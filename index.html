q": "아래 정보를 이용해 계산할 때, A펀드가 B펀드보다 우월하게 나오는 성과지표로만 묶은 것은?(벤치마크수익률은 시장수익률과 동일한 10%, 무위험수익률은 3%)\n- A펀드: 수익률 13%, 표준편차 8%, 베타 0.8, 잔차위험 5%\n- B펀드: 수익률 18%, 표준편차 14%, 베타 1.5, 잔차위험 10%", "choices": ["샤프비율, 정보비율", "트레이너비율, 젠센의 알파", "젠센의 알파, 정보비율", "샤프비율, 트레이너비율"], "answer": 3, "explanation": "네 가지 지표를 각각 계산해서 A와 B를 비교하면, A가 이기는 것은 샤프비율과 트레이너비율이에요.\n① 샤프 = (Rp−Rf)/σ: A 10/8 = 1.25, B 15/14 ≈ 1.07 → A 우월\n② 트레이너 = (Rp−Rf)/β: A 10/0.8 = 12.5, B 15/1.5 = 10 → A 우월\n③ 젠센 = (Rp−Rf) − β(Rm−Rf): A 10 − 0.8×7 = 4.4%, B 15 − 1.5×7 = 4.5% → B 우월\n④ 정보비율 = (Rp−Rb)/잔차위험: A 3/5 = 0.6, B 8/10 = 0.8 → B 우월", "similar": [{"q": "월평균 펀드수익률 2%, 월평균 표준편차 3%, 무위험자산의 월평균수익률 0.5%일 때 연율화된 샤프비율은?", "choices": ["0.50", "6.00", "1.73", "0.14"], "answer": 2, "explanation": "월 샤프비율을 구한 뒤 √12를 곱해 연율화하면 약 1.73이에요.\n① 월 샤프비율 = (2% − 0.5%)/3% = 0.5\n② 연율화: 초과수익은 ×12, 표준편차는 ×√12 → 샤프비율은 ×√12\n③ 0.5 × √12 ≈ 1.73\n6.00은 표준편차를 연율화하지 않고 12를 곱한 실수예요. 기출(월 2.5 × √12 = 8.66)과 같은 구조예요.", "tip": "샤프비율 연율화 = 월 샤프비율 × √12", "terms": [{"term": "샤프비율", "meaning": "포트폴리오의 초과수익(수익률 − 무위험수익률)을 표준편차(총위험)로 나눈 값이에요."}, {"term": "연율화", "meaning": "월이나 일 단위로 구한 수익률이나 지표를 1년 기준으로 바꾸는 것이에요."}, {"term": "표준편차", "meaning": "수익률이 평균에서 얼마나 흩어져 있는지 나타내는 값으로, 분산의 제곱근이에요. 위험의 크기로 써요."}, {"term": "무위험자산", "meaning": "수익률이 확실하게 정해져 있어 위험(표준편차)이 0인 자산이에요."}]}, {"q": "포트폴리오 수익률 12%, 시장수익률(벤치마크수익률) 9%, 무위험수익률 4%, 표준편차 10%, 베타 1.2일 때 젠센의 알파는?", "choices": ["0.8%", "2.0%", "3.0%", "6.0%"], "answer": 1, "explanation": "젠센의 알파는 실제 초과수익에서 CAPM이 말하는 초과수익을 뺀 값이에요. 답은 2.0%예요.\n젠센의 알파 = (Rp − Rf) − β × (Rm − Rf)\n= (12% − 4%) − 1.2 × (9% − 4%)\n= 8% − 6% = 2.0%\n3.0%는 단순히 Rp − Rm, 6.0%는 β×(Rm−Rf)만 계산한 값이에요. 젠센의 알파는 SML(베타)을 이용하며, 종목선택능력은 평가하지만 시장예측능력은 따로 측정하지 못해요.", "tip": "젠센 α = (Rp−Rf) − β(Rm−Rf)", "terms": [{"term": "젠센의 알파", "meaning": "실제 초과수익에서 CAPM(베타)으로 계산한 적정 초과수익을 뺀 값으로, 종목선택능력을 보여줘요."}, {"term": "베타", "meaning": "시장 전체가 움직일 때 개별 자산이나 포트폴리오가 얼마나 따라 움직이는지 나타내는 체계적 위험의 크기예요."}, {"term": "증권시장선(SML)", "meaning": "모든 자산의 기대수익률과 베타(체계적 위험)의 관계를 나타낸 직선이에요."}]}, {"q": "다음 중 샤프비율이 가장 높은 펀드와 트레이너비율이 가장 높은 펀드를 순서대로 고른 것은?(무위험수익률 4%)\n- A: 기대수익률 16%, 베타 1.0, 표준편차 15%\n- B: 기대수익률 19%, 베타 1.5, 표준편차 20%\n- C: 기대수익률 22%, 베타 1.2, 표준편차 25%\n- D: 기대수익률 25%, 베타 2.0, 표준편차 35%", "choices": ["A, D", "C, C", "A, C", "B, C"], "answer": 2, "explanation": "샤프비율은 표준편차로, 트레이너비율은 베타로 나눠서 비교해요. 샤프는 A, 트레이너는 C가 가장 높아요.\n① 샤프 = (E−Rf)/σ: A 12/15 = 0.80, B 15/20 = 0.75, C 18/25 = 0.72, D 21/35 = 0.60 → A 최고\n② 트레이너 = (E−Rf)/β: A 12, B 10, C 15, D 10.5 → C 최고\n분산투자가 잘 된 펀드는 트레이너비율, 그렇지 않은 펀드는 샤프비율로 평가하는 것이 알맞아요.", "tip": "분산투자 잘 됨 → 트레이너(β), 안 됨 → 샤프(σ)", "terms": [{"term": "샤프비율", "meaning": "포트폴리오의 초과수익(수익률 − 무위험수익률)을 표준편차(총위험)로 나눈 값이에요."}, {"term": "트레이너비율", "meaning": "포트폴리오의 초과수익(수익률 − 무위험수익률)을 베타(체계적 위험)로 나눈 값이에요."}, {"term": "베타", "meaning": "시장 전체가 움직일 때 개별 자산이나 포트폴리오가 얼마나 따라 움직이는지 나타내는 체계적 위험의 크기예요."}, {"term": "표준편차", "meaning": "수익률이 평균에서 얼마나 흩어져 있는지 나타내는 값으로, 분산의 제곱근이에요. 위험의 크기로 써요."}]}], "tip": "샤프=표준편차, 트레이너=베타, 젠센=CAPM 초과, 정보비율=잔차위험", "terms": [{"term": "샤프비율", "meaning": "포트폴리오의 초과수익(수익률 − 무위험수익률)을 표준편차(총위험)로 나눈 값이에요."}, {"term": "트레이너비율", "meaning": "포트폴리오의 초과수익(수익률 − 무위험수익률)을 베타(체계적 위험)로 나눈 값이에요."}, {"term": "젠센의 알파", "meaning": "실제 초과수익에서 CAPM(베타)으로 계산한 적정 초과수익을 뺀 값으로, 종목선택능력을 보여줘요."}, {"term": "정보비율", "meaning": "벤치마크보다 더 얻은 수익을 잔차위험(추적오차)으로 나눈 값으로, 위험 1단위당 초과수익을 보여줘요."}]}, {"no": 42, "topic": "거시경제", "concept": "IS-LM 모형의 작동원리(외생변수 변화의 효과)", "q": "IS-LM 모형의 작동원리에 대한 설명으로 가장 적절하지 않은 것은?", "choices": ["정부지출(G)이 증가하면 실질국민소득(Y)이 증가한다.", "물가(P)가 상승하면 실질국민소득(Y)이 증가한다.", "통화량(M)이 증가하면 실질국민소득(Y)이 증가한다.", "조세(T)가 증가하면 실질국민소득(Y)이 감소한다."], "answer": 1, "explanation": "물가(P)가 오르면 실질화폐공급(M/P)이 줄어서 LM곡선이 왼쪽으로 이동해요. 그러면 이자율은 오르고 실질국민소득은 감소해요. 그래서 '물가 상승 시 소득 증가'는 틀렸어요. G 증가 → IS 우측이동(Y↑, r↑), T 증가 → IS 좌측이동(Y↓, r↓), M 증가 → LM 우측이동(Y↑, r↓)이에요.", "similar": [{"q": "IS-LM 모형에서 확장적 통화정책(통화량 증가)을 실시할 때의 효과로 옳은 것은?", "choices": ["IS곡선 좌측 이동 → 국민소득 감소, 이자율 하락", "LM곡선 좌측 이동 → 국민소득 감소, 이자율 상승", "IS곡선 우측 이동 → 국민소득 증가, 이자율 상승", "LM곡선 우측 이동 → 국민소득 증가, 이자율 하락"], "answer": 3, "explanation": "통화량(M) 증가는 화폐시장의 외생변수가 바뀐 것이라 LM곡선이 오른쪽으로 이동해요. 그래서 국민소득은 늘고 이자율은 내려가요. IS 우측 이동(Y↑, r↑)은 정부지출 증가 같은 확장적 재정정책의 효과라서 정답이 아니에요. 확장적 통화정책의 수단에는 법정지급준비율 인하, 국채매입(공개시장운영) 등이 있어요.", "tip": "통화량↑ → LM 우측 → Y↑ r↓ / 정부지출↑ → IS 우측 → Y↑ r↑", "terms": [{"term": "IS-LM 모형", "meaning": "IS곡선(상품시장 균형)과 LM곡선(화폐시장 균형)이 만나는 점에서 국민소득과 이자율이 정해진다고 보는 모형이에요."}, {"term": "확장적 통화정책", "meaning": "중앙은행이 통화량을 늘리거나 금리를 낮춰 경기를 살리려는 정책이에요."}, {"term": "법정지급준비율", "meaning": "은행이 받은 예금 중 꼭 중앙은행에 맡겨 두어야 하는 돈의 비율이에요."}, {"term": "공개시장운영", "meaning": "중앙은행이 국채 등을 사고팔아 시중의 통화량을 조절하는 정책이에요."}]}, {"q": "이자율 변동요인에 대한 설명으로 옳지 않은 것은?", "choices": ["경기상승 시 자금수요가 증가해 금리가 상승한다.", "물가상승 시 화폐보유의 기회비용이 증가해 금리가 상승한다.", "경상수지 흑자가 확대되면 해외로부터 화폐공급이 증가하여 금리가 상승한다.", "사회·정치 불안 시 위험프리미엄이 증가해 금리가 상승한다."], "answer": 2, "explanation": "경상수지가 흑자면 외화가 들어오고, 통화량이 늘어서 금리는 '하락'해요. 그래서 '금리가 상승한다'는 설명이 틀렸어요. 경상수지와 금리는 강한 음(−)의 관계이고, 경상수지 적자는 금리 상승 요인이에요. 환율이 오르면 단기적으로는 금리 상승, 장기적으로는 금리 하락 요인이에요.", "tip": "경상수지 흑자 → 통화량↑ → 금리↓", "terms": [{"term": "경상수지", "meaning": "한 나라가 외국과 상품·서비스 등을 사고팔아 번 돈과 쓴 돈의 차이예요."}, {"term": "기회비용", "meaning": "어떤 것을 선택하느라 포기한 다른 선택의 가치예요."}, {"term": "위험프리미엄", "meaning": "위험을 감수하는 대가로 추가로 요구하는 수익(이자)이에요."}]}, {"q": "IS-LM 모형에서 재정정책과 통화정책의 효과가 가장 크게 나타나는 조건을 순서대로 옳게 연결한 것은?", "choices": ["재정정책: IS 수평·LM 수평 / 통화정책: IS 수직·LM 수직", "재정정책: IS 수평·LM 수직 / 통화정책: IS 수직·LM 수평", "재정정책: IS 수직·LM 수직 / 통화정책: IS 수평·LM 수평", "재정정책: IS 수직·LM 수평 / 통화정책: IS 수평·LM 수직"], "answer": 3, "explanation": "재정정책은 IS가 수직(투자가 이자율에 비탄력적)이고 LM이 수평(화폐수요가 이자율에 무한탄력적)일 때 구축효과가 없어서 가장 효과가 커요. 통화정책은 반대로 IS가 수평이고 LM이 수직일 때 가장 효과가 커요. 그래서 '재정: IS 수직·LM 수평 / 통화: IS 수평·LM 수직'이 정답이에요.", "tip": "재정은 IS 세우고 LM 눕히고, 통화는 그 반대", "terms": [{"term": "구축효과", "meaning": "정부지출을 늘리면 이자율이 올라서 민간투자가 줄어드는 현상이에요."}, {"term": "탄력적", "meaning": "어떤 값이 변할 때 다른 값이 민감하게 많이 변하는 성질이에요. 반대로 거의 변하지 않으면 비탄력적이라고 해요."}, {"term": "재정정책", "meaning": "정부가 세금이나 정부지출을 조절해 경기를 관리하는 정책이에요."}, {"term": "통화정책", "meaning": "중앙은행이 통화량이나 금리를 조절해 경기를 관리하는 정책이에요."}]}], "tip": "IS의 외생변수 = G·T, LM의 외생변수 = M·P", "terms": [{"term": "IS-LM 모형", "meaning": "IS곡선(상품시장 균형)과 LM곡선(화폐시장 균형)이 만나는 점에서 국민소득과 이자율이 정해진다고 보는 모형이에요."}, {"term": "실질국민소득", "meaning": "물가 변화의 영향을 뺀, 한 나라가 실제로 생산한 소득이에요."}, {"term": "실질화폐공급", "meaning": "명목통화량을 물가로 나눈 값(M/P)으로, 돈이 실제로 살 수 있는 양을 나타내요."}, {"term": "외생변수", "meaning": "모형 밖에서 정해져서 모형에 영향을 주는 변수예요. 정부지출, 조세, 통화량, 물가 등이 있어요."}]}, {"no": 43, "topic": "거시경제", "concept": "구축효과와 유동성함정", "q": "구축효과(Crowding Out Effect)에 대한 설명으로 가장 거리가 먼 것은?", "choices": ["확대재정정책이 이자율을 상승시켜 민간투자를 위축시키는 현상을 구축효과라고 한다.", "확대통화정책을 집행할 때에는 구축효과가 발생하지 않는다.", "LM곡선이 수평인 상태에서는 완전구축효과가 발생하여 확대재정정책의 효과가 전혀 없다.", "완전구축효과가 발생한다면 확대재정정책을 집행하더라도 국민소득의 증가효과는 없다."], "answer": 2, "explanation": "LM곡선이 수평(유동성함정 구간)이면 재정을 늘려도 이자율이 오르지 않아요. 그래서 '무구축효과'가 생기고 재정정책의 효과가 가장 커져요. 따라서 'LM 수평이면 완전구축효과'라는 설명이 틀렸어요. 완전구축효과는 LM곡선이 수직일 때(고전학파) 생기고, 이때 국민소득은 그대로이고 이자율·물가만 올라요. LM이 우상향하면(케인즈의 일반적 경우) 부분구축효과가 생겨요.", "similar": [{"q": "유동성함정에 대한 설명으로 옳지 않은 것은?", "choices": ["화폐수요의 이자율 탄력성이 무한대가 되어 LM곡선이 수평이 된다.", "통화정책의 효과가 극대화되므로 중앙은행의 금리 인하가 가장 효과적인 경기부양책이다.", "확장적 재정정책을 시행하면 이자율의 변화 없이 국민소득을 증가시킬 수 있다.", "통화공급을 증가시켜도 국민소득 증가효과가 발생하지 않는다."], "answer": 1, "explanation": "유동성함정 구간에서는 통화공급을 늘려도 화폐시장에 초과공급이 생기지 않아서 통화정책이 힘을 못 써요. 그래서 '통화정책 효과가 극대화된다'는 설명이 틀렸어요. 반면 확장적 재정정책은 무구축효과 때문에 효과가 가장 커요.", "tip": "유동성함정 = 화폐수요 탄력성 ∞ + LM 수평 + 무구축 + 재정정책 극대화(통화정책 X)", "terms": [{"term": "유동성함정", "meaning": "이자율이 매우 낮아 사람들이 돈을 그냥 가지고만 있으려 해서, 통화를 늘려도 효과가 없는 상태예요."}, {"term": "이자율 탄력성", "meaning": "이자율이 변할 때 다른 값(화폐수요 등)이 얼마나 민감하게 변하는지 나타내는 정도예요."}, {"term": "무구축효과", "meaning": "정부지출을 늘려도 이자율이 오르지 않아 민간투자가 전혀 줄지 않는 경우예요."}, {"term": "초과공급", "meaning": "공급하려는 양이 수요보다 많은 상태예요."}]}, {"q": "피구효과(Pigou Effect)에 대한 설명으로 가장 적절하지 않은 것은?", "choices": ["케인즈학파가 유동성함정에서 통화정책의 유효성을 주장하기 위해 제시한 논리이다.", "물가가 신축적으로 움직인다는 것을 전제로 한다.", "불황에 따른 물가하락으로 화폐의 실질가치가 증가하여 민간의 부와 소비가 증가하는 효과이다.", "유동성함정이 존재하더라도 경제가 자동적으로 완전고용을 회복할 수 있다는 논거이다."], "answer": 0, "explanation": "피구효과는 케인즈학파의 유동성함정 논리에 맞서기 위한 '고전학파'의 논리예요. 그래서 '케인즈학파가 제시한 논리'라는 설명이 틀렸어요. 물가가 신축적이라면 심한 불황 → 물가 급락 → 실질화폐가치 증가 → 부 증가 → 소비·총수요 증가로 경제가 저절로 회복된다는 주장이에요. 유동성함정 탈출수단은 케인즈학파는 확장적 재정정책, 고전학파는 피구효과예요.", "tip": "유동성함정 탈출: 케인즈 = 재정정책, 고전학파 = 피구효과", "terms": [{"term": "피구효과", "meaning": "물가가 내려가면 가지고 있는 돈의 실질가치가 올라 부가 늘고 소비가 늘어난다는 효과예요."}, {"term": "유동성함정", "meaning": "이자율이 매우 낮아 사람들이 돈을 그냥 가지고만 있으려 해서, 통화를 늘려도 효과가 없는 상태예요."}, {"term": "신축적", "meaning": "상황에 따라 자유롭게 오르내릴 수 있다는 뜻이에요."}, {"term": "총수요", "meaning": "한 나라 안에서 가계, 기업, 정부 등이 사려고 하는 모든 상품과 서비스의 합이에요."}]}, {"q": "<보기>에 가장 부합하는 경제이론은?\n합리적 경제주체는 현재 세금의 감소를 미래 세금의 증가로 인식하기 때문에, 세금 감소는 민간의 저축을 증가시킬 뿐 총수요에는 변동이 없다.", "choices": ["실질잔고효과", "피구효과", "리카르도 불변정리", "피셔효과"], "answer": 2, "explanation": "합리적 기대학파의 리카르도 불변정리예요. 세금을 깎아줘도 사람들은 나중에 세금이 늘 거라고 생각해서 저축만 늘리고, 총수요는 변하지 않아요. 피구효과는 물가하락→부 증가→소비 증가예요. 실질잔고효과는 명목통화공급 증가→부 증가→소비 증가예요. 피셔효과는 기대인플레이션과 명목이자율이 1:1로 움직이는 관계예요.", "tip": "리카르도 = 감세 → 저축만↑, 총수요 불변", "terms": [{"term": "리카르도 불변정리", "meaning": "정부가 세금을 깎아줘도 사람들이 미래 세금 증가를 예상해 저축만 늘리므로 총수요는 변하지 않는다는 이론이에요."}, {"term": "총수요", "meaning": "한 나라 안에서 가계, 기업, 정부 등이 사려고 하는 모든 상품과 서비스의 합이에요."}, {"term": "피셔효과", "meaning": "기대인플레이션이 오르면 그만큼 명목이자율도 1:1로 오른다는 관계예요."}, {"term": "합리적 기대학파", "meaning": "사람들이 모든 정보를 이용해 합리적으로 미래를 예상한다고 보는 경제학파예요."}]}], "tip": "LM 수직=완전구축, 우상향=부분구축, 수평=무구축", "terms": [{"term": "구축효과", "meaning": "정부지출을 늘리면 이자율이 올라서 민간투자가 줄어드는 현상이에요."}, {"term": "유동성함정", "meaning": "이자율이 매우 낮아 사람들이 돈을 그냥 가지고만 있으려 해서, 통화를 늘려도 효과가 없는 상태예요."}, {"term": "LM곡선", "meaning": "화폐시장이 균형을 이루는 국민소득과 이자율의 조합을 이은 선이에요."}, {"term": "확대재정정책", "meaning": "정부가 지출을 늘리거나 세금을 줄여 경기를 살리려는 정책이에요."}]}, {"no": 44, "topic": "거시경제", "concept": "고용지표(실업률·경제활동참가율) 계산", "q": "취업자 540명, 실업자 60명, 생산가능인구 800명일 때 실업률과 경제활동참가율은 각각 얼마인가?", "choices": ["실업률 10.0%, 경제활동참가율 75.0%", "실업률 11.1%, 경제활동참가율 75.0%", "실업률 10.0%, 경제활동참가율 67.5%", "실업률 7.5%, 경제활동참가율 75.0%"], "answer": 0, "explanation": "경제활동인구를 먼저 구하고, 실업률과 참가율의 분모를 헷갈리지 않는 게 핵심이에요.\n① 경제활동인구 = 540 + 60 = 600명\n② 실업률 = 실업자/경제활동인구 = 60/600 = 10%\n③ 경제활동참가율 = 경제활동인구/생산가능인구 = 600/800 = 75%\n11.1%는 실업자를 취업자로, 67.5%는 취업자를 생산가능인구로, 7.5%는 실업자를 생산가능인구로 나눈 실수예요.", "similar": [{"q": "취업자 360명, 경제활동인구 400명, 생산가능인구 500명일 경우 실업률과 경제활동참가율은 각각 얼마인가?", "choices": ["실업률 8.0%, 경제활동참가율 80.0%", "실업률 10.0%, 경제활동참가율 80.0%", "실업률 10.0%, 경제활동참가율 72.0%", "실업률 11.1%, 경제활동참가율 80.0%"], "answer": 1, "explanation": "실업자 수를 먼저 구한 뒤 실업률과 참가율을 계산해요. 답은 실업률 10%, 참가율 80%예요.\n① 실업자 = 400 − 360 = 40명\n② 실업률 = 40/400 = 10%\n③ 경제활동참가율 = 400/500 = 80%\n8.0%는 실업자를 생산가능인구로 나눈 값, 72.0%는 취업자를 생산가능인구로 나눈 실수예요.", "tip": "실업자 = 경활인구 − 취업자", "terms": [{"term": "경제활동인구", "meaning": "생산가능인구 중 일할 의사와 능력이 있는 사람으로, 취업자와 실업자를 합친 수예요."}, {"term": "생산가능인구", "meaning": "일할 수 있는 나이인 만 15세 이상 인구예요. 군인과 재소자 등은 빠져요."}, {"term": "실업률", "meaning": "경제활동인구 중 실업자가 차지하는 비율이에요."}, {"term": "경제활동참가율", "meaning": "생산가능인구 중 경제활동인구가 차지하는 비율이에요."}]}, {"q": "만 15세 이상 인구(생산가능인구)가 1,000명, 비경제활동인구가 300명, 실업자가 35명일 때 경제활동참가율과 실업률은 각각 얼마인가?", "choices": ["경제활동참가율 70%, 실업률 3.5%", "경제활동참가율 30%, 실업률 5.0%", "경제활동참가율 70%, 실업률 5.0%", "경제활동참가율 66.5%, 실업률 5.3%"], "answer": 2, "explanation": "비경제활동인구를 빼서 경제활동인구를 먼저 구해요. 답은 참가율 70%, 실업률 5%예요.\n① 경제활동인구 = 1,000 − 300 = 700명\n② 경제활동참가율 = 700/1,000 = 70%\n③ 실업률 = 35/700 = 5%\n3.5%는 실업자를 생산가능인구로 나눈 실수예요.", "tip": "생산가능인구 = 경활인구 + 비경활인구, 경활인구 = 취업자 + 실업자", "terms": [{"term": "생산가능인구", "meaning": "일할 수 있는 나이인 만 15세 이상 인구예요. 군인과 재소자 등은 빠져요."}, {"term": "비경제활동인구", "meaning": "생산가능인구 중 일할 능력이나 의사가 없는 사람이에요. 가정주부, 학생, 구직단념자 등이 있어요."}, {"term": "경제활동인구", "meaning": "생산가능인구 중 일할 의사와 능력이 있는 사람으로, 취업자와 실업자를 합친 수예요."}, {"term": "실업률", "meaning": "경제활동인구 중 실업자가 차지하는 비율이에요."}]}, {"q": "고용 관련 인구 분류에 대한 설명으로 가장 적절하지 않은 것은?", "choices": ["가사와 육아를 도맡아 하는 가정주부는 비경제활동인구로 분류된다.", "구직단념자는 적극적으로 구직활동을 하지 않으므로 실업자로 분류된다.", "군인과 재소자는 생산가능인구에서 제외된다.", "경제활동인구는 취업자와 실업자의 2가지로 구분된다."], "answer": 1, "explanation": "구직단념자는 실업자가 아니라 '비경제활동인구'로 분류돼요. 그래서 이 설명이 틀렸어요. 실업자는 적극적으로 일자리를 구해봤지만 얻지 못했고, 일자리가 있으면 바로 일할 수 있는 사람이에요. 취업자는 조사대상 주간에 수입을 목적으로 1시간 이상 일한 사람, 또는 무급이라도 주당 18시간 이상 일한 사람이에요.", "tip": "구직단념자·가정주부 = 비경활, 군인·재소자 = 생산가능인구 제외", "terms": [{"term": "구직단념자", "meaning": "일하고 싶지만 일자리를 찾지 못할 것 같아 구직활동을 포기한 사람이에요."}, {"term": "비경제활동인구", "meaning": "생산가능인구 중 일할 능력이나 의사가 없는 사람이에요. 가정주부, 학생, 구직단념자 등이 있어요."}, {"term": "생산가능인구", "meaning": "일할 수 있는 나이인 만 15세 이상 인구예요. 군인과 재소자 등은 빠져요."}, {"term": "경제활동인구", "meaning": "생산가능인구 중 일할 의사와 능력이 있는 사람으로, 취업자와 실업자를 합친 수예요."}]}], "tip": "실업률 분모 = 경활인구, 참가율 분모 = 생산가능인구", "terms": [{"term": "경제활동인구", "meaning": "생산가능인구 중 일할 의사와 능력이 있는 사람으로, 취업자와 실업자를 합친 수예요."}, {"term": "생산가능인구", "meaning": "일할 수 있는 나이인 만 15세 이상 인구예요. 군인과 재소자 등은 빠져요."}, {"term": "실업률", "meaning": "경제활동인구 중 실업자가 차지하는 비율이에요."}, {"term": "경제활동참가율", "meaning": "생산가능인구 중 경제활동인구가 차지하는 비율이에요."}]}, {"no": 45, "topic": "거시경제", "concept": "경기예측방법(경기종합지수 구성지표·BSI·DI)", "q": "경기종합지수(CI)를 구성하는 지표 중 선행지표에 해당하는 것은?", "choices": ["건설수주액", "광공업생산지수", "소매판매액지수", "CP유통수익률"], "answer": 0, "explanation": "건설수주액은 선행지표라서 정답이에요. 선행지표에는 재고순환지표, 경제심리지수, 기계류내수출하지수, 건설수주액, 수출입물가비율, 코스피지수, 장단기금리차가 있어요. 광공업생산지수와 소매판매액지수는 동행지표예요(그 밖에 비농림어업취업자수, 서비스업생산지수, 내수출하지수, 건설기성액, 수입액). CP유통수익률은 후행지표예요(그 밖에 취업자수, 생산자제품재고지수, 소비자물가지수변화율, 소비재수입액).", "similar": [{"q": "기업경기실사지수(BSI) 조사에서 전체 응답자 200명 중 70명이 경기가 호전될 것으로, 130명이 악화될 것으로 응답하였다. BSI 지수와 경기국면 판단으로 옳은 것은?", "choices": ["BSI 35, 경기수축국면", "BSI 70, 경기확장국면", "BSI 130, 경기확장국면", "BSI 70, 경기수축국면"], "answer": 3, "explanation": "BSI는 긍정 응답과 부정 응답의 차이로 계산하고, 100을 기준으로 판단해요. 답은 BSI 70, 경기수축국면이에요.\nBSI = (긍정응답 − 부정응답)/전체응답 × 100 + 100\n= (70 − 130)/200 × 100 + 100\n= −30 + 100 = 70\n100 미만이므로 경기수축국면으로 봐요. 기출(긍정 60, 부정 40 → BSI 120, 확장국면)과 같은 구조예요.", "tip": "BSI·CSI는 100 기준, DI는 50 기준", "terms": [{"term": "기업경기실사지수(BSI)", "meaning": "기업가들에게 경기 전망을 물어 만든 지수로, 100보다 크면 경기확장, 작으면 경기수축으로 봐요."}, {"term": "경기수축국면", "meaning": "경기가 나빠지고 있는 시기예요."}, {"term": "경기확장국면", "meaning": "경기가 좋아지고 있는 시기예요."}]}, {"q": "경기확산지수(DI)에 대한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 경기변동의 진폭이나 속도는 측정하지 않고 경기변동의 방향과 전환점을 식별한다.\nㄴ. 0%에서 100%까지 존재하며 기준선 50%를 초과하면 경기상승국면으로 판단한다.\nㄷ. 각 지표의 전월대비 증감률을 통계적으로 종합하여 경기변동의 속도와 진폭까지 파악할 수 있다.", "choices": ["ㄱ", "ㄴ, ㄷ", "ㄱ, ㄴ", "ㄱ, ㄴ, ㄷ"], "answer": 2, "explanation": "ㄱ과 ㄴ은 경기확산지수(DI)의 특징이라서 'ㄱ, ㄴ'이 정답이에요. ㄷ은 경기종합지수(CI)에 대한 설명이에요. CI는 각 지표의 전월대비 증감률을 합쳐서 경기변동의 방향뿐 아니라 속도와 진폭까지 알 수 있어요. DI는 방향과 전환점만 알려줘요.", "tip": "DI = 방향·전환점(50 기준), CI = 방향+속도+진폭", "terms": [{"term": "경기확산지수(DI)", "meaning": "여러 지표 중 좋아진 지표의 비율로 경기의 방향과 전환점을 보는 지수예요. 50을 넘으면 경기상승으로 봐요."}, {"term": "경기종합지수(CI)", "meaning": "여러 경제지표의 전월대비 증감률을 합쳐 만든 지수로, 경기의 방향뿐 아니라 속도와 진폭까지 보여줘요."}, {"term": "진폭", "meaning": "경기가 오르내리는 크기예요."}, {"term": "전환점", "meaning": "경기가 좋아지다가 나빠지기 시작하거나, 나빠지다가 좋아지기 시작하는 시점이에요."}]}, {"q": "경기예측방법에 대한 설명으로 옳지 않은 것은?", "choices": ["소비자동향지수(CSI)는 기업경기실사지수(BSI)보다 선행하는 경향이 있다.", "거시경제계량모형은 경제환경이 급격히 변하면 예측력이 하락하며 예측오차 기준으로 RMSE를 주로 사용한다.", "시계열모형(ARIMA)은 경제이론을 근거로 인과관계가 있는 변수들을 연립방정식으로 축약한 모형이다.", "기업경기실사지수(BSI)는 단기 경기예측에 적합하며 100 이상이면 확장국면으로 본다."], "answer": 2, "explanation": "경제이론을 바탕으로 인과관계가 있는 변수들을 연립방정식으로 묶은 것은 '거시경제계량모형'이에요. 그래서 이를 시계열모형(ARIMA)의 설명이라고 한 것이 틀렸어요. 시계열모형은 과거 흐름만 보고 통계적 모형을 만들어요. 단기 예측에 알맞지만 이론적 근거가 부족해요. CSI는 BSI보다 앞서 움직이고, 경기확장기보다 수축기에 신뢰도가 더 높아요.", "tip": "계량모형 = 이론·연립방정식, 시계열(ARIMA) = 과거 동향·단기예측", "terms": [{"term": "거시경제계량모형", "meaning": "경제이론을 바탕으로 인과관계가 있는 변수들을 연립방정식으로 묶어 경기를 예측하는 모형이에요."}, {"term": "시계열모형(ARIMA)", "meaning": "경제이론 대신 데이터의 과거 흐름만으로 통계적 모형을 만들어 미래를 예측하는 방법이에요."}, {"term": "연립방정식", "meaning": "여러 개의 방정식을 한꺼번에 묶어서 함께 푸는 식이에요."}, {"term": "RMSE", "meaning": "평균제곱근오차예요. 예측값이 실제값과 평균적으로 얼마나 차이 나는지 재는 지표로, 작을수록 예측이 정확해요."}]}], "tip": "선행=수주, 동행=생산, 후행=소비 키워드", "terms": [{"term": "경기종합지수(CI)", "meaning": "여러 경제지표의 전월대비 증감률을 합쳐 만든 지수로, 경기의 방향뿐 아니라 속도와 진폭까지 보여줘요."}, {"term": "선행지표", "meaning": "경기보다 먼저 움직여서 앞으로의 경기를 미리 알려주는 경제지표예요."}, {"term": "동행지표", "meaning": "경기와 거의 같은 시기에 움직이는 경제지표예요."}, {"term": "후행지표", "meaning": "경기보다 늦게 움직여서 지나간 경기를 확인해 주는 경제지표예요."}]}, {"no": 46, "topic": "분산투자기법", "concept": "분산투자효과(체계적·비체계적 위험)", "q": "투자종목의 수와 위험분산효과에 대한 설명으로 가장 적절하지 않은 것은?", "choices": ["포트폴리오에 포함하는 종목의 수가 계속 증가할수록 포트폴리오의 위험은 각 종목들 간 공분산의 평균에 근접해 간다.", "포트폴리오에 편입되는 종목의 수를 무한히 증가시키면 체계적 위험도 0에 수렴한다.", "증권시장 전반의 공통적 요인에 의해 야기되는 위험은 체계적 위험이다.", "포트폴리오 투자에 있어서 적절한 보상은 분산불능위험인 체계적 위험에 한정된다."], "answer": 1, "explanation": "종목 수를 아무리 늘려도 없어지는 것은 비체계적 위험뿐이에요. 체계적 위험(시장공통위험)은 사라지지 않아요. 그래서 '체계적 위험도 0에 수렴한다'는 설명이 틀렸어요. 종목 수가 늘수록 포트폴리오 위험은 공분산의 평균에 가까워져요. 시장은 분산불능위험인 체계적 위험에 대해서만 보상해요. 분산투자의 주요 이익은 분산 초기단계에서 대부분 얻어져요.", "similar": [{"q": "상관계수와 분산투자효과에 대한 설명으로 옳지 않은 것은?", "choices": ["상관계수가 낮을수록 분산투자효과가 높아진다.", "상관계수가 0인 경우에는 분산투자효과가 발생하지 않는다.", "상관계수가 -1이면 분산투자효과가 극대화된다.", "상관계수는 공분산을 두 자산 표준편차의 곱으로 나누어 -1에서 1 사이로 표준화한 것이다."], "answer": 1, "explanation": "상관계수가 0이어도 분산투자효과는 생겨요. 분산투자효과가 없는 경우는 상관계수가 +1일 때뿐이에요. 그래서 '0이면 효과가 없다'는 설명이 틀렸어요. 공분산은 범위가 무한대라 비교가 어려워서, 이를 표준화한 상관계수를 써요. 포트폴리오 투자를 하면 기대수익을 희생하지 않고 위험을 줄일 수 있어요.", "tip": "상관계수 +1만 분산효과 없음, −1이면 극대화", "terms": [{"term": "상관계수", "meaning": "두 자산이 얼마나 같이 움직이는지를 −1에서 +1 사이 숫자로 나타낸 값이에요."}, {"term": "분산투자효과", "meaning": "여러 자산에 나눠 투자해서 전체 위험을 줄이는 효과예요."}, {"term": "공분산", "meaning": "두 자산의 수익률이 같은 방향으로 움직이는지 반대로 움직이는지를 나타내는 값이에요."}, {"term": "표준화", "meaning": "크기가 제각각인 값을 일정한 범위로 맞춰 서로 비교할 수 있게 만드는 것이에요."}]}, {"q": "주식 X의 표준편차는 0.3, 주식 Y의 표준편차는 0.2이고, 두 주식 간의 공분산이 -0.03이라면 두 주식 간의 상관계수는?", "choices": ["-0.05", "-0.20", "-0.75", "-0.50"], "answer": 3, "explanation": "상관계수는 공분산을 두 표준편차의 곱으로 나눠서 구해요. 답은 −0.5예요.\n상관계수 = 공분산/(σX × σY)\n= −0.03/(0.3 × 0.2) = −0.03/0.06 = −0.5\n상관계수가 음(−)이라서 두 주식은 반대로 움직이는 경향이 있고, 분산투자효과가 커요. 최소분산포트폴리오 비중 계산에서도 공분산 = ρ × σX × σY 관계를 꼭 써요.", "tip": "ρ = 공분산/(σX×σY) ↔ 공분산 = ρ×σX×σY", "terms": [{"term": "상관계수", "meaning": "두 자산이 얼마나 같이 움직이는지를 −1에서 +1 사이 숫자로 나타낸 값이에요."}, {"term": "공분산", "meaning": "두 자산의 수익률이 같은 방향으로 움직이는지 반대로 움직이는지를 나타내는 값이에요."}, {"term": "표준편차", "meaning": "수익률이 평균에서 얼마나 흩어져 있는지 나타내는 값으로, 분산의 제곱근이에요. 위험의 크기로 써요."}]}, {"q": "마코위츠 모형에 의하여 50개 종목으로 구성된 포트폴리오의 위험을 계산하기 위해 필요한 투입정보량(기대수익률, 분산, 공분산)은 각각 몇 개인가?", "choices": ["50개, 50개, 1,225개", "50개, 50개, 2,450개", "50개, 1,225개, 50개", "1개, 50개, 1,225개"], "answer": 0, "explanation": "마코위츠 모형에서는 기대수익률과 분산이 종목 수만큼, 공분산은 두 종목씩 짝지은 수만큼 필요해요.\n① 기대수익률 = n = 50개\n② 분산 = n = 50개\n③ 공분산 = n(n−1)/2 = 50×49/2 = 1,225개\n2,450개는 2로 나누지 않은 값(ij와 ji를 중복 계산)이에요. 투입정보량이 너무 많다는 단점 때문에 단일지표모형이 나왔어요.", "tip": "마코위츠 공분산 개수 = n(n−1)/2", "terms": [{"term": "마코위츠 모형", "meaning": "자산들의 기대수익률, 분산, 공분산을 이용해 위험 대비 수익이 가장 좋은 포트폴리오를 찾는 모형이에요."}, {"term": "공분산", "meaning": "두 자산의 수익률이 같은 방향으로 움직이는지 반대로 움직이는지를 나타내는 값이에요."}, {"term": "단일지표모형", "meaning": "개별 주식의 수익률이 시장지수 하나와의 관계로 설명된다고 보는 모형으로, 마코위츠 모형보다 필요한 정보가 적어요."}, {"term": "투입정보량", "meaning": "모형으로 계산하기 위해 미리 알아야 하는 숫자(기대수익률, 분산, 공분산 등)의 개수예요."}]}], "tip": "분산으로 없어지는 건 비체계적(개별) 위험뿐", "terms": [{"term": "체계적 위험", "meaning": "경기, 금리처럼 시장 전체에 영향을 주는 위험으로, 분산투자로도 없앨 수 없어요."}, {"term": "비체계적 위험", "meaning": "개별 기업에만 생기는 위험으로, 여러 종목에 분산투자하면 없앨 수 있어요."}, {"term": "공분산", "meaning": "두 자산의 수익률이 같은 방향으로 움직이는지 반대로 움직이는지를 나타내는 값이에요."}, {"term": "포트폴리오", "meaning": "여러 자산을 묶어서 함께 투자하는 자산의 모음이에요."}]}, {"no": 47, "topic": "분산투자기법", "concept": "포트폴리오 기대수익률 계산", "q": "주식 X를 60%, 주식 Y를 40% 편입한 포트폴리오의 기대수익률은?\n[호황] 확률 0.3 / 주식X 25% / 주식Y 12%\n[정상] 확률 0.5 / 주식X 10% / 주식Y 6%\n[불황] 확률 0.2 / 주식X -20% / 주식Y -4%", "choices": ["6.88%", "7.42%", "7.15%", "14.30%"], "answer": 1, "explanation": "먼저 주식마다 기대수익률을 구하고, 그다음 비중으로 가중평균해요. 답은 7.42%예요.\n① X = 25%×0.3 + 10%×0.5 + (−20%)×0.2 = 7.5 + 5 − 4 = 8.5%\n② Y = 12%×0.3 + 6%×0.5 + (−4%)×0.2 = 3.6 + 3 − 0.8 = 5.8%\n③ 포트폴리오 = 8.5%×0.6 + 5.8%×0.4 = 5.1 + 2.32 = 7.42%\n6.88%는 비중을 뒤바꾼 값, 7.15%는 단순평균, 14.30%는 두 수익률의 합이에요.", "similar": [{"q": "주식펀드 A의 기대수익률이 15%, 표준편차가 20%이다. 무위험이자율이 3%일 때, 주식펀드 A를 70%, 무위험자산을 30% 편입한 포트폴리오의 기대수익률과 표준편차는?", "choices": ["기대수익률 11.4%, 표준편차 20.0%", "기대수익률 10.5%, 표준편차 14.0%", "기대수익률 11.4%, 표준편차 14.0%", "기대수익률 12.6%, 표준편차 16.0%"], "answer": 2, "explanation": "무위험자산은 표준편차가 0이고 공분산도 0이라서, 표준편차는 위험자산 비중만큼만 생겨요.\n① 기대수익률 = 0.7×15% + 0.3×3% = 10.5% + 0.9% = 11.4%\n② 표준편차 = 0.7×20% = 14.0%\n10.5%는 무위험자산 수익을 빠뜨린 값이에요. 기출(60% 편입: 13.6%, 7.2%)과 같은 구조예요.", "tip": "무위험자산 섞으면 σp = 위험자산 비중 × σ", "terms": [{"term": "무위험자산", "meaning": "수익률이 확실하게 정해져 있어 위험(표준편차)이 0인 자산이에요."}, {"term": "기대수익률", "meaning": "여러 상황이 일어날 확률을 반영해 평균적으로 기대할 수 있는 수익률이에요."}, {"term": "표준편차", "meaning": "수익률이 평균에서 얼마나 흩어져 있는지 나타내는 값으로, 분산의 제곱근이에요. 위험의 크기로 써요."}]}, {"q": "주식 X와 Y를 5:5로 편입한 포트폴리오가 있다. X의 표준편차는 20%, Y의 표준편차는 10%, 두 주식의 상관계수는 0.6일 때 포트폴리오의 표준편차로 가장 가까운 것은?", "choices": ["11.2%", "13.6%", "15.0%", "18.5%"], "answer": 1, "explanation": "두 자산 포트폴리오의 분산 공식에 넣어 계산하면 약 13.6%예요.\nσp² = wX²σX² + wY²σY² + 2wXwYρσXσY\n= 0.25×0.04 + 0.25×0.01 + 2×0.5×0.5×0.6×0.2×0.1\n= 0.01 + 0.0025 + 0.006 = 0.0185\nσp = √0.0185 ≈ 13.6%\n15.0%는 단순 가중평균(상관계수 1일 때)이에요. 상관계수가 1보다 작으면 위험은 가중평균보다 작아져요. 11.2%는 공분산 항을 빠뜨린 값이에요.", "tip": "σp² = wX²σX² + wY²σY² + 2wXwYρσXσY", "terms": [{"term": "표준편차", "meaning": "수익률이 평균에서 얼마나 흩어져 있는지 나타내는 값으로, 분산의 제곱근이에요. 위험의 크기로 써요."}, {"term": "상관계수", "meaning": "두 자산이 얼마나 같이 움직이는지를 −1에서 +1 사이 숫자로 나타낸 값이에요."}, {"term": "분산", "meaning": "수익률이 평균에서 얼마나 흩어져 있는지를 나타내는 값으로, 편차를 제곱해 평균한 것이에요."}, {"term": "공분산", "meaning": "두 자산의 수익률이 같은 방향으로 움직이는지 반대로 움직이는지를 나타내는 값이에요."}]}, {"q": "어떤 주식의 수익률이 확률 50%로 20%, 확률 50%로 -10%가 된다. 이 주식의 기대수익률과 표준편차는?", "choices": ["기대수익률 5%, 표준편차 2.25%", "기대수익률 5%, 표준편차 15%", "기대수익률 10%, 표준편차 15%", "기대수익률 5%, 표준편차 30%"], "answer": 1, "explanation": "기대수익률을 먼저 구하고, 편차를 제곱해서 분산을 구한 다음 제곱근을 씌워요.\n① 기대수익률 = 0.5×20% + 0.5×(−10%) = 5%\n② 분산 = 0.5×(20−5)² + 0.5×(−10−5)² = 0.5×225 + 0.5×225 = 225(%²) = 0.0225\n③ 표준편차 = √0.0225 = 15%\n2.25%는 분산을 표준편차로 착각한 값이에요.", "tip": "분산 = Σ확률×(편차)², 표준편차 = √분산", "terms": [{"term": "기대수익률", "meaning": "여러 상황이 일어날 확률을 반영해 평균적으로 기대할 수 있는 수익률이에요."}, {"term": "분산", "meaning": "수익률이 평균에서 얼마나 흩어져 있는지를 나타내는 값으로, 편차를 제곱해 평균한 것이에요."}, {"term": "표준편차", "meaning": "수익률이 평균에서 얼마나 흩어져 있는지 나타내는 값으로, 분산의 제곱근이에요. 위험의 크기로 써요."}, {"term": "편차", "meaning": "각 값이 평균에서 얼마나 떨어져 있는지를 나타내는 차이예요."}]}], "tip": "포트폴리오 기대수익률은 언제나 단순 가중평균", "terms": [{"term": "기대수익률", "meaning": "여러 상황이 일어날 확률을 반영해 평균적으로 기대할 수 있는 수익률이에요."}, {"term": "가중평균", "meaning": "각 값에 비중(무게)을 곱해서 더한 평균이에요. 비중이 큰 값이 결과에 더 큰 영향을 줘요."}, {"term": "포트폴리오", "meaning": "여러 자산을 묶어서 함께 투자하는 자산의 모음이에요."}]}, {"no": 48, "topic": "분산투자기법", "concept": "최소분산포트폴리오(MVP) 자산 비중 계산", "q": "주식 X의 분산은 0.09, 주식 Y의 분산은 0.16, X와 Y의 공분산은 0.03이다. 최소분산포트폴리오를 만드는 주식 X의 편입비중으로 가장 가까운 것은?", "choices": ["31.6%", "68.4%", "64.0%", "50.0%"], "answer": 1, "explanation": "최소분산포트폴리오 공식에 넣으면 X의 비중은 약 68.4%예요.\nwX = (σY² − σXY)/(σX² + σY² − 2σXY)\n= (0.16 − 0.03)/(0.09 + 0.16 − 0.06) = 0.13/0.19 ≈ 68.4%\n분자는 '상대방' 자산의 분산에서 공분산을 뺀 값이라는 점이 핵심이에요. 31.6%는 Y의 비중(1 − 0.684), 64.0%는 공분산을 무시하고 σY²/(σX²+σY²)로 계산한 값이에요.", "similar": [{"q": "자산 A의 표준편차는 0.3, 자산 B의 표준편차는 0.2, 두 자산 간 상관계수가 -1일 경우 최소분산포트폴리오가 되는 자산 A의 비중은?", "choices": ["0.31", "0.50", "0.40", "0.60"], "answer": 2, "explanation": "상관계수가 −1이면 공식이 간단해져요. A의 비중은 0.4예요.\nwA = σB/(σA + σB) = 0.2/(0.3 + 0.2) = 0.4\n이때 포트폴리오 위험은 0이 돼요. 0.60은 자산 B의 비중이에요(기출: σX 0.2, σY 0.3 → X 비중 0.6). 0.31은 상관계수 0 공식(σB²/(σA²+σB²))을 잘못 쓴 값이에요.", "tip": "ρ = −1이면 wA = σB/(σA+σB), 위험 0", "terms": [{"term": "최소분산포트폴리오", "meaning": "두 자산을 섞어서 만들 수 있는 포트폴리오 중 위험(분산)이 가장 작은 포트폴리오예요."}, {"term": "상관계수", "meaning": "두 자산이 얼마나 같이 움직이는지를 −1에서 +1 사이 숫자로 나타낸 값이에요."}, {"term": "표준편차", "meaning": "수익률이 평균에서 얼마나 흩어져 있는지 나타내는 값으로, 분산의 제곱근이에요. 위험의 크기로 써요."}]}, {"q": "자산 A의 표준편차는 0.2, 자산 B의 표준편차는 0.3, 두 자산 간 상관계수가 0일 경우 최소분산포트폴리오가 되는 자산 B의 비중으로 가장 가까운 것은?", "choices": ["30.8%", "40.0%", "60.0%", "69.2%"], "answer": 0, "explanation": "상관계수가 0이면 공분산이 0이라서 분산만으로 비중을 구해요. B의 비중은 약 30.8%예요.\nwB = σA²/(σA² + σB²) = 0.04/(0.04 + 0.09) = 0.04/0.13 ≈ 30.8%\n69.2%는 자산 A의 비중, 40.0%는 상관계수 −1 공식(σA/(σA+σB))을 잘못 쓴 값이에요. 기출(σA 0.3, σB 0.4 → B 비중 0.36)과 같은 유형이에요.", "tip": "ρ = 0이면 wB = σA²/(σA²+σB²)", "terms": [{"term": "최소분산포트폴리오", "meaning": "두 자산을 섞어서 만들 수 있는 포트폴리오 중 위험(분산)이 가장 작은 포트폴리오예요."}, {"term": "상관계수", "meaning": "두 자산이 얼마나 같이 움직이는지를 −1에서 +1 사이 숫자로 나타낸 값이에요."}, {"term": "공분산", "meaning": "두 자산의 수익률이 같은 방향으로 움직이는지 반대로 움직이는지를 나타내는 값이에요."}]}, {"q": "자산 A의 표준편차는 0.4, 자산 B의 표준편차는 0.5, 두 자산 간 상관계수가 0.5이다. 최소분산포트폴리오가 되는 자산 A의 비중으로 가장 가까운 것은?", "choices": ["55.6%", "61.0%", "71.4%", "28.6%"], "answer": 2, "explanation": "상관계수가 주어지면 먼저 공분산으로 바꾸는 것이 출발점이에요. A의 비중은 약 71.4%예요.\n① 공분산 = ρσAσB = 0.5 × 0.4 × 0.5 = 0.1\n② wA = (σB² − σAB)/(σA² + σB² − 2σAB)\n= (0.25 − 0.1)/(0.16 + 0.25 − 0.2) = 0.15/0.21 ≈ 71.4%\n61.0%는 공분산을 무시한 값(0.25/0.41), 28.6%는 B의 비중이에요.", "tip": "상관계수 → 공분산(ρσAσB) 먼저, 그다음 MVP 공식", "terms": [{"term": "최소분산포트폴리오", "meaning": "두 자산을 섞어서 만들 수 있는 포트폴리오 중 위험(분산)이 가장 작은 포트폴리오예요."}, {"term": "공분산", "meaning": "두 자산의 수익률이 같은 방향으로 움직이는지 반대로 움직이는지를 나타내는 값이에요."}, {"term": "상관계수", "meaning": "두 자산이 얼마나 같이 움직이는지를 −1에서 +1 사이 숫자로 나타낸 값이에요."}]}], "tip": "내 비중 분자 = 남의 분산 − 공분산", "terms": [{"term": "최소분산포트폴리오", "meaning": "두 자산을 섞어서 만들 수 있는 포트폴리오 중 위험(분산)이 가장 작은 포트폴리오예요."}, {"term": "분산", "meaning": "수익률이 평균에서 얼마나 흩어져 있는지를 나타내는 값으로, 편차를 제곱해 평균한 것이에요."}, {"term": "공분산", "meaning": "두 자산의 수익률이 같은 방향으로 움직이는지 반대로 움직이는지를 나타내는 값이에요."}]}, {"no": 49, "topic": "분산투자기법", "concept": "변동성보상비율(RVAR)과 자본시장선(CML)", "q": "자산 A의 기대수익률은 10%, 표준편차는 5%이다. 자산 A와 무위험수익률이 4%인 무위험자산을 7:3으로 편입한 포트폴리오의 변동성보상비율(RVAR)은?", "choices": ["1.20", "0.84", "2.00", "2.34"], "answer": 0, "explanation": "변동성보상비율(RVAR)은 편입비중과 상관없이 일정해서, 자산 A 하나로 구해도 돼요. 답은 1.2예요.\n① RVAR = (E(R) − Rf)/σ = (10% − 4%)/5% = 1.2\n② 검증: 기대수익률 = 0.7×10 + 0.3×4 = 8.2%, 표준편차 = 0.7×5 = 3.5%\n③ (8.2 − 4)/3.5 = 1.2로 같음\nRVAR은 자본배분선 위 모든 점의 기울기예요. 2.00은 무위험수익률을 빼지 않은 값, 0.84는 비중을 곱한 실수예요.", "similar": [{"q": "자본시장선(CML)에 대한 설명으로 가장 적절하지 않은 것은?", "choices": ["CML은 비효율적 포트폴리오를 포함한 모든 투자자산의 기대수익률과 베타의 관계를 나타낸다.", "CML의 기울기는 시장위험 1단위에 대한 위험보상률로, 위험의 균형가격이라고도 한다.", "CML 위에는 비체계적 위험이 완전히 제거된 효율적 포트폴리오만 위치한다.", "CML상에서 시장포트폴리오 왼쪽은 대출포트폴리오, 오른쪽은 차입포트폴리오이다."], "answer": 0, "explanation": "모든 투자자산(비효율적인 것 포함)의 기대수익률과 베타(체계적 위험)의 관계를 나타내는 것은 증권시장선(SML)이에요. 그래서 이를 CML이라고 한 설명이 틀렸어요. CML은 효율적 포트폴리오의 기대수익률과 표준편차(총위험)의 관계를 나타내고, 시장포트폴리오를 전제로 해요. 두 선의 절편(무위험이자율)이 뜻하는 것은 같아요.", "tip": "CML = 표준편차·효율적, SML = 베타·모든 자산", "terms": [{"term": "자본시장선(CML)", "meaning": "무위험자산과 시장포트폴리오를 섞은 효율적 포트폴리오의 기대수익률과 표준편차의 관계를 나타낸 직선이에요."}, {"term": "증권시장선(SML)", "meaning": "모든 자산의 기대수익률과 베타(체계적 위험)의 관계를 나타낸 직선이에요."}, {"term": "효율적 포트폴리오", "meaning": "같은 위험에서 기대수익률이 가장 높은 포트폴리오예요. 비체계적 위험이 제거되어 있어요."}, {"term": "시장포트폴리오", "meaning": "시장에 있는 모든 위험자산을 시가총액 비율대로 담은 포트폴리오예요."}]}, {"q": "무위험자산의 기대수익률이 7%, 시장포트폴리오의 기대수익률이 10%, 표준편차가 12%일 때 자본시장선(CML)의 기울기는?", "choices": ["0.03", "0.25", "0.83", "1.43"], "answer": 1, "explanation": "CML 기울기는 시장포트폴리오의 초과수익을 시장 표준편차로 나눈 값이에요. 답은 0.25예요.\nCML 기울기 = (E(Rm) − Rf)/σm = (10% − 7%)/12% = 0.25\n0.03은 SML의 기울기(시장위험프리미엄 E(Rm) − Rf = 3%)이고, 0.83은 무위험수익률을 빼지 않은 값(10/12)이에요. CML 기울기는 시장포트폴리오의 변동성보상비율과 같아요.", "tip": "CML 기울기 = (E(Rm)−Rf)/σm, SML 기울기 = E(Rm)−Rf", "terms": [{"term": "자본시장선(CML)", "meaning": "무위험자산과 시장포트폴리오를 섞은 효율적 포트폴리오의 기대수익률과 표준편차의 관계를 나타낸 직선이에요."}, {"term": "증권시장선(SML)", "meaning": "모든 자산의 기대수익률과 베타(체계적 위험)의 관계를 나타낸 직선이에요."}, {"term": "시장위험프리미엄", "meaning": "시장포트폴리오의 기대수익률에서 무위험수익률을 뺀 값으로, 시장위험을 감수한 대가예요."}]}, {"q": "기대수익률이 12%이고 표준편차가 15%인 위험자산과 기대수익률이 5%인 무위험자산에 총 100만 원을 투자하여 9%의 기대수익을 얻고자 할 때 위험자산의 투자비율로 가장 가까운 것은?", "choices": ["42.9%", "75.0%", "60.0%", "57.1%"], "answer": 3, "explanation": "위험자산 비율을 p로 두고, 목표 수익률이 되도록 식을 세워요. 답은 약 57.1%예요.\n9% = 12% × p + 5% × (1 − p)\n9 = 5 + 7p → p = 4/7 ≈ 57.1%\n42.9%는 무위험자산의 비율이에요. 이때 포트폴리오 표준편차는 0.571 × 15% ≈ 8.6%이고, 변동성보상비율은 (12−5)/15로 비중과 상관없이 일정해요.", "tip": "목표수익률 = 위험자산 수익률×p + 무위험수익률×(1−p)", "terms": [{"term": "무위험자산", "meaning": "수익률이 확실하게 정해져 있어 위험(표준편차)이 0인 자산이에요."}, {"term": "변동성보상비율(RVAR)", "meaning": "위험 1단위(표준편차)당 얻는 초과수익으로, (기대수익률 − 무위험수익률)/표준편차로 구해요."}, {"term": "기대수익률", "meaning": "여러 상황이 일어날 확률을 반영해 평균적으로 기대할 수 있는 수익률이에요."}]}], "tip": "RVAR = (E(R)−Rf)/σ, 무위험자산과 섞어도 불변", "terms": [{"term": "변동성보상비율(RVAR)", "meaning": "위험 1단위(표준편차)당 얻는 초과수익으로, (기대수익률 − 무위험수익률)/표준편차로 구해요."}, {"term": "무위험자산", const NUM = ["①","②","③","④"];
const KEY = "ias-cbt-v1";
let st = {ans:{}, tab:"1", filter:"all", t0:Date.now()};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s&&s.ans) st={...st,...s};}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
const $=s=>document.querySelector(s);
const NEG=/(옳지 않은 것|옳지 않게|적절하지 않은 것|가장 거리가 먼 것|거리가 먼 것|해당하지 않는 것|해당되지 않는 것|아닌 것|틀린 것|잘못된 것|않는 것|포함되지 않는 것)/g;
const qfmt=s=>esc(s).replace(NEG,"<strong>$1</strong>");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function subjStats(si){
  const S=DATA[si-1]; let done=0,ok=0;
  S.items.forEach(it=>{const a=st.ans[`${si}-${it.no}`]; if(a!==undefined){done++; if(a===it.answer) ok++;}});
  return {done,ok,n:S.items.length,pct:ok/S.items.length*100};
}
function simStats(){let d=0,o=0;DATA.forEach((S,i)=>S.items.forEach(it=>it.similar.forEach((s,k)=>{const a=st.ans[`${i+1}-${it.no}-${k}`];if(a!==undefined){d++;if(a===s.answer)o++;}})));return{d,o};}

function renderTabs(){
  const t=$("#tabs"); t.innerHTML="";
  DATA.forEach((S,i)=>{const s=subjStats(i+1);
    t.insertAdjacentHTML("beforeend",`<button class="tab" role="tab" aria-selected="${st.tab==String(i+1)}" data-tab="${i+1}">${i+1}과목 ${esc(S.short)}<em>${s.ok}/${s.done}</em></button>`);});
  t.insertAdjacentHTML("beforeend",`<button class="tab" role="tab" aria-selected="${st.tab=="t"}" data-tab="t">암기팁 모음</button><button class="tab" role="tab" aria-selected="${st.tab=="r"}" data-tab="r">성적표 · 취약 주제</button>`);
  t.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{st.tab=b.dataset.tab;st.filter="all";save();render();window.scrollTo(0,0);});
}
function renderMeta(){
  let done=0,tot=0; DATA.forEach((S,i)=>{const s=subjStats(i+1);done+=s.done;tot+=s.pct;});
  $("#m-done").textContent=`${done} / ${DATA.reduce((a,S)=>a+S.items.length,0)}`;
  $("#m-total").textContent=(tot/DATA.length).toFixed(1);
}

function choiceHTML(key,item){
  const a=st.ans[key];
  return `<ul class="choices">${item.choices.map((c,i)=>{
    let cls="ch"; if(a!==undefined){ if(i===a) cls+= a===item.answer?" pick-ok":" pick-bad"; else if(i===item.answer) cls+=" is-ans";}
    return `<li><button class="${cls}" data-key="${key}" data-i="${i}" ${a!==undefined?"disabled":""}><span class="mk">${i+1}</span><span class="tx">${esc(c)}</span>${a!==undefined&&(i===a||i===item.answer)?`<span class="flag">${i===item.answer?"정답":"내 선택"}</span>`:""}</button></li>`;}).join("")}</ul>`;
}
function expHTML(key,item,concept){
  const a=st.ans[key]; if(a===undefined) return "";
  const terms=(item.terms||[]).length?`<dl class="terms">${item.terms.map(t=>`<div><dt>${esc(t.term)}</dt> <dd>${esc(t.meaning)}</dd></div>`).join("")}</dl>`:"";
  const tip=item.tip?`<div class="tip"><b>암기팁</b>${esc(item.tip)}</div>`:"";
  return `<div class="exp"><b>정답 ${NUM[item.answer]} · 해설</b><div class="exp-body">${esc(item.explanation)}</div>${concept?`<div class="concept">핵심 개념: ${esc(concept)}</div>`:""}${terms}${tip}</div>`;
}
function statusHTML(key,item){const a=st.ans[key]; if(a===undefined) return ""; return a===item.answer?`<span class="status ok">정답</span>`:`<span class="status bad">오답 · 내가 고른 답 ${NUM[a]}</span>`;}

function qHTML(si,it){
  const key=`${si}-${it.no}`, a=st.ans[key];
  let sim="";
  if(a!==undefined && a!==it.answer){
    const sd=it.similar.filter((s,k)=>st.ans[`${key}-${k}`]!==undefined).length;
    const so=it.similar.filter((s,k)=>st.ans[`${key}-${k}`]===s.answer).length;
    sim=`<div class="sim"><div class="sim-h"><b>유사문항 3개로 다시 확인</b><span>같은 개념을 다른 각도에서 묻습니다 · ${so}/${sd} 정답</span></div>${
      it.similar.map((s,k)=>{const sk=`${key}-${k}`;return `<div class="q" id="q${sk}"><div class="qhead"><span class="qno">유사 ${it.no}-${k+1}</span>${statusHTML(sk,s)}</div><p class="qtext">${qfmt(s.q)}</p>${choiceHTML(sk,s)}${expHTML(sk,s)}</div>`;}).join("")}</div>`;
  }
  return `<article class="q" id="q${key}"><div class="qhead"><span class="qno">${String(it.no).padStart(2,"0")}.</span><span class="topic">${esc(it.topic)}</span>${statusHTML(key,it)}</div><p class="qtext">${qfmt(it.q)}</p>${choiceHTML(key,it)}${expHTML(key,it,it.concept)}${sim}</article>`;
}

function renderSubject(si){
  const S=DATA[si-1]; const f=st.filter;
  const list=S.items.filter(it=>{const a=st.ans[`${si}-${it.no}`]; return f==="all"||(f==="todo"&&a===undefined)||(f==="wrong"&&a!==undefined&&a!==it.answer);});
  const s=subjStats(si);
  $("#main").innerHTML=`<div class="subhead"><div><h1>제${si}과목 ${esc(S.name)}</h1><p>${esc(S.desc)}</p></div>
    <div class="filters" role="group" aria-label="문항 필터">
      <button class="chip" data-f="all" aria-pressed="${f==="all"}">전체 ${S.items.length}</button>
      <button class="chip" data-f="todo" aria-pressed="${f==="todo"}">안 푼 문제 ${S.items.length-s.done}</button>
      <button class="chip" data-f="wrong" aria-pressed="${f==="wrong"}">틀린 문제 ${s.done-s.ok}</button></div></div>
    <div class="paper">${list.length?list.map(it=>qHTML(si,it)).join(""):`<div class="empty">${f==="wrong"?"틀린 문제가 없습니다.":"모든 문제를 풀었습니다. 성적표 탭에서 결과를 확인하세요."}</div>`}</div>`;
  $("#main").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{st.filter=b.dataset.f;save();renderSubject(si);});
  // OMR side
  const cutOk=s.pct>=40;
  $("#side").innerHTML=`<div class="card"><h2>${si}과목 점수</h2>
    <div class="score"><span class="big">${s.ok}</span><span class="of">/ ${s.n}문항 정답 · 푼 문항 ${s.done}</span></div>
    <div class="bar" title="과락 기준 40%"><i style="width:${s.pct}%"></i><span class="cut" style="left:40%"></span></div>
    <div class="small">${s.pct.toFixed(0)}% · 과락선 40% ${s.done?(cutOk?'<span class="pill ok">과락 면함</span>':'<span class="pill bad">과락 위험</span>'):'<span class="pill wait">응시 전</span>'}</div></div>
    <div class="card"><h2>답안 표기란</h2><div class="omr">${S.items.map(it=>{const a=st.ans[`${si}-${it.no}`];const c=a===undefined?"":(a===it.answer?"ok":"bad");return `<a href="#q${si}-${it.no}" class="${c}" data-jump="${si}-${it.no}">${it.no}${a!==undefined?`<span>${NUM[a]}</span>`:""}</a>`;}).join("")}</div>
    <div class="legend"><span><i style="background:var(--ok-soft);border-color:var(--ok)"></i>정답</span><span><i style="background:var(--bad-soft);border-color:var(--bad)"></i>오답</span><span><i></i>미응답</span></div></div>
    <div class="card"><button class="btn danger" id="reset">${si}과목 답안 초기화</button><p class="small" style="margin:8px 0 0">초기화하면 이 과목의 모든 답안과 유사문항 답안이 지워집니다.</p></div>`;
  $("#side").querySelectorAll("[data-jump]").forEach(a=>a.onclick=e=>{e.preventDefault();if(st.filter!=="all"&&!document.getElementById("q"+a.dataset.jump)){st.filter="all";renderSubject(si);}document.getElementById("q"+a.dataset.jump)?.scrollIntoView({behavior:"smooth",block:"start"});});
  const rb=$("#reset"); let armed=false;
  rb.onclick=()=>{ if(!armed){armed=true;rb.textContent="한 번 더 누르면 초기화됩니다";setTimeout(()=>{armed=false;rb.textContent=`${si}과목 답안 초기화`;},3000);return;}
    Object.keys(st.ans).forEach(k=>{if(k.startsWith(si+"-"))delete st.ans[k];});save();render();};
}

function renderResult(){
  const rows=DATA.map((S,i)=>({S,s:subjStats(i+1)}));
  const total=rows.reduce((a,r)=>a+r.s.pct,0)/rows.length;
  const allDone=rows.every(r=>r.s.done===r.s.n);
  const pass=rows.every(r=>r.s.pct>=40)&&total>=60;
  const sm=simStats();
  // weak topics
  const topics={};
  DATA.forEach((S,i)=>S.items.forEach(it=>{const a=st.ans[`${i+1}-${it.no}`];if(a===undefined)return;const k=`${i+1}과목 · ${it.topic}`;topics[k]=topics[k]||{d:0,w:0,si:i+1};topics[k].d++;if(a!==it.answer)topics[k].w++;}));
  const weak=Object.entries(topics).filter(([k,v])=>v.w>0).sort((a,b)=>b[1].w/b[1].d-a[1].w/a[1].d||b[1].w-a[1].w);
  const wrongList=[];DATA.forEach((S,i)=>S.items.forEach(it=>{const a=st.ans[`${i+1}-${it.no}`];if(a!==undefined&&a!==it.answer)wrongList.push({si:i+1,it});}));
  $("#main").innerHTML=`<div class="subhead"><div><h1>성적표</h1><p>과목별 40% 미만이면 과락, 세 과목 평균 60% 이상이면 합격입니다. 목표는 70점입니다.</p></div></div>
  <div class="res">
    <div class="paper"><div class="tbl-wrap"><table><thead><tr><th>과목</th><th style="text-align:right">푼 문항</th><th style="text-align:right">정답</th><th style="text-align:right">점수</th><th>판정</th></tr></thead><tbody>
    ${rows.map((r,i)=>`<tr><td>${i+1}과목 ${esc(r.S.name)}</td><td class="n">${r.s.done}/${r.s.n}</td><td class="n">${r.s.ok}</td><td class="n">${r.s.pct.toFixed(0)}</td><td>${!r.s.done?'<span class="pill wait">응시 전</span>':r.s.pct>=40?'<span class="pill ok">통과</span>':'<span class="pill bad">과락</span>'}</td></tr>`).join("")}
    <tr><td><b>평균</b></td><td class="n"></td><td class="n"></td><td class="n"><b>${total.toFixed(1)}</b></td><td>${pass?'<span class="pill ok">합격권</span>':'<span class="pill bad">불합격권</span>'}${allDone?"":' <span class="small">(미응답은 0점 처리)</span>'}</td></tr>
    </tbody></table></div></div>
    <div class="card"><h2>유사문항 재도전</h2><div class="small">유사문항 ${sm.d}개를 풀어 ${sm.o}개를 맞혔습니다${sm.d?` (${Math.round(sm.o/sm.d*100)}%)`:""}.</div></div>
    <div class="card"><h2>취약 주제 (오답률 높은 순)</h2>${weak.length?`<div class="weak">${weak.map(([k,v])=>`<div class="weak-row"><span>${esc(k)}</span><div class="bar"><i style="width:${v.w/v.d*100}%"></i></div><span class="small" style="text-align:right">${v.w}/${v.d} 오답</span></div>`).join("")}</div>`:`<div class="small">아직 틀린 문제가 없습니다.</div>`}</div>
    <div class="card"><h2>틀린 문제 바로가기</h2>${wrongList.length?`<div class="omr" style="grid-template-columns:repeat(auto-fill,minmax(64px,1fr))">${wrongList.map(w=>`<a href="#" class="bad" data-go="${w.si}-${w.it.no}">${w.si}-${w.it.no}</a>`).join("")}</div>`:`<div class="small">없음</div>`}</div>
  </div>`;
  $("#main").querySelectorAll("[data-go]").forEach(a=>a.onclick=e=>{e.preventDefault();const [si]=a.dataset.go.split("-");st.tab=si;st.filter="all";save();render();document.getElementById("q"+a.dataset.go)?.scrollIntoView({block:"start"});});
  $("#side").innerHTML=`<div class="card"><h2>총점</h2><div class="score"><span class="big">${total.toFixed(1)}</span><span class="of">/ 100</span></div><div class="bar"><i style="width:${total}%"></i><span class="cut" style="left:60%"></span><span class="cut" style="left:70%;opacity:.4"></span></div><div class="small">합격선 60 · 목표 70</div></div>
  <div class="card"><button class="btn danger" id="resetAll">전체 답안 초기화</button></div>`;
  const rb=$("#resetAll");let armed=false;rb.onclick=()=>{if(!armed){armed=true;rb.textContent="한 번 더 누르면 전체 초기화";setTimeout(()=>{armed=false;rb.textContent="전체 답안 초기화";},3000);return;}st.ans={};save();render();};
}

function renderTips(){
  const sf=st.tipSubj||"0", only=!!st.tipWrong;
  let html="";
  DATA.forEach((S,i)=>{ if(sf!=="0"&&sf!==String(i+1)) return;
    const groups={};
    S.items.forEach(it=>{const a=st.ans[`${i+1}-${it.no}`]; if(only&&!(a!==undefined&&a!==it.answer)) return;
      const seen=new Set(); const g=(groups[it.topic]=groups[it.topic]||[]);
      [it,...it.similar].forEach(x=>{if(x.tip&&!seen.has(x.tip)){seen.add(x.tip);g.push({tip:x.tip,concept:it.concept,no:it.no});}});});
    Object.entries(groups).forEach(([tp,arr])=>{ if(!arr.length) return;
      html+=`<div class="tgroup">${i+1}과목 · ${esc(tp)} <span class="small">${arr.length}개</span></div>`+arr.map(x=>`<div class="tiprow"><div><div class="c">${esc(x.concept)}</div><div class="t">${esc(x.tip)}</div></div><a href="#" data-go="${i+1}-${x.no}">문제 ${x.no} →</a></div>`).join("");});
  });
  $("#main").innerHTML=`<div class="subhead"><div><h1>암기팁 모음</h1><p>해설에 나온 암기팁을 과목·단원별로 모았습니다. 시험 직전에 훑어보세요.</p></div>
    <div class="filters" role="group" aria-label="과목 선택">${["전체","1과목","2과목","3과목"].map((l,k)=>`<button class="chip" data-s="${k}" aria-pressed="${sf===String(k)}">${l}</button>`).join("")}
    <button class="chip" data-w="1" aria-pressed="${only}">틀린 문제만</button></div></div>
    <div class="paper tiplist">${html||`<div class="empty">${only?"틀린 문제가 아직 없습니다.":"암기팁이 없습니다."}</div>`}</div>`;
  $("#main").querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{st.tipSubj=b.dataset.s;save();renderTips();});
  $("#main").querySelector("[data-w]").onclick=()=>{st.tipWrong=!only;save();renderTips();};
  $("#main").querySelectorAll("[data-go]").forEach(a=>a.onclick=e=>{e.preventDefault();st.tab=a.dataset.go.split("-")[0];st.filter="all";save();render();document.getElementById("q"+a.dataset.go)?.scrollIntoView({block:"start"});});
  const ns=new Set();DATA.forEach(S=>S.items.forEach(it=>[it,...it.similar].forEach(x=>{if(x.tip)ns.add(x.tip);})));const n=ns.size;
  $("#side").innerHTML=`<div class="card"><h2>암기팁</h2><div class="score"><span class="big">${n}</span><span class="of">개 수록</span></div><p class="small" style="margin:8px 0 0">'틀린 문제만'을 켜면 내가 틀린 문제의 팁만 남습니다. 문제 번호를 누르면 그 문제로 이동합니다.</p></div>`;
}
function render(){renderTabs();renderMeta(); if(st.tab==="r") renderResult(); else if(st.tab==="t") renderTips(); else renderSubject(+st.tab);}

document.addEventListener("click",e=>{
  const b=e.target.closest(".ch"); if(!b||b.disabled) return;
  const key=b.dataset.key; if(st.ans[key]!==undefined) return;
  st.ans[key]=+b.dataset.i; save();
  const y=window.scrollY; renderSubjectKeep(key); window.scrollTo(0,y);
});
function renderSubjectKeep(key){
  const si=+key.split("-")[0]; if(st.filter!=="all"){st.filter="all";save();}
  renderTabs(); renderMeta(); renderSubject(si);
}
render();
</script>

</body></html>
