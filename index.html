 상장 후 '40일'.", "terms": [{"term": "최선집행기준", "meaning": "고객 주문을 가장 유리한 가격·비용·조건으로 처리하기 위해 회사가 정한 기준."}, {"term": "투자매매업자", "meaning": "자기 돈으로 직접 증권을 사고파는 회사."}, {"term": "투자중개업자", "meaning": "고객의 주문을 받아 대신 사고팔아 주는(중개하는) 회사."}, {"term": "조사분석자료", "meaning": "특정 회사나 금융투자상품의 가치를 분석해 투자의견을 담은 보고서(리서치 자료)."}]}, {"no": 11, "topic": "자본시장법·금융위원회규정", "concept": "불건전영업행위(선행매매·임의매매·과당매매)", "q": "투자매매업자·투자중개업자의 불건전영업행위에 대한 설명으로 옳지 않은 것은?", "choices": ["투자자의 주문을 체결하기 전에 자기 계산으로 매매하거나 제3자에게 매매를 권유하는 행위는 선행매매에 해당한다.", "증권시장과 파생상품시장 간의 가격차이를 이용한 차익거래는 선행매매 금지의 예외이다.", "과당매매는 영업실적을 올리기 위해 일반투자자의 재산으로 과도하고 빈번하게 거래하는 행위이다.", "투자일임약정이 실제로 존재하지 않는데도 투자자의 예탁재산으로 매매한 경우는 일임매매에 해당한다."], "answer": 3, "explanation": "투자일임약정이 실제로 없는데 투자자 예탁재산으로 매매했다면 일임매매가 아니라 임의매매이다. 그래서 이 선지가 틀렸고 정답이다. 약정이 실제로 있어야 일임매매가 된다. 선행매매는 가격에 큰 영향을 줄 고객 주문을 체결하기 전에 자기 매매나 제3자 권유를 하는 것이다. 차익거래나 주문정보를 이용하지 않았음을 증명하는 경우는 선행매매의 예외이다. 과당매매는 일반투자자 재산으로 과도하고 빈번하게 거래하는 행위이다.", "similar": [{"q": "다음 빈칸에 들어갈 말로 옳게 연결된 것은?\n금융투자분석사가 소속 금융투자회사에서 조사분석자료를 공표한 금융투자상품을 매매하는 경우 공표 후 ( ㄱ )이 경과해야 하며, 공표일로부터 ( ㄴ ) 동안은 공표한 투자의견과 같은 방향으로 매매해야 한다.", "choices": ["ㄱ 12시간, ㄴ 7일", "ㄱ 24시간, ㄴ 7일", "ㄱ 24시간, ㄴ 30일", "ㄱ 48시간, ㄴ 14일"], "answer": 1, "explanation": "금융투자분석사는 조사분석자료를 공표한 뒤 24시간이 지나야 그 상품을 매매할 수 있다. 또 공표일로부터 7일 동안은 공표한 투자의견과 같은 방향으로만 매매해야 한다. 그래서 'ㄱ 24시간, ㄴ 7일'이 정답이다. 이는 스캘핑을 막기 위한 규정이다. 본인이 담당하는 업종은 아예 매매할 수 없다.", "tip": "'24시간·7일'.", "terms": [{"term": "금융투자분석사", "meaning": "조사분석자료를 작성하는 애널리스트."}, {"term": "조사분석자료", "meaning": "특정 회사나 금융투자상품의 가치를 분석해 투자의견을 담은 보고서(리서치 자료)."}, {"term": "스캘핑", "meaning": "자기가 낸 투자의견을 이용해 공표 전후로 짧게 사고팔아 이익을 챙기는 행위."}]}, {"q": "투자매매업자 또는 투자중개업자가 투자자나 그 대리인으로부터 매매의 청약 또는 주문을 받지 아니하고 투자자로부터 예탁받은 재산으로 금융투자상품을 매매하는 행위는?", "choices": ["일임매매", "과당매매", "임의매매", "선행매매"], "answer": 2, "explanation": "투자자의 주문을 받지 않고 투자자 예탁재산으로 매매하는 것은 임의매매이다. 그래서 이것이 정답이다(자본시장법 제70조). 일임매매는 투자일임약정이 실제로 있는 경우이다. 과당매매는 과도하고 빈번한 거래이고, 선행매매는 고객 주문 전에 자기매매를 하는 것이다.", "tip": "주문 없이 매매 = 임의매매.", "terms": [{"term": "임의매매", "meaning": "고객의 주문이나 일임약정 없이 고객 재산으로 마음대로 사고판 행위."}, {"term": "일임매매", "meaning": "투자일임약정이 실제로 있어서 고객이 맡긴 판단에 따라 사고파는 것."}, {"term": "과당매매", "meaning": "영업실적을 올리려고 고객 돈으로 너무 자주, 너무 많이 사고파는 행위."}, {"term": "선행매매", "meaning": "고객의 큰 주문을 알고 그 주문이 체결되기 전에 회사가 먼저 사고팔아 이익을 얻는 행위."}]}, {"q": "투자매매업자가 자기가 발행한 자기주식을 증권시장 밖에서 예외적으로 취득할 수 있는 경우는?", "choices": ["주가 안정을 위해 필요하다고 이사회가 판단한 경우", "자기주식의 시가가 액면가 아래로 하락한 경우", "투자자로부터 증권시장의 매매수량단위 미만의 매도 청약을 받은 경우", "투자자로부터 대량의 매도 청약을 받은 경우"], "answer": 2, "explanation": "투자매매업자는 자기가 발행한 자기주식에 대해 증권시장 매매수량단위 미만(단주)의 매도 청약을 받은 경우에만 증권시장 밖에서 취득할 수 있다. 그래서 이것이 정답이다. 주가 안정, 액면가 아래로 하락, 대량 매도 청약은 모두 예외 사유가 아니다.", "tip": "자기주식 장외 취득 = '단주'만.", "terms": [{"term": "자기주식", "meaning": "회사가 자기가 발행한 주식을 다시 사서 가지고 있는 것."}, {"term": "단주", "meaning": "거래소의 최소 매매단위보다 적은 수량의 주식."}, {"term": "투자매매업자", "meaning": "자기 돈으로 직접 증권을 사고파는 회사."}]}], "tip": "'약정 있으면 일임, 없으면 임의'.", "terms": [{"term": "임의매매", "meaning": "고객의 주문이나 일임약정 없이 고객 재산으로 마음대로 사고판 행위."}, {"term": "일임매매", "meaning": "투자일임약정이 실제로 있어서 고객이 맡긴 판단에 따라 사고파는 것."}, {"term": "선행매매", "meaning": "고객의 큰 주문을 알고 그 주문이 체결되기 전에 회사가 먼저 사고팔아 이익을 얻는 행위."}, {"term": "차익거래", "meaning": "같은 상품이 두 시장에서 가격이 다를 때 싼 곳에서 사고 비싼 곳에서 팔아 이익을 얻는 거래."}]}, {"no": 12, "topic": "자본시장법·금융위원회규정", "concept": "집합투자기구 동일종목 투자제한의 예외", "q": "공모 집합투자기구는 동일종목 증권에 자산총액의 10%까지만 투자할 수 있다. 그 예외로서 자산총액의 30%까지 투자할 수 있는 대상이 아닌 것은?", "choices": ["지방채", "특수채", "국채", "파생결합증권"], "answer": 2, "explanation": "국채는 30%가 아니라 100%까지 투자할 수 있다. 그래서 이것이 정답이다. 국채, 통안채, 정부보증채는 100%까지 가능하다. 지방채, 특수채, OECD 회원국이나 중국이 발행한 채권, 금융기관 발행채권, 파생결합증권 등은 30%까지 투자할 수 있다. ETF에서 동일종목에 투자하는 경우 등도 30%까지 가능하다.", "similar": [{"q": "집합투자기구의 금전차입 등과 관련하여 빈칸에 들어갈 말로 옳게 연결된 것은?\n대량환매청구 등 예외적인 경우 차입 당시 순자산총액의 ( ㄱ )까지 차입할 수 있으며, 부동산집합투자기구는 순자산총액의 ( ㄴ )까지 금전차입, ( ㄷ )까지 금전대여가 가능하다.", "choices": ["ㄱ 10%, ㄴ 100%, ㄷ 200%", "ㄱ 20%, ㄴ 200%, ㄷ 100%", "ㄱ 10%, ㄴ 200%, ㄷ 70%", "ㄱ 10%, ㄴ 200%, ㄷ 100%"], "answer": 3, "explanation": "일반 집합투자기구는 대량환매 같은 예외적인 경우 순자산의 10%까지 차입할 수 있다. 부동산집합투자기구는 특례로 순자산의 200%까지 차입하고, 100%까지 대여할 수 있다. 그래서 'ㄱ 10%, ㄴ 200%, ㄷ 100%'가 정답이다. 부동산펀드가 아닌 집합투자기구는 보유 부동산가액의 70%까지 차입할 수 있다.", "tip": "'차입 200, 대여 100, 비부동산펀드 70'.", "terms": [{"term": "집합투자기구", "meaning": "여러 투자자의 돈을 모아 운용하고 그 결과를 나눠 주는 펀드."}, {"term": "순자산총액", "meaning": "펀드 자산 전체에서 부채를 뺀 금액."}, {"term": "부동산집합투자기구", "meaning": "모은 돈을 주로 부동산에 투자하는 펀드."}]}, {"q": "집합투자기구의 이익금 분배에 대한 설명으로 가장 적절하지 않은 것은?", "choices": ["집합투자업자는 이익금을 투자자에게 금전 또는 새로 발행하는 집합투자증권으로 분배해야 한다.", "투자회사가 이익금 전액을 새로 발행하는 주식으로 분배하려면 이사회 결의를 거쳐야 한다.", "투자회사는 순자산액에서 최저순자산액을 뺀 금액을 초과하여 분배할 수 없다.", "MMF는 집합투자규약이 정하는 바에 따라 이익금의 분배를 유보할 수 있다."], "answer": 3, "explanation": "이익금 분배는 집합투자규약에 따라 유보할 수 있지만, MMF는 유보할 수 없다. 그래서 이 선지가 틀렸고 정답이다. 이익금은 금전이나 새로 발행하는 집합투자증권으로 분배한다. 투자회사가 신주로 분배하려면 이사회 결의가 필요하다. 이익금보다 많이 분배하는 것도 가능하지만, 투자회사는 '순자산액 - 최저순자산액'을 넘어서 분배할 수 없다.", "tip": "MMF는 분배 유보 불가.", "terms": [{"term": "이익금 분배", "meaning": "펀드에서 생긴 이익을 투자자에게 나누어 주는 것."}, {"term": "MMF", "meaning": "단기 채권 등 아주 짧은 만기의 안전한 자산에 투자하는 펀드(머니마켓펀드)."}, {"term": "투자회사", "meaning": "회사(주식회사) 형태로 만든 펀드. 투자자는 그 회사의 주주가 된다."}, {"term": "최저순자산액", "meaning": "투자회사가 최소한 유지해야 하는 순자산 금액."}]}, {"q": "공모 집합투자기구의 운용제한에 대한 설명으로 옳은 것은?", "choices": ["동일 집합투자업자가 운용하는 전체 집합투자기구에서 동일법인 발행 지분증권 총수의 20%를 초과하여 투자할 수 없다.", "각 집합투자기구는 동일법인이 발행한 지분증권 총수의 20%까지 투자할 수 있다.", "파생상품 매매에 따른 위험평가액은 집합투자기구 순자산의 20%까지 허용된다.", "동일 집합투자업자가 운용하는 집합투자기구 전체의 집합투자증권에는 자산총액의 70%까지 투자할 수 있다."], "answer": 0, "explanation": "동일법인이 발행한 지분증권에는 같은 집합투자업자가 운용하는 펀드 전체를 합쳐 총수의 20%를 넘게 투자할 수 없다. 그래서 이것이 옳은 설명이다. 각 펀드 기준으로는 20%가 아니라 10%까지이다. 파생상품 위험평가액은 순자산의 20%가 아니라 10%를 넘을 수 없다. 같은 운용사의 집합투자증권 투자는 각 펀드 20%, 전체 50% 이내이므로 70%도 틀렸다.", "tip": "지분 '10/20', 펀드투자 '20/50'.", "terms": [{"term": "지분증권", "meaning": "주식처럼 회사에 대한 소유 지분을 나타내는 증권."}, {"term": "위험평가액", "meaning": "파생상품 거래로 생길 수 있는 위험을 금액으로 평가한 것."}, {"term": "집합투자기구", "meaning": "여러 투자자의 돈을 모아 운용하고 그 결과를 나눠 주는 펀드."}]}], "tip": "'국가가 직접 보증 = 100%, 그 밖의 준공공 = 30%'.", "terms": [{"term": "공모", "meaning": "불특정 다수(50인 이상)의 투자자를 대상으로 모집하는 것."}, {"term": "동일종목", "meaning": "같은 회사(발행인)가 발행한 같은 종류의 증권."}, {"term": "특수채", "meaning": "한국전력 등 법률로 정한 특별한 법인이 발행하는 채권."}, {"term": "파생결합증권", "meaning": "주가, 금리 같은 기초자산의 움직임에 따라 받을 돈이 정해지는 증권(ELS, ELW 등)."}]}, {"no": 13, "topic": "자본시장법·금융위원회규정", "concept": "집합투자업자의 이해관계인 거래제한", "q": "집합투자업자의 영업행위 규칙으로서 이해관계인과의 거래제한 등에 대한 설명으로 적절하지 않은 것은?", "choices": ["이해관계인에는 집합투자업자의 계열회사 임직원 및 그 배우자도 포함된다.", "집합투자업자는 집합투자기구의 계산으로 그 집합투자업자가 발행한 수익증권을 취득할 수 있다.", "이해관계인이 되기 6개월 이전에 체결한 계약에 따른 거래는 예외가 인정된다.", "이해관계인과의 예외거래 시 및 이해관계인의 변경 시에는 신탁업자에게 즉시 통보해야 한다."], "answer": 1, "explanation": "집합투자기구의 돈으로 그 집합투자기구 자신의 집합투자증권(수익증권)을 취득하는 것은 금지된다. 그래서 '취득할 수 있다'는 설명이 틀렸고 정답이다. 이해관계인에는 계열회사 임직원과 그 배우자도 포함된다. 이해관계인이 되기 6개월 이전에 맺은 계약, 증권시장 등 공개시장 거래, 집합투자기구에 유리한 거래 등은 예외이다. 예외거래를 하거나 이해관계인이 바뀌면 신탁업자에게 즉시 알려야 한다.", "similar": [{"q": "집합투자업자의 의결권 행사에 대한 설명으로 옳은 것은?", "choices": ["집합투자재산에 속하는 주식의 발행법인이 계열회사인 경우 중립투표(shadow voting)를 하는 것이 원칙이다.", "제3자와의 계약에 의한 의결권 교차행사는 사모펀드에 한하여 허용된다.", "동일종목 투자한도를 위반하여 취득한 주식이라도 의결권을 행사할 수 있다.", "투자신탁재산에 속하는 주식의 의결권은 판매회사가 행사한다."], "answer": 0, "explanation": "주식 발행법인이 계열회사이거나 사실상 지배력을 행사하는 관계라면 중립투표(shadow voting)를 하는 것이 원칙이다. 그래서 이것이 옳은 설명이다. 의결권 교차행사는 공모·사모 모두 금지된다. 투자한도를 위반해 취득한 주식은 의결권을 행사할 수 없다. 의결권은 판매회사가 아니라 집합투자업자가 충실의무에 따라 행사한다.", "tip": "계열사 주식 = 중립투표, 교차행사는 공모·사모 모두 금지.", "terms": [{"term": "중립투표(shadow voting)", "meaning": "주주총회에서 다른 주주들의 찬성·반대 비율과 똑같은 비율로 의결권을 행사하는 것."}, {"term": "의결권 교차행사", "meaning": "서로 다른 회사끼리 짜고 상대 펀드의 의결권을 대신 행사해 주는 것."}, {"term": "계열회사", "meaning": "같은 기업집단에 속해 서로 연결된 회사."}]}, {"q": "집합투자업자의 수시공시사항에 속하지 않는 것은?", "choices": ["투자운용인력의 변경", "환매연기 또는 환매재개의 결정 및 그 사유", "집합투자자총회의 결의내용", "집합투자규약에 따른 투자설명서 내용의 변경"], "answer": 3, "explanation": "투자설명서 내용의 변경 자체는 수시공시사항이 아니다. 그래서 이것이 정답이다. 수시공시사항에는 투자운용인력 변경, 환매연기·재개 결정과 그 사유, 부실자산 발생 시 명세와 상각률, 집합투자자총회 결의내용 등이 있다.", "tip": "수시공시 = 인력 변경·환매연기·부실자산·총회 결의.", "terms": [{"term": "수시공시", "meaning": "정기적으로가 아니라, 중요한 일이 생길 때마다 바로 알리는 공시."}, {"term": "환매연기", "meaning": "펀드 투자자가 돈을 돌려달라고 해도 정해진 사유로 지급을  확률을 부여하여 추정한다.", "시장공통예측치 사용법에서 주식의 기대수익률은 PER의 역수 등을 활용하여 추정할 수 있다.", "시장공통예측치 사용법에서 채권의 기대수익률은 수익률곡선에서 추정한다."], "answer": 0, "explanation": "추세분석법은 과거 오랜 기간의 수익률을 분석하는 방법이다. 그래서 자본시장 역사가 짧은 우리나라에서는 쓰기 어렵다. 따라서 '가장 적합하다'는 설명이 틀렸고 정답이다. 시나리오분석법은 거시경제변수 시나리오와 확률을 이용한다. 시장공통예측치 사용법은 주식은 PER의 역수(또는 배당할인모형), 채권은 수익률곡선으로 기대수익률을 추정한다.", "tip": "추세분석법 = 역사 짧은 한국엔 곤란.", "terms": [{"term": "추세분석법", "meaning": "과거 오랜 기간의 수익률을 분석해 미래 수익률을 추정하는 방법."}, {"term": "시나리오분석법", "meaning": "경제 상황을 여러 시나리오로 나누고 각각에 확률을 주어 수익률을 추정하는 방법."}, {"term": "PER", "meaning": "주가수익비율. 주가를 주당순이익(EPS)으로 나눈 값으로, 이익에 비해 주가가 얼마나 비싼지 보여준다."}, {"term": "수익률곡선", "meaning": "채권 만기별 수익률을 이어 그린 곡선."}]}, {"q": "자산배분의 대상이 되는 자산집단이 갖추어야 할 기본적 속성에 대한 설명으로 옳은 것은?", "choices": ["분산가능성: 자산집단 간의 상관관계가 높아야 한다.", "충분성: 자산집단 내 투자대상의 규모와 수는 적을수록 바람직하다.", "배타성: 자산집단 간에는 서로 겹치는 부분이 없어야 한다.", "동질성: 자산집단 내의 자산들은 서로 이질적인 특성을 가져야 한다."], "answer": 2, "explanation": "배타성은 자산집단끼리 서로 겹치는 부분이 없어야 한다는 뜻이다. 그래서 이것이 옳은 설명이다. 분산가능성은 자산집단 간 상관관계가 '낮아야' 한다. 충분성은 투자대상의 규모와 수가 유동성 문제가 없을 만큼 '충분해야' 한다. 동질성은 집단 안의 자산들이 '같은' 특성을 가져야 한다. 포괄성은 투자 가능한 자산 대부분을 포함해야 한다는 뜻이다.", "tip": "'동·배·분·포·충'.", "terms": [{"term": "자산집단", "meaning": "주식, 채권처럼 비슷한 성격을 가진 투자자산의 묶음."}, {"term": "상관관계", "meaning": "두 자산의 가격이 같은 방향으로 움직이는 정도."}]}], "tip": "'ARCH 계열 = 위험 추정'.", "terms": [{"term": "GARCH", "meaning": "과거 자료를 이용해 변동성(위험)이 시간에 따라 어떻게 변하는지 추정하는 통계 모형. ARCH, EWMA와 같은 계열이다."}, {"term": "기대수익률", "meaning": "투자로 앞으로 얻을 것으로 예상하는 평균 수익률."}, {"term": "추세분석법", "meaning": "과거 오랜 기간의 수익률을 분석해 미래 수익률을 추정하는 방법."}, {"term": "시장공통예측치 사용법", "meaning": "시장 참여자들이 공통으로 예상하는 수치를 이용해 수익률을 추정하는 방법."}]}, {"no": 21, "topic": "주식투자운용/투자전략", "concept": "전술적 자산배분(TAA)의 특징", "q": "전술적 자산배분에 대한 설명으로 가장 적절하지 않은 것은?", "choices": ["전술적 자산배분은 본질적으로 역투자전략이다.", "전술적 자산배분은 시장가격이 상승하면 매수하고 하락하면 매도하는 추세순응적 전략이다.", "전술적 자산배분은 자본시장의 과잉반응 현상을 활용하며, 자산집단이 평균반전 과정을 따른다는 전제가 필요하다.", "전술적 자산배분은 가치평가 과정이며 투자위험의 인내 과정이다."], "answer": 1, "explanation": "전술적 자산배분은 싸진 자산을 사고 비싸진 자산을 파는 역투자전략이다. 시장가격이 오르면 사고 내리면 파는 추세순응(Positive feedback)은 보험자산배분의 특징이다. 그래서 이 선지가 틀렸고 정답이다. 전술적 자산배분은 과잉반응과 평균반전을 이론적 배경으로 한다. 또 가치평가 과정이면서 투자위험을 참고 견디는 과정이다.", "similar": [{"q": "전략적 자산배분에 대한 설명으로 옳은 것은?", "choices": ["입력변수의 추정오차가 존재하더라도 효율적 투자기회선은 정확한 하나의 선으로 표시된다.", "전략적 자산배분은 투자자가 정하는 것이 원칙이다.", "시장가치 접근방법은 소규모 자금으로 포트폴리오를 구성할 때 적용하기 쉽다.", "다른 유사한 기관투자자의 자산배분을 모방하는 방법은 실무에서 사용되지 않는다."], "answer": 1, "explanation": "전략적 자산배분은 투자자가 정하는 것이 원칙이다. 그래서 이것이 옳은 설명이다. 기대수익률·위험에 추정오차가 있으면 효율적 투자기회선은 한 개의 선이 아니라 영역(퍼지 투자기회선)으로 나타난다. 시장가치 접근방법은 소규모 자금에는 적용하기 어렵다. 비슷한 기관투자자의 자산배분을 따라 하는 방법은 실무에서 널리 쓰인다.", "tip": "추정오차 있으면 선이 아니라 '퍼지(영역)'.", "terms": [{"term": "전략적 자산배분", "meaning": "장기적인 목표에 맞춰 자산별 투자 비중을 정하고 오래 유지하는 전략(SAA)."}, {"term": "효율적 투자기회선", "meaning": "같은 위험에서 가장 높은 기대수익률을 주는 포트폴리오들을 이은 선."}, {"term": "퍼지 투자기회선", "meaning": "추정 오차 때문에 효율적 투자기회선이 한 개의 선이 아니라 띠 모양의 영역으로 나타나는 것."}, {"term": "시장가치 접근방법", "meaning": "시장에 있는 자산들의 시가총액 비율대로 투자 비중을 정하는 전략적 자산배분 방법."}]}, {"q": "전술적 자산배분의 실행도구에 해당하지 않는 것은?", "choices": ["시장가치 접근방법", "포뮬러 플랜", "가치평가모형", "기술적 분석"], "answer": 0, "explanation": "시장가치 접근방법은 시가총액 비율에 맞추는 전략적 자산배분의 실행방법이다. 전술적 자산배분의 도구가 아니므로 정답이다. 전술적 자산배분의 실행도구는 포뮬러 플랜, 가치평가모형, 기술적 분석이다. 포뮬러 플랜은 주가가 내리면 주식비중을 늘리고, 오르면 채권비중을 늘린다.", "tip": "TAA 도구 = 포뮬러 플랜·가치평가모형·기술적 분석.", "terms": [{"term": "시장가치 접근방법", "meaning": "시장에 있는 자산들의 시가총액 비율대로 투자 비중을 정하는 전략적 자산배분 방법."}, {"term": "포뮬러 플랜", "meaning": "주가가 내리면 주식을 더 사고 오르면 채권 비중을 늘리는 식으로 미리 정한 규칙대로 비중을 바꾸는 방법."}, {"term": "기술적 분석", "meaning": "과거 가격과 거래량의 흐름을 보고 앞으로의 가격을 예측하는 분석."}, {"term": "전술적 자산배분", "meaning": "시장이 일시적으로 잘못 평가한 자산을 찾아 중단기적으로 비중을 조절해 초과수익을 노리는 전략(TAA)."}]}, {"q": "자산배분전략의 비교 설명으로 옳은 것은?", "choices": ["전략적 자산배분은 주가가 장기적으로 내재가치에 수렴한다는 시장 효율성을 전제로 한다.", "전술적 자산배분은 시장이 중단기적으로 효율적이라는 가정에 근거한다.", "보험자산배분은 저가매수·고가매도 전략을 구사한다.", "전략적 자산배분은 시장 상황에 따라 비중을 수시로 바꾸는 초단기 전략이다."], "answer": 0, "explanation": "전략적 자산배분은 주가가 장기적으로 내재가치에 수렴한다는 시장 효율성을 전제로 한 장기·소극적 전략이다. 그래서 이것이 옳은 설명이다. 전술적 자산배분은 시장이 중단기적으로 과잉반응한다는 비효율성을 전제로 한다. 보험자산배분은 저가매수·고가매도가 아니라 고가매수·저가매도 전략이다. 비중을 수시로 바꾸는 초단기 전략은 전략적 자산배분이 아니라 보험자산배분이다.", "tip": "SAA 장기·효율, TAA 중단기·비효율, 보험 초단기·고가매수.", "terms": [{"term": "전략적 자산배분", "meaning": "장기적인 목표에 맞춰 자산별 투자 비중을 정하고 오래 유지하는 전략(SAA)."}, {"term": "전술적 자산배분", "meaning": "시장이 일시적으로 잘못 평가한 자산을 찾아 중단기적으로 비중을 조절해 초과수익을 노리는 전략(TAA)."}, {"term": "보험자산배분", "meaning": "투자 원금 등 최저 수익을 지키면서 위로는 이익을 얻도록 자산 비중을 계속 바꾸는 전략."}, {"term": "내재가치", "meaning": "기업이 실제로 지닌 본래의 가치."}]}], "tip": "TAA = 역투자(Negative feedback), IAA = 추세순응.", "terms": [{"term": "전술적 자산배분", "meaning": "시장이 일시적으로 잘못 평가한 자산을 찾아 중단기적으로 비중을 조절해 초과수익을 노리는 전략(TAA)."}, {"term": "역투자전략", "meaning": "다른 사람들과 반대로, 쌀 때 사고 비쌀 때 파는 전략."}, {"term": "추세순응", "meaning": "가격이 오르면 더 사고 내리면 파는 식으로 시장 흐름을 따라가는 것."}, {"term": "평균반전", "meaning": "가격이나 수익률이 일시적으로 벗어나도 결국 장기 평균으로 돌아오려는 성질."}]}, {"no": 22, "topic": "주식투자운용/투자전략", "concept": "보험자산배분(포트폴리오 보험)전략의 특징", "q": "보험자산배분전략에 대한 설명으로 가장 적절하지 않은 것은?", "choices": ["투자자가 원하는 특정한 투자성과를 만들어내기 위해 자산구성비율을 동적으로 변경해 나가는 전략이다.", "일정기간 동안 목표수익률을 반드시 달성해야 하는 특수한 목적을 가진 자금에 적용할 수 있는 전략이다.", "주식가격이 하락할 때 매수하고 상승할 때 매도한다.", "시장가격의 추세를 수동적으로 반영한다."], "answer": 2, "explanation": "보험자산배분은 포트폴리오 가치가 오르면 위험자산 비중을 늘리고, 내리면 줄이는 고가매수·저가매도(추세순응) 전략이다. 그래서 '하락할 때 매수하고 상승할 때 매도한다'는 설명이 틀렸고 정답이다. 보험자산배분은 자산구성비율을 동적으로 바꾼다. 목표수익률을 반드시 달성해야 하는 특수목적 자금에 쓰인다. 미래를 예측하지 않고 시장 추세를 수동적으로 반영한다.", "similar": [{"q": "포트폴리오 보험전략에 대한 설명으로 가장 적절하지 않은 것은?", "choices": ["시장가격의 변화 추세만을 반영하여 운용하는 수동적인 초단기적 자산배분 전략이다.", "이 전략을 선호하는 투자자는 극도로 위험을 회피하지만 위험자산에 투자한다.", "고가매입·저가매도 전략을 구사한다.", "최저보장수익률은 무위험수익률 이상으로 설정해야 한다."], "answer": 3, "explanation": "최저보장수익률은 반드시 무위험수익률(국채수익률) 이하로 정해야 한다. 무위험수익률보다 높은 수익을 보장하는 것은 불가능하기 때문이다. 그래서 '이상으로 설정해야 한다'는 설명이 틀렸고 정답이다. 나머지 선지는 모두 보험자산배분의 특징으로 옳다.", "tip": "최저보장수익률 ≤ 무위험수익률.", "terms": [{"term": "최저보장수익률", "meaning": "포트폴리오 보험 전략에서 최소한 지키려고 하는 수익률."}, {"term": "무위험수익률", "meaning": "위험 없이 얻을 수 있는 수익률. 보통 국채 수익률을 쓴다."}, {"term": "보험자산배분", "meaning": "투자 원금 등 최저 수익을 지키면서 위로는 이익을 얻도록 자산 비중을 계속 바꾸는 전략."}]}, {"q": "OBPI와 "answer": 2, "explanation": "CPPI에서 주식투자금액(익스포저)은 쿠션에 승수를 곱해 구한다. 먼저 최저보장가치를 무위험수익률로 할인해 Floor를 구해야 한다. 할인하지 않고 (100-90)×3 = 30억원으로 계산하면 틀린다. 그래서 42.86억원이 정답이다.\n① Floor = 90 ÷ 1.05 = 85.71억원\n② 쿠션 = 100 - 85.71 = 14.29억원\n③ 익스포저 = 14.29 × 3 = 42.86억원\n④ 채권투자금액 = 100 - 42.86 = 57.14억원", "similar": [{"q": "현재 투자가용자금이 5,000만원이며 주식과 채권에 투자하되 만기(1년) 최소보장가치를 4,500만원으로 하고자 한다. 무위험수익률이 3%, 승수가 2일 때 CPPI 전략의 쿠션(Cushion)은 약 얼마인가?", "choices": ["500만원", "631만원", "1,262만원", "4,369만원"], "answer": 1, "explanation": "쿠션은 현재 투자금액에서 Floor(최소보장가치의 현재가치)를 뺀 금액이다. 그래서 약 631만원이 정답이다. 할인하지 않으면 500만원이라는 오답이 나온다. 쿠션에 승수를 곱한 1,262만원은 익스포저이고, 4,369만원은 Floor 자체이다.\n① Floor = 4,500 ÷ 1.03 ≈ 4,369만원\n② 쿠션 = 5,000 - 4,369 ≈ 631만원", "tip": "쿠션 = 투자금 - 최소보장가치 ÷ (1 + 무위험수익률).", "terms": [{"term": "CPPI", "meaning": "쿠션(투자금 - 최저보장가치의 현재가치)에 승수를 곱한 만큼만 주식에 투자하는 포트폴리오 보험 전략."}, {"term": "쿠션", "meaning": "CPPI에서 현재 포트폴리오 가치에서 Floor를 뺀 금액. 손실을 견딜 수 있는 여유분이다."}, {"term": "Floor", "meaning": "CPPI에서 만기 최저보장가치를 무위험수익률로 할인한 현재가치. 이만큼은 안전자산으로 지킨다."}, {"term": "현재가치", "meaning": "미래에 받을 돈을 이자율로 할인해 지금 시점의 가치로 바꾼 금액."}]}, {"q": "최초 투자금액이 100억원이며 만기(1년) 보장수준이 85억원, 무위험이자율이 연 4%이다. 승수가 1일 때 CPPI 전략에 따른 채권투자금액은 약 얼마인가?", "choices": ["85.00억원", "18.27억원", "63.46억원", "81.73억원"], "answer": 3, "explanation": "CPPI에서 채권투자금액은 전체 투자금에서 익스포저(주식투자금액)를 뺀 금액이다. 승수가 1이면 채권투자금액은 Floor와 같아진다. 그래서 81.73억원이 정답이다. 63.46억원은 승수를 2로 잘못 적용한 값이다.\n① Floor = 85 ÷ 1.04 = 81.73억원\n② 쿠션 = 100 - 81.73 = 18.27억원\n③ 익스포저 = 18.27 × 1 = 18.27억원\n④ 채권투자금액 = 100 - 18.27 = 81.73억원", "tip": "채권투자금액 = 투자금 - (쿠션 × 승수), 승수 1이면 = Floor.", "terms": [{"term": "CPPI", "meaning": "쿠션(투자금 - 최저보장가치의 현재가치)에 승수를 곱한 만큼만 주식에 투자하는 포트폴리오 보험 전략."}, {"term": "Floor", "meaning": "CPPI에서 만기 최저보장가치를 무위험수익률로 할인한 현재가치. 이만큼은 안전자산으로 지킨다."}, {"term": "쿠션", "meaning": "CPPI에서 현재 포트폴리오 가치에서 Floor를 뺀 금액. 손실을 견딜 수 있는 여유분이다."}, {"term": "익스포저", "meaning": "CPPI에서 위험자산(주식)에 투자하는 금액. 쿠션 × 승수로 구한다."}]}, {"q": "최초 투자금액이 200억원, 만기(1년) 최저보장가치가 190억원, 무위험수익률이 연 4%, 승수가 4이다. CPPI 전략에 대로 보유해 단순하다. 하지만 거래비용이 많이 들어서 펀드 수익률이 벤치마크 수익률보다 낮게 나타난다. 그래서 '거래비용이 없어 수익률이 높다'는 설명이 틀렸고 정답이다. 표본추출법은 대형주는 모두, 중소형주는 일부만 담는다. 최적화법은 적은 종목으로 잔차위험을 낮출 수 있지만, 과거자료에 의존한다는 단점이 있다.", "tip": "완전복제 = 거래비용 多 → 수익률 < 벤치마크.", "terms": [{"term": "완전복제법", "meaning": "벤치마크에 들어 있는 모든 종목을 같은 비율로 사서 인덱스펀드를 만드는 방법."}, {"term": "표본추출법", "meaning": "대형주는 모두 담고 중소형주는 일부만 골라 인덱스펀드를 만드는 방법."}, {"term": "최적화법", "meaning": "통계 모형으로 적은 종목만 골라 벤치마크와 비슷하게 움직이도록 인덱스펀드를 만드는 방법."}, {"term": "잔차위험", "meaning": "펀드가 벤치마크와 다르게 움직여 생기는 위험."}]}, {"q": "KOSPI 200을 추종하는 인덱스펀드에 자산의 70%를 투자하고, 나머지를 KOSPI 200에서 제외된 중소형주에 투자하는 전략은?", "choices": ["액티브-보완 조합 운용", "핵심-위성 조합 운용", "인핸스드 인덱스 운용", "완전복제법에 의한 인덱스 운용"], "answer": 1, "explanation": "인덱스펀드를 핵심(약 70%)으로 두고 나머지를 액티브로 운용해 초과수익을 노리는 것이 핵심-위성 조합 운용이다. 그래서 이것이 정답이다. 액티브-보완 조합 운용은 반대로 액티브가 약 70%이고, 액티브가 다루지 않는 분야를 보완펀드(패시브 약 30%)로 운용한다.", "tip": "'핵심 = 패시브 7'.", "terms": [{"term": "핵심-위성 조합 운용", "meaning": "자금의 대부분(약 70%)은 패시브(인덱스)로 운용하고 나머지를 액티브로 운용해 초과수익을 노리는 방식."}, {"term": "액티브-보완 조합 운용", "meaning": "자금의 대부분(약 70%)을 액티브로 운용하고, 액티브가 다루지 않는 분야를 보완펀드(패시브)로 채우는 방식."}, {"term": "인덱스펀드", "meaning": "주가지수 같은 벤치마크의 수익률을 그대로 따라가도록 만든 펀드."}, {"term": "패시브", "meaning": "시장 지수를 그대로 따라가는 소극적 운용 방식."}]}, {"q": "효율적 시장가설(EMH)에 대한 설명으로 가장 적합한 것은?", "choices": ["준강형 효율적 시장가설에 따르면 공시 등 공개된 정보를 이용하면 초과수익을 얻을 수 있다.", "강형 효율적 시장가설에 따르면 내부자는 비공개정보로 초과수익을 얻을 수 있다.", "효율적 시장가설은 액티브 운용을 지지하는 논거로 이용된다.", "약형 효율적 시장가설에 따르면 기술적 분석으로는 초과수익을 얻을 수 없다."], "answer": 3, "explanation": "약형 효율적 시장가설에서는 과거 가격과 거래량이 이미 주가에 반영되어 있다. 그래서 기술적 분석으로 초과수익을 얻을 수 없고, 이것이 정답이다. 준강형에서는 공개정보까지 반영되므로 공시를 이용해도 초과수익을 얻을 수 없다. 강형에서는 비공개정보까지 반영되므로 내부자도 초과수익을 얻을 수 없다. 효율적 시장가설은 액티브 운용을 반대하는 논거로 쓰인다.", "tip": "약형 = 과거가격, 준강형 = 공개정보, 강형 = 비공개정보까지 반영.", "terms": [{"term": "효율적 시장가설(EMH)", "meaning": "주가에 이용 가능한 정보가 이미 모두 반영되어 있어 그 정보로 초과수익을 얻기 어렵다는 이론."}, {"term": "약형 효율적 시장가설", "meaning": "과거 가격과 거래량 정보가 주가에 이미 반영되어 있다는 가설."}, {"term": "기술적 분석", "meaning": "과거 가격과 거래량의 흐름을 보고 앞으로의 가격을 예측하는 분석."}, {"term": "액티브 운용", "meaning": "종목 선택이나 시점 선택으로 벤치마크보다 높은 수익을 노리는 운용."}]}], "tip": "준액티브는 '조금 벌고 조금 위험 → 정보비율 최고'(0.75 > 0.5 > 0).", "terms": [{"term": "정보비율", "meaning": "초과수익률을 추적오차로 나눈 값. 위험 한 단위당 초과수익을 얼마나 냈는지 보여준다."}, {"term": "인핸스드 인덱스", "meaning": "인덱스를 따라가면서도 약간의 초과수익을 노리는 운용 방식(준액티브)."}, {"term": "추적오차", "meaning": "펀드 수익률이 벤치마크 수익률과 얼마나 차이 나며 움직이는지 나타내는 값."}, {"term": "초과수익률", "meaning": "펀드 수익률에서 벤치마크 수익률을 뺀 값."}]}, {"no": 25, "topic": "주식투자운용/투자전략", "concept": "가치투자 스타일의 특징", "q": "액티브 운용 중 가치투자에 대한 설명으로 가장 거리가 먼 것은?", "choices": ["기업의 수익은 평균으로 회귀하려는 경향을 가진다고 전제한다.", "이익전망이 좋은 기업에 대해 시장 PER보다 높은 가격을 지불하고 투자한다.", "저PER주, 저PBR주, 고배당주 투자를 선호한다.", "투자자가 예상하는 투자기간 내에 저평가된 정도가 회복되지 않을 위험이 존재한다."], "answer": 1, "explanation": "이익전망이 좋은 기업에 시장 PER보다 높은 가격을 주고 투자하는 것은 가치투자가 아니라 성장투자이다. 그래서 이것이 정답이다. 가치투자는 기업 수익이 평균으로 돌아온다고 전제하고, 저PER·저PBR·고배당 종목을 선호한다. 매매회전율이 낮다. 저평가된 정도가 예상한 투자기간 안에 회복되지 않을 위험이 있다.", "similar": [{"q": "액티브 운용 중 성장주 스타일 투자의 특성과 가장 거리가 먼 것은?", "choices": ["매매회전율이 낮고 저PER·저PBR 종목을 주로 보유한다.", "성장률이 높은 기업에 대해 시장 PER보다 높은 가격을 지불한다.", "매출증가율이 시장보다 높으며 높은 PER과 높은 PBR을 보인다.", "기업의 이익이 예상을 상회했는지 하회했는지가 주가에 큰 영향을 미친다."], "answer": 0, "explanation": "매매회전율이 낮고 저PER·저PBR 종목을 주로 보유하는 것은 성장투자가 아니라 가치투자의 특징이다. 그래서 이것이 정답이다. 성장투자는 미래의 성장성과 수익성을 보고 투자하므로 매매회전율이 높다. 시장보다 높은 PER을 지불하고, 높은 PER·PBR을 보인다. 이익이 예상보다 좋은지 나쁜지(어닝 서프라이즈·쇼크)에 주가가 크게 흔들린다.", "tip": "회전율 낮음·저PER = 가치, 회전율 높음·고PER = 성장.", "terms": [{"term": "성장투자", "meaning": "앞으로 이익이 빠르게 늘어날 기업에, 비싼 가격을 주더라도 투자하는 방식."}, {"term": "가치투자", "meaning": "기업의 가치에 비해 주가가 싼(저평가된) 주식에 투자하는 방식."}, {"term": "매매회전율", "meaning": "일정 기간 동안 계좌의 자산을 얼마나 자주 사고팔았는지 나타내는 비율."}, {"term": "어닝 서프라이즈", "meaning": "기업 실적이 시장 예상보다 훨씬 좋게 나온 것. 반대로 나쁘면 어닝 쇼크라 한다."}]}, {"q": "기업실적에 대한 서프라이즈나 쇼크에 가장 큰 영향을 받는 액티브 운용 스타일은?", "choices": ["가치투자 스타일", "성장투자 스타일", "혼합투자 스타일", "시가총액(규모) 기준 투자 스타일"], "answer": 1, "explanation": "성장투자는 EPS가 늘고 PER이 낮아지지 않으면 주가가 최소한 EPS 증가율만큼 오를 것이라고 가정한다. 그래서 이익이 예상보다 높은지 낮은지가 주가에 큰 영향을 주고, 성장투자 스타일이 정답이다. 예상한 EPS 증가가 실현되지 않으면 EPS와 PER이 함께 낮아져 손실이 더 커진다.", "tip": "어닝 서프라이즈·쇼크에 민감 = 성장투자.", "terms": [{"term": "성장투자", "meaning": "앞으로 이익이 빠르게 늘어날 기업에, 비싼 가격을 주더라도 투자하는 방식."}, {"term": "EPS", "meaning": "주당순이익. 회사의 순이익을 주식 수로 나눈 값."}, {"term": "PER", "meaning": "주가수익비율. 주가를 주당순이익(EPS)으로 나눈 값으로, 이익에 비해 주가가 얼마나 비싼지 보여준다."}, {"term": "어닝 서프라이즈", "meaning": "기업 실적이 시장 예상보다 훨씬 좋게 나온 것. 반대로 나쁘면 어닝 쇼크라 한다."}]}, {"q": "주식시장의 이상현상 중 '수익률 역전 그룹'에 해당하는 것은?", "choices": ["저PER효과", "저베타효과", "소형주효과", "1월 효과"], "answer": 1, "explanation": "저베타효과는 수익률 역전 그룹에 속한다. 그래서 이것이 정답이다. 수익률 역전 그룹에는 장기 수익률 역전현상, 저베타효과, 잔차수익률 역전현상, 고유수익률 역전현상이 있다. 저PER·저PBR 효과는 상대적 저가주 효과 그룹이다. 소형주효과, 1월 효과, 무시된 기업효과, 수익예상 수정·추세효과는 정보비효율 그룹이다.", "tip": "역전 그룹 = 장기·저베타·잔차·고유 역전, 저가주 그룹 = 저PER·저PBR, 정보비효율 = 소형주·1월·무시된 기업.", "terms": [{"term": "이상현상", "meaning": "효율적 시장가설로 설명하기 어려운, 주식시장에서 반복적으로 나타나는 특이한 수익률 현상."}, {"term": "저베타효과", "meaning": "베타(시장 대비 변동성)가 낮은 주식이 예상보다 높은 수익을 내는 현상."}, {"term": "소형주효과", "meaning": "규모가 작은 기업의 주식이 대형주보다 높은 수익을 내는 경향."}, {"term": "1월 효과", "meaning": "1월의 주식 수익률이 다른 달보다 높게 나타나는 현상."}]}], "tip": "가치 = '저PER·저PBR·고배당', 성장 = '고PER·고PBR·저배당'.", "terms": [{"term": "가치투자", "meaning": "기업의 가치에 비해 주가가 싼(저평가된) 주식에 투자하는 방식."}, {"term": "성장투자", "meaning": "앞으로 이익이 빠르게 늘어날 기업에, 비싼 가격을 주더라도 투자하는 방식."}, {"term": "PER", "meaning": "주가수익비율. 주가를 주당순이익(EPS)으로 나눈 값으로, 이익에 비해 주가가 얼마나 비싼지 보여준다."}, {"term": "PBR", "meaning": "주가순자산비율. 주가를 주당순자산으로 나눈 값."}]}, {"no": 26, "topic": "채권투자운용/투자전략", "concept": "이자지급방식에 따른 채권 분류(복리채·할인채·이표채)", "q": "이자지급방식에 따른 채권 분류에 대한 설명으로 옳지 않은 것은?", "choices": ["할인채는 액면금액에서 상환일까지의 이자를 미리 할인하여 발행하며 만기에는 액면가만 지급한다.", "복리채는 이자가 자동으로 복리 재투자되어 만기에 원금과 이자를 한꺼번에 지급한다.", "통화안정증권은 대표적인 할인채이고, 국민주택1종·2종채권은 대표적인 복리채이다.", "이표채는 만기가 짧아질수록, 이표율이 낮아질수록 재투자위험이 증가한다."], "answer": 3, "explanation": "이표채는 만기 전에 이자(현금흐름)를 중간중간 받기 때문에, 받은 이자를 다시 투자해야 해서 재투자위험이 있어요. 만기가 길수록, 이표율이 높을수록 중간에 받는 돈이 많아지니 재투자위험이 커져요. 그래서 '짧아질수록·낮아질수록 증가한다'는 설명이 틀렸어요. 할인채는 이자를 미리 빼고(선이자) 발행해서 만기에 액면만 주고, 복리채는 만기에 원금과 이자를 한꺼번에 줘요. 할인채·복리채 같은 무이표채는 중간에 받는 돈이 없어서 재투자위험이 없어요.", "similar": [{"q": "다음 중 채권과 대표 예시의 연결이 옳지 않은 것은?", "choices": ["할인채 - 통화안정증권", "할인채 - 국민주택1종채권", "이표채 - 국고채", "복리채 - 지역개발공채"], "answer": 1, "explanation": "국민주택1종채권은 할인채가 아니라 복리채예요. 그래서 '할인채 - 국민주택1종채권' 연결이 틀렸어요. 복리채의 대표는 국민주택1종·2종채권과 지역개발공채예요. 할인채의 대표는 통화안정증권과 외국환평형기금채권이고, 이표채의 대표는 국고채, 대부분의 회사채, 한전채예요.", "tip": "통안채=할인, 국민주택·지역개발=복리, 국고·회사채=이표", "terms": [{"term": "할인채", "meaning": "이자만큼 미리 깎은 가격으로 발행하고, 만기에 액면금액만 돌려주는 채권이에요."}, {"term": "복리채", "meaning": "중간 이자가 자동으로 복리로 다시 투자되어, 만기에 원금과 이자를 한꺼번에 주는 채권이에요."}, {"term": "이표채", "meaning": "정해진 기간마다 이자를 나눠 주고, 만기에 원금을 돌려주는 채권이에요."}, {"term": "통화안정증권", "meaning": "한국은행이 시중의 통화량을 조절하려고 발행하는 채권으로, 대표적인 할인채예요."}]}, {"q": "옵션부채권 및 합성채권에 대한 설명으로 옳지 않은 것은?", "choices": ["신주인수권부사채(BW)는 신주인수권을 행사해도 기존의 채권이 존속한다.", "수의상환채권은 금리가 상승할 경우 발행자의 옵션 행사 가능성이 높아진다.", "교환사채(EB)의 교환권을 행사하면 발행회사의 자산과 부채가 동시에 줄어든다.", "수의상환청구채권(풋옵션부채권)의 옵션 행사자는 채권자(투자자)이다."], "answer": 1, "explanation": "수의상환채권(콜옵션부채권)은 발행자가 빚을 미리 갚을 수 있는 권리(조기상환권)를 가진 채권이에요. 발행자는 금리가 '하락'할 때 비싼 이자의 옛 채권을 갚고, 싼 이자로 다시 빌리고 싶어 해요. 그래서 '금리가 상승할 때 행사 가능성이 높아진다'는 설명이 틀렸어요. 수의상환청구채권은 반대로 금리가 오를 때 투자자가 권리를 써요. BW는 신주인수권을 써도 사채가 그대로 남고, EB는 교환하면 회사의 보유주식(자산)과 사채(부채)가 함께 줄어요.", "tip": "콜=발행자=금리하락 때 행사, 풋=투자자=금리상승 때 행사", "terms": [{"term": "수의상환채권", "meaning": "발행자가 만기 전에 미리 갚을 수 있는 권리(콜옵션)가 붙은 채권이에요."}, {"term": "수의상환청구채권", "meaning": "투자자가 만기 전에 발행자에게 원금을 미리 갚으라고 요구할 수 있는 권리(풋옵션)가 붙은 채권이에요."}, {"term": "신주인수권부사채(BW)", "meaning": "일정 가격에 발행회사의 새 주식을 살 수 있는 권리(신주인수권)가 붙은 사채예요."}, {"term": "교환사채(EB)", "meaning": "채권을 가진 사람이 발행회사가 보유한 다른 회사 주식으로 바꿀 수 있는 권리가 붙은 사채예요."}]}, {"q": "다음 중 채권에 내재된 옵션을 채권투자자(채권자)가 행사하는 것이 아닌 것은?", "choices": ["수의상환채권", "신주인수권부사채", "교환사채", "수의상환청구채권"], "answer": 0, "explanation": "수의상환채권(Callable bond)의 조기상환권은 투자자가 아니라 발행자가 써요. 그래서 수의상환채권이 정답이에요. 교환사채(교환권), 신주인수권부사채(신주인수권), 수의상환청구채권(매수청구권, Putable bond)은 모두 투자자가 쓰는 권리예요. 가치로 보면 수의상환채권 = 일반채권 − 콜옵션가치, 수의상환청구채권 = 일반채권 + 풋옵션가치예요.", "tip": "수의상환채권 = 일반채권 − 콜옵션가치(발행자 권리), 수의상환청구채권 = 일반채권 + 풋옵션가치(투자자 권리)", "terms": [{"term": "수의상환채권", "meaning": "발행자가 만기 전에 미리 갚을 수 있는 권리(콜옵션)가 붙은 채권이에요."}, {"term": "수의상환청구채권", "meaning": "투자자가 만기 전에 발행자에게 원금을 미리 갚으라고 요구할 수 있는 권리(풋옵션)가 붙은 채권이에요."}, {"term": "교환사채(EB)", "meaning": "채권을 가진 사람이 발행회사가 보유한 다른 회사 주식으로 바꿀 수 있는 권리가 붙은 사채예요."}, {"term": "신주인수권부사채(BW)", "meaning": "일정 가격에 발행회사의 새 주식을 살 수 있는 권리(신주인수권)가 붙은 사채예요."}]}], "tip": "이표채 = 중간에 쿠폰 → 재투자위험, 만기 길고 이표율 높을수록 ↑", "terms": [{"term": "재투자위험", "meaning": "중간에 받은 이자를 다시 투자할 때 금리가 바뀌어서 처음 기대한 수익을 못 얻을 수 있는 위험이에요."}, {"term": "이표채", "meaning": "정해진 기간마다 이자를 나눠 주고, 만기에 원금을 돌려주는 채권이에요."}, {"term": "할인채", "meaning": "이자만큼 미리 깎은 가격으로 발행하고, 만기에 액면금액만 돌려주는 채권이에요."}, {"term": "복리채", "meaning": "중간 이자가 자동으로 복리로 다시 투자되어, 만기에 원금과 이자를 한꺼번에 주는 채권이에요."}]}, {"no": 27, "topic": "채권투자운용/투자전략", "concept": "전환사채 패리티·괴리율 계산", "q": "다음 전환사채(CB)의 괴리율은 얼마인가?\n- 액면가 10,000원, 전환가격 8,000원\n- 전환대상 주식의 현재가격 10,000원\n- 전환사채의 시장가격 13,000원", "choices": ["4.00%", "3.85%", "25.00%", "30.00%"], "answer": 0, "explanation": "괴리율은 괴리를 패리티가격으로 나눠서 구해요. 계산하면 4%가 나와요.\n① 패리티 = 주가/전환가격×100 = 10,000/8,000×100 = 125%\n② 패리티가격(전환가치) = 패리티×액면/100 = 12,500원\n③ 괴리 = CB 시장가격 − 패리티가격 = 13,000 − 12,500 = 500원\n④ 괴리율 = 괴리/패리티가격 = 500/12,500 = 4%\n3.85%는 분모를 CB 시장가격으로 나눈 실수이고, 25%는 패리티−100을 괴리율로 착각한 값이에요.", "similar": [{"q": "채권액면 10,000원, 채권액면에 대한 전환주수는 2주(전환비율 100%)이다. 현재 전환사채의 시장가격은 9,500원이고 전환대상 주식의 시장가격은 4,500원이다. 이 전환사채의 패리티는?", "choices": ["90.0%", "85.5%", "94.7%", "111.1%"], "answer": 0, "explanation": "패리티는 주가가 전환가격의 몇 %인지 보는 값이라 90%가 정답이에요.\n① 전환가격 = 액면/전환주수 = 10,000/2 = 5,000원\n② 패리티 = 주가/전환가격×100 = 4,500/5,000×100 = 90%\n94.7%는 전환가치(9,000)를 CB 시장가격(9,500)으로 나눈 값이고, 111.1%는 분자와 분모를 뒤집은 값이에요. 패리티 90은 100 이하라서 채권의 성격이 강해요.", "tip": "패리티 = 주가/전환가격×100, 전환가격 = 액면/전환주수", "terms": [{"term": "전환사채(CB)", "meaning": "정해진 조건에 따라 발행회사의 주식으로 바꿀 수 있는 권리가 붙은 사채예요."}, {"term": "전환가격", "meaning": "전환사채를 주식 1주로 바꿀 때 적용하는 가격이에요."}, {"term": "패리티", "meaning": "전환대상 주식의 주가가 전환가격의 몇 %인지 나타낸 지표예요. 100을 넘으면 주식의 성격이 강해요."}]}, {"q": "액면가 10,000원인 전환사채의 전환가격이 25,000원, 전환대상 주식가격이 20,000원, 전환사채의 시장가격이 8,600원이다. 이 전환사채의 괴리(전환프리미엄)는?", "choices": ["600원", "400원", "1,400원", "2,000원"], "answer": 0, "explanation": "괴리(전환프리미엄)는 CB 시장가격에서 패리티가격을 뺀 값이라 600원이 정답이에요.\n① 패리티 = 20,000/25,000×100 = 80%\n② 패리티가격 = 10,000×80/100 = 8,000원(= 전환주수 0.4주 × 20,000원)\n③ 괴리 = 8,600 − 8,000 = 600원\n④ 참고로 괴리율 = 600/8,000 = 7.5%\n1,400원은 액면과 시장가격의 차이라서 오답이에요.", "tip": "괴리 = CB 시장가격 − 패리티가격", "terms": [{"term": "패리티", "meaning": "전환대상 주식의 주가가 전환가격의 몇 %인지 나타낸 지표예요. 100을 넘으면 주식의 성격이 강해요."}, {"term": "괴리율", "meaning": "전환사채의 시장가격이 패리티가격보다 얼마나 비싼지를 패리티가격 대비 비율로 나타낸 값이에요."}, {"term": "전환가격", "meaning": "전환사채를 주식 1주로 바꿀 때 적용하는 가격이에요."}]}, {"q": "액면가 10,000원, 전환가격 10,000원, 전환대상 주식가격 12,000원, 전환사채 시장가격 13,200원일 때 옳은 것은?", "choices": ["패리티 120%, 괴리율 10% - 주식의 성격이 강하다.", "패리티 120%, 괴리율 10% - 채권의 성격이 강하다.", "패리티 83%, 괴리율 32% - 채권의 성격이 강하다.", "패리티 110%, 괴리율 12% - 주식의 성격이 강하다."], "answer": 0, "explanation": "패리티 120%, 괴리율 10%이고, 패리티가 100을 넘으니 주식의 성격이 강해요.\n① 패리티 = 12,000/10,000×100 = 120%\n② 패리티가격 = 12,000원\n③ 괴리 = 13,200 − 12,000 = 1,200원\n④ 괴리율 = 1,200/12,000 = 10%\n같은 숫자에 '채권의 성격이 강하다'고 한 선지는 성격 판단이 틀렸어요. 패리티가 100 이하일 때 채권의 성격이 강해요.", "tip": "패리티 100 넘으면 주식처럼, 100 이하면 채권처럼", "terms": [{"term": "패리티", "meaning": "전환대상 주식의 주가가 전환가격의 몇 %인지 나타낸 지표예요. 100을 넘으면 주식의 성격이 강해요."}, {"term": "괴리율", "meaning": "전환사채의 시장가격이 패리티가격보다 얼마나 비싼지를 패리티가격 대비 비율로 나타낸 값이에요."}]}], "tip": "괴리율 분모는 패리티가격(CB 시장가격 아님)", "terms": [{"term": "전환사채(CB)", "meaning": "정해진 조건에 따라 발행회사의 주식으로 바꿀 수 있는 권리가 붙은 사채예요."}, {"term": "전환가격", "meaning": "전환사채를 주식 1주로 바꿀 때 적용하는 가격이에요."}, {"term": "패리티", "meaning": "전환대상 주식의 주가가 전환가격의 몇 %인지 나타낸 지표예요. 100을 넘으면 주식의 성격이 강해요."}, {"term": "괴리율", "meaning": "전환사채의 시장가격이 패리티가격보다 얼마나 비싼지를 패리티가격 대비 비율로 나타낸 값이에요."}]}, {"no": 28, "topic": "채권투자운용/투자전략", "concept": "복리채 가격 계산(관행적 복할인)", "q": "채권액면 1만 원, 표면금리 4%, 만기 3년인 연단위 복리채를 발행일에 만기수익률 5%로 매입하였다. 이 채권의 가격(액면 1만 원 기준)으로 가장 가까운 것은?", "choices": ["8,638원", "9,905원", "9,717원", "11,249원"], "answer": 2, "explanation": "복리채는 만기에 받을 원금+이자(만기상환금)를 만기수익률로 할인해서 가격을 구해요. 계산하면 약 9,717원이에요.\n① 만기상환금 = 10,000×(1.04)^3 ≈ 11,249원\n② 가격 = 11,249/(1.05)^3 ≈ 9,717원\n8,638원은 분자에 원금만 넣은 할인채 방식의 실수, 11,249원은 만기상환금 그 자체, 9,905원은 1년만 반영한 값이에요.", "similar": [{"q": "액면가 1만 원, 만기수익률 4%, 만기까지 1년 73일이 남은 할인채의 가격(관행적 복할인, 연 365일)으로 가장 가까운 것은?", "choices": ["9,846원", "9,615원", "9,569원", "9,539원"], "answer": 3, "explanation": "할인채는 만기에 액면만 받으니 분자는 액면 10,000원이에요. 관행적 복할인은 1년 단위는 복리로, 1년이 안 되는 남은 날수는 단리로 할인해요.\n가격 = 10,000 / [(1.04)^1 × (1 + 0.04×73/365)]\n= 10,000 / (1.04 × 1.008) ≈ 9,539원\n9,615원은 1년만 할인하고 73일을 무시한 값이에요.", "tip": "관행적 복할인: 연 단위는 복리, 1년 미만 잔여일수는 단리", "terms": [{"term": "할인채", "meaning": "이자만큼 미리 깎은 가격으로 발행하고, 만기에 액면금액만 돌려주는 채권이에요."}, {"term": "관행적 복할인", "meaning": "남은 기간 중 1년 단위는 복리로, 1년이 안 되는 나머지 날수는 단리로 할인해 채권가격을 구하는 방법이에요."}, {"term": "만기수익률", "meaning": "채권을 지금 가격에 사서 만기까지 가지고 있을 때 얻는 연평균 수익률이에요. 채권가격을 계산할 때 할인율로 써요."}]}, {"q": "액면 10,000원, 표면금리 5%, 만기 3년인 연단위 후급 이표채를 발행일에 만기수익률 4%로 매입할 경우 매입가격으로 가장 가까운 것은?", "choices": ["9,728원", "10,278원", "10,000원", "10,500원"], "answer": 1, "explanation": "이표채 가격은 매년 받는 이자와 만기의 원금을 각각 만기수익률로 할인해서 더해요. 계산하면 약 10,278원이에요.\n① 매년 이자 = 10,000×5% = 500원\n② 가격 = 500/1.04 + 500/1.04^2 + 10,500/1.04^3\n≈ 480.8 + 462.3 + 9,334.4 ≈ 10,278원\n표면금리(5%)가 만기수익률(4%)보다 높아서 액면보다 비싼 할증채가 돼요. 9,728원은 할인율을 반대로 적용한 경우에 가까워요.", "tip": "표면 > 수익률 → 할증, 표면 < 수익률 → 할인", "terms": [{"term": "이표채", "meaning": "정해진 기간마다 이자를 나눠 주고, 만기에 원금을 돌려주는 채권이에요."}, {"term": "표면금리", "meaning": "채권 겉면에 적힌 이자율로, 액면금액에 곱해 매년 받는 이자를 정해요(표면이율이라고도 해요)."}, {"term": "만기수익률", "meaning": "채권을 지금 가격에 사서 만기까지 가지고 있을 때 얻는 연평균 수익률이에요. 채권가격을 계산할 때 할인율로 써요."}, {"term": "할증채", "meaning": "액면금액보다 비싼 가격에 거래되는 채권이에요. 표면금리가 만기수익률보다 높을 때 생겨요."}]}, {"q": "액면 10,000원, 표면이율 6%, 만기 3년인 연단위 후급 이표채의 시장가격이 9,600원이다. 이 채권의 경상수익률은?", "choices": ["5.76%", "6.00%", "4.17%", "6.25%"], "answer": 3, "explanation": "경상수익률은 1년 동안 받는 이자를 채권의 시장가격으로 나눈 값이라 6.25%가 정답이에요.\n경상수익률 = 연이자지급액 / 채권 시장가격\n= (10,000×6%) / 9,600 = 600/9,600 = 6.25%\n6.00%는 표면이율이고, 5.76%는 시장가격에 표면이율을 곱해 액면으로 나눈 틀린 값이에요. 채권가격이 오르면 경상수익률은 낮아져요.", "tip": "경상수익률 = 연이자 / 시장가격(액면 아님)", "terms": [{"term": "경상수익률", "meaning": "1년 동안 받는 이자를 채권의 현재 시장가격으로 나눈 비율이에요."}, {"term": "표면금리", "meaning": "채권 겉면에 적힌 이자율로, 액면금액에 곱해 매년 받는 이자를 정해요(표면이율이라고도 해요)."}]}], "tip": "복리채 분자 = 액면×(1+표면)^n, 할인채 분자 = 액면", "terms": [{"term": "복리채", "meaning": "중간 이자가 자동으로 복리로 다시 투자되어, 만기에 원금과 이자를 한꺼번에 주는 채권이에요."}, {"term": "표면금리", "meaning": "채권 겉면에 적힌 이자율로, 액면금액에 곱해 매년 받는 이자를 정해요(표면이율이라고도 해요)."}, {"term": "만기수익률", "meaning": "채권을 지금 가격에 사서 만기까지 가지고 있을 때 얻는 연평균 수익률이에요. 채권가격을 계산할 때 할인율로 써요."}, {"term": "할인", "meaning": "미래에 받을 돈을 이자율로 나눠서 지금의 가치(현재가치)로 바꾸는 것이에요."}]}, {"no": 29, "topic": "채권투자운용/투자전략", "concept": "듀레이션과 볼록성의 특성", "q": "듀레이션과 볼록성에 대한 설명으로 가장 적절하지 않은 것은?", "choices": ["무이표채의 듀레이션은 채권의 잔존만기와 동일하다.", "다른 조건이 동일하다면 표면이율이 낮을수록 듀레이션은 증가한다.", "만기수익률이 10%인 영구채의 듀레이션은 (1+0.1)/0.1 = 11년이다.", "이표채의 이자지급주기가 짧아지면 듀레이션은 증가한다."], "answer": 3, "explanation": "이자지급주기가 짧아지면 돈을 더 빨리 돌려받으니 듀레이션은 '감소'해요. 그래서 '증가한다'는 설명이 틀렸어요. 듀레이션은 표면이율이 낮을수록, 잔존만기가 길수록, 만기수익률이 낮을수록 커져요. 무이표채(할인채·복리채)의 듀레이션은 만기와 같고, 이표채는 항상 만기보다 짧아요. 영구채 듀레이션은 (1+y)/y라서 10%면 11년이 맞아요.", "similar": [{"q": "말킬(Malkiel)의 채권가격정리에 대한 설명으로 가장 적절하지 않은 것은?", "choices": ["채권의 만기가 길수록 채권가격 변동폭은 커지며 그 증가폭도 점차 체증한다.", "채권의 잔존기간이 길수록 동일한 수익률 변동에 대한 채권가격 변동폭이 커진다.", "채권가격은 채권수익률과 반대방향으로 움직인다.", "만기가 일정할 때 수익률 하락으로 인한 가격상승폭이 수익률 상승으로 인한 가격하락폭보다 크다."], "answer": 0, "explanation": "만기가 길수록 가격 변동폭은 커지지만, 그 증가폭은 점점 '체감'(줄어듦)해요. 그래서 '체증한다'는 설명이 틀렸어요. 나머지는 말킬의 정리 그대로예요. 수익률이 내려갈 때 가격이 오르는 폭이 수익률이 오를 때 가격이 내리는 폭보다 큰 것은 볼록성 때문이에요. 다섯 번째 정리는 '표면이율이 낮을수록 같은 수익률 변동에 가격변동폭이 커진다'예요.", "tip": "말킬: 역관계·장기일수록 큼·증가폭 체감·하락 쪽이 더 큼·저쿠폰일수록 큼", "terms": [{"term": "말킬의 채권가격정리", "meaning": "채권가격과 수익률, 만기, 표면이율 사이의 관계를 다섯 가지로 정리한 법칙이에요."}, {"term": "체감", "meaning": "늘어나는 정도가 점점 줄어든다는 뜻이에요."}, {"term": "볼록성", "meaning": "채권가격과 수익률의 관계가 직선이 아니라 휘어진 정도예요. 듀레이션만으로 생기는 가격 추정 오차를 보완해요."}]}, {"q": "수정듀레이션이 4, 볼록성(컨벡시티)이 50인 채권의 만기수익률이 1%p 상승하면 채권가격의 변동률(근사치)은?", "choices": ["-4.25%", "-4.00%", "-3.75%", "-3.50%"], "answer": 2, "explanation": "가격변동률은 '듀레이션 효과'에 '볼록성 효과'를 더해서 구해요. 결과는 −3.75%예요.\nΔP/P ≈ −수정듀레이션×Δy + ½×볼록성×(Δy)^2\n= −4×0.01 + ½×50×(0.01)^2\n= −0.04 + 0.0025 = −0.0375 → −3.75%\n볼록성 효과는 금리가 오르든 내리든 항상 (+)로 더해져요. −4.25%는 볼록성 효과를 빼버린 실수, −3.50%는 ½을 빠뜨린 실수예요.", "tip": "수정듀레이션만 쓰면 상승 때는 과소, 하락 때는 과대 추정(상소·하대)", "terms": [{"term": "수정듀레이션", "meaning": "수익률이 1%p 변할 때 채권가격이 몇 % 변하는지 나타내는 값이에요."}, {"term": "볼록성", "meaning": "채권가격과 수익률의 관계가 직선이 아니라 휘어진 정도예요. 듀레이션만으로 생기는 가격 추정 오차를 보완해요."}, {"term": "%p(퍼센트포인트)", "meaning": "퍼센트 값끼리의 단순한 차이를 나타내는 단위예요. 금리가 3%에서 4%로 오르면 1%p 오른 거예요."}]}, {"q": "채권의 만기수익률이 1%p 상승할 때 채권가격은 2.50% 하락하였다. 수정듀레이션이 2.70인 경우 이 채권의 볼록성은 얼마인가?", "choices": ["20", "4", "60", "40"], "answer": 3, "explanation": "같은 공식을 거꾸로 풀어서 볼록성 C를 구하면 40이에요.\n−0.025 = −2.70×0.01 + ½×C×(0.01)^2\n−0.025 = −0.027 + 0.00005C\n0.00005C = 0.002 → C = 40\n20은 ½을 빠뜨린 경우의 값이에요.", "tip": "실제 변동률 − 듀레이션 추정치(0.2%p) = 볼록성 효과 → ½×(Δy)^2로 나누기", "terms": [{"term": "수정듀레이션", "meaning": "수익률이 1%p 변할 때 채권가격이 몇 % 변하는지 나타내는 값이에요."}, {"term": "볼록성", "meaning": "채권가격과 수익률의 관계가 직선이 아니라 휘어진 정도예요. 듀레이션만으로 생기는 가격 추정 오차를 보완해요."}]}], "tip": "듀레이션은 표면↓ 만기↑ 수익률↓일 때 길어진다", "terms": [{"term": "듀레이션", "meaning": "채권에서 받는 돈(이자와 원금)을 평균적으로 회수하는 데 걸리는 기간이에요. 금리 변화에 대한 채권가격의 민감도로도 쓰여요."}, {"term": "무이표채", "meaning": "중간에 이자를 주지 않는 채권으로, 할인채와 복리채가 해당해요."}, {"term": "영구채", "meaning": "만기 없이 이자만 계속 주는 채권이에요."}, {"term": "잔존만기", "meaning": "지금부터 채권 만기일까지 남은 기간이에요."}]}, {"no": 30, "topic": "채권투자운용/투자전략", "concept": "수익률곡선(이자율 기간구조) 이론", "q": "수익률곡선(Yield Curve)의 기간구조 이론에 대한 설명으로 가장 거리가 먼 것은?", "choices": ["불편기대이론은 모든 투자자가 위험중립형이라는 전제하에 단기채권과 장기채권이 완전대체관계를 이룬다고 본다.", "시장분할이론은 장·단기채권 간 대체관계가 없다고 보므로 수익률곡선의 이동을 잘 설명한다.", "유동성선호이론에 따르면 투자자는 유동성을 선호하므로 만기가 길수록 더 높은 유동성프리미엄을 요구하여 수익률곡선이 우상향한다.", "특정시장선호이론에서 장기채권의 금리는 만기까지 예상된 단기이자율의 평균에 기간프리미엄을 더한 값이다."], "answer": 1, "explanation": "시장분할이론은 장기채와 단기채가 서로 바꿔 쓸 수 없다(대체관계 없음)고 봐요. 그래서 수익률곡선의 '이동'은 설명하지 못하고, 우상향 같은 모양만 설명할 수 있어요. 따라서 '이동을 잘 설명한다'는 설명이 틀렸어요. 불편기대이론은 완전대체·위험중립을 전제하고, 유동성선호이론은 불완전대체와 항상 (+)인 유동성프리미엄을 말해요. 특정시장선호이론은 (+)와 (−)가 모두 가능한 기간프리미엄을 더해요.", "similar": [{"q": "현 시점에서 만기 1년인 현물이자율이 4%, 만기 2년인 현물이자율이 5%이다. 향후 1년 후의 1년 만기 내재선도이자율로 가장 가까운 것은?", "choices": ["4.50%", "5.00%", "6.01%", "7.00%"], "answer": 2, "explanation": "2년 동안 투자한 결과와 '1년 투자 후 1년 더 투자'한 결과가 같다고 놓고 풀어요. 답은 약 6.01%예요.\n(1+0.05)^2 = (1+0.04)×(1+f)\nf = 1.1025/1.04 − 1 ≈ 6.01%\n약식: 2×5% − 1×4% = 6%\n4.5%는 단순평균, 5%는 2년 현물이자율을 그대로 쓴 오답이에요. 불편기대이론에서 장기채 수익률은 단기채 수익률과 내재선도이자율의 기하평균이에요.", "tip": "선도이자율 ≈ 긴 기간×긴 금리 − 짧은 기간×짧은 금리", "terms": [{"term": "현물이자율", "meaning": "지금 돈을 빌리거나 투자해서 특정 만기까지 적용되는 이자율이에요."}, {"term": "내재선도이자율", "meaning": "현재의 현물이자율들 안에 담겨 있는, 미래 특정 기간에 적용될 것으로 예상되는 이자율이에요."}, {"term": "기하평균", "meaning": "여러 기간의 수익률을 곱셈으로 연결해 구한 평균으로, 복리 효과를 반영해요."}]}, {"q": "현 시점에서 만기 2년인 현물이자율이 6%, 만기 3년인 현물이자율이 7%이다. 향후 2년 후의 1년 만기 내재선도이자율로 가장 가까운 것은?", "choices": ["6.50%", "9.03%", "8.00%", "13.00%"], "answer": 1, "explanation": "3년 투자한 결과와 '2년 투자 후 1년 더 투자'한 결과가 같다고 놓고 풀어요. 답은 약 9.03%예요.\n(1.07)^3 = (1.06)^2 × (1+f)\nf = 1.225043/1.1236 − 1 ≈ 9.03%\n약식: 3×7% − 2×6% = 21% − 12% = 9%\n8%는 3년 금리 7%에 금리차 1%p를 한 번만 더한 오류, 13%는 7%와 6%를 더한 값이에요.", "tip": "선도이자율 ≈ 긴 기간×긴 금리 − 짧은 기간×짧은 금리", "terms": [{"term": "현물이자율", "meaning": "지금 돈을 빌리거나 투자해서 특정 만기까지 적용되는 이자율이에요."}, {"term": "내재선도이자율", "meaning": "현재의 현물이자율들 안에 담겨 있는, 미래 특정 기간에 적용될 것으로 예상되는 이자율이에요."}]}, {"q": "이자율 기간구조이론과 그 특징의 연결로 옳지 않은 것은?", "choices": ["유동성프리미엄이론 - 유동성프리미엄은 양(+)과 음(-)의 값을 모두 가질 수 있음", "시장분할이론 - 채권 간 대체관계 없음, 수익률곡선의 이동은 설명 불가", "불편기대이론 - 채권 간 완전대체관계, 수익률곡선의 우상향은 설명 불가", "특정시장선호이론 - 채권 간 불완전대체관계, 수익률곡선의 방향과 이동 모두 설명 가능"], "answer": 0, "explanation": "유동성프리미엄은 유동성을 포기한 대가라서 항상 양(+)이고, 만기가 길수록 커져요. 그래서 '양과 음이 모두 가능하다'는 연결이 틀렸어요. (+)와 (−)가 모두 가능한 것은 특정시장선호이론의 '기간프리미엄'이에요. 단기채를 좋아하는 사람에게는 (+), 장기채를 좋아하는 사람에게는 (−)가 돼요.", "tip": "유동성프리미엄 = 항상 +, 기간프리미엄 = ±", "terms": [{"term": "유동성프리미엄", "meaning": "만기가 긴 채권에 투자해 유동성을 포기하는 대가로 요구하는 추가 수익으로, 항상 (+)예요."}, {"term": "기간프리미엄", "meaning": "특정시장선호이론에서 투자자가 선호하지 않는 만기의 채권에 투자할 때 요구하는 대가로, (+)와 (−) 모두 가능해요."}, {"term": "특정시장선호이론", "meaning": "투자자마다 좋아하는 만기가 있어서, 다른 만기에 투자하려면 기간프리미엄을 요구한다는 이론이에요."}]}], "tip": "불편=완전대체·우상향 설명불가 / 분할=대체X·이동 설명불가", "terms": [{"term": "수익률곡선", "meaning": "만기가 다른 채권들의 수익률을 이어서 그린 선이에요."}, {"term": "불편기대이론", "meaning": "장기금리가 미래에 예상되는 단기금리들의 평균으로 정해진다는 이론이에요. 투자자가 위험중립형이라고 가정해요."}, {"term": "시장분할이론", "meaning": "채권시장이 만기별로 나뉘어 있고, 장기채와 단기채가 서로 대체되지 않는다고 보는 이론이에요."}, {"term": "유동성프리미엄", "meaning": "만기가 긴 채권에 투자해 유동성을 포기하는 대가로 요구하는 추가 수익으로, 항상 (+)예요."}]}, {"no": 31, "topic": "채권투자운용/투자전략", "concept": "적극적·소극적 채권운용전략", "q": "다음 채권운용전략 중 소극적(passive) 운용전략에 해당하지 않는 것은?", "choices": ["수익률곡선타기 전략", "현금흐름일치전략", "사다리형 만기전략", "채권인덱싱 전략"], "answer": 0, "explanation": "수익률곡선타기 전략은 적극적 전략이라서 정답이에요. 우상향 수익률곡선에서 시간이 지나 수익률이 내려가면(가격 상승) 자본차익을 노리는 전략이에요(롤링효과·숄더효과). 소극적 전략에는 만기보유, 사다리형 만기, 면역, 현금흐름일치, 채권인덱싱 전략이 있어요. 적극적 전략에는 금리예측(듀레이션 조절), 채권교체(동종·이종), 스프레드운용, 수익률곡선타기, 수익률곡선전략(바벨·불릿)이 있어요.", "similar": [{"q": "소극적인 채권운용전략에 대한 설명으로 가장 거리가 먼 것은?", "choices": ["사다리형 만기전략은 단기물·중기물·장기물을 동일비중으로 편입하여 시세변동위험을 평준화한다.", "전통적 면역전략은 투자자의 목표투자기간과 채권의 듀레이션을 일치시켜 매입 당시 설정한 수익률을 실현하려는 전략이다.", "순자산가치 면역전략은 자산과 부채의 시장가치가중 듀레이션을 일치시켜 순자산가치의 변동성을 최소화하려는 전략이다.", "채권인덱싱 전략은 채권시장이 비효율적이라고 전제하고 초과수익을 추구하는 전략이다."], "answer": 3, "explanation": "채권인덱싱 전략은 채권시장이 '효율적'이라고 보고, 시장 전체 흐름을 그대로 따라가서 시장 전체 수익률을 얻으려는 전략이에요. 그래서 '비효율적이라 보고 초과수익을 추구한다'는 설명이 틀렸어요. 인덱싱은 매매회전율이 낮아 거래비용이 싸고 대규모 펀드에 알맞아요. 나머지 지문은 모두 소극적 전략에 대한 옳은 설명이에요.", "tip": "인덱싱 = 시장 효율적 전제, 시장수익률 추구(초과수익 X)", "terms": [{"term": "채권인덱싱 전략", "meaning": "채권시장 전체 흐름을 그대로 따르는 포트폴리오를 만들어 시장 수익률을 얻으려는 소극적 전략이에요."}, {"term": "면역전략", "meaning": "목표투자기간과 채권의 듀레이션을 맞춰, 금리가 변해도 처음 정한 수익률을 지키려는 전략이에요."}, {"term": "듀레이션", "meaning": "채권에서 받는 돈(이자와 원금)을 평균적으로 회수하는 데 걸리는 기간이에요. 금리 변화에 대한 채권가격의 민감도로도 쓰여요."}, {"term": "매매회전율", "meaning": "일정 기간 동안 포트폴리오 안의 자산을 얼마나 자주 사고팔았는지 나타내는 비율이에요."}]}, {"q": "전통적인 채권 면역전략에 대한 설명으로 가장 적절하지 않은 것은?", "choices": ["목표투자기간 중 시장수익률의 변동과 관계없이 매입 당시 설정한 수익률을 목표기간 말에 실현하도록 한다.", "투자자의 목표기간과 채권의 듀레이션을 일치시킴으로써 면역상태를 유도할 수 있다.", "가격변동효과와 재투자효과가 서로 상쇄되는 관계를 이용한다.", "한번 면역상태를 구성하면 시간이 지나도 리밸런싱이 필요 없다."], "answer": 3, "explanation": "시간이 지나면 듀레이션과 잔존만기가 서로 다른 속도로 줄고, 수익률곡선 모양도 바뀌어요. 그래서 면역상태를 지키려면 정기적으로 리밸런싱(재면역)을 해야 해요. 따라서 '리밸런싱이 필요 없다'는 설명이 틀렸어요. 면역전략은 금리가 변할 때 가격위험과 재투자위험이 서로 반대로 움직여 상쇄되는 점을 이용해요.", "tip": "면역 = 목표기간 = 듀레이션, 시간 지나면 재면역 필요", "terms": [{"term": "면역전략", "meaning": "목표투자기간과 채권의 듀레이션을 맞춰, 금리가 변해도 처음 정한 수익률을 지키려는 전략이에요."}, {"term": "리밸런싱", "meaning": "시간이 지나 달라진 포트폴리오 구성을 원래 목표에 맞게 다시 조정하는 것이에요."}, {"term": "재투자위험", "meaning": "중간에 받은 이자를 다시 투자할 때 금리가 바뀌어서 처음 기대한 수익을 못 얻을 수 있는 위험이에요."}, {"term": "듀레이션", "meaning": "채권에서 받는 돈(이자와 원금)을 평균적으로 회수하는 데 걸리는 기간이에요. 금리 변화에 대한 채권가격의 민감도로도 쓰여요."}]}, {"q": "<보기>에 해당하는 채권운용전략은?\n서로 다른 두 종목 간의 수익률 격차가 일시적으로 확대 또는 축소되었다가 시간이 경과함에 따라 정상적인 수준으로 되돌아오는 특성을 이용하여, 격차가 확대 또는 축소되는 시점에 교체매매를 행함으로써 투자효율을 높인다.", "choices": ["수익률곡선타기 전략", "스프레드운용전략", "현금흐름일치전략", "사다리형 만기전략"], "answer": 1, "explanation": "두 종목의 수익률 격차(스프레드)가 잠깐 벌어지거나 좁아졌다가 원래대로 돌아오는 성질을 이용해 교체매매하는 것은 스프레드운용전략이에요. 이건 적극적 전략이에요. 수익률곡선타기는 우상향 곡선에서 잔존기간이 줄며 생기는 가격상승을 노리는 전략이에요. 현금흐름일치·사다리형은 소극적 전략이에요. 참고로 신용스프레드는 경기불황 국면에서 커져요.", "tip": "스프레드운용 = 격차 벌어지고 되돌아오는 것 이용한 교체매매", "terms": [{"term": "스프레드", "meaning": "두 채권이나 두 종목 사이의 수익률 차이예요."}, {"term": "교체매매", "meaning": "가지고 있던 채권을 팔고 더 유리한 다른 채권으로 바꿔 사는 거래예요."}, {"term": "신용스프레드", "meaning": "회사채처럼 신용위험이 있는 채권의 수익률과 국채 수익률의 차이예요."}]}], "tip": "소극 = 만사면현인(만기보유·사다리·면역·현금흐름일치·인덱싱)", "terms": [{"term": "적극적 운용전략", "meaning": "금리나 시장을 예측해 시장보다 높은 수익(초과수익)을 얻으려는 운용전략이에요."}, {"term": "소극적 운용전략", "meaning": "시장을 예측하지 않고, 정해진 원칙에 따라 안정적인 수익을 얻으려는 운용전략이에요."}, {"term": "자본차익", "meaning": "산 가격보다 비싸게 팔아서 얻는 이익이에요."}, {"term": "롤링효과", "meaning": "우상향 수익률곡선에서 시간이 지나 잔존만기가 짧아지면 수익률이 내려가고 채권가격이 오르는 효과예요."}]}, {"no": 32, "topic": "파생상품투자운용/투자전략", "concept": "장내파생상품(선물)과 장외파생상품(선도)의 차이", "q": "선물(장내)거래와 선도(장외)거래를 비교한 설명으로 옳지 않은 것은?", "choices": ["선물은 표준화된 제도에 의해 조직화된 거래소에서 거래되고, 선도는 매매당사자 간 협의로 거래된다.", "선물은 계약종료일에 한 번 정산하고, 선도는 매일 정산(일일정산)한다.", "선물은 반대매매를 통한 중도청산이 쉽지만, 선도는 반대매매가 어렵다.", "선물은 대부분 반대매매로 청산되어 극소수만 실물인수도되지만, 선도는 만기일에 실물인수도 및 대금결제가 이루어진다."], "answer": 1, "explanation": "일일정산(매일정산)은 선물(장내)의 특징이고, 선도(장외)는 계약종료일에 한 번만 정산해요. 문제의 지문은 둘을 거꾸로 말해서 틀렸어요. 선물은 거래소와 청산기관이 있어서 계약불이행위험이 거의 없지만, 선도는 계약불이행(신용)위험이 있어요. 매매방식도 선물은 경쟁매매, 선도는 상대매매예요.", "similar": [{"q": "장외파생상품에 대한 설명으로 가장 적절한 것은?", "choices": ["장외파생상품은 표준화된 계약이므로 유동성이 풍부하다.", "장외파생상품의 기초자산은 주가지수와 개별주식으로 한정된다.", "장외파생상품은 거래소가 결제를 보증하므로 계약불이행위험이 없다.", "장외파생상품은 시장조성자(Market Maker 또는 Warehouse)와 고객 간의 일대일 계약 형태로 일어나는 것이 대부분이다."], "answer": 3, "explanation": "장외파생상품은 대부분 시장조성자(주로 금융기관)와 고객이 일대일로 맺는 계약이에요. 그래서 이 설명이 옳아요. 맞춤형 거래가 가능한 대신 유동성이 부족하고 신용위험이 있어요. 그러니 '표준화돼 유동성이 풍부하다', '거래소가 보증해 계약불이행위험이 없다'는 틀렸어요. 기초자산도 금리, 원자재, 신용위험 등으로 다양해서 '주가지수·개별주식으로 한정'도 틀렸어요.", "tip": "장외 = 맞춤형·일대일·유동성 부족·신용위험 O", "terms": [{"term": "장외파생상품", "meaning": "거래소 밖에서 당사자끼리 직접 맞춤형으로 거래하는 파생상품이에요."}, {"term": "시장조성자", "meaning": "항상 사고팔 가격을 내놓아 거래가 이루어지게 하는 금융기관이에요."}, {"term": "기초자산", "meaning": "파생상품의 가치를 결정하는 바탕이 되는 자산이에요. 주식, 주가지수, 금리, 환율, 원자재 등이 있어요."}, {"term": "유동성", "meaning": "자산을 손해 없이 빠르게 현금으로 바꿀 수 있는 정도예요."}]}, {"q": "다음 중 장외파생상품의 기초자산이 될 수 있는 것을 모두 고른 것은?\nㄱ. 금리\nㄴ. 원자재\nㄷ. 신용위험", "choices": ["ㄱ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "answer": 3, "explanation": "장외파생상품은 당사자끼리 맞춤형으로 맺는 계약이라서 금리, 원자재, 신용위험(신용파생상품) 등 다양한 기초자산을 쓸 수 있어요. 그래서 ㄱ, ㄴ, ㄷ 모두 해당해요. 참고로 장외파생상품은 맞춤형이지만 유동성이 부족하다는 단점이 있어요.", "tip": "장외파생 기초자산 = 금리·원자재·신용위험 등 다양", "terms": [{"term": "장외파생상품", "meaning": "거래소 밖에서 당사자끼리 직접 맞춤형으로 거래하는 파생상품이에요."}, {"term": "기초자산", "meaning": "파생상품의 가치를 결정하는 바탕이 되는 자산이에요. 주식, 주가지수, 금리, 환율, 원자재 등이 있어요."}, {"term": "신용파생상품", "meaning": "채권 발행자 등의 신용위험(돈을 못 갚을 위험)을 기초자산으로 하는 파생상품이에요."}]}, {"q": "선물거래의 증거금 제도에 대한 설명으로 옳지 않은 것은?", "choices": ["개시증거금은 선물거래를 계약할 때 예치하는 보증금이다.", "유지증거금은 거래를 하는 동안 최소한 유지해야 하는 증거금 수준이다.", "증거금이 유지증거금 수준에 미달하면 유지증거금 수준까지만 추가증거금을 납부하면 된다.", "선물거래의 손익은 일일정산제도에 의해 증거금에서 가산·차감된다."], "answer": 2, "explanation": "증거금이 유지증거금 아래로 떨어지면 마진콜이 오고, 이때는 '개시증거금' 수준까지 추가증거금을 채워야 해요. 그래서 '유지증거금 수준까지만 내면 된다'는 설명이 틀렸어요. 따라서 개시증거금 = 일일정산 후 증거금 + 추가증거금 관계가 성립해요.", "tip": "마진콜은 유지선에서 울리고, 채우는 건 개시선까지", "terms": [{"term": "개시증거금", "meaning": "선물거래를 처음 계약할 때 맡기는 보증금이에요."}, {"term": "유지증거금", "meaning": "선물거래를 하는 동안 계좌에 최소한 남아 있어야 하는 증거금이에요."}, {"term": "마진콜", "meaning": "증거금이 유지증거금보다 적어졌을 때, 돈을 더 채워 넣으라고 요구하는 것이에요."}, {"term": "추가증거금", "meaning": "마진콜이 왔을 때 개시증거금 수준까지 채우기 위해 더 내는 돈이에요."}]}], "tip": "선물 = 표준·거래소·반대매매·매일정산·신용위험X", "terms": [{"term": "선물", "meaning": "거래소에서 표준화된 조건으로, 미래의 정해진 날에 정해진 가격으로 사고팔기로 약속한 계약이에요."}, {"term": "선도", "meaning": "거래소 밖에서 두 당사자가 직접 협의해 미래에 정한 가격으로 사고팔기로 약속한 계약이에요."}, {"term": "일일정산", "meaning": "선물거래의 손익을 매일 계산해 증거금에 더하거나 빼는 제도예요."}, {"term": "반대매매", "meaning": "처음 거래와 반대 방향의 거래를 해서 포지션을 정리하는 것이에요. 산 것은 팔고, 판 것은 사요."}]}, {"no": 33, "topic": "파생상품투자운용/투자전략", "concept": "균형선물환율(이자율평가식) 계산", "q": "현물환율이 1$=1,100원, 원화이자율 연 3%, 달러이자율 연 1%일 때, 이자율평가식에 의한 1년 만기 균형선물환율로 가장 가까운 것은?", "choices": ["1,078원", "1,100원", "1,122원", "1,144원"], "answer": 2, "explanation": "균형선물환율은 현물환율에 두 나라 금리 차이를 반영해서 구해요. 답은 약 1,122원이에요.\nF = S × (1+원화이자율)/(1+달러이자율)\n= 1,100 × 1.03/1.01 ≈ 1,121.8원\n약식: 1,100×(1+0.03−0.01) = 1,122원\n자국(원화) 금리가 높으면 선물환율이 현물환율보다 높아요. 1,078원은 두 금리를 바꿔 넣은 실수, 1,144원은 금리를 더한 실수예요.", "similar": [{"q": "KOSPI200 지수가 250pt, 연 무위험이자율 4%, 연 배당수익률 2%이고 선물 만기까지 6개월 남았을 때 주가지수선물의 균형가격은?", "choices": ["247.5pt", "255.0pt", "252.5pt", "257.5pt"], "answer": 2, "explanation": "주가지수선물의 균형가격은 현물지수에 보유비용(이자비용 − 배당수익)을 기간만큼 더해서 구해요. 답은 252.5pt예요.\n균형가격 = S × [1 + (r − d) × t]\n= 250 × [1 + (0.04 − 0.02) × 6/12]\n= 250 × 1.01 = 252.5pt\n255.0pt는 6개월을 반영하지 않고 1년으로 계산한 값이에요. 257.5pt는 배당을 빼지 않고 더한 실수((0.04+0.02)×6/12), 247.5pt는 부호를 반대로 적용한 값이에요.", "tip": "주가지수선물 = S×[1+(r−d)×t], 보유비용 = 이자비용 − 배당수익", "terms": [{"term": "균형가격", "meaning": "차익거래 기회가 없도록 이론적으로 계산한 적정 가격이에요."}, {"term": "보유비용", "meaning": "현물을 선물 만기까지 가지고 있는 데 드는 비용이에요. 주가지수선물에서는 이자비용 − 배당수익이에요."}, {"term": "배당수익률", "meaning": "주가에 비해 배당금을 얼마나 받는지 나타내는 비율이에요."}, {"term": "pt(포인트)", "meaning": "주가지수나 지수선물·옵션 가격을 나타내는 단위예요."}]}, {"q": "현물환율 1$=1,300원, 원화이자율 연 1%, 달러이자율 연 3%, 1년 만기 선물환율이 1$=1,290원에 거래되고 있다. 차익거래 포지션으로 가장 적절한 것은?(차익거래 만기 1년)", "choices": ["선물환 매수 + 현물환 매수(원화차입, 달러운용)", "선물환 매수 + 현물환 매도(달러차입, 원화운용)", "선물환 매도 + 현물환 매도(달러차입, 원화운용)", "선물환 매도 + 현물환 매수(원화차입, 달러운용)"], "answer": 3, "explanation": "먼저 균형선물환율을 구한 다음, 시장 가격과 비교해 비싼 쪽을 팔고 싼 쪽을 사요.\n① 균형선물환율 = 1,300 × 1.01/1.03 ≈ 1,274.8원\n② 시장 선물환율 1,290원 > 균형가격 → 선물환이 고평가\n③ 고평가된 선물환 매도 + 저평가된 현물환 매수\n현물환 매수는 원화를 빌려(원화차입) 달러로 바꾸고 달러로 운용하는 것이에요. 그래서 '선물환 매도 + 현물환 매수(원화차입, 달러운용)'가 정답이에요.", "tip": "차익거래: 비싼 것 팔고 싼 것 산다", "terms": [{"term": "차익거래", "meaning": "같은 가치의 두 자산 가격이 다를 때, 싼 것을 사고 비싼 것을 팔아 위험 없이 이익을 얻는 거래예요."}, {"term": "균형선물환율", "meaning": "현물환율에 두 나라의 금리 차이를 반영해 이론적으로 계산한 적정 선물환율이에요."}, {"term": "고평가", "meaning": "실제 가격이 이론적으로 적정한 가격보다 비싼 상태예요."}, {"term": "선물환", "meaning": "미래의 정해진 날에 정해진 환율로 외화를 사고팔기로 약속하는 거래예요."}]}, {"q": "현물지수가 300pt, 금리가 연 5%, 배당수익률이 연 1%이고 만기가 3개월 남은 주가지수선물의 시장가격이 301pt이다. 이익을 얻기 위한 차익거래로 옳은 것은?(거래비용 무시)", "choices": ["매도차익거래: 현물 매도 + 선물 매수", "매수차익거래: 현물 매수 + 선물 매도", "매수차익거래: 현물 매도 + 선물 매수", "차익거래 기회가 없다"], "answer": 0, "explanation": "이론가격을 먼저 구하고 실제 선물가격과 비교해요. 선물이 싸면 매도차익거래를 해요.\n① 이론가격 = 300 × [1 + (0.05 − 0.01) × 3/12] = 300 × 1.01 = 303pt\n② 실제 301pt < 이론 303pt → 선물 저평가\n③ 매도차익거래 = 현물 매도 + 선물 매수\n매수차익거래는 실제선물가격 > 이론가격일 때 하는 '현물 매수 + 선물 매도'예요. 백워데이션 시장에서는 항상 매도차익거래가 발생해요.", "tip": "선물 고평가 → 매수차익(현물매수+선물매도), 저평가 → 매도차익(현물매도+선물매수)", "terms": [{"term": "매도차익거래", "meaning": "선물이 이론가격보다 쌀 때, 현물을 팔고 선물을 사서 이익을 얻는 거래예요."}, {"term": "매수차익거래", "meaning": "선물이 이론가격보다 비쌀 때, 현물을 사고 선물을 팔아 이익을 얻는 거래예요."}, {"term": "이론가격", "meaning": "현물가격과 보유비용 등으로 계산한 선물의 적정 가격이에요."}, {"term": "백워데이션", "meaning": "선물가격이 현물가격보다 낮은 시장 상태예요."}]}], "tip": "이자율평가식: 분자 = 자국금리, 분모 = 외국금리", "terms": [{"term": "균형선물환율", "meaning": "현물환율에 두 나라의 금리 차이를 반영해 이론적으로 계산한 적정 선물환율이에요."}, {"term": "이자율평가식", "meaning": "두 나라의 금리 차이만큼 선물환율과 현물환율이 차이 난다는 관계식이에요."}, {"term": "현물환율", "meaning": "지금 바로 외화를 사고팔 때 적용되는 환율이에요."}]}, {"no": 34, "topic": "파생상품투자운용/투자전략", "concept": "선물 증거금(개시·유지·추가증거금) 계산", "q": "선물거래에서 유지증거금이 80억 원이고, 일일정산 후 증거금 수준이 50억 원이 되어 마진콜에 따라 추가로 70억 원을 납부하였다. 개시증거금은 얼마인가?", "choices": ["100억 원", "130억 원", "120억 원", "150억 원"], "answer": 2, "explanation": "증거금이 유지증거금(80억) 아래로 떨어지면 개시증거금 수준까지 채워야 해요. 그래서 개시증거금은 120억 원이에요.\n개시증거금 = 일일정산 후 증거금 + 추가증거금\n= 50억 + 70억 = 120억 원\n150억은 유지증거금에 추가증거금을 더한 실수(80+70), 130억은 50+80을 더한 실수예요. 기출(60억+40억=100억)과 같은 구조예요.", "similar": [{"q": "선물 1계약 금액이 2억 원, 개시증거금률 15%, 유지증거금률 10%이다. 일일정산 후 증거금이 1,800만 원이 되었다면 납부해야 할 추가증거금은?", "choices": ["200만 원", "1,200만 원", "1,000만 원", "3,000만 원"], "answer": 1, "explanation": "정산 후 증거금이 유지증거금보다 적으니 마진콜이 오고, 개시증거금까지 채워야 해요. 그래서 1,200만 원을 내야 해요.\n① 개시증거금 = 2억×15% = 3,000만 원\n② 유지증거금 = 2억×10% = 2,000만 원\n③ 1,800만 원 < 2,000만 원 → 마진콜\n④ 추가증거금 = 3,000 − 1,800 = 1,200만 원\n200만 원은 유지증거금까지만 채운 오답이에요.", "tip": "추가증거금 = 개시증거금 − 현재 증거금(유지증거금 기준 아님)", "terms": [{"term": "개시증거금", "meaning": "선물거래를 처음 계약할 때 맡기는 보증금이에요."}, {"term": "유지증거금", "meaning": "선물거래를 하는 동안 계좌에 최소한 남아 있어야 하는 증거금이에요."}, {"term": "추가증거금", "meaning": "마진콜이 왔을 때 개시증거금 수준까지 채우기 위해 더 내는 돈이에요."}, {"term": "마진콜", "meaning": "증거금이 유지증거금보다 적어졌을 때, 돈을 더 채워 넣으라고 요구하는 것이에요."}]}, {"q": "현재 보유 중인 주식포트폴리오의 가치는 300억 원이고 베타는 1.2이다. KOSPI200 선물지수가 300pt이고 1pt당 거래승수가 25만 원일 때, 포트폴리오를 헤지하기 위해 필요한 선물계약 수와 포지션은?", "choices": ["480계약 매도", "480계약 매수", "400계약 매도", "360계약 매도"], "answer": 0, "explanation": "주식을 가지고 있어서 값이 떨어질 위험을 막으려면 선물을 팔아야 해요(매도헤지). 계약수는 480계약이에요.\n헤지 계약수 = (포트폴리오 가치 × 베타) / (선물가격 × 거래승수)\n= (300억 × 1.2) / (300 × 25만 원)\n= 360억 / 7,500만 원 = 480계약\n400계약은 베타를 반영하지 않은 값이고, '매수'는 포지션 방향이 틀렸어요.", "tip": "헤지 계약수 = (포트폴리오 가치×β) / (선물가격×승수), 현물 보유 → 선물 매도", "terms": [{"term": "헤지", "meaning": "가격이 불리하게 변할 위험을 줄이려고 반대 방향의 거래를 하는 것이에요."}, {"term": "베타", "meaning": "시장 전체가 움직일 때 개별 자산이나 포트폴리오가 얼마나 따라 움직이는지 나타내는 체계적 위험의 크기예요."}, {"term": "거래승수", "meaning": "지수 1pt를 돈으로 바꿀 때 곱하는 금액이에요. 승수가 25만 원이면 1pt = 25만 원이에요."}, {"term": "매도헤지", "meaning": "현물을 가진 사람이 가격 하락 위험을 막기 위해 선물을 파는 것이에요."}]}, {"q": "베이시스와 헤지에 대한 설명으로 옳은 것은?", "choices": ["현물포지션과 선물헤지포지션을 만기 전 임의 시점에 청산해도 베이시스 손익은 발생하지 않는다.", "현물포지션과 선물헤지포지션을 선물 만기 시점에 청산하면 베이시스 위험에 노출되지 않는다(제로 베이시스 헤지).", "매수헤지는 현물을 보유한 투자자가 가격하락 위험을 피하기 위해 선물을 매도하는 것이다.", "교차헤지는 현물과 동일한 선물상품을 이용한 헤지이다."], "answer": 1, "explanation": "선물 만기에는 선물가격과 현물가격이 같아져서 베이시스가 0이 돼요. 그래서 만기에 청산하면 베이시스 위험이 없어요(제로 베이시스 헤지). 만기 전 아무 때나 청산하는 것은 랜덤 베이시스 헤지로, 시장위험은 피하지만 베이시스 위험이 남아요. 현물 보유자가 선물을 파는 것은 '매수헤지'가 아니라 '매도헤지'예요. 비슷한 다른 상품으로 헤지하는 것이 '교차헤지'예요.", "tip": "만기 청산 = 제로 베이시스(위험 없음), 만기 전 청산 = 랜덤 베이시스(위험 있음)", "terms": [{"term": "베이시스", "meaning": "선물가격과 현물가격의 차이예요."}, {"term": "제로 베이시스 헤지", "meaning": "선물 만기에 청산해서 베이시스가 0이 되므로 베이시스 위험이 없는 헤지예요."}, {"term": "매도헤지", "meaning": "현물을 가진 사람이 가격 하락 위험을 막기 위해 선물을 파는 것이에요."}, {"term": "교차헤지", "meaning": "헤지하려는 현물과 똑같은 선물이 없을 때, 비슷하게 움직이는 다른 선물로 헤지하는 방법이에요."}]}], "tip": "개시증거금 = 정산 후 증거금 + 추가증거금", "terms": [{"term": "개시증거금", "meaning": "선물거래를 처음 계약할 때 맡기는 보증금이에요."}, {"term": "유지증거금", "meaning": "선물거래를 하는 동안 계좌에 최소한 남아 있어야 하는 증거금이에요."}, {"term": "추가증거금", "meaning": "마진콜이 왔을 때 개시증거금 수준까지 채우기 위해 더 내는 돈이에요."}, {"term": "마진콜", "meaning": "증거금이 유지증거금보다 적어졌을 때, 돈을 더 채워 넣으라고 요구하는 것이에요."}]}, {"no": 35, "topic": "파생상품투자운용/투자전략", "concept": "옵션 스프레드 포지션 만기 손익 계산", "q": "행사가격이 250pt인 풋옵션을 2.0pt에 1계약 매수하고, 행사가격이 260pt인 풋옵션을 6.0pt에 1계약 매도하였다. 옵션 만기 시점에 기초자산 가격이 255pt로 끝났다면 이 포지션의 순손익은?(단위: pt)", "choices": ["+4.0pt", "+1.0pt", "-1.0pt", "-6.0pt"], "answer": 2, "explanation": "각 옵션의 만기 가치와 프리미엄을 따로 계산해서 더하면 −1.0pt예요.\n① 풋 250 매수: Max(250−255, 0) = 0, 프리미엄 −2.0 → −2.0\n② 풋 260 매도: 매수자에게 Max(260−255, 0) = 5 지급, 프리미엄 +6.0 → +1.0\n③ 합계 = −2.0 + 1.0 = −1.0pt\n+4.0은 순프리미엄 수입만 본 값(최대이익)이에요. 낮은 행사가 풋 매수 + 높은 행사가 풋 매도는 강세풋스프레드(풋불스프레드)이고, 설정할 때 돈이 들어와요.", "similar": [{"q": "행사가격이 200pt인 콜옵션을 4.0pt에 1계약 매수하고, 행사가격이 210pt인 콜옵션을 1.5pt에 1계약 매도하였다. 만기 시점에 기초자산이 215pt로 끝났다면 순손익은?", "choices": ["+7.5pt", "+2.5pt", "+10.0pt", "+12.5pt"], "answer": 0, "explanation": "각 콜옵션의 손익을 따로 구해 더하면 +7.5pt예요.\n① 콜 200 매수: 내재가치 15 − 프리미엄 4.0 = +11.0\n② 콜 210 매도: −5 + 프리미엄 1.5 = −3.5\n③ 합계 = +7.5pt\n이 값은 강세콜스프레드의 최대이익(행사가격 차이 10 − 순지출 2.5)과 같아요. 강세콜스프레드는 설정할 때 순지출이 생기고, 이익과 손실이 모두 제한돼요.", "tip": "강세콜스프레드 최대이익 = 행사가격 차이 − 순지출", "terms": [{"term": "콜옵션", "meaning": "정해진 가격(행사가격)에 기초자산을 살 수 있는 권리예요."}, {"term": "내재가치", "meaning": "옵션을 지금 바로 행사했을 때 얻는 이익이에요. 콜은 Max(S−X, 0), 풋은 Max(X−S, 0)이에요."}, {"term": "강세콜스프레드", "meaning": "행사가격이 낮은 콜을 사고 높은 콜을 팔아, 가격이 오를 때 제한된 이익을 노리는 전략이에요."}]}, {"q": "행사가격 250pt인 콜옵션(프리미엄 4pt)과 풋옵션(프리미엄 3pt)을 동시에 1계약씩 매도하였다. 만기 시 이 포지션에서 이익이 발생하는 기초자산 가격 구간은?", "choices": ["246pt ~ 254pt", "243pt ~ 257pt", "247pt ~ 253pt", "250pt ~ 257pt"], "answer": 1, "explanation": "같은 행사가격의 콜과 풋을 동시에 파는 것은 스트래들 매도예요. 받은 프리미엄 합계만큼 위아래로 여유가 있어요.\n① 받은 프리미엄 = 4 + 3 = 7pt\n② 이익 구간 = 250 ± 7 → 243pt 초과 ~ 257pt 미만\n스트래들 매도는 변동성이 줄어들 것으로 예상될 때 써요.", "tip": "스트래들 매도 이익구간 = 행사가격 ± 받은 프리미엄 합계", "terms": [{"term": "스트래들", "meaning": "행사가격이 같은 콜과 풋을 함께 사거나 파는 옵션 전략이에요."}, {"term": "행사가격", "meaning": "옵션 권리를 행사할 때 기초자산을 사거나 팔기로 정해 둔 가격이에요."}, {"term": "프리미엄", "meaning": "옵션을 살 때 내는 가격이에요. 옵션을 판 사람은 이 돈을 받아요."}, {"term": "변동성", "meaning": "가격이 얼마나 크게 오르내리는지를 나타내는 정도예요."}]}, {"q": "옵션 투자전략과 시장 전망의 연결로 옳지 않은 것은?", "choices": ["주가 상승 예상 - 콜옵션 매수, 풋옵션 매도, 불 스프레드", "주가 하락 예상 - 풋옵션 매수, 콜옵션 매도, 베어 스프레드", "변동성 증가 예상 - 스트래들 매수, 스트랭글 매수", "변동성 증가 예상 - 스트래들 매도, 버터플라이 매수"], "answer": 3, "explanation": "스트래들 매도와 버터플라이 매수는 변동성이 '줄어들' 것으로 볼 때 쓰는 전략이에요. 그래서 이를 '변동성 증가 예상'과 연결한 것이 틀렸어요. 변동성 증가가 예상되면 스트래들·스트랭글 매수(또는 버터플라이 매도)가 유리해요. 스트랭글은 다른 행사가격(외가격)을 써서 스트래들보다 비용이 적지만, 이익을 내려면 더 큰 가격변동이 필요해요.", "tip": "변동성↑ = 스트래들·스트랭글 매수, 변동성↓ = 스트래들 매도·버터플라이 매수", "terms": [{"term": "스트래들", "meaning": "행사가격이 같은 콜과 풋을 함께 사거나 파는 옵션 전략이에요."}, {"term": "스트랭글", "meaning": "행사가격이 서로 다른 콜과 풋(외가격)을 함께 사거나 파는 옵션 전략이에요."}, {"term": "버터플라이", "meaning": "행사가격이 다른 세 종류의 옵션을 조합한 전략으로, 매수하면 가격이 크게 변하지 않을 때 이익이 나요."}, {"term": "변동성", "meaning": "가격이 얼마나 크게 오르내리는지를 나타내는 정도예요."}]}], "tip": "풋 내재가치 = Max(X−S, 0), 매도 포지션 손익 = 받은 프리미엄 − 지급액", "terms": [{"term": "풋옵션", "meaning": "정해진 가격(행사가격)에 기초자산을 팔 수 있는 권리예요."}, {"term": "행사가격", "meaning": "옵션 권리를 행사할 때 기초자산을 사거나 팔기로 정해 둔 가격이에요."}, {"term": "프리미엄", "meaning": "옵션을 살 때 내는 가격이에요. 옵션을 판 사람은 이 돈을 받아요."}, {"term": "강세풋스프레드", "meaning": "행사가격이 낮은 풋을 사고 높은 풋을 팔아, 가격이 오를 때 제한된 이익을 노리는 전략이에요. 설정할 때 돈이 들어와요."}]}, {"no": 36, "topic": "파생상품투자운용/투자전략", "concept": "풋-콜 패리티와 합성포지션", "q": "풋-콜 패리티(콜옵션 + 채권 = 풋옵션 + 기초자산)에 의할 때 채권매수와 동일한 포지션에 해당하는 것은?", "choices": ["콜옵션 매수 + 풋옵션 매도 + 주식 매수", "콜옵션 매수 + 풋옵션 매수 + 주식 매도", "콜옵션 매도 + 풋옵션 매수 + 주식 매수", "콜옵션 매도 + 풋옵션 매도 + 주식 매수"], "answer": 2, "explanation": "C + B = P + S에서 채권(B)만 한쪽에 남기면 B = −C + P + S예요. 즉 콜옵션 매도 + 풋옵션 매수 + 주식(기초자산) 매수가 채권매수와 같아요. 이 조합은 옵션 차익거래의 '컨버전'과 같아요. 같은 방법으로 콜매수 = −B + P + S, 풋매수 = C + B − S, 기초자산매수 = C + B − P예요.", "similar": [{"q": "KOSPI200 지수가 200pt이고 이자율은 연 6%, 옵션 만기까지는 2개월이 남았다. 행사가격이 200인 유럽식 콜옵션의 프리미엄이 5.0pt라면, 같은 행사가격을 가진 풋옵션의 정상적 프리미엄 수준은?(단리 할인)", "choices": ["1.98pt", "6.98pt", "5.00pt", "3.02pt"], "answer": 3, "explanation": "풋-콜 패리티 식을 풋(P)에 대해 풀어서 구하면 3.02pt예요.\nP = C + X/(1+r×t) − S\n= 5.0 + 200/(1+0.06×2/12) − 200\n= 5.0 + 198.02 − 200 = 3.02pt\n6.98pt는 할인효과(1.98)를 반대로 더한 값, 1.98pt는 콜 프리미엄을 빠뜨린 값이에요. 등가격에서는 이자 효과 때문에 콜옵션이 풋옵션보다 비싸요.", "tip": "P = C + X/(1+r×t) − S", "terms": [{"term": "풋-콜 패리티", "meaning": "같은 조건의 콜옵션, 풋옵션, 기초자산, 채권 사이에 '콜 + 채권 = 풋 + 기초자산'이 성립한다는 관계예요."}, {"term": "유럽식 옵션", "meaning": "만기일에만 권리를 행사할 수 있는 옵션이에요."}, {"term": "등가격", "meaning": "옵션의 행사가격과 기초자산의 현재 가격이 같은 상태(ATM)예요."}, {"term": "단리 할인", "meaning": "이자에 다시 이자가 붙지 않는 단리 방식으로 미래 금액을 현재가치로 바꾸는 것이에요."}]}, {"q": "옵션을 이용한 차익거래 중 컨버전(Conversion) 전략에 해당하는 것은?", "choices": ["콜옵션 매수 + 풋옵션 매도 + 기초자산 매도", "콜옵션 매도 + 풋옵션 매도 + 기초자산 매도", "콜옵션 매수 + 풋옵션 매수 + 기초자산 매수", "콜옵션 매도 + 풋옵션 매수 + 기초자산 매수"], "answer": 3, "explanation": "컨버전은 C + B > P + S(콜 고평가)일 때, 합성선물매도(콜 매도 + 풋 매수)와 현물(기초자산) 매수를 함께 하는 매수차익거래예요. 그래서 '콜옵션 매도 + 풋옵션 매수 + 기초자산 매수'가 정답이에요. 리버설은 반대로 C + B < P + S일 때 합성선물매수(콜 매수 + 풋 매도)와 기초자산 매도를 하는 매도차익거래예요.", "tip": "컨버전 = 콜매도+풋매수+현물매수, 리버설 = 콜매수+풋매도+현물매도", "terms": [{"term": "컨버전", "meaning": "콜이 고평가(C + B > P + S)일 때 콜 매도 + 풋 매수 + 기초자산 매수로 이익을 얻는 옵션 차익거래예요."}, {"term": "리버설", "meaning": "콜이 저평가(C + B < P + S)일 때 콜 매수 + 풋 매도 + 기초자산 매도로 이익을 얻는 옵션 차익거래예요."}, {"term": "합성선물", "meaning": "콜옵션과 풋옵션을 조합해 선물과 똑같은 손익 구조를 만든 포지션이에요."}]}, {"q": "풋-콜 패리티를 이용하여 기초자산(주식) 매수와 동일한 효과를 내는 옵션 포지션을 구성할 때 핵심 옵션 조합은?(채권 포지션은 고려하지 않음)", "choices": ["콜옵션 매수 + 풋옵션 매도", "콜옵션 매도 + 풋옵션 매수", "콜옵션 매수 + 풋옵션 매수", "콜옵션 매도 + 풋옵션 매도"], "answer": 0, "explanation": "C + B = P + S에서 S = C + B − P이므로, 기초자산 매수는 콜옵션 매수 + 풋옵션 매도(+ 채권 매수)로 똑같이 만들 수 있어요. 그래서 '콜옵션 매수 + 풋옵션 매도'가 정답이에요. 이 조합을 '합성선물 매수'라고도 해요. 반대로 콜 매도 + 풋 매수는 합성선물 매도(기초자산 매도 효과)예요.", "tip": "합성선물 매수 = 콜매수 + 풋매도, 합성선물 매도 = 콜매도 + 풋매수", "terms": [{"term": "풋-콜 패리티", "meaning": "같은 조건의 콜옵션, 풋옵션, 기초자산, 채권 사이에 '콜 + 채권 = 풋 + 기초자산'이 성립한다는 관계예요."}, {"term": "합성선물", "meaning": "콜옵션과 풋옵션을 조합해 선물과 똑같은 손익 구조를 만든 포지션이에요."}, {"term": "복제", "meaning": "다른 자산들을 조합해 어떤 자산과 똑같은 수익 구조를 만드는 것이에요."}]}], "tip": "남길 것만 남기고 나머지는 부호를 바꿔 넘긴다", "terms": [{"term": "풋-콜 패리티", "meaning": "같은 조건의 콜옵션, 풋옵션, 기초자산, 채권 사이에 '콜 + 채권 = 풋 + 기초자산'이 성립한다는 관계예요."}, {"term": "컨버전", "meaning": "콜이 고평가(C + B > P + S)일 때 콜 매도 + 풋 매수 + 기초자산 매수로 이익을 얻는 옵션 차익거래예요."}, {"term": "기초자산", "meaning": "파생상품의 가치를 결정하는 바탕이 되는 자산이에요. 주식, 주가지수, 금리, 환율, 원자재 등이 있어요."}]}, {"no": 37, "topic": "파생상품투자운용/투자전략", "concept": "옵션 민감도 지표(델타·감마·쎄타·베가·로우)", "q": "옵션 민감도 지표에 대한 설명으로 옳지 않은 것은?", "choices": ["델타는 기초자산 가격이 변할 때 옵션가격이 얼마나 변하는지를 나타낸다.", "감마는 기초자산 가격이 변할 때 델타가 얼마나 변하는지를 나타낸다.", "베가는 무위험이자율이 변할 때 옵션가격이 얼마나 변하는지를 나타낸다.", "쎄타는 시간이 경과할 때 옵션가격이 얼마나 변하는지를 나타낸다."], "answer": 2, "explanation": "베가는 기초자산의 '변동성'이 변할 때 옵션가격이 얼마나 변하는지 나타내요. 무위험이자율 변화에 대한 민감도는 '로우'예요. 그래서 베가를 이자율로 설명한 것이 틀렸어요. 매수포지션 부호는 콜(델타+, 감마+, 베가+, 쎄타−, 로우+), 풋(델타−, 감마+, 베가+, 쎄타−, 로우−)이에요.", "similar": [{"q": "기초자산의 가격이 200pt에서 210pt로 상승할 때 옵션의 가격이 8pt에서 12pt로 상승하였다. 이 옵션의 델타는?", "choices": ["0.04", "0.50", "0.40", "2.50"], "answer": 2, "explanation": "델타는 기초자산 가격이 1 변할 때 옵션가격이 얼마나 변하는지예요. 답은 0.4예요.\n델타 = 옵션가격 변화 / 기초자산가격 변화\n= (12 − 8)/(210 − 200) = 4/10 = 0.4\n2.50은 분자와 분모를 뒤집은 값이에요. 콜옵션 매수의 델타는 0~1 사이(+), 풋옵션 매수의 델타는 −1~0 사이(−)이고, 등가격 콜의 델타는 약 0.5예요.", "tip": "델타 = 옵션가격 변화 / 기초자산가격 변화", "terms": [{"term": "델타", "meaning": "기초자산 가격이 변할 때 옵션가격이 얼마나 변하는지를 나타내는 민감도예요."}, {"term": "등가격", "meaning": "옵션의 행사가격과 기초자산의 현재 가격이 같은 상태(ATM)예요."}, {"term": "기초자산", "meaning": "파생상품의 가치를 결정하는 바탕이 되는 자산이에요. 주식, 주가지수, 금리, 환율, 원자재 등이 있어요."}]}, {"q": "<보기>에 가장 부합하는 옵션 민감도 지표는?\n- 옵션프리미엄의 기초자산가격에 대한 2차 미분치에 해당한다.\n- 등가격(ATM)에서 그 값이 가장 크고, 만기에 근접할수록 그 값이 커진다.", "choices": ["감마", "델타", "베가", "로우"], "answer": 0, "explanation": "감마는 기초자산이 변할 때 델타가 얼마나 변하는지(2차 미분치)를 나타내요. 등가격에서 가장 크고, 만기가 가까울수록(잔존기간이 짧을수록) 커져요. 그래서 감마가 정답이에요. 옵션 매수 포지션의 감마는 콜·풋 모두 (+), 매도는 (−)예요. 델타는 1차 미분치, 베가는 변동성, 로우는 금리에 대한 민감도예요.", "tip": "감마 = 델타의 변화, 등가격·만기 근접 시 최대", "terms": [{"term": "감마", "meaning": "기초자산 가격이 변할 때 델타가 얼마나 변하는지를 나타내는 옵션 민감도예요."}, {"term": "델타", "meaning": "기초자산 가격이 변할 때 옵션가격이 얼마나 변하는지를 나타내는 민감도예요."}, {"term": "2차 미분치", "meaning": "변화하는 정도가 다시 얼마나 변하는지를 나타내는 값이에요. 감마는 델타가 얼마나 변하는지를 보여줘요."}, {"term": "등가격", "meaning": "옵션의 행사가격과 기초자산의 현재 가격이 같은 상태(ATM)예요."}]}, {"q": "행사가격이 300pt인 풋옵션의 프리미엄이 13pt이고 현재 기초자산 가격이 290pt이다. 이 옵션의 시간가치와 moneyness로 옳은 것은?", "choices": ["시간가치 10pt, 내가격", "시간가치 3pt, 외가격", "시간가치 13pt, 외가격", "시간가치 3pt, 내가격"], "answer": 3, "explanation": "내재가치를 먼저 구하고, 프리미엄에서 빼면 시간가치예요. 답은 시간가치 3pt, 내가격이에요.\n① 풋 내재가치 = Max(300 − 290, 0) = 10pt\n② 시간가치 = 프리미엄 − 내재가치 = 13 − 10 = 3pt\n③ 지금 행사하면 이익이 나므로 내가격(ITM)\n콜은 S > X, 풋은 X > S일 때 내가격이에요.", "tip": "시간가치 = 프리미엄 − 내재가치, 풋은 X > S면 내가격", "terms": [{"term": "내재가치", "meaning": "옵션을 지금 바로 행사했을 때 얻는 이익이에요. 콜은 Max(S−X, 0), 풋은 Max(X−S, 0)이에요."}, {"term": "시간가치", "meaning": "옵션 프리미엄 중 내재가치를 뺀 나머지로, 만기까지 남은 시간 동안 이익이 날 가능성에 대한 가치예요."}, { 해야 한다.", "컴포지트 수익률은 개별 포트폴리오 수익률을 자산가중하여 계산해야 한다.", "수익률은 실제 매매비용을 공제한 후 계산하며, 추정된 매매비용을 사용하지 않아야 한다."], "answer": 1, "explanation": "재량권이 없는 포트폴리오는 보수를 받더라도 컴포지트(통합계정)에 넣지 않아야 해요. 그래서 이 설명이 틀렸어요. 반대로 재량권이 있는 포트폴리오는 보수를 받지 않아도 컴포지트에 넣어야 해요. 또한 모형 포트폴리오의 성과를 실제 성과에 연결해서는 안 돼요.", "tip": "컴포지트 포함 기준은 보수가 아니라 재량권", "terms": [{"term": "GIPS", "meaning": "국제투자성과기준이에요. 운용회사들이 투자성과를 같은 규칙으로 계산하고 공시하도록 만든 세계 공통 기준이에요."}, {"term": "컴포지트", "meaning": "운용 목적이나 전략이 비슷한 포트폴리오들을 하나로 묶은 통합계정이에요."}, {"term": "재량권", "meaning": "고객이 운용사에 맡겨, 운용사가 스스로 판단해 투자 결정을 할 수 있는 권한이에요."}, {"term": "발생주의", "meaning": "돈이 실제로 들어오거나 나가는 때가 아니라, 거래나 사건이 생긴 시점에 손익을 기록하는 방식이에요."}]}, {"q": "GIPS에 따른 성과공시 방법으로 옳지 않은 것은?", "choices": ["3년 연환산된 사후 표준편차를 제시해야 한다.", "성과를 내기 위해 사용된 통화를 공시해야 한다.", "컴포지트 개요, 벤치마크 개요, 내부분산도 지표를 공시해야 한다.", "1년 미만 기간에 대한 수익률은 연환산하여 공시해야 한다."], "answer": 3, "explanation": "GIPS에서는 1년이 안 되는 기간의 수익률을 연환산하면 안 돼요. 그래서 '연환산하여 공시해야 한다'는 설명이 틀렸어요. 그 밖에 통화 공시, 컴포지트·벤치마크 개요와 내부분산도 공시, 3년 연환산 사후표준편차 제시, 최소 5년 성과 제시 등이 요구돼요.", "tip": "GIPS: 1년 미만 수익률은 연환산 금지", "terms": [{"term": "GIPS", "meaning": "국제투자성과기준이에요. 운용회사들이 투자성과를 같은 규칙으로 계산하고 공시하도록 만든 세계 공통 기준이에요."}, {"term": "연환산", "meaning": "1년이 안 되는 기간의 수익률을 1년 기준으로 늘려 계산하는 것이에요."}, {"term": "내부분산도", "meaning": "같은 컴포지트에 속한 포트폴리오들의 수익률이 서로 얼마나 퍼져 있는지 나타내는 지표예요."}, {"term": "표준편차", "meaning": "수익률이 평균에서 얼마나 흩어져 있는지 나타내는 값으로, 분산의 제곱근이에요. 위험의 크기로 써요."}]}], "tip": "회·수·위·비·특·정·보", "terms": [{"term": "회계처리", "meaning": "펀드가 가진 자산의 가치를 평가하고 거래 내용을 장부에 기록하는 일이에요."}, {"term": "기준지표(벤치마크)", "meaning": "펀드의 운용성과가 좋은지 나쁜지 비교하는 기준이 되는 지수나 포트폴리오예요."}, {"term": "동류그룹", "meaning": "운용 방식이나 투자 대상이 비슷한 펀드들의 모임이에요."}, {"term": "정성평가", "meaning": "숫자로 나타내기 어려운 운용조직, 운용철학, 프로세스 등을 따져 보는 평가예요."}]}, {"no": 39, "topic": "투자운용결과분석", "concept": "시간가중수익률과 금액가중수익률", "q": "금액가중수익률과 시간가중수익률에 대한 설명으로 가장 적절하지 않은 것은?", "choices": ["금액가중수익률은 운용기간 중 현금흐름(자금 유출입)의 영향을 받는 내부수익률(IRR)이다.", "금액가중수익률은 펀드매니저만의 운용성과를 측정하므로 벤치마크 및 동류그룹 간 비교에 적합하다.", "시간가중수익률은 펀드매니저가 통제할 수 없는 투자자금 유출입에 따른 수익률 왜곡을 해결한다.", "시간가중수익률은 총 투자기간을 세부기간으로 나누어 기하적으로 연결하며, 세부기간이 짧을수록 왜곡이 감소한다."], "answer": 1, "explanation": "금액가중수익률(IRR)은 펀드매니저와 투자자의 공동성과를 보여줘요. 그래서 매니저만의 성과를 평가할 수 없고, 벤치마크·동류그룹 간 비교도 할 수 없어요. 따라서 이 설명이 틀렸어요. 매니저 성과 측정과 벤치마크 비교에 알맞은 것은 시간가중수익률이에요. 집합투자기구 기준가격도 시간가중수익률로 발표돼요.", "similar": [{"q": "다음 자료에 따를 때 2년 전체기간의 통합계정수익률(연평균, 시간가중 기하평균)은?\n[1차년도] 펀드A 기초 500 → 기말 700, 펀드B 기초 1,500 → 기말 2,500\n[2차년도] 펀드A 기초 1,000 → 기말 1,300, 펀드B 기초 3,000 → 기말 3,600", "choices": ["82.50%", "41.25%", "40.00%", "96.00%"], "answer": 2, "explanation": "통합계정수익률은 먼저 해마다 자산가중으로 구하고, 그다음 기간을 시간가중(기하)으로 이어요. 답은 40%예요.\n① 1차년도 = (3,200 − 2,000)/2,000 = 60%\n② 2차년도 = (4,900 − 4,000)/4,000 = 22.5%\n③ 기하 연결 = 1.6 × 1.225 = 1.96\n④ 연평균 = √1.96 − 1 = 40%\n96%는 2년 누적수익률, 41.25%는 산술평균, 82.5%는 단순합이에요.", "tip": "통합계정수익률 = 자산가중(같은 기간) → 시간가중(기간 연결)", "terms": [{"term": "통합계정수익률", "meaning": "여러 펀드를 하나로 묶은 통합계정(컴포지트)의 수익률이에요."}, {"term": "자산가중", "meaning": "각 포트폴리오의 자산 규모를 비중으로 삼아 평균을 내는 방식이에요."}, {"term": "시간가중수익률", "meaning": "돈이 들어오고 나간 영향을 없애고 기간별 수익률을 곱셈으로 이어 계산한 수익률로, 펀드매니저의 실력만 보여줘요."}, {"term": "기하평균", "meaning": "여러 기간의 수익률을 곱셈으로 연결해 구한 평균으로, 복리 효과를 반영해요."}]}, {"q": "시간가중수익률에 대한 설명으로 가장 거리가 먼 것은?", "choices": ["펀드매니저가 통제할 수 없는 투자자금의 유출입에 따른 수익률 왜곡현상을 해결한다.", "세부기간이 짧을수록 수익률의 왜곡현상이 감소한다.", "순수 시간가중수익률을 계산하려면 반드시 일일 단위로 수익률을 측정해야 한다.", "GIPS는 시간가중수익률로 펀드수익률을 계산할 것을 권고한다."], "answer": 2, "explanation": "순수 시간가중수익률을 구할 때 꼭 매일 단위로 수익률을 잴 필요는 없어요. 현금흐름이 생기는 시점마다 기간을 나누면 돼요. 그래서 '반드시 일일 단위'라는 설명이 틀렸어요. 나머지는 모두 옳은 설명이에요. 시간가중수익률의 핵심은 펀드운용자 관점, 기하수익률, 벤치마크·동류그룹 비교 가능이에요.", "tip": "시간가중 = 운용자 관점·기하·비교 가능, 현금흐름 시점마다 구분", "terms": [{"term": "시간가중수익률", "meaning": "돈이 들어오고 나간 영향을 없애고 기간별 수익률을 곱셈으로 이어 계산한 수익률로, 펀드매니저의 실력만 보여줘요."}, {"term": "GIPS", "meaning": "국제투자성과기준이에요. 운용회사들이 투자성과를 같은 규칙으로 계산하고 공시하도록 만든 세계 공통 기준이에요."}, {"term": "기하평균", "meaning": "여러 기간의 수익률을 곱셈으로 연결해 구한 평균으로, 복리 효과를 반영해요."}]}, {"q": "주식을 1기 초에 10,000원에 매입하였고, 1기 말 15,000원, 2기 말 12,000원이 되었다(배당 없음). 2기간의 산술평균수익률과 기하평균수익률로 옳은 것은?", "choices": ["산술평균 15.00%, 기하평균 20.00%", "산술평균 9.54%, 기하평균 15.00%", "산술평균 20.00%, 기하평균 10.00%", "산술평균 15.00%, 기하평균 9.54%"], "answer": 3, "explanation": "각 기간 수익률을 먼저 구하고, 산술평균과 기하평균을 따로 계산해요. 답은 산술평균 15%, 기하평균 약 9.54%예요.\n① 1기 = (15,000 − 10,000)/10,000 = 50%\n② 2기 = (12,000 − 15,000)/15,000 = −20%\n③ 산술평균 = (50% − 20%)/2 = 15%\n④ 기하평균 = √(1.5 × 0.8) − 1 = √1.2 − 1 ≈ 9.54%\n산술평균은 보통 기하평균보다 높게 나와요. 과거 성과를 잴 때는 기하평균(시간가중)이 알맞아요.", "tip": "산술평균 ≥ 기하평균, 과거성과는 기하평균", "terms": [{"term": "산술평균", "meaning": "여러 값을 모두 더해 개수로 나눈 단순한 평균이에요."}, {"term": "기하평균", "meaning": "여러 기간의 수익률을 곱셈으로 연결해 구한 평균으로, 복리 효과를 반영해요."}]}], "tip": "금액가중 = 투자자 관점·IRR / 시간가중 = 운용자 관점·기하", "terms": [{"term": "금액가중수익률", "meaning": "투자기간 중 들어오고 나간 돈까지 반영해 계산한 수익률(내부수익률, IRR)이에요."}, {"term": "시간가중수익률", "meaning": "돈이 들어오고 나간 영향을 없애고 기간별 수익률을 곱셈으로 이어 계산한 수익률로, 펀드매니저의 실력만 보여줘요."}, {"term": "내부수익률(IRR)", "meaning": "투자로 들어오고 나가는 돈의 현재가치 합을 0으로 만드는 수익률이에요."}, {"term": "기준지표(벤치마크)", "meaning": "펀드의 운용성과가 좋은지 나쁜지 비교하는 기준이 되는 지수나 포트폴리오예요."}]}, {"no": 40, "topic": "투자운용결과분석", "concept": "기준지표(벤치마크)의 바람직한 속성과 종류", "q": "기준지표(벤치마크)가 갖추어야 할 바람직한 특성에 대한 설명으로 옳지 않은 것은?", "choices": ["사후결정: 운용성과를 공정하게 반영하기 위해 평가기간이 끝난 후 정해져야 한다.", "투자가능성: 적극적인 운용을 하지 않는 경우 기준지표의 구성종목에 투자하여 보유할 수 있어야 한다.", "측정가능성: 일반에게 공개된 정보로부터 원하는 기간마다 기준지표 수익률을 계산할 수 있어야 한다.", "명확성: 기준지표를 구성하는 종목명과 비중이 정확하게 표시되어야 한다."], "answer": 0, "explanation": "기준지표는 평가기간이 시작되기 '전에' 미리 정해져야 해요. 그래서 '평가기간이 끝난 후 정해져야 한다'는 사후결정이 틀렸어요. 바람직한 속성에는 명확성, 투자가능성, 측정가능성, 적합성(매니저의 운용스타일과 맞음), 투자의견 반영(매니저가 BM 구성종목에 대한 투자지식을 가짐), 사전결정이 있어요.", "similar": [{"q": "펀드 유형과 적합한 기준지표의 연결로 옳지 않은 것은?", "choices": ["운용상 특별한 제약이 없는 경우 - 시장지수(종합주가지수, 종합채권지수)", "특정 분야에 집중투자하는 경우 - 스타일지수(가치주·성장주·국공채 섹터 등)", "혼합형펀드 - 2개 이상의 지수를 합성한 합성지수", "포트폴리오보험전략 등 일반성이 적은 펀드 - 시장지수"], "answer": 3, "explanation": "포트폴리오보험전략, 동결포트폴리오처럼 일반성이 적은 펀드는 시장지수가 아니라 '맞춤포트폴리오'를 기준지표로 써요. 그래서 이 연결이 틀렸어요. 투자가능성에 맞추기 위해 만드는 벤치마크는 정상포트폴리오(예: KOBI 30)예요.", "tip": "제약 없음=시장, 집중=스타일, 혼합=합성, 보험=맞춤", "terms": [{"term": "포트폴리
