증권투자운용/투자전략", "concept": "국제채권시장과 미국 국채", "q": "미국 재무부 채권에 대한 설명으로 옳은 것은?", "choices": ["T-Bond는 만기 10년 이상의 장기채로 이표채로 발행된다.", "T-Note는 만기 10년 초과의 장기채이다.", "T-Bill은 만기 1년 이하의 단기채로 이표채로 발행된다.", "T-Bond는 이자를 지급하지 않고 액면가보다 싸게 발행되는 할인채이다."], "answer": 0, "explanation": "T-Bond는 만기 10년 이상의 장기채이고 이표채로 발행된다. 그래서 이것이 옳다. T-Bill은 만기 1년 이하의 단기 '할인채'이다. T-Note는 장기채가 아닌 중기 이표채이다.", "similar": [{"q": "미국 국채 투자 시 고려사항(유의사항)과 가장 거리가 먼 것은?", "choices": ["Yield Curve 분석", "미국 연준(Fed)의 금리정책", "달러 움직임과 안전자산 선호", "발행국의 디폴트(채무불이행) 위험 증가"], "answer": 3, "explanation": "미국 국채는 위험이 없는 채권으로 여겨진다. 그래서 디폴트 위험은 주요 고려사항이 아니다. Yield Curve, 수요·공급, 달러 움직임, 안전자산 선호, Fed 금리정책, 물가·GDP·실업률 등이 고려사항이다. 다른 나라 채권금리는 T-Bill 금리에 가산금리를 더한 것으로 본다.", "tip": "미국 국채 = 무위험 → 디폴트 위험은 고려 X", "terms": [{"term": "Yield Curve", "meaning": "채권의 만기별 수익률을 이어 그린 곡선(수익률곡선)"}, {"term": "안전자산", "meaning": "가치가 잘 떨어지지 않아 위기 때 사람들이 찾는 자산(미국 국채, 금 등)"}, {"term": "디폴트", "meaning": "빌린 돈을 약속대로 갚지 못하는 것(채무불이행)"}, {"term": "가산금리", "meaning": "기준 금리에 위험 등을 반영해 더해 주는 금리"}]}, {"q": "유로채 시장에 대한 설명으로 옳지 않은 것은?", "choices": ["유로채의 유통시장은 시장규모가 크고 유동성이 높다.", "유로채 매매는 실물의 이동 없이 장부상으로 결제가 이루어진다.", "주요 결제기관으로는 유로클리어(Euroclear)와 세델(Cedel)이 있다.", "유로채는 쿠폰을 연 4회 지급하는 것이 일반적이며 소득세를 원천징수한다."], "answer": 3, "explanation": "유로채는 쿠폰을 1년에 1번 주는 것이 일반적이다. 또 채권에서 생기는 소득세를 원천징수하지 않는다. 그래서 '연 4회 지급, 원천징수'라는 설명이 틀렸다. 유통시장은 규모가 크고 유동성이 높으며 AIBD의 통제를 받는다. 결제는 실물 이동 없이 장부상으로 이루어지고, 결제기관은 Euroclear와 Cedel이다.", "tip": "유로채 = 연 1회 쿠폰·원천징수 X·장부결제", "terms": [{"term": "쿠폰", "meaning": "채권에서 정해진 날마다 지급하는 이자"}, {"term": "원천징수세", "meaning": "소득을 줄 때 세금을 미리 떼고 주는 방식의 세금"}, {"term": "결제기관", "meaning": "증권 거래 후 돈과 증권을 주고받는 일을 처리해 주는 기관"}]}, {"q": "국제채권시장의 특징에 대한 설명으로 가장 적절한 것은?", "choices": ["국내 기업이 해외채권을 발행하면 자금유입으로 자본수지 흑자 요인이 된다.", "약세통화로 표시된 채권의 발행은 늘어나는 것이 일반적이다.", "외국채 시장이 유로채 시장보다 상대적으로 규제가 적어 더 발달하였다.", "외국채는 무기명채권이므로 이자소득세 부담이 없다."], "answer": 0, "explanation": "국내 기업이 해외에서 채권을 발행하면 돈이 들어오므로 자본수지 흑자 요인이 된다. 그래서 이것이 옳다. 규제가 덜한 유로채 시장이 외국채 시장보다 더 발달했다. 약세통화로 표시된 채권 발행은 보통 줄어든다. 외국채는 기명식이라 이자소득세를 낸다.", "tip": "해외채권 발행 = 자금유입 = 자본수지 흑자", "terms": [{"term": "자본수지", "meaning": "나라 안팎으로 오간 투자 자금의 차이. 들어온 돈이 더 많으면 흑자"}, {"term": "약세통화", "meaning": "가치가 떨어지고 있는 통화"}, {"term": "외국채", "meaning": "외국 기업·정부가 어떤 나라에서 그 나라 통화로 발행하는 채권(예: 미국에서 달러로 발행한 양키본드)"}]}], "tip": "Bill(단기·할인) - Note(중기·이표) - Bond(장기·이표)", "terms": [{"term": "이표채", "meaning": "정해진 기간마다 이자(쿠폰)를 받는 채권"}, {"term": "할인채", "meaning": "이자를 따로 주지 않고, 액면가보다 싸게 발행해 만기에 액면가를 주는 채권"}]}, {"no": 16, "topic": "해외증권투자운용/투자전략", "concept": "해외주식 투자전략(Top-Down/Bottom-Up/방어적)", "q": "해외주식투자 시 국가별 비중을 결정하는 Bottom-Up(상향식) 접근에 대한 설명으로 가장 적절하지 않은 것은?", "choices": ["주요 산업과 기업을 글로벌 경쟁의 관점에서 분석해 혁신 선도기업을 선정한다.", "국가 비중은 산업 및 기업 선정의 결과로써 결정된다.", "세계경제를 하나의 통합된 시장으로 보고 개별기업의 특성을 중시한다.", "각국의 거시경제 변수를 분석하여 국가 비중을 먼저 결정한다."], "answer": 3, "explanation": "거시경제 변수로 국가 비중을 먼저 정하고 산업·기업으로 내려가는 것은 Top-Down(하향식) 접근이다. 그래서 이 설명은 Bottom-Up에 맞지 않는다. Bottom-Up은 기업·산업을 분석한 결과로 국가 비중이 나중에 정해진다. 또 세계경제를 글로벌화된 산업의 집합체로 본다. 두 방식 모두 적극적(공격적) 투자전략이다.", "similar": [{"q": "해외주식투자 전략 중 방어적(소극적) 전략에 대한 설명으로 가장 적절하지 않은 것은?", "choices": ["벤치마크 대비 국가별 비중 차이를 크게 하여 초과수익을 적극 추구한다.", "환율과 주가 전망을 거의 반영하지 않고 벤치마크 지수 구성을 모방한다.", "벤치마크를 정확히 모방하면 목표수익률은 벤치마크에 근접하나 거래비용은 증가한다.", "국제주식시장이 효율적이라고 가정한다."], "answer": 0, "explanation": "벤치마크와 국가별 비중을 크게 다르게 하는 것은 적극적 전략이다. 전망이 틀리면 벤치마크보다 크게 뒤질 위험도 있다. 그래서 이 설명은 방어적 전략에 맞지 않는다. 방어적 전략은 시장효율성을 가정하고 벤치마크를 따라 해서 차이를 최소로 한다. 목표수익률의 상한은 벤치마크 수익률이다.", "tip": "방어적 = 시장효율 가정·벤치마크 모방, 적극적 = 비중 차이로 초과수익", "terms": [{"term": "방어적(소극적) 전략", "meaning": "시장이 효율적이라고 보고 벤치마크를 그대로 따라가는 투자전략"}, {"term": "벤치마크", "meaning": "투자 성과를 비교하는 기준(보통 지수)"}, {"term": "초과수익", "meaning": "벤치마크 수익률보다 더 얻은 수익"}, {"term": "시장효율성", "meaning": "시장가격에 모든 정보가 이미 반영되어 있어 꾸준히 시장을 이기기 어렵다는 생각"}]}, {"q": "Top-Down(하향식) 해외투자 접근에 대한 설명으로 옳은 것은?", "choices": ["국제주식시장이 효율적이라고 생각한다.", "환율과 주가 전망을 투자결정에 거의 반영하지 않는다.", "국가 비중은 기업 선정의 결과로 나중에 결정된다.", "세계경제를 완전히 통합되지 않고 분리된 각국 경제의 결합체로 본다."], "answer": 3, "explanation": "Top-Down은 세계경제를 완전히 통합되지 않고 분리된 각국 경제의 결합체로 본다. 그래서 이것이 옳다. Top-Down은 국가 비중을 먼저 정한 뒤 산업·기업 비중을 정한다. 또 시장이 비효율적이라 보고 환율·주가 전망을 적극 반영한다. 시장효율성 가정과 전망 미반영은 방어적 전략, 국가 비중을 나중에 정하는 것은 Bottom-Up이다.", "tip": "Top = 국가 먼저, Bottom = 국가 나중", "terms": [{"term": "Top-Down", "meaning": "경제 전체(거시경제)를 먼저 보고 점점 산업·기업으로 내려가며 투자를 결정하는 방식"}, {"term": "Bottom-Up", "meaning": "개별 기업 분석에서 출발해 투자를 결정하는 방식"}, {"term": "방어적(소극적) 전략", "meaning": "시장이 효율적이라고 보고 벤치마크를 그대로 따라가는 투자전략"}]}, {"q": "해외투자 실무에 대한 설명으로 가장 적절하지 않은 것은?", "choices": ["해외펀드는 환매 신청 후 환매대금 지급까지 7~10일 정도가 소요된다.", "해외 수출관련주에 투자하면 주가와 투자대상국 통화가치 간 음(-)의 상관관계로 분산 경감효과를 볼 수 있다.", "경제성장이 기대되고 통화가치 상승이 예상되는 국가의 투자비중을 늘린다.", "해외투자에서는 방어적 투자전략이 공격적 투자전략보다 더 큰 비중을 차지한다."], "answer": 3, "explanation": "해외투자에서는 공격적(적극적) 투자전략이 더 큰 비중을 차지한다. 그래서 '방어적 전략이 더 크다'는 설명이 틀렸다. 해외펀드 환매대금 지급에 7~10일이 걸리는 점, 수출관련주의 음(-) 상관관계로 위험이 줄어드는 점, 성장과 통화강세가 예상되는 나라의 비중을 늘리는 점은 옳다.", "tip": "해외투자 = 공격적 전략 비중이 더 크다", "terms": [{"term": "공격적(적극적) 전략", "meaning": "전망을 반영해 벤치마크보다 높은 초과수익을 노리는 투자전략"}, {"term": "환매", "meaning": "펀드 투자자가 투자한 돈을 돌려달라고 하는 것"}, {"term": "상관관계", "meaning": "두 자산의 가격이 같은 방향으로 움직이는 정도. 낮을수록 서로 따로 움직여서 함께 담으면 위험이 줄어든다."}]}], "tip": "Top = 국가 먼저, Bottom = 국가 나중", "terms": [{"term": "Bottom-Up", "meaning": "개별 기업 분석에서 출발해 투자를 결정하는 방식"}, {"term": "Top-Down", "meaning": "경제 전체(거시경제)를 먼저 보고 점점 산업·기업으로 내려가며 투자를 결정하는 방식"}, {"term": "거시경제 변수", "meaning": "경제성장률, 물가, 금리, 환율처럼 나라 경제 전체를 보여 주는 숫자"}]}, {"no": 17, "topic": "투자분석기법", "concept": "증권분석 통계용어", "q": "증권분석을 위한 통계 기초에 대한 설명으로 가장 적절하지 않은 것은?", "choices": ["중앙값은 관찰치를 크기 순서대로 나열했을 때 정가운데 있는 값이다.", "범위는 최댓값에서 최솟값을 뺀 값이다.", "상관계수는 공분산을 각각의 표준편차의 곱으로 나누어 준 값이다.", "공분산은 -1에서 +1 사이의 값만을 가진다."], "answer": 3, "explanation": "공분산은 -∞에서 +∞까지 어떤 값이든 가질 수 있다. -1에서 +1 사이의 값을 가지는 것은 상관계수이다. 그래서 공분산에 대한 설명이 틀렸다. 중앙값, 범위, 상관계수의 정의는 모두 옳다.\n공식: 상관계수 = 공분산 / (표준편차A × 표준편차B)", "similar": [{"q": "다음 중 자료의 중심위치(대표치)를 나타내는 지표가 아닌 것은?", "choices": ["산술평균", "중앙값", "표준편차", "최빈값"], "answer": 2, "explanation": "중심위치를 나타내는 지표는 산술평균, 중앙값, 최빈값이며 기대수익률과 관련된다. 표준편차는 중심위치가 아니라 흩어진 정도(위험)를 보는 산포경향 지표이다. 범위, 분산, 평균편차도 산포경향 지표이다.", "tip": "중심 = 평·중·최, 산포 = 범·분·표·평균편차", "terms": [{"term": "중심위치", "meaning": "자료가 어느 값 근처에 모여 있는지를 나타내는 대표값(산술평균, 중앙값, 최빈값)"}, {"term": "산포경향", "meaning": "자료가 중심에서 얼마나 흩어져 있는지를 나타내는 성질"}, {"term": "표준편차", "meaning": "자료가 평균에서 얼마나 흩어져 있는지를 나타내는 값으로, 투자에서는 위험을 뜻한다"}, {"term": "최빈값", "meaning": "자료 중에서 가장 자주 나타나는 값"}]}, {"q": "어느 주식의 연도별 수익률이 -2%, 5%, 1%, 8%, 3%였다. 이 자료의 중앙값과 범위를 옳게 짝지은 것은?", "choices": ["중앙값 3%, 범위 10%", "중앙값 1%, 범위 10%", "중앙값 3%, 범위 6%", "중앙값 1%, 범위 6%"], "answer": 0, "explanation": "중앙값은 크기순으로 늘어놓은 뒤 정가운데 값을 고른다. 범위는 최댓값에서 최솟값을 뺀다. 1%는 정렬하지 않고 세 번째 값을 고른 실수이고, 6%는 음수 부호를 무시한 실수이다.\n정렬: -2, 1, 3, 5, 8\n중앙값: 정가운데 값 = 3%\n범위: 8 - (-2) = 10%", "tip": "중앙값은 '정렬 먼저', 범위 = 최댓값 - 최솟값", "terms": [{"term": "중앙값", "meaning": "자료를 크기 순서대로 늘어놓았을 때 정가운데 있는 값"}, {"term": "범위", "meaning": "최댓값에서 최솟값을 뺀 값"}]}, {"q": "자료가 중심위치로부터 어느 정도 흩어져 있는지를 나타내는 산포경향 지표로만 묶인 것은?", "choices": ["산술평균, 분산, 최빈값", "범위, 분산, 표준편차", "중앙값, 범위, 표준편차", "최빈값, 중앙값, 평균편차"], "answer": 1, "explanation": "산포경향 지표는 범위, 분산, 표준편차, 평균편차이다. 이 지표들은 수익률이 얼마나 출렁이는지, 즉 위험과 관련된다. 그래서 범위·분산·표준편차가 정답이다. 산술평균, 중앙값, 최빈값은 중심위치 지표이므로 다른 선지는 틀렸다.", "tip": "중심 = 평·중·최, 산포 = 범·분·표·평균편차", "terms": [{"term": "산포경향", "meaning": "자료가 중심에서 얼마나 흩어져 있는지를 나타내는 성질"}, {"term": "분산", "meaning": "자료가 평균에서 떨어진 정도를 제곱해서 평균 낸 값. 제곱근을 씌우면 표준편차가 된다."}, {"term": "표준편차", "meaning": "자료가 평균에서 얼마나 흩어져 있는지를 나타내는 값으로, 투자에서는 위험을 뜻한다"}, {"term": "평균편차", "meaning": "각 값이 평균에서 떨어진 거리(절댓값)를 평균 낸 값"}]}], "tip": "공분산은 범위 무제한, 표준편차 곱으로 나누면(표준화) 상관계수(-1~+1)", "terms": [{"term": "공분산", "meaning": "두 변수가 함께 움직이는 방향과 정도를 나타내는 값으로, 크기에 제한이 없다"}, {"term": "상관계수", "meaning": "두 자산의 움직임이 얼마나 함께 가는지를 -1에서 +1 사이 숫자로 나타낸 값"}, {"term": "중앙값", "meaning": "자료를 크기 순서대로 늘어놓았을 때 정가운데 있는 값"}, {"term": "범위", "meaning": "최댓값에서 최솟값을 뺀 값"}]}, {"no": 18, "topic": "투자분석기법", "concept": "재무비율의 분류(활동성·정태·혼합)", "q": "다음 중 활동성지표에 해당하지 않는 것은?", "choices": ["매출채권회전율", "매출액증가율", "재고자산회전율", "총자산회전율"], "answer": 1, "explanation": "매출액증가율은 활동성지표가 아니라 성장성지표이다. 총자산증가율, 주당이익증가율도 성장성지표이다. 활동성지표는 자산을 얼마나 효율적으로 쓰는지 보는 회전율 지표이다. 매출채권회전율, 재고자산회전율, 총자산회전율(= 매출액 / 평균자산)이 여기에 속한다.", "similar": [{"q": "재무상태표와 손익계산서를 같이 활용하여 산출하는 재무비율(혼합비율)이 아닌 것은?", "choices": ["총자산회전율", "부채비율", "자기자본이익률(ROE)", "재고자산회전율"], "answer": 1, "explanation": "부채비율(타인자본 / 자기자본)은 재무상태표 항목만으로 만든 정태비율이다. 그래서 혼합비율이 아니다. 회전율 지표와 ROE 같은 이익률 지표는 재무상태표와 손익계산서를 함께 쓰는 혼합비율이다. 정태비율에는 유동비율, 당좌비율, 현금비율, 부채비율이 있다.", "tip": "정태 = 재무상태표만(유동·당좌·현금·부채비율), 혼합 = 회전율·이익률", "terms": [{"term": "정태비율", "meaning": "재무상태표 항목만으로 계산하는 비율"}, {"term": "혼합비율", "meaning": "재무상태표와 손익계산서 항목을 함께 써서 계산하는 비율"}, {"term": "부채비율", "meaning": "타인자본(부채)을 자기자본으로 나눈 비율"}, {"term": "재무상태표", "meaning": "어느 시점에 회사의 자산·부채·자본이 얼마인지 보여 주는 표"}]}, {"q": "A기업의 이자 및 법인세 차감 전 이익(EBIT)이 60억 원이고 이자비용이 15억 원일 때 이자보상비율은?", "choices": ["25%", "75%", "400%", "300%"], "answer": 2, "explanation": "이자보상비율은 EBIT를 이자비용으로 나눈다. 25%는 분자와 분모를 뒤집은 값이다. 75%는 (60-15)/60, 300%는 (60-15)/15처럼 이자비용을 분자에서 한 번 더 뺀 실수이다. 이자보상비율은 기업이 재무적 부담을 얼마나 잘 감당하는지 보는 보상비율이다.\n공식: 이자보상비율 = EBIT / 이자비용\n계산: 60 / 15 = 4 → 400%", "tip": "이자보상비율 = EBIT ÷ 이자비용", "terms": [{"term": "EBIT", "meaning": "이자와 법인세를 빼기 전의 이익(영업이익과 비슷)"}, {"term": "이자보상비율", "meaning": "EBIT를 이자비용으로 나눈 비율로, 번 돈으로 이자를 몇 번 갚을 수 있는지 보여 준다"}]}, {"q": "1년 이내의 단기채무 처리능력을 나타내는 유동성지표에 해당하는 것은?", "choices": ["이자보상비율", "부채비율", "총자산회전율", "당좌비율"], "answer": 3, "explanation": "유동성지표는 1년 안의 단기채무를 갚는 능력을 본다. 유동비율(유동자산 / 유동부채)과 당좌비율(산성시험비율)이 있다. 당좌비율은 일시적인 재무위기 때 현금을 마련하는 능력을 본다. 부채비율은 1년 넘는 중장기 채무능력을 보는 안정성지표, 총자산회전율은 활동성지표, 이자보상비율은 보상비율이다.", "tip": "유동성 = 유동비율·당좌비율(산성시험비율)", "terms": [{"term": "유동성지표", "meaning": "1년 안에 갚아야 할 빚을 갚을 능력을 보는 지표(유동비율, 당좌비율)"}, {"term": "당좌비율", "meaning": "(유동자산 - 매출채권 - 재고자산)을 유동부채로 나눈 비율로, 산성시험비율이라고도 한다"}, {"term": "유동자산·유동부채", "meaning": "1년 안에 현금으로 바뀌는 자산과 1년 안에 갚아야 하는 부채"}, {"term": "안정성지표", "meaning": "회사가 오랫동안 빚을 갚으며 버틸 수 있는지 보는 지표(부채비율 등)"}]}], "tip": "'회전율' = 활동성, '증가율' = 성장성", "terms": [{"term": "활동성지표", "meaning": "회사가 가진 자산을 얼마나 효율적으로 쓰는지 보는 지표(각종 회전율)"}, {"term": "회전율", "meaning": "매출액을 자산으로 나눈 값으로, 자산이 1년에 몇 번 매출로 돌았는지를 뜻한다"}, {"term": "성장성지표", "meaning": "회사가 얼마나 커지고 있는지 보는 지표(매출액증가율 등)"}, {"term": "매출채권", "meaning": "물건을 팔고 아직 받지 못한 돈"}]}, {"no": 19, "topic": "투자분석기법", "concept": "ROE·듀퐁분석 계산", "q": "A기업의 순이익은 30억 원, 총자산은 400억 원, 자기자본비율은 25%이다. A기업의 자기자본이익률(ROE)은?", "choices": ["7.5%", "30%", "10%", "12%"], "answer": 1, "explanation": "ROE는 순이익을 자기자본으로 나눈다. 먼저 자기자본을 구해야 한다. 7.5%는 ROA(30/400)이고, 10%는 부채 300억 원으로 나눈 실수이다.\n① 자기자본 = 총자산 × 자기자본비율 = 400 × 25% = 100억 원\n② ROE = 순이익 / 자기자본 = 30 / 100 = 30%\n검산(듀퐁): ROE = ROA × (총자산/자기자본) = 7.5% × 4 = 30%", "similar": [{"q": "ROA가 10%이고 총부채가 500억 원, 총자산이 1,000억 원일 때 ROE는?", "choices": ["5%", "20%", "10%", "15%"], "answer": 1, "explanation": "ROE는 ROA에 레버리지(총자산 / 자기자본)를 곱해서 구한다. 5%는 배수를 곱하지 않고 나눈 실수이다.\n① 자기자본 = 1,000 - 500 = 500억 원\n② ROE = ROA × (총자산/자기자본) = 10% × (1,000/500) = 20%", "tip": "ROE = ROA × 레버리지(총자산/자기자본)", "terms": [{"term": "ROE", "meaning": "순이익을 자기자본으로 나눈 값으로, 주주의 돈으로 얼마나 벌었는지 보여 준다"}, {"term": "ROA", "meaning": "순이익을 총자산으로 나눈 값으로, 회사 전체 자산으로 얼마나 벌었는지 보여 준다"}, {"term": "자기자본", "meaning": "회사 주인(주주)의 몫인 돈. 총자산에서 부채를 뺀 값"}]}, {"q": "ROE가 ROA의 5배이고 총자산이 500억 원일 때 총부채는?", "choices": ["400억 원", "125억 원", "250억 원", "100억 원"], "answer": 0, "explanation": "ROE = ROA × (총자산 / 자기자본)이므로, ROE가 ROA의 5배이면 총자산 / 자기자본 = 5이다. 100억 원은 자기자본을 답한 실수이다.\n① 총자산 / 자기자본 = 5\n② 자기자본 = 500 / 5 = 100억 원\n③ 총부채 = 500 - 100 = 400억 원", "tip": "ROE = ROA × (총자산/자기자본)", "terms": [{"term": "ROE", "meaning": "순이익을 자기자본으로 나눈 값으로, 주주의 돈으로 얼마나 벌었는지 보여 준다"}, {"term": "ROA", "meaning": "순이익을 총자산으로 나눈 값으로, 회사 전체 자산으로 얼마나 벌었는지 보여 준다"}, {"term": "자기자본", "meaning": "회사 주인(주주)의 몫인 돈. 총자산에서 부채를 뺀 값"}]}, {"q": "한 기업의 ROA가 3%이고 총자산회전율은 0.6회이다. 총자산회전율을 유지하면서 ROA를 9%로 높이려면 매출액순이익률은 몇 %가 되어야 하는가?", "choices": ["5%", "5.4%", "9%", "15%"], "answer": 3, "explanation": "ROA는 매출액순이익률에 총자산회전율을 곱한 값이다. 5%는 현재(3% / 0.6)의 매출액순이익률이고, 5.4%는 9% × 0.6으로 곱한 실수이다.\n공식: ROA = 매출액순이익률 × 총자산회전율\n계산: 9% = 매출액순이익률 × 0.6\n→ 매출액순이익률 = 9% / 0.6 = 15%", "tip": "ROA = 마진 × 회전율", "terms": [{"term": "ROA", "meaning": "순이익을 총자산으로 나눈 값으로, 회사 전체 자산으로 얼마나 벌었는지 보여 준다"}, {"term": "매출액순이익률", "meaning": "순이익을 매출액으로 나눈 값(마진)"}, {"term": "총자산회전율", "meaning": "매출액을 총자산으로 나눈 값"}]}], "tip": "ROE = ROA × (총자산/자기자본)", "terms": [{"term": "ROE", "meaning": "순이익을 자기자본으로 나눈 값으로, 주주의 돈으로 얼마나 벌었는지 보여 준다"}, {"term": "ROA", "meaning": "순이익을 총자산으로 나눈 값으로, 회사 전체 자산으로 얼마나 벌었는지 보여 준다"}, {"term": "자기자본비율", "meaning": "총자산 중에서 자기자본이 차지하는 비율"}, {"term": "듀퐁분석", "meaning": "ROE를 매출액순이익률, 총자산회전율, 총자산/자기자본 등 여러 비율의 곱으로 나눠 분석하는 방법"}]}, {"no": 20, "topic": "투자분석기법", "concept": "레버리지도(DOL·DFL·DCL)", "q": "어떤 기업의 판매량이 300개에서 450개로 증가할 때 영업이익은 20억 원에서 50억 원으로 증가하였다. 판매량이 300개일 때의 영업레버리지도(DOL)는?", "choices": ["3", "2.5", "1.5", "0.33"], "answer": 0, "explanation": "DOL은 영업이익 변화율을 판매량(매출액) 변화율로 나눈다. 0.33은 역수, 2.5는 50/20, 1.5는 450/300을 계산한 실수이다.\n① 영업이익 변화율 = (50 - 20) / 20 = 150%\n② 판매량 변화율 = (450 - 300) / 300 = 50%\n③ DOL = 150% / 50% = 3", "similar": [{"q": "재무레버리지도(DFL)가 4이고 영업이익이 6,000원일 때 이자비용은?", "choices": ["1,500원", "4,500원", "2,000원", "24,000원"], "answer": 1, "explanation": "DFL은 영업이익을 (영업이익 - 이자비용)으로 나눈다. 1,500원은 세전이익(영업이익 - 이자비용)을 답한 실수이다.\n공식: DFL = 영업이익 / (영업이익 - 이자비용)\n① 4 = 6,000 / (6,000 - 이자비용)\n② 6,000 - 이자비용 = 1,500\n③ 이자비용 = 4,500원", "tip": "DFL '매변고/매변고이'", "terms": [{"term": "DFL", "meaning": "영업이익이 변할 때 주당순이익(EPS)이 몇 배로 변하는지 나타내는 값(재무레버리지도)"}, {"term": "영업이익", "meaning": "매출액에서 영업에 쓴 비용(변동비·고정비)을 뺀 이익"}]}, {"q": "매출액 200억 원, 변동비 80억 원, 고정비 60억 원, 이자비용 20억 원인 기업의 결합레버리지도(DCL)는?", "choices": ["1.5", "2", "3", "6"], "answer": 2, "explanation": "DCL은 (매출액 - 변동비)를 (매출액 - 변동비 - 고정비 - 이자비용)으로 나눈다. 2는 DOL만, 1.5는 DFL만 계산한 값이다.\n① 매출액 - 변동비 = 200 - 80 = 120\n② 120 - 60 - 20 = 40\n③ DCL = 120 / 40 = 3\n검산: DOL = 120/60 = 2, DFL = 60/40 = 1.5, DCL = 2 × 1.5 = 3", "tip": "DCL = DOL × DFL", "terms": [{"term": "DCL", "meaning": "매출액이 변할 때 주당순이익이 몇 배로 변하는지 나타내는 값으로, DOL × DFL"}, {"term": "DOL", "meaning": "판매량(매출액)이 변할 때 영업이익이 몇 배로 변하는지 나타내는 값(영업레버리지도)"}, {"term": "DFL", "meaning": "영업이익이 변할 때 주당순이익(EPS)이 몇 배로 변하는지 나타내는 값(재무레버리지도)"}, {"term": "변동비·고정비", "meaning": "변동비는 판매량에 따라 늘고 주는 비용, 고정비는 판매량과 관계없이 일정하게 드는 비용"}]}, {"q": "레버리지분석에 대한 설명으로 옳지 않은 것은?", "choices": ["영업고정비를 부담하지 않는 기업의 영업레버리지도(DOL)는 1이다.", "재무레버리지도(DFL)는 영업이익 변화율에 대한 주당순이익 변화율의 비율이다.", "결합레버리지도(DCL)는 영업레버리지도와 재무레버리지도의 합으로 산출된다.", "자본집약적 산업일수록 영업레버리지도가 높다."], "answer": 2, "explanation": "결합레버리지도(DCL)는 DOL과 DFL의 '합'이 아니라 '곱'으로 구한다. 그래서 이 설명이 틀렸다. 영업고정비와 이자비용이 있으면 DCL은 항상 1보다 크다. 고정비가 0이면 DOL = 1이라는 점, DFL의 정의, 자본집약적 산업일수록 DOL이 높다는 점은 옳다.", "tip": "DCL = DOL × DFL, 고정비·이자 클수록 커진다", "terms": [{"term": "DCL", "meaning": "매출액이 변할 때 주당순이익이 몇 배로 변하는지 나타내는 값으로, DOL × DFL"}, {"term": "DFL", "meaning": "영업이익이 변할 때 주당순이익(EPS)이 몇 배로 변하는지 나타내는 값(재무레버리지도)"}, {"term": "주당순이익(EPS)", "meaning": "순이익을 주식 수로 나눈 값으로, 한 주가 번 이익"}, {"term": "자본집약적 산업", "meaning": "공장·설비처럼 큰돈이 드는 자산이 많이 필요한 산업"}]}], "tip": "DOL '매변/매변고', 변화율끼리 나눈다", "terms": [{"term": "DOL", "meaning": "판매량(매출액)이 변할 때 영업이익이 몇 배로 변하는지 나타내는 값(영업레버리지도)"}, {"term": "영업이익", "meaning": "매출액에서 영업에 쓴 비용(변동비·고정비)을 뺀 이익"}]}, {"no": 21, "topic": "투자분석기법", "concept": "항상성장모형(고든) 적정주가", "q": "요구수익률 13%, 배당성장률 9%, 배당성향 40%, 내년도 주당순이익(EPS₁)이 3,000원인 기업의 항상성장모형에 의한 적정주가는?", "choices": ["9,231원", "30,000원", "32,700원", "75,000원"], "answer": 1, "explanation": "항상성장모형에서는 내년 배당(D₁)을 (요구수익률 - 성장률)로 나눈다. 32,700원은 이미 내년 값인 D₁에 성장률을 한 번 더 곱한 실수다. 75,000원은 EPS를 배당으로 쓴 실수, 9,231원은 g를 빼지 않은 값이다.\n① D₁ = EPS₁ × 배당성향 = 3,000 × 40% = 1,200원\n② P₀ = D₁ / (r - g) = 1,200 / (0.13 - 0.09) = 30,000원", "similar": [{"q": "배당성향 25%, 배당성장률 6%, 당기 주당순이익 8,000원, 현재 주가 20,000원인 주식의 요구수익률은? (항상성장모형 가정)", "choices": ["10.6%", "16%", "16.6%", "12%"], "answer": 2, "explanation": "요구수익률은 배당수익률(D₁ / P₀)에 배당성장률을 더해서 구한다. 16%는 D₀를 그대로 쓴 실수, 10.6%는 g를 더하지 않은 실수이다.\n① D₀ = 8,000 × 25% = 2,000원\n② D₁ = 2,000 × 1.06 = 2,120원\n③ r = D₁/P₀ + g = 2,120/20,000 + 6% = 10.6% + 6% = 16.6%", "tip": "r = 배당수익률 + 배당성장률", "terms": [{"term": "요구수익률", "meaning": "투자자가 이 정도는 벌어야 투자하겠다고 생각하는 최소한의 수익률(r)"}, {"term": "배당수익률", "meaning": "주당배당금을 주가로 나눈 값(D₁/P₀)"}, {"term": "배당성향", "meaning": "순이익 중에서 배당으로 나눠 주는 비율"}, {"term": "항상성장모형", "meaning": "배당이 매년 일정한 비율(g)로 늘어난다고 보고 주가를 계산하는 모형(고든모형). P₀ = D₁/(r - g)"}]}, {"q": "B사는 매년 순이익의 50%를 사내에 유보하고 자기자본이익률(ROE) 16%를 계속 유지한다. 주가는 20,000원, 예상 주당배당금(D₁)은 1,000원일 때 요구수익률은?", "choices": ["13%", "8%", "21%", "10.5%"], "answer": 0, "explanation": "먼저 성장률 g를 유보율 × ROE로 구하고, 배당수익률에 더한다. 21%는 g 대신 ROE(16%)를 더한 실수, 8%는 성장률만 답한 실수이다.\n① g = 유보율 × ROE = 0.5 × 16% = 8%\n② r = D₁/P₀ + g = 1,000/20,000 + 8% = 5% + 8% = 13%", "tip": "g = b × ROE", "terms": [{"term": "유보율", "meaning": "순이익 중에서 배당하지 않고 회사에 남겨 두는 비율(b = 1 - 배당성향)"}, {"term": "ROE", "meaning": "순이익을 자기자본으로 나눈 값으로, 주주의 돈으로 얼마나 벌었는지 보여 준다"}, {"term": "요구수익률", "meaning": "투자자가 이 정도는 벌어야 투자하겠다고 생각하는 최소한의 수익률(r)"}, {"term": "배당수익률", "meaning": "주당배당금을 주가로 나눈 값(D₁/P₀)"}]}, {"q": "현재 배당금(D₀)이 1,500원, 배당성장률 4%, 요구수익률 9%인 주식의 항상성장모형에 의한 적정주가는?", "choices": ["30,000원", "31,200원", "16,667원", "17,333원"], "answer": 1, "explanation": "현재 배당(D₀)이 주어졌으므로 먼저 내년 배당(D₁)으로 바꿔야 한다. 30,000원은 D₀를 그대로 쓴 실수이다. 16,667원과 17,333원은 r에서 g를 빼지 않은 실수이다.\n① D₁ = 1,500 × 1.04 = 1,560원\n② P₀ = 1,560 / (0.09 - 0.04) = 31,200원", "tip": "P₀ = D₀(1+g) / (r - g)", "terms": [{"term": "항상성장모형", "meaning": "배당이 매년 일정한 비율(g)로 늘어난다고 보고 주가를 계산하는 모형(고든모형). P₀ = D₁/(r - g)"}, {"term": "배당성장률", "meaning": "배당금이 매년 늘어나는 비율(g)"}, {"term": "요구수익률", "meaning": "투자자가 이 정도는 벌어야 투자하겠다고 생각하는 최소한의 수익률(r)"}]}], "tip": "고든모형은 r > g 필수, 분자는 '내년' 배당", "terms": [{"term": "항상성장모형", "meaning": "배당이 매년 일정한 비율(g)로 늘어난다고 보고 주가를 계산하는 모형(고든모형). P₀ = D₁/(r - g)"}, {"term": "요구수익률", "meaning": "투자자가 이 정도는 벌어야 투자하겠다고 생각하는 최소한의 수익률(r)"}, {"term": "배당성향", "meaning": "순이익 중에서 배당으로 나눠 주는 비율"}, {"term": "배당성장률", "meaning": "배당금이 매년 늘어나는 비율(g)"}]}, {"no": 22, "topic": "투자분석기법", "concept": "PER·PBR 등 시장가치지표", "q": "투자자의 요구수익률이 14%, 자기자본이익률(ROE)이 15%, 배당성향이 40%인 기업의 PER은? (항상성장모형 가정, PER = 배당성향/(r - g))", "choices": ["2.86배", "20배", "12배", "8배"], "answer": 3, "explanation": "먼저 유보율로 성장률 g를 구하고, PER 공식에 넣는다. 12배는 분자에 유보율(0.6)을 넣은 실수, 20배는 분자를 1로 둔 실수, 2.86배는 g를 빼지 않은 실수이다.\n① 유보율 b = 1 - 0.4 = 0.6\n② g = b × ROE = 0.6 × 15% = 9%\n③ PER = (1 - b) / (r - g) = 0.4 / (0.14 - 0.09) = 8배", "similar": [{"q": "어느 기업의 PER이 12배, PBR이 1.2배일 때 이 기업의 ROE는? (PBR = PER × ROE 이용)", "choices": ["1%", "14.4%", "12%", "10%"], "answer": 3, "explanation": "PBR = PER × ROE이므로 ROE = PBR / PER이다. 14.4%는 둘을 곱한 실수, 1%는 소수점 처리를 잘못한 실수이다.\n계산: ROE = 1.2 / 12 = 0.1 = 10%", "tip": "PBR = (주가/EPS) × (EPS/BPS) = PER × ROE", "terms": [{"term": "PBR", "meaning": "주가를 주당순자산(BPS)으로 나눈 값"}, {"term": "PER", "meaning": "주가를 주당순이익(EPS)으로 나눈 값으로, 주가가 이익의 몇 배인지 보여 준다"}, {"term": "ROE", "meaning": "순이익을 자기자본으로 나눈 값으로, 주주의 돈으로 얼마나 벌었는지 보여 준다"}, {"term": "BPS", "meaning": "순자산을 주식 수로 나눈 값으로, 한 주에 해당하는 순자산"}]}, {"q": "배당평가모형과 PER에 대한 설명으로 옳은 것은?", "choices": ["고든의 PER모형에서 ROE가 요구수익률보다 클 경우 PER과 배당성향은 부(-)의 관계를 보인다.", "무성장모형은 r > g 조건이 반드시 필요하다.", "고든의 항상성장모형은 배당성장률이 요구수익률보다 크다고 가정한다.", "항상성장모형은 성장 후 성숙단계로 가는 기업에 단계별로 적용한다."], "answer": 0, "explanation": "ROE가 요구수익률(r)보다 크면 이익을 회사에 남겨 다시 투자하는 것이 가치를 높인다. 그래서 배당성향이 높을수록 PER이 낮아지는 부(-)의 관계가 된다. 나머지는 틀렸다. 고든모형은 r > g를 가정하고, 무성장모형은 r > g 조건이 필요 없다. 단계별로 적용하는 것은 항상성장모형이 아니라 초기고속성장(다단계)모형이다.", "tip": "ROE > r → 배당성향↑ PER↓ (부의 관계)", "terms": [{"term": "배당성향", "meaning": "순이익 중에서 배당으로 나눠 주는 비율"}, {"term": "PER", "meaning": "주가를 주당순이익(EPS)으로 나눈 값으로, 주가가 이익의 몇 배인지 보여 준다"}, {"term": "무성장모형", "meaning": "배당이 늘지 않고 매년 똑같다고 보고 주가를 계산하는 모형"}, {"term": "항상성장모형", "meaning": "배당이 매년 일정한 비율(g)로 늘어난다고 보고 주가를 계산하는 모형(고든모형). P₀ = D₁/(r - g)"}]}, {"q": "시장가치지표에 대한 설명으로 가장 적절하지 않은 것은?", "choices": ["PER은 적자기업인 경우 적용하기가 곤란하다.", "PSR은 신생기업·벤처기업 평가에 주로 사용된다.", "PSR은 PER, PBR과 달리 곤경에 처한 기업에도 사용할 수 있다.", "PEGR이 높을수록 주가상승 가능성이 높다."], "answer": 3, "explanation": "PEGR(PER / 연평균 EPS성장률)은 낮을수록 주가가 오를 가능성이 높다. 그래서 '높을수록'이라는 설명이 틀렸다. PER은 적자기업에 쓰기 어렵다. PSR은 신생·벤처기업 평가에 쓰이고, 매출액 기준이라 곤경에 처한 기업에도 쓸 수 있으며, PER만큼 변동이 심하지 않다.", "tip": "PEGR은 낮을수록 좋다(저평가)", "terms": [{"term": "PEGR", "meaning": "PER을 연평균 EPS성장률로 나눈 값"}, {"term": "PSR", "meaning": "주가를 주당매출액으로 나눈 값"}, {"term": "PER", "meaning": "주가를 주당순이익(EPS)으로 나눈 값으로, 주가가 이익의 몇 배인지 보여 준다"}]}], "tip": "PER = 배당성향/(r-g)", "terms": [{"term": "PER", "meaning": "주가를 주당순이익(EPS)으로 나눈 값으로, 주가가 이익의 몇 배인지 보여 준다"}, {"term": "유보율", "meaning": "순이익 중에서 배당하지 않고 회사에 남겨 두는 비율(b = 1 - 배당성향)"}, {"term": "배당성향", "meaning": "순이익 중에서 배당으로 나눠 주는 비율"}, {"term": "요구수익률", "meaning": "투자자가 이 정도는 벌어야 투자하겠다고 생각하는 최소한의 수익률(r)"}]}, {"no": 23, "topic": "투자분석기법", "concept": "EV/EBITDA 주당가치", "q": "상장기업 A의 EBITDA는 2천만 원이고 채권자가치는 1억 원이다. A와 유사한 기업의 EV/EBITDA 비율은 12이며, A의 총발행주식수는 100,000주이다. A의 주당가치는?", "choices": ["1,400원", "1,200원", "2,400원", "3,400원"], "answer": 0, "explanation": "EV에서 채권자가치를 빼면 주주가치(시가총액)가 되고, 이를 주식수로 나누면 주당가치가 된다. 2,400원은 EV를 그대로 주식수로 나눈 실수, 3,400원은 채권자가치를 더한 실수이다.\n① EV = EV/EBITDA × EBITDA = 12 × 2천만 = 2억 4천만 원\n② 시가총액 = 2.4억 - 1억 = 1억 4천만 원\n③ 주당가치 = 1.4억 / 10만 주 = 1,400원", "similar": [{"q": "B기업의 EBITDA는 5천만 원, 순차입금은 2억 원이다. 유사기업의 EV/EBITDA 비율이 10이고 B의 발행주식수가 50,000주일 때 B의 주당가치는?", "choices": ["4,000원", "14,000원", "10,000원", "6,000원"], "answer": 3, "explanation": "EV에서 순차입금을 빼서 시가총액을 구한 뒤 주식수로 나눈다. 10,000원은 순차입금을 빼지 않은 실수, 14,000원은 순차입금을 더한 실수이다.\n① EV = 10 × 5천만 = 5억 원\n② 시가총액 = 5억 - 2억 = 3억 원\n③ 주당가치 = 3억 / 5만 주 = 6,000원", "tip": "주주가치 = EV - 채권자가치(순차입금)", "terms": [{"term": "EV", "meaning": "기업 전체의 가치로, 주주가치(시가총액)와 채권자가치(순차입금)를 합한 것"}, {"term": "EBITDA", "meaning": "영업이익에 감가상각비 등을 더한 값으로, 영업으로 벌어들인 현금에 가깝다"}, {"term": "순차입금", "meaning": "회사가 빌린 돈에서 가지고 있는 현금을 뺀 금액(채권자가치)"}]}, {"q": "<보기>가 설명하는 기업가치 평가지표는?\nㄱ. 추정방식이 단순하고 회사 간 비교가능성이 높아 공시정보로 유용하다.\nㄴ. 분석시점에 따라 시가총액이 달라지므로 시가변동 차이를 고려해야 한다.\nㄷ. 당기순이익을 기준으로 평가하는 PER의 한계점을 보완한다.\nㄹ. 기업의 자본구조를 감안한 평가방식이라는 점에서 유용성이 있다.", "choices": ["PBR", "토빈의 Q", "EV/EBITDA", "PSR"], "answer": 2, "explanation": "EV/EBITDA는 EV(주주가치 + 채권자가치)를 써서 기업의 자본구조를 감안한다. 또 당기순이익을 기준으로 하는 PER의 한계를 보완한다. EBITDA는 영업이익에 감가상각비를 더한 것으로, 설비투자가 많은 기업의 현금흐름을 잘 보여 준다. 토빈의 Q는 PBR을 보완하는 지표이다.", "tip": "EV/EBITDA = 자본구조 감안·PER 한계 보완", "terms": [{"term": "EV", "meaning": "기업 전체의 가치로, 주주가치(시가총액)와 채권자가치(순차입금)를 합한 것"}, {"term": "EBITDA", "meaning": "영업이익에 감가상각비 등을 더한 값으로, 영업으로 벌어들인 현금에 가깝다"}, {"term": "감가상각비", "meaning": "건물·기계 같은 자산의 가치가 줄어드는 만큼을 매년 비용으로 나누어 잡은 것. 실제 현금은 나가지 않는다."}, {"term": "토빈의 Q", "meaning": "자본의 시장가치를 자산의 대체원가로 나눈 값"}]}, {"q": "토빈의 Q 비율에 대한 설명으로 틀린 것은?", "choices": ["자본의 시장가치를 자산의 대체원가로 나누어 구한다.", "Q가 1보다 크면 투자수익성이 양호하고 경영이 효율적임을 의미한다.", "대체원가가 장부가에 기반하므로 PBR의 시간성 차이를 극복하지 못한다.", "Q가 1보다 작으면 적대적 M&A의 대상이 되는 경향이 있다."], "answer": 2, "explanation": "토빈의 Q의 분모인 대체원가는 장부가가 아니라 자산들의 현가(시가)에 기반한다. 그래서 PBR의 단점인 시간성 차이를 극복한다. 따라서 '극복하지 못한다'는 설명이 틀렸다. 다만 대체원가를 추정하기 어렵다는 단점이 있다. Q가 1보다 크면 효율적 경영, 1보다 작으면 적대적 M&A의 대상이 되기 쉽다.", "tip": "Q > 1 효율경영, Q < 1 M&A 타깃", "terms": [{"term": "토빈의 Q", "meaning": "자본의 시장가치를 자산의 대체원가로 나눈 값"}, {"term": "대체원가", "meaning": "지금 같은 자산을 새로 마련하려면 드는 비용"}, {"term": "PBR", "meaning": "주가를 주당순자산(BPS)으로 나눈 값"}, {"term": "적대적 M&A", "meaning": "경영진이 원하지 않는데 강제로 회사를 인수하는 것"}]}], "tip": "주주가치 = EV - 채권자가치", "terms": [{"term": "EV", "meaning": "기업 전체의 가치로, 주주가치(시가총액)와 채권자가치(순차입금)를 합한 것"}, {"term": "EBITDA", "meaning": "영업이익에 감가상각비 등을 더한 값으로, 영업으로 벌어들인 현금에 가깝다"}, {"term": "채권자가치", "meaning": "회사에 돈을 빌려준 채권자들의 몫(순차입금)"}, {"term": "시가총액", "meaning": "주가 × 발행주식 수. 회사 주식 전체의 시장가치"}]}, {"no": 24, "topic": "투자분석기법", "concept": "EVA(경제적부가가치) 계산", "q": "다음 자료에 따를 때 해당 기업의 EVA는? (단위: 억 원)\n· 영업이익: 500억 원, 법인세율: 20%\n· 투하자본: 2,000억 원 (타인자본비중 50%, 자기자본비중 50%)\n· 타인자본비용(세전): 10%, 자기자본비용: 14%", "choices": ["180억 원", "160억 원", "260억 원", "280억 원"], "answer": 0, "explanation": "EVA는 세후순영업이익에서 자본비용(투하자본 × WACC)을 뺀다. 160은 타인자본비용을 세후로 바꾸지 않은 실수(WACC 12%)이고, 280·260은 영업이익을 세후로 바꾸지 않은 실수이다.\n① NOPLAT = 500 × (1 - 0.2) = 400\n② WACC = 0.5 × 10% × (1 - 0.2) + 0.5 × 14% = 4% + 7% = 11%\n③ EVA = 400 - 2,000 × 11% = 180억 원", "similar": [{"q": "세후순영업이익 36억 원, 투하자본 200억 원(자기자본 80억 원, 타인자본 120억 원), 자기자본비용 15%, 세후 타인자본비용 10%일 때 EVA모형으로 평가한 기업가치는?", "choices": ["300억 원", "212억 원", "100억 원", "336억 원"], "answer": 0, "explanation": "EVA모형의 기업가치는 투하자본에 MVA(EVA / WACC)를 더해서 구한다. 100억 원은 MVA만 답한 실수이다.\n① WACC = 0.4 × 15% + 0.6 × 10% = 12%\n② EVA = 36 - 200 × 12% = 12억 원\n③ MVA = EVA / WACC = 12 / 0.12 = 100억 원\n④ 기업가치 = 투하자본 + MVA = 200 + 100 = 300억 원", "tip": "기업가치 = IC + EVA/WACC", "terms": [{"term": "MVA", "meaning": "EVA를 WACC로 나눈 값으로, 미래 EVA를 현재가치로 바꾼 시장부가가치"}, {"term": "WACC", "meaning": "타인자본비용(세후)과 자기자본비용을 비중대로 가중평균한 자본비용"}, {"term": "EVA", "meaning": "세후순영업이익에서 자본비용(투하자본 × WACC)을 뺀 값으로, 자본비용을 넘어서 진짜로 더 번 이익"}, {"term": "투하자본", "meaning": "회사가 영업을 위해 실제로 투입한 자본"}]}, {"q": "EVA와 당기순이익의 관계에 대한 설명으로 옳은 것은?", "choices": ["손익계산서상의 당기순이익은 자기자본비용까지 반영한다.", "주주자본비용의 기회비용적 성격을 명확하게 설정하는 것은 EVA이다.", "EVA는 타인자본비용만 반영하고 자기자본비용은 반영하지 않는다.", "EVA를 성과측정 도구로 쓰면 타인자본비용만이 기업투자의 목표로 설정된다."], "answer": 1, "explanation": "EVA는 자기자본비용, 즉 주주의 기회비용까지 반영한다. 그래서 주주자본비용의 기회비용 성격을 분명히 하는 것은 EVA이다. 손익계산서의 당기순이익은 자기자본비용을 반영하지 못한다. EVA를 성과측정에 쓰면 타인자본비용과 자기자본비용을 합한 자본비용이 투자의 목표가 된다.", "tip": "EVA = 자기자본비용(주주 기회비용)까지 반영", "terms": [{"term": "EVA", "meaning": "세후순영업이익에서 자본비용(투하자본 × WACC)을 뺀 값으로, 자본비용을 넘어서 진짜로 더 번 이익"}, {"term": "자기자본비용", "meaning": "주주가 투자 대가로 기대하는 수익률로, 회사 입장에서는 비용이다"}, {"term": "기회비용", "meaning": "어떤 것을 선택해서 포기하게 된 다른 선택의 가치"}]}, {"q": "자기자본비용이 15%, 세후 타인자본비용이 7%인 기업이 있다. 다른 조건이 동일할 때 EVA를 가장 크게 만드는 자본구성(타인자본비중 : 자기자본비중)은?", "choices": ["20% : 80%", "40% : 60%", "70% : 30%", "50% : 50%"], "answer": 2, "explanation": "EVA = NOPLAT - IC × WACC이므로, EVA를 키우려면 WACC를 낮춰야 한다. 세후 타인자본비용(7%)이 자기자본비용(15%)보다 낮다. 그래서 타인자본비중이 가장 큰 70:30에서 WACC가 가장 낮다. 타인자본 비중이 높을수록 법인세 절감 효과도 커진다.\n계산: WACC = 0.7 × 7% + 0.3 × 15% = 4.9% + 4.5% = 9.4%", "tip": "EVA↑ = WACC↓ = 싼 타인자본 비중↑", "terms": [{"term": "EVA", "meaning": "세후순영업이익에서 자본비용(투하자본 × WACC)을 뺀 값으로, 자본비용을 넘어서 진짜로 더 번 이익"}, {"term": "WACC", "meaning": "타인자본비용(세후)과 자기자본비용을 비중대로 가중평균한 자본비용"}, {"term": "타인자본비용", "meaning": "빌린 돈에 대한 이자율. 이자는 세금을 줄여 주므로 세후로 바꿔 계산한다"}, {"term": "자기자본비용", "meaning": "주주가 투자 대가로 기대하는 수익률로, 회사 입장에서는 비용이다"}]}], "tip": "영업이익과 타인자본비용 둘 다 '세후'로", "terms": [{"term": "EVA", "meaning": "세후순영업이익에서 자본비용(투하자본 × WACC)을 뺀 값으로, 자본비용을 넘어서 진짜로 더 번 이익"}, {"term": "NOPLAT", "meaning": "영업이익에서 법인세를 뺀 이익(세후순영업이익)"}, {"term": "WACC", "meaning": "타인자본비용(세후)과 자기자본비용을 비중대로 가중평균한 자본비용"}, {"term": "투하자본", "meaning": "회사가 영업을 위해 실제로 투입한 자본"}]}, {"no": 25, "topic": "투자분석기법", "concept": "현금흐름표(간접법)와 현금흐름 추정", "q": "간접법으로 영업활동 현금흐름을 작성할 때 당기순이익에 플러스(+)로 반영되는 항목이 아닌 것은?", "choices": ["감가상각비", "매출채권의 감소", "매입채무의 증가", "유가증권처분이익"], "answer": 3, "explanation": "유가증권처분이익은 투자활동에서 생긴 이익이다. 그래서 간접법에서는 당기순이익에서 빼야(-) 한다. 감가상각비(현금이 나가지 않은 비용), 매출채권 감소, 매입채무 증가, 유가증권처분손실은 더한다(+).", "similar": [{"q": "현금흐름 추정의 기본원칙으로 잘못된 것은?", "choices": ["현금흐름은 증분기준으로 추정되어야 한다.", "현금흐름은 세후기준으로 추정되어야 한다.", "매몰원가는 고려하되 기회비용은 고려하지 않는다.", "현금흐름 추정에는 모든 간접적 효과도 고려되어야 한다."], "answer": 2, "explanation": "기회비용은 고려해야 하지만 매몰원가(매몰비용)는 고려하지 않는다. 그래서 반대로 말한 설명이 틀렸다. 현금흐름 추정의 기본원칙은 증분기준, 세후기준, 간접효과 고려, 유입·유출 시점의 정확한 추정이다.", "tip": "'기회는 잡고 매몰은 버린다'", "terms": [{"term": "기회비용", "meaning": "어떤 것을 선택해서 포기하게 된 다른 선택의 가치"}, {"term": "매몰원가", "meaning": "이미 써 버려서 어떤 선택을 해도 되돌릴 수 없는 비용"}, {"term": "증분기준", "meaning": "그 투자를 할 때와 안 할 때 달라지는 현금흐름만 따지는 기준"}]}, {"q": "현금흐름표에 대한 설명으로 옳지 않은 것은?", "choices": ["원재료 구매, 제품 생산 및 판매활동에서 발생한 현금흐름은 영업활동 현금흐름이다.", "장기대여금을 회수하면 투자활동으로 인한 현금흐름이 증가한다.", "단기차입금을 상환하면 재무활동으로 인한 현금흐름이 감소한다.", "자기주식을 취득하면 재무활동으로 인한 현금흐름이 증가한다."], "answer": 3, "explanation": "자기주식을 사면(취득) 현금이 나가므로 재무활동 현금흐름이 줄어든다(-). 자기주식을 팔면(처분) 늘어난다(+). 그래서 '취득하면 증가한다'는 설명이 틀렸다. 구매·생산·판매는 영업활동, 장기대여금 회수는 투자활동(+), 차입금 상환은 재무활동(-)이다.", "tip": "자기주식 취득 = 재무활동 (-), 처분 = (+)", "terms": [{"term": "자기주식", "meaning": "회사가 자기 회사 주식을 사서 가지고 있는 것"}, {"term": "재무활동 현금흐름", "meaning": "돈을 빌리고 갚거나 주식을 발행·매입하는 활동으로 생긴 현금"}, {"term": "투자활동 현금흐름", "meaning": "자산을 사고팔거나 돈을 빌려주고 받는 활동으로 생긴 현금"}, {"term": "영업활동 현금흐름", "meaning": "물건을 만들고 파는 회사의 주된 활동으로 들어오고 나간 현금"}]}, {"q": "간접법에 의한 영업활동 현금흐름 계산 시 당기순이익에서 차감(-)해야 하는 항목은?", "choices": ["대손상각비", "재고자산의 증가", "매입채무의 증가", "재고자산평가손실"], "answer": 1, "explanation": "재고자산이 늘었다는 것은 현금이 재고로 묶였다는 뜻이다. 그래서 당기순이익에서 뺀다(-). 매출채권 증가, 매입채무 감소도 뺀다. 대손상각비와 재고자산평가손실은 현금이 나가지 않은 비용이라 더한다(+). 매입채무 증가는 아직 돈을 내지 않은 것이라 더한다(+).", "tip": "영업자산 증가·영업부채 감소 = (-)", "terms": [{"term": "간접법", "meaning": "당기순이익에서 출발해 현금이 오가지 않은 항목을 더하고 빼서 영업활동 현금흐름을 구하는 방법"}, {"term": "재고자산", "meaning": "팔려고 가지고 있는 물건(상품·제품·원재료 등)"}, {"term": "대손상각비", "meaning": "받지 못할 것으로 예상되는 매출채권을 비용으로 잡은 것. 현금은 나가지 않는다."}, {"term": "재고자산평가손실", "meaning": "재고자산 가치가 떨어진 만큼 비용으로 잡은 것. 현금은 나가지 않는다."}]}], "tip": "처분'손실'은 더하고 처분'이익'은 뺀다(역산)", "terms": [{"term": "간접법", "meaning": "당기순이익에서 출발해 현금이 오가지 않은 항목을 더하고 빼서 영업활동 현금흐름을 구하는 방법"}, {"term": "감가상각비", "meaning": "건물·기계 같은 자산의 가치가 줄어드는 만큼을 매년 비용으로 나누어 잡은 것. 실제 현금은 나가지 않는다."}, {"term": "매입채무", "meaning": "물건을 사고 아직 갚지 않은 돈"}, {"term": "처분이익·처분손실", "meaning": "자산을 장부가격보다 비싸게 팔아 생긴 이익과 싸게 팔아 생긴 손실"}]}, {"no": 26, "topic": "투자분석기법", "concept": "기술적 분석의 기본가정과 한계", "q": "기술적 분석의 기본가정 및 특징에 대한 설명으로 가장 적절하지 않은 것은?", "choices": ["증권의 시장가치는 수요와 공급에 의해서만 결정된다고 전제한다.", "수요와 공급의 분석을 통해 시장이 변동하는 근본 원인을 설명할 수 있다.", "시장의 사소한 변동을 무시하면 주가는 지속되는 추세에 따라 상당기간 움직이는 경향이 있다고 본다.", "도표에 나타나는 주가 모형은 스스로 반복하는 경향이 있다고 본다."], "answer": 1, "explanation": "기술적 분석은 수요·공급을 분석해도 시장이 변동하는 '근본 원인'은 설명할 수 없습니다. 이것이 기술적 분석의 대표적인 한계입니다. 그래서 '근본 원인을 설명할 수 있다'는 설명이 틀렸습니다. 나머지는 모두 기본가정입니다. 시장가치는 수요·공급으로만 결정되고, 추세는 지속되며, 패턴은 반복된다고 봅니다.", "similar": [{"q": "기술적 분석의 장점으로 가장 적절한 것은?", "choices": ["기업의 내재가치를 정확하게 산출할 수 있다.", "과거의 추세와 패턴이 미래에 반복되지 않는다는 점을 전제로 한다.", "시장이 변동하는 근본 원인을 수요·공급 분석으로 밝혀낸다.", "계량화가 어려운 심리적 요인까지 주가에 반영하여 기본적 분석의 한계를 보완한다."], "answer": 3, "explanation": "기술적 분석의 장점은 계량화가 어려운 심리적 요인을 주가에 반영하고, 매매시점을 잡을 수 있다는 것입니다. 주가를 '내재가치 + 심리'로 보기 때문입니다. 내재가치를 산출하는 것은 기본적 분석이 하는 일입니다. 또 기술적 분석은 추세·패턴이 반복된다고 전제하고, 근본 원인은 설명하지 못합니다.", "tip": "주가 = 내  "terms": [{"term": "충격파동", "meaning": "시장 전체 움직임과 같은 방향으로 가는 파동(1·3·5번, A·C)."}, {"term": "조정파동", "meaning": "시장 전체 움직임을 거스르는 방향으로 가는 파동(2·4번, B)."}]}, {"q": "엘리어트 파동의 각 파동에 대한 설명으로 가장 적절한 것은?", "choices": ["B파동은 상승추세가 재개되는 것으로 믿기 쉬운 파동으로, 매입포지션을 정리할 마지막 기회이다.", "1번 파동은 5개 파동 중 가장 길며 돌파갭과 급진갭이 주로 나타난다.", "4번 파동은 3번 파동을 100% 되돌리는 경향이 높다.", "C파동은 거래가 한산하고 가격변동이 작게 나타난다."], "answer": 0, "explanation": "B파동은 상승추세가 다시 시작된 것처럼 착각하기 쉬운 파동입니다. 그래서 매입포지션을 정리할 마지막 기회입니다. 가장 길고 갭이 나타나는 파동은 1번이 아니라 3번입니다(1번은 가장 짧음). 4번은 3번을 100%가 아니라 38.2% 되돌리는 경향이 있습니다. C파동은 거래가 한산한 것이 아니라 활발하고 투매가 나타납니다.", "tip": "B파동 = 상승 착각, 매입포지션 정리 마지막 기회 / C파동 = 거래 활발·투매", "terms": [{"term": "매입포지션", "meaning": "주식 등을 사서 들고 있는 상태."}, {"term": "갭", "meaning": "앞의 가격대와 겹치지 않고 건너뛰어서 차트에 생긴 빈 공간."}, {"term": "투매", "meaning": "손해를 보더라도 한꺼번에 마구 파는 것."}, {"term": "되돌림", "meaning": "직전에 움직인 폭 가운데 일부를 반대 방향으로 다시 움직이는 것."}]}], "tip": "상승 5파·하락 3파 / 2번은 100% 못 넘고, 3번은 최단 불가, 4번은 1번 고점 침범 불가", "terms": [{"term": "엘리어트 파동이론", "meaning": "주가가 상승 5개 파동과 하락 3개 파동을 한 묶음으로 끝없이 반복한다고 보는 이론."}, {"term": "되돌림", "meaning": "직전에 움직인 폭 가운데 일부를 반대 방향으로 다시 움직이는 것."}, {"term": "저점", "meaning": "일정 기간 중 가격이 가장 낮았던 지점."}, {"term": "돌파갭", "meaning": "주가가 기존 모양에서 벗어나 새로운 추세를 시작할 때 생기는 갭."}]}, {"no": 29, "topic": "투자분석기법", "concept": "패턴분석(반전형/지속형)", "q": "패턴분석에 대한 설명으로 가장 적절하지 않은 것은?", "choices": ["헤드앤숄더형은 오른쪽 어깨에서 거래량이 가장 많고 왼쪽으로 갈수록 감소한다.", "이중바닥형은 두 번째 바닥이 첫 번째 바닥보다 더 완만하고 높게 형성된다.", "직사각형이 형성되기 위해서는 최소한 2개의 산과 2개의 골이 있어야 한다.", "쐐기형은 깃발형과 삼각형의 혼합형태로서 지속형 패턴에 속한다."], "answer": 0, "explanation": "헤드앤숄더형은 오른쪽이 아니라 '왼쪽 어깨'에서 거래량이 가장 많습니다. 그 뒤 머리, 오른쪽 어깨로 갈수록 거래량이 줄어듭니다. 이중바닥형의 두 번째 바닥은 첫 번째보다 더 완만하고 높게 생깁니다. 직사각형은 최소 2개의 산과 2개의 골(4번 이상 등락)이 필요합니다. 쐐기형은 깃발형과 삼각형이 섞인 지속형 패턴입니다.", "similar": [{"q": "다음 패턴 중 반전형 패턴이 아닌 것은?", "choices": ["삼각형", "헤드앤숄더형", "이중천장형", "원형바닥형"], "answer": 0, "explanation": "삼각형은 반전형이 아니라 지속형 패턴입니다. 직사각형·깃발형·쐐기형·다이아몬드형도 지속형입니다. 반전형 패턴에는 헤드앤숄더(역헤드앤숄더), 이중천장(M)·이중바닥(W), 원형천장·원형바닥, V자형 등이 있습니다. 그래서 헤드앤숄더형·이중천장형·원형바닥형은 모두 반전형입니다.", "tip": "지속형 = 삼각·직사각·깃발·쐐기·다이아몬드 / 헤드앤숄더·M·W·원형·V자는 반전형", "terms": [{"term": "반전형 패턴", "meaning": "기존 추세가 반대 방향으로 바뀔 것을 알려 주는 차트 모양."}, {"term": "지속형 패턴", "meaning": "잠시 쉬었다가 기존 추세가 계속될 것을 알려 주는 차트 모양."}]}, {"q": "지속형 패턴과 반전형 패턴에 대한 설명으로 가장 적절한 것은?", "choices": ["반전형 패턴은 예상 목표치 계산이 불가능하다는 것이 일반적인 특징이다.", "지속형 패턴은 반전형 패턴에 비해 형성기간이 짧고 영향력이 일시적이다.", "다이아몬드형은 대표적인 반전형 패턴이다.", "상승추세 과정에서 나타나는 하락쐐기형은 하락반전을 예고한다."], "answer": 1, "explanation": "지속형 패턴은 반전형 패턴보다 형성기간이 짧고 영향력이 일시적입니다. 반전형 패턴은 예상 목표치를 계산할 수 있습니다(단, 원형천장·원형바닥형은 계산 불가). 다이아몬드형은 반전형이 아니라 지속형입니다. 상승추세 중의 하락쐐기형은 하락반전이 아니라 상승이 계속된다는 신호입니다.", "tip": "지속형 = 짧고 일시적 / 반전형 = 목표치 계산 가능(원형만 불가)", "terms": [{"term": "지속형 패턴", "meaning": "잠시 쉬었다가 기존 추세가 계속될 것을 알려 주는 차트 모양."}, {"term": "반전형 패턴", "meaning": "기존 추세가 반대 방향으로 바뀔 것을 알려 주는 차트 모양."}, {"term": "목표치", "meaning": "패턴을 보고 주가가 어디까지 갈지 미리 계산한 가격."}, {"term": "쐐기형", "meaning": "두 선이 한쪽으로 좁아지며 기울어진 쐐기 모양의 지속형 패턴."}]}, {"q": "주가 패턴에 대한 설명으로 가장 거리가 먼 것은?", "choices": ["다이아몬드형은 확대형과 대칭삼각형이 합쳐진 모양으로 주가의 큰 변동 이후 많이 나타난다.", "직사각형은 매수·매도세력이 균형을 이루며 횡보하는 패턴으로 저항선과 지지선이 수평으로 평행을 이룬다.", "확대형은 고점은 점점 낮아지고 저점은 점점 높아지는 패턴으로 하락추세의 초기 현상이다.", "주가의 상승추세가 완만한 곡선을 그리며 서서히 하락추세로 전환되는 패턴은 원형천장형이다."], "answer": 2, "explanation": "확대형(나팔형·메가폰형)은 고점은 점점 높아지고 저점은 점점 낮아지는 패턴입니다. 투자심리가 극도로 불안정한 상태를 보여 줍니다. 또 하락추세의 초기가 아니라 '상승추세의 말기'에 나타나는 현상입니다. 그래서 '고점은 낮아지고 저점은 높아지며 하락추세 초기'라는 설명이 틀렸습니다. 나머지 설명은 맞습니다.", "tip": "확+대=다 (확대형+대칭삼각형=다이아몬드형) / 확대형 = 상승추세 말기", "terms": [{"term": "확대형", "meaning": "고점은 점점 높아지고 저점은 점점 낮아져 나팔(메가폰)처럼 벌어지는 패턴."}, {"term": "고점", "meaning": "일정 기간 중 가격이 가장 높았던 지점."}, {"term": "저점", "meaning": "일정 기간 중 가격이 가장 낮았던 지점."}]}], "tip": "깃+삼=쐐 (깃발형+삼각형=쐐기형, 지속형) / 헤드앤숄더 거래량은 왼쪽 어깨가 최대", "terms": [{"term": "헤드앤숄더형", "meaning": "왼쪽 어깨-머리-오른쪽 어깨처럼 봉우리 세 개가 생기는 대표적인 반전형 패턴."}, {"term": "거래량", "meaning": "일정 기간 동안 사고판 주식의 수량."}, {"term": "이중바닥형", "meaning": "주가가 W자처럼 바닥을 두 번 찍고 오르는 반전형 패턴."}, {"term": "지속형 패턴", "meaning": "잠시 쉬었다가 기존 추세가 계속될 것을 알려 주는 차트 모양."}]}, {"no": 30, "topic": "투자분석기법", "concept": "이동평균선 분석", "q": "이동평균선(Moving Average)에 대한 설명으로 가장 적절하지 않은 것은?", "choices": ["주가와 이동평균선의 괴리가 지나치게 클 때에는 이동평균선으로 회귀하려는 경향이 있다.", "이동평균 분석기간이 길수록 이동평균선은 가파르게 움직인다.", "약세국면에서 주가가 이동평균선 아래에서 움직일 경우 하락세가 지속될 가능성이 높다.", "상승하고 있는 이동평균선을 주가가 하향돌파하는 경우 추세는 조만간 하락반전할 가능성이 높다."], "answer": 1, "explanation": "이동평균선은 분석기간이 길수록 '완만'해지고, 짧을수록 가파릅니다. 그래서 '길수록 가파르다'는 설명이 틀렸습니다. 주가와 이동평균선의 괴리가 크면 이동평균선으로 돌아가려 합니다(이격도 분석). 약세국면에서 주가가 이동평균선 아래에 있으면 하락이 계속되기 쉽고(역배열), 상승하는 이동평균선을 하향돌파하면 하락반전 가능성이 높습니다. 주가가 바뀔 때 가장 먼저 움직이는 것은 단기 이동평균선입니다.", "similar": [{"q": "골든크로스(Golden Cross)에 대한 설명으로 가장 적절한 것은?", "choices": ["단기이동평균선이 장기이동평균선을 위에서 아래로 하향돌파하는 것으로 매도신호이다.", "현재 주가와 이동평균선의 괴리도를 파악하여 매매시점을 판단하는 것이다.", "주가 > 단기 > 중기 > 장기 이동평균선 순으로 배열된 상태를 말한다.", "단기이동평균선이 장기이동평균선을 아래에서 위로 상향돌파하는 것으로 매수신호이다."], "answer": 3, "explanation": "골든크로스는 단기이동평균선이 장기이동평균선을 아래에서 위로 뚫고 올라가는 것으로, 매수신호(호전)입니다. 반대로 위에서 아래로 뚫고 내려가는 것은 데드크로스이며 매도신호(역전)입니다. 괴리도를 보는 것은 이격도 분석입니다. 주가>단기>중기>장기 순서는 정배열(배열도 분석)입니다.", "tip": "골든크로스 = 단기가 장기를 상향돌파(매수) / 데드크로스 = 하향돌파(매도)", "terms": [{"term": "상향돌파", "meaning": "선을 아래에서 위로 뚫고 올라가는 것."}, {"term": "매수신호", "meaning": "주식을 사라는 신호."}, {"term": "이격도", "meaning": "현재 주가가 이동평균선에서 얼마나 떨어져 있는지를 나타낸 정도."}, {"term": "정배열", "meaning": "상승장에서 위에서부터 주가>단기>중기>장기 이동평균선 순서로 놓인 상태."}]}, {"q": "상승장에서 나타나는 이동평균선의 정배열 순서로 옳은 것은?", "choices": ["장기 > 중기 > 단기 > 주가", "단기 > 주가 > 장기 > 중기", "주가 > 단기 > 중기 > 장기", "중기 > 단기 > 주가 > 장기"], "answer": 2, "explanation": "정배열은 상승장에서 나타나는 배열입니다. 주가가 가장 위에 있고, 그 아래로 단기·중기·장기 이동평균선이 차례로 놓입니다. 역배열은 하락장의 배열로 장기 > 중기 > 단기 > 주가 순서입니다. 나머지 순서는 둘 다 아닙니다.", "tip": "정배열: 주가>단기>중기>장기 / 역배열: 정확히 거꾸로", "terms": [{"term": "정배열", "meaning": "상승장에서 위에서부터 주가>단기>중기>장기 이동평균선 순서로 놓인 상태."}, {"term": "역배열", "meaning": "하락장에서 위에서부터 장기>중기>단기 이동평균선>주가 순서로 놓인 상태."}, {"term": "이동평균선", "meaning": "일정 기간 주가의 평균을 매일 구해서 이은 선."}]}, {"q": "지지선·저항선·추세선에 대한 설명으로 가장 적절하지 않은 것은?", "choices": ["추세선은 길이가 길고 기울기가 완만하며 저점이나 고점이 여러 번 나타날수록 신뢰도가 높다.", "상승추세선은 고점을, 하락추세선은 저점을 연결하여 그린다.", "저항선은 주가의 상승추세를 저지시키는 높은 주가수준을 말한다.", "추세대는 저항선과 지지선이 서로 평행한 상태로, 그 안에서 주가가 등락한다."], "answer": 1, "explanation": "상승추세선은 '저점'을 이어서 그리고, 하락추세선은 '고점'을 이어서 그립니다. 그래서 거꾸로 말한 설명이 틀렸습니다. 추세선은 길이가 길고, 기울기가 완만하고, 고점·저점이 여러 번 나타날수록 신뢰도가 높습니다. 저항선과 추세대에 대한 설명은 맞습니다.", "tip": "상승추세선 = 저점 연결, 하락추세선 = 고점 연결", "terms": [{"term": "추세선", "meaning": "주가의 저점끼리 또는 고점끼리 이어서 추세 방향을 보여 주는 선."}, {"term": "지지선", "meaning": "주가가 더 내려가지 않고 받쳐지는 가격대를 이은 선."}, {"term": "저항선", "meaning": "주가가 더 올라가지 못하고 막히는 가격대를 이은 선."}, {"term": "추세대", "meaning": "저항선과 지지선이 서로 평행하게 놓여, 그 사이에서 주가가 오르내리는 통로."}]}], "tip": "기간 길수록 완만, 짧을수록 가파름 → 전환 시 단기선이 먼저 움직임", "terms": [{"term": "이동평균선", "meaning": "일정 기간 주가의 평균을 매일 구해서 이은 선."}, {"term": "괴리", "meaning": "두 값이 서로 벌어져 있는 것. 여기서는 주가와 이동평균선 사이의 거리."}, {"term": "이격도", "meaning": "현재 주가가 이동평균선에서 얼마나 떨어져 있는지를 나타낸 정도."}, {"term": "하향돌파", "meaning": "선을 위에서 아래로 뚫고 내려가는 것."}]}, {"no": 31, "topic": "투자분석기법", "concept": "그랜빌의 매매신호", "q": "그랜빌(Granville)의 투자전략에서 매수신호에 해당하지 않는 것은?", "choices": ["이동평균선의 하락이 멈춘 상태에서 주가가 이동평균선을 상향돌파하는 경우", "이동평균선의 상승이 멈춘 상태에서 주가가 이동평균선을 하향돌파하는 경우", "이동평균선이 상승하고 있을 때 주가가 일시적으로 이동평균선 아래로 하락하는 경우", "주가가 상승하는 이동평균선 위에서 급격히 하락하다가 이동평균선의 지지를 받고 반등하는 경우"], "answer": 1, "explanation": "이동평균선의 상승이 멈춘 상태에서 주가가 이동평균선을 하향돌파하면 상승에서 하락으로 바뀔 것으로 봅니다. 그래서 매수신호가 아니라 매도신호 1입니다. 매수신호는 4가지입니다.\n① 하락이 멈춘 이동평균선을 상향돌파\n② 상승하는 이동평균선 아래로 일시 하락\n③ 이동평균선의 지지를 받고 반등\n④ 하락하는 이동평균선을 하향돌파한 뒤 급락(반등 기대)", "similar": [{"q": "그랜빌의 투자전략에서 매도신호에 해당하는 것은?", "choices": ["이동평균선이 상승하고 있을 때 주가가 이동평균선 아래로 하락하는 경우", "주가가 하락하고 있는 이동평균선을 하향돌파한 후 급락하는 경우", "이동평균선의 하락이 멈춘 상태에서 주가가 이동평균선을 상향돌파하는 경우", "주가가 상승하고 있는 이동평균선을 상향돌파한 후 급등하는 경우"], "answer": 3, "explanation": "주가가 상승하는 이동평균선을 상향돌파한 뒤 급등하면 너무 많이 오른 것입니다. 그래서 다시 이동평균선 쪽으로 내려오는 반락이 예상되므로 매도신호 4입니다. 나머지 세 가지는 각각 매수신호 2, 4, 1입니다.", "tip": "매도신호 = 매수신호를 위아래로 뒤집은 것", "terms": [{"term": "상향돌파", "meaning": "선을 아래에서 위로 뚫고 올라가는 것."}, {"term": "반락", "meaning": "오르던 가격이 다시 떨어지는 것."}, {"term": "매도신호", "meaning": "주식을 팔라는 신호."}]}, {"q": "그랜빌의 투자전략에서 '이동평균선이 하락하고 있을 때 주가가 이동평균선 위로 상승하는 경우'의 해석으로 가장 적절한 것은?", "choices": ["추세가 하락에서 상승으로 전환될 것으로 예상되는 매수신호이다.", "과도한 하락 후 이동평균선으로 수렴하는 반등으로 매수신호이다.", "하락추세 속의 일시적 주가 상승으로 매도신호이다.", "상승추세의 지지를 받고 다시 상승하는 매수신호이다."], "answer": 2, "explanation": "이동평균선이 계속 '하락하는 중'에 주가가 그 위로 올라온 것입니다. 이것은 하락추세 속의 일시적인 상승으로 보아 매도신호 2입니다. 이동평균선의 하락이 '멈춘' 상태에서 상향돌파해야 추세전환을 뜻하는 매수신호 1이 됩니다.", "tip": "이평선 하락 '지속' 중 상승 = 매도 / 하락 '멈춤' 후 상향돌파 = 매수", "terms": [{"term": "추세전환", "meaning": "추세의 방향이 바뀌는 것(상승→하락, 하락→상승)."}, {"term": "상향돌파", "meaning": "선을 아래에서 위로 뚫고 올라가는 것."}, {"term": "매도신호", "meaning": "주식을 팔라는 신호."}]}, {"q": "그랜빌의 투자전략에 대한 설명으로 가장 적절하지 않은 것은?", "choices": ["주가가 이동평균선 아래에서 상승세를 보이다가 이동평균선을 돌파하지 못하고 하락하면 매도신호이다.", "이동평균선이 상승한 뒤 평행이나 하락국면으로 진입할 때 주가가 이동평균선을 하향돌파하면 매도신호이다.", "이동평균선이 하락한 뒤 보합이나 상승국면으로 진입할 때 주가가 이동평균선을 상향돌파하면 매수신호이다.", "주가가 하락하고 있는 이동평균선을 하향돌파한 후 급락하는 경우는 하락추세가 가속되는 것이므로 매도신호이다."], "answer": 3, "explanation": "하락하는 이동평균선을 하향돌파한 뒤 급락하는 경우는 매도신호가 아닙니다. 너무 많이 떨어졌으므로 이동평균선 쪽으로 돌아가는 반등을 기대하는 '매수신호 4'입니다. 그랜빌 전략은 주가가 이동평균선과 많이 벌어지면 다시 이동평균선으로 돌아온다는 원리를 이용합니다. 나머지 세 설명은 맞습니다.", "tip": "괴리가 크면 이평선으로 회귀 → 과도한 급락은 매수, 과도한 급등은 매도", "terms": [{"term": "반등", "meaning": "떨어지던 가격이 다시 오르는 것."}, {"term": "괴리", "meaning": "두 값이 서로 벌어져 있는 것. 여기서는 주가와 이동평균선 사이의 거리."}, {"term": "회귀", "meaning": "원래 자리로 다시 돌아오는 것."}]}], "tip": "매도신호 = 매수신호를 위아래로 뒤집은 것", "terms": [{"term": "그랜빌의 투자전략", "meaning": "주가와 이동평균선의 위치·방향으로 매수신호 4가지와 매도신호 4가지를 정리한 전략."}, {"term": "이동평균선", "meaning": "일정 기간 주가의 평균을 매일 구해서 이은 선."}, {"term": "하향돌파", "meaning": "선을 위에서 아래로 뚫고 내려가는 것."}, {"term": "반등", "meaning": "떨어지던 가격이 다시 오르는 것."}]}, {"no": 32, "topic": "투자분석기법", "concept": "일목균형표", "q": "일목균형표에 대한 설명으로 가장 적절하지 않은 것은?", "choices": ["평균(Average)이 아닌 중간값(Median)을 사용한다.", "선행스팬1은 기준선과 전환선의 중간값을 당일보다 26일 앞선 위치에 표시한다.", "기준선은 당일 포함 9일 동안의 최고치와 최저치의 중간값이다.", "구름대는 선행스팬1과 선행스팬2 사이의 띠 모양 영역으로 지지선이나 저항선으로 작용하는 경향이 있다."], "answer": 2, "explanation": "기준선은 9일이 아니라 '26일' 동안의 최고치와 최저치의 중간값입니다. 9일 동안의 중간값은 전환선입니다. 선행스팬2는 52일 중간 가격이 안정적이면 '줄어듭니다'. 거꾸로 말한 설명이 틀렸습니다. 중심선(n일 이동평균선) ±2σ로 상한선과 하한선을 정합니다. 하한선 근처에서 사고 상한선 근처에서 팔며, 밴드 밖으로 나가면 현재 추세가 계속된다는 뜻입니다.", "tip": "변동 크면 밴드 넓게, 안정되면 좁게 / 중심선 ±2σ", "terms": [{"term": "볼린저 밴드", "meaning": "이동평균선을 중심으로 위아래에 표준편차만큼 띠(밴드)를 그린 지표."}, {"term": "표준편차(σ)", "meaning": "값들이 평균에서 얼마나 흩어져 있는지를 나타내는 숫자. 클수록 변동이 크다."}, {"term": "이동평균선", "meaning": "일정 기간 주가의 평균을 매일 구해서 이은 선."}]}, {"q": "MACD(Moving Average Convergence & Divergence)에 대한 설명으로 가장 적절한 것은?", "choices": ["장기지수이동평균에서 단기지수이동평균을 뺀 값이다.", "과매수·과매도 상태를 이용해 추세전환을 잡는 추세반전형 지표이다.", "주가 움직임과 MACD 오실레이터 사이에서 다이버전스가 발견되면 강력한 추세반전이 예상된다.", "두 이동평균선이 가장 가깝게 모였을 때를 매매타이밍으로 하는 기법이다."], "answer": 2, "explanation": "주가와 MACD 오실레이터 사이에 다이버전스가 보이면 강력한 추세반전을 예상합니다. MACD는 장기에서 단기를 빼는 것이 아니라 '단기'지수이동평균 − '장기'지수이동평균입니다. 매매타이밍은 두 이동평균선이 가장 가까울 때가 아니라 '가장 크게 벌어졌을 때'입니다. 또 MACD는 추세반전형이 아니라 추세추종형 지표입니다.", "tip": "MACD = 단기 지수이평 − 장기 지수이평, 가장 크게 벌어질 때가 타이밍, 추세추종형", "terms": [{"term": "지수이동평균", "meaning": "최근 가격에 더 큰 비중을 두고 구한 이동평균."}, {"term": "다이버전스", "meaning": "주가와 지표가 서로 반대 방향으로 움직이는 현상."}, {"term": "MACD 오실레이터", "meaning": "MACD와 시그널선(MACD의 지수이동평균)의 차이를 나타낸 것."}, {"term": "추세추종형 지표", "meaning": "이미 생긴 추세를 뒤따라가며 확인하는 지표(후행성)."}]}, {"q": "RSI(상대강도지수)에 대한 설명으로 가장 적절하지 않은 것은?", "choices": ["상승폭과 하락폭을 합계로 구하므로 일시적인 비정상적 가격 움직임에 크게 영향을 받는다.", "RSI가 상한선 부근의 높은 수준이면 매도신호, 하한선 부근의 낮은 수준이면 매수신호로 본다.", "Failure Swing은 직전 최고(최저) 기록을 돌파하지 못하고 진행방향을 바꾸는 현상이다.", "과매수·과매도 여부를 판단하는 추세반전형 지표이다."], "answer": 0, "explanation": "RSI는 상승폭과 하락폭을 합계가 아니라 모두 '평균값'으로 구합니다. 그래서 분석기간 중 잠깐 비정상적인 움직임이 있어도 별 영향을 받지 않습니다. RSI가 높으면 과매수(매도신호), 낮으면 과매도(매수신호)입니다. 직전 고점을 돌파하지 못하고 방향을 바꾸는 Failure Swing은 추세전환 신호입니다.", "tip": "RSI = 상승폭·하락폭의 '평균' 사용 → 일시적 이상 움직임에 영향 적음", "terms": [{"term": "RSI", "meaning": "일정 기간 상승폭과 하락폭의 평균으로 오르는 힘의 크기를 나타낸 추세반전형 지표."}, {"term": "과매수·과매도", "meaning": "너무 많이 사서 가격이 지나치게 오른 상태가 과매수, 너무 많이 팔아서 지나치게 내린 상태가 과매도이다."}, {"term": "Failure Swing", "meaning": "직전 최고(최저) 기록을 돌파하지 못하고 진행 방향을 바꾸는 현상. 추세전환 신호로 본다."}]}], "tip": "추종형 = 후행·큰 흐름에 유리 / 반전형 = 선행·횡보장에 강함", "terms": [{"term": "추세추종형 지표", "meaning": "이미 생긴 추세를 뒤따라가며 확인하는 지표(후행성)."}, {"term": "추세반전형 지표", "meaning": "과매수·과매도를 보고 추세가 바뀌는 때를 미리 잡으려는 지표(선행성)."}, {"term": "선행성·후행성", "meaning": "추세보다 먼저 신호를 주는 성질이 선행성, 추세가 생긴 뒤에 따라서 신호를 주는 성질이 후행성이다."}, {"term": "횡보장", "meaning": "주가가 뚜렷한 방향 없이 옆으로 움직이는 시장."}]}, {"no": 35, "topic": "투자분석기법", "concept": "산업연관분석(산업연관표)", "q": "산업연관표에 대한 설명으로 가장 적절하지 않은 것은?", "choices": ["산업연관표는 국민소득통계에서 제외된 중간생산물의 산업 간 거래도 포괄한다.", "산업연관표상의 총투입액과 총산출액은 일치한다.", "생산유발계수를 통해 전·후방 연쇄효과를 파악할 수 있다.", "산업연관표의 세로방향은 상품의 배분구조, 가로방향은 상품의 투입구조를 나타낸다."], "answer": 3, "explanation": "산업연관표는 세로방향이 투입구조, 가로방향이 배분구조입니다. 그래서 거꾸로 말한 설명이 틀렸습니다. 산업연관표는 국민소득통계와 달리 중간생산물의 산업 간 거래도 포함하고, 총투입액과 총산출액은 같습니다. 다만 5년마다 작성되어 경제구조 변화를 빠르게 반영하지 못하는 단점이 있습니다.", "similar": [{"q": "'최종수요가 1단위 증가할 때 각 산업에서 유발되는 산출물의 단위'로, 산업 간 상호의존관계를 분석할 수 있으며 레온티에프 역행렬계수라고도 부르는 지표는?", "choices": ["생산유발계수", "투입계수", "부가가치계수", "수입유발계수"], "answer": 0, "explanation": "생산유발계수는 최종수요가 1단위 늘 때 각 산업에서 생기는 산출물의 단위입니다. 레온티에프 역행렬계수라고도 하며, 산업 간 상호의존관계를 분석하는 데 씁니다. 투입계수는 (중간투입액+부가가치액)/총투입액, 부가가치계수는 부가가치액/총투입액입니다. 수입유발계수는 최종수요가 1단위 늘 때 생기는 수입의 단위입니다.", "tip": "최종수요 1단위 → 생산 유발 = 생산유발계수(레온티에프 역행렬계수)", "terms": [{"term": "최종수요", "meaning": "소비·투자·수출처럼 재료가 아니라 최종적으로 쓰이는 수요."}, {"term": "부가가치", "meaning": "생산 과정에서 새로 더해진 가치."}, {"term": "중간투입액", "meaning": "생산에 재료로 들어간 다른 산업 제품의 금액."}, {"term": "상호의존관계", "meaning": "서로 영향을 주고받는 관계."}]}, {"q": "'특정 산업제품의 최종수요 1단위 증가가 모든 산업의 생산에 미치는 영향'을 의미하는 것은?", "choices": ["전방연쇄효과", "고용유발계수", "후방연쇄효과", "중간투입계수"], "answer": 2, "explanation": "특정 산업의 최종수요 1단위 증가가 모든 산업의 생산에 주는 영향은 후방연쇄효과입니다. 반대로 모든 산업의 최종수요 증가가 특정 산업에 주는 영향은 전방연쇄효과입니다. 후방연쇄효과가 가장 크게 나타나는 대표 산업은 자동차산업입니다.", "tip": "특정→모든 = 후방, 모든→특정 = 전방 (후방 대표: 자동차)", "terms": [{"term": "최종수요", "meaning": "소비·투자·수출처럼 재료가 아니라 최종적으로 쓰이는 수요."}, {"term": "후방연쇄효과", "meaning": "특정 산업제품의 최종수요가 1단위 늘 때 모든 산업의 생산에 미치는 영향."}, {"term": "전방연쇄효과", "meaning": "모든 산업제품의 최종수요가 각 1단위씩 늘 때 특정 산업의 생산에 미치는 영향."}]}, {"q": "어떤 산업의 총투입액이 500억 원이고, 이 중 중간투입액이 300억 원, 부가가치액이 200억 원이다. 이 산업의 부가가치계수는?", "choices": ["0.6", "0.4", "1.0", "0.67"], "answer": 1, "explanation": "정답은 0.4입니다. 부가가치계수는 부가가치액을 총투입액으로 나눈 값입니다. 0.6은 중간투입계수(300/500)입니다. 1.0은 투입계수((300+200)/500)입니다. 0.67은 분모에 중간투입액을 잘못 넣은 값입니다.\n공식: 부가가치계수 = 부가가치액 / 총투입액\n계산: 200 / 500 = 0.4", "tip": "부가가치계수 = 부가가치/총투입, 중간투입계수 = 중간투입/총투입", "terms": [{"term": "부가가치", "meaning": "생산 과정에서 새로 더해진 가치."}, {"term": "중간투입액", "meaning": "생산에 재료로 들어간 다른 산업 제품의 금액."}, {"term": "총투입액", "meaning": "한 산업이 생산을 위해 들인 모든 금액(중간투입액+부가가치액)."}]}], "tip": "세투가배 (세로 = 투입, 가로 = 배분)", "terms": [{"term": "산업연관표", "meaning": "일정 기간 산업끼리 주고받은 재화·서비스 거래를 한 장의 표로 정리한 것."}, {"term": "중간생산물", "meaning": "다른 상품을 만드는 데 재료로 쓰이는 생산물."}, {"term": "국민소득통계", "meaning": "나라 전체가 일정 기간 새로 만들어 낸 소득을 집계한 통계."}, {"term": "생산유발계수", "meaning": "최종수요가 1단위 늘 때 각 산업에서 생겨나는 산출물의 단위. 레온티에프 역행렬계수라고도 한다."}]}, {"no": 36, "topic": "투자분석기법", "concept": "산업정책의 특징과 시장경쟁강도 지표", "q": "산업정책의 특징에 대한 설명으로 가장 적절하지 않은 것은?", "choices": ["정부가 직접 시장에 개입하여 자원배분의 효율을 높이는 정책이다.", "기업 차원보다는 국가 차원에서의 접근이 더욱 중요한 의미를 가진다.", "수요관리가 아닌 공급지향적 정책으로, 케인즈의 총수요관리정책과 대비된다.", "선진국일수록 더 강조되는 경향이 있다."], "answer": 3, "explanation": "산업정책은 선진국이 아니라 '후진국'일수록 강조됩니다. 산업정책은 정부가 직접 시장에 개입해 자원배분의 효율을 높이는 정책입니다. 기업보다 국가 차원의 접근이 더 중요합니다. 또 수요관리가 아닌 공급지향적 정책이라 케인즈의 총수요관리정책과 대비됩니다.", "similar": [{"q": "산업정책에 대한 설명으로 가장 적절한 것은?", "choices": ["유망산업을 육성하는 정책은 소극적 산업구조정책에 해당한다.", "사양산업·불황산업을 보호하는 정책은 적극적 산업구조정책에 해당한다.", "시장집중률(CR)과 허핀달지수(HHI)는 주로 산업구조정책에 활용된다.", "시장의 독과점을 완화하는 정책은 산업조직정책에 속한다."], "answer": 3, "explanation": "시장의 독과점을 완화하는 정책은 산업조직정책입니다. 유망산업 육성은 소극적이 아니라 적극적 산업구조정책입니다. 사양·불황산업 보호는 적극적이 아니라 소극적 산업구조정책입니다. CR과 HHI는 산업구조정책이 아니라 산업조직정책에 쓰는 지수입니다.", "tip": "육성 = 적극적, 보호 = 소극적(구조정책) / 독과점·CR·HHI = 조직정책", "terms": [{"term": "독과점", "meaning": "한 기업(독점)이나 몇몇 기업(과점)이 시장을 차지한 상태."}, {"term": "산업조직정책", "meaning": "독과점 완화처럼 시장의 경쟁 질서를 다루는 산업정책."}, {"term": "산업구조정책", "meaning": "유망산업 육성, 사양산업 조정처럼 산업의 구성을 바꾸는 산업정책."}, {"term": "사양산업", "meaning": "점점 쇠퇴해 가는 산업."}]}, {"q": "어떤 산업에 4개 기업만 존재하며, 각 기업의 시장점유율이 40%, 30%, 20%, 10%이다. 이 산업의 허핀달지수(HHI)는?", "choices": ["0.30", "0.25", "1.00", "0.16"], "answer": 0, "explanation": "정답은 0.30입니다. HHI는 각 기업 시장점유율을 제곱해서 모두 더한 값입니다. 0.25는 4개 기업 점유율이 모두 같을 때(4 × 0.25²)의 값입니다. 1.00은 점유율을 그냥 더한 값, 0.16은 1위 기업만 제곱한 값입니다.\n공식: HHI = 각 기업 시장점유율² 의 합\n① 0.4² + 0.3² + 0.2² + 0.1²\n② = 0.16 + 0.09 + 0.04 + 0.01\n③ = 0.30", "tip": "HHI = 점유율 제곱의 합 (클수록 집중)", "terms": [{"term": "허핀달지수(HHI)", "meaning": "모든 기업의 시장점유율을 제곱해서 더한 값. 클수록 소수 기업에 집중되어 있다."}, {"term": "시장점유율", "meaning": "시장 전체 판매 중 한 기업이 차지하는 비율."}]}, {"q": "시장경쟁강도 측정지표에 대한 설명으로 가장 적절하지 않은 것은?", "choices": ["HHI는 기업규모 간 불균등도와 소수기업의 집중도를 모두 반영한다.", "시장집중률(CR)은 측정하지 않은 기업들의 점유율을 알 수 없다는 단점이 있다.", "HHI가 작을수록 기업규모 간 불균등도가 커진다.", "CR과 HHI는 산업구조정책이 아닌 산업조직정책에 활용되는 지수이다."], "answer": 2, "explanation": "HHI는 '클수록' 기업규모 간 불균등도(=집중도)가 커집니다. 그래서 '작을수록 커진다'는 설명이 틀렸습니다. HHI는 점유율 제곱의 합이라 불균등도와 소수기업의 집중도를 모두 반영합니다. CR은 상위 k개 기업 점유율의 합이라 나머지 기업의 점유율은 알 수 없습니다.", "tip": "HHI 클수록 불균등·집중 ↑ / CR은 상위 k개만 → 나머지는 모름", "terms": [{"term": "허핀달지수(HHI)", "meaning": "모든 기업의 시장점유율을 제곱해서 더한 값. 클수록 소수 기업에 집중되어 있다."}, {"term": "시장집중률(CR)", "meaning": "상위 k개 기업의 시장점유율을 더한 값."}, {"term": "불균등도", "meaning": "기업들의 크기가 얼마나 고르지 않은지의 정도."}, {"term": "산업조직정책", "meaning": "독과점 완화처럼 시장의 경쟁 질서를 다루는 산업정책."}]}], "tip": "산업정책: 정부 직접개입 · 국가 차원 · 공급지향 · 후진국일수록 강조", "terms": [{"term": "산업정책", "meaning": "정부가 직접 시장에 개입해 자원배분의 효율을 높이려는 정책."}, {"term": "자원배분", "meaning": "돈·사람·물자 같은 한정된 자원을 어디에 얼마나 쓸지 나누는 것."}, {"term": "공급지향적", "meaning": "수요를 조절하기보다 생산(공급) 쪽을 키우고 바꾸는 데 초점을 둔다는 뜻."}, {"term": "총수요관리정책", "meaning": "정부가 재정·금융정책으로 나라 전체의 수요를 조절하는 케인즈식 정책."}]}, {"no": 37, "topic": "리스크관리", "concept": "리스크의 분류(시장위험의 범위)", "q": "다음 중 시장위험(시장리스크)에 포함되지 않는 것은?", "choices": ["유동성위험", "이자율위험", "환율위험", "주식위험"], "answer": 0, "explanation": "유동성위험은 시장위험에 포함되지 않고, 시장위험과 같은 등급의 별도 리스크입니다. 시장위험에는 주식·이자율·환율·(상품가격)·신용스프레드 위험이 들어갑니다. 재무적 리스크는 시장·신용·유동성·운영·법적 리스크로 나뉩니다.", "similar": [{"q": "리스크의 정의에 대한 설명으로 가장 적절하지 않은 것은?", "choices": ["거래상대방이 약속한 금액을 지불하지 못하여 발생하는 손실에 대한 위험을 운영위험이라 한다.", "자산을 매각하고자 할 때 매입자가 없어 매우 불리한 조건으로 매각해야 할 때 노출되는 위험을 유동성위험이라 한다.", "부적절한 내부시스템, 관리실패, 잘못된 통제, 사기, 인간의 오류 등으로 발생하는 손실에 대한 위험을 운영위험이라 한다.", "계약을 집행하지 못함으로 인해 발생하는 손실에 대한 위험을 법적위험이라 한다."], "answer": 0, "explanation": "거래상대방이 약속한 돈을 지불하지 못해 생기는 손실 위험은 운영위험이 아니라 '신용위험'입니다. 신용리스크에는 신용위험과 결제위험이 포함됩니다. 유동성위험·운영위험·법적위험의 정의는 모두 맞습니다.", "tip": "돈 못 받음 = 신용 / 살 사람 없음 = 유동성 / 내부 실수·사기 = 운영 / 계약 집행 불가 = 법적", "terms": [{"term": "거래상대방", "meaning": "거래를 함께 한 상대편."}, {"term": "신용위험", "meaning": "거래상대방이 약속한 돈을 지불하지 못해 손실을 볼 위험."}, {"term": "운영위험", "meaning": "부적절한 내부시스템, 관리 실패, 사기, 사람의 실수 등으로 손실을 볼 위험."}, {"term": "결제위험", "meaning": "거래 대금이나 증권이 약속대로 주고받아지지 않아 생기는 위험."}]}, {"q": "Roll Over Risk(롤오버위험)에 크게 노출됨에 따라 발생한 리스크관리 실패 사례는?", "choices": ["베어링은행 사건", "LTCM 사건", "메탈게젤샤프트(MGRM) 사건", "오렌지카운티 사건"], "answer": 2, "explanation": "MGRM은 장기 선도공급계약을 단기 선물로 계속 갈아타며 헤지(롤링헤지)했습니다. 그러다 롤오버위험·자금조달리스크·신용리스크에 노출되어 파산했습니다. 베어링은행은 운영·시장위험(닉 리슨), 오렌지카운티는 레버리지로 인한 이자율·자금조달위험, LTCM은 신용스프레드·유동성위험 사례입니다.", "tip": "스트래들베어, 롤링메탈, 레버리지오렌지", "terms": [{"term": "롤오버위험", "meaning": "만기가 된 포지션을 다음 만기로 넘길(롤오버) 때 생기는 가격 차이로 손실을 볼 위험."}, {"term": "선물", "meaning": "미리 정한 가격으로 미래의 정해진 날에 사고팔기로 약속하는 거래소 계약."}, {"term": "헤지", "meaning": "손실 위험을 줄이려고 반대 방향의 거래를 해 두는 것."}, {"term": "레버리지", "meaning": "빌린 돈을 이용해 투자 규모를 키우는 것."}]}, {"q": "비재무적 리스크 중 포트폴리오 리스크에 해당하는 것은?", "choices": ["규제위험", "조세위험", "산업집중위험", "신용등급변동위험"], "answer": 2, "explanation": "포트폴리오 리스크는 거래집중·상품집중·산업집중위험입니다. 그래서 산업집중위험이 정답입니다. 법적위험, 신용등급변동위험, 규제위험, 조세위험은 사건리스크에 속합니다.", "tip": "포트폴리오 리스크 = 집중(거래·상품·산업) / 사건리스크 = 법적·신용등급변동·규제·조세", "terms": [{"term": "포트폴리오", "meaning": "여러 자산을 묶어서 함께 보유한 것."}, {"term": "사건리스크", "meaning": "법·규제·세금·신용등급 변화 같은 사건 때문에 생기는 리스크."}, {"term": "신용등급", "meaning": "돈을 갚을 능력을 등급으로 매긴 것."}]}], "tip": "시장위험: 주·채·통·상 / 재무적 리스크 = 시장·신용·유동성·운영·법적", "terms": [{"term": "시장위험", "meaning": "주가·이자율·환율 같은 시장 가격이 불리하게 움직여 손실을 볼 위험."}, {"term": "유동성위험", "meaning": "자산을 팔려고 할 때 살 사람이 없어 매우 불리한 조건으로 팔아야 하는 위험."}, {"term": "신용스프레드", "meaning": "신용도 차이 때문에 생기는 금리 차이(예: 회사채 금리 − 국채 금리)."}]}, {"no": 38, "topic": "리스크관리", "concept": "VaR의 개념과 해석", "q": "VaR(Value at Risk)에 대한 설명으로 가장 적절하지 않은 것은?", "choices": ["1일 VaR이 신뢰구간 95%에서 10억 원이라면, 향후 1일 동안 10억 원을 초과하는 손실이 발생할 확률이 5%라는 의미이다.", "측정기간(보유기간)이 길어질수록 VaR은 커진다.", "다른 조건이 동일한 상태에서 신뢰구간을 상향시키면 VaR은 작아진다.", "부서별 위험한도와 전체 위험한도를 VaR로 관리하면 포트폴리오 효과(분산투자효과)를 기대할 수 있다."], "answer": 2, "explanation": "신뢰구간을 높이면 VaR은 작아지는 것이 아니라 '커집니다'. 신뢰상수가 커지기 때문입니다(95% 1.65 → 99% 2.33). 보유기간이 길어져도 VaR은 √n배로 커집니다. VaR은 '정해진 기간 동안 정해진 신뢰수준에서 발생할 수 있는 최대손실 예상치'입니다.", "similar": [{"q": "어느 포지션의 1일 VaR이 신뢰수준 99%에서 20억 원이다. 이에 대한 해석으로 가장 적절한 것은?", "choices": ["향후 1일 동안 99%의 확률로 20억 원 이상의 손실이 발생한다.", "향후 1일 동안 20억 원을 초과하는 손실이 발생할 확률이 1%이다.", "향후 1일 동안 어떤 경우에도 손실은 20억 원을 넘지 않는다.", "향후 99일 동안 손실이 20억 원 이내일 확률이 1%이다."], "answer": 1, "explanation": "99% VaR이 20억 원이라는 것은 1일 동안 99% 확률로 손실이 20억 원 이내라는 뜻입니다. 거꾸로 말하면 20억 원을 넘는 손실이 날 확률이 1%입니다. VaR은 최대손실을 '확률적으로' 보여 줄 뿐, 절대 넘지 않는 상한이 아닙니다. 그래서 '어떤 경우에도 넘지 않는다'는 틀립니다.", "tip": "99% VaR X원 = X원 초과 손실 확률 1%", "terms": [{"term": "VaR", "meaning": "정해진 기간 동안 정해진 신뢰수준에서 발생할 수 있는 최대손실 예상치."}, {"term": "신뢰수준", "meaning": "VaR이 맞을 것이라고 믿는 확률(95%, 99% 등). 신뢰구간이라고도 한다."}, {"term": "상한", "meaning": "넘을 수 없는 가장 높은 한계."}]}, {"q": "VaR의 특징에 대한 설명으로 가장 적절하지 않은 것은?", "choices": ["VaR 측정 시 주식은 베타, 채권은 수정듀레이션, 옵션은 델타를 이용한다.", "VaR 계산값이 음수로 나오면 이익이 예상된다는 뜻이므로 위험이 없는 것으로 본다.", "신뢰상수는 95% 신뢰수준에서 1.65, 99% 신뢰수준에서 2.33을 사용한다.", "수치로 표시되는 값이므로 구체적이며 회사 간 비교가 가능하다."], "answer": 1, "explanation": "VaR은 위험의 크기이므로 계산값이 음수로 나와도 절대값으로 봅니다. 그래서 '음수면 위험이 없다'는 설명이 틀렸습니다. 민감도로는 주식은 베타, 채권은 수정듀레이션, 옵션은 델타를 씁니다. 신뢰상수는 95%에서 1.65, 99%에서 2.33입니다.", "tip": "민감도: 주식-베타, 채권-수정듀레이션, 옵션-델타 / 95% = 1.65, 99% = 2.33", "terms": [{"term": "베타", "meaning": "시장 전체가 움직일 때 그 주식(포트폴리오)이 얼마나 따라 움직이는지 나타내는 민감도."}, {"term": "수정듀레이션", "meaning": "채권수익률(금리)이 변할 때 채권가격이 몇 % 변하는지 나타내는 민감도."}, {"term": "델타", "meaning": "기초자산 가격이 1만큼 변할 때 옵션가격이 얼마나 변하는지 나타내는 민감도."}, {"term": "절대값", "meaning": "부호(+, −)를 떼고 본 크기."}]}, {"q": "VaR의 유용성(장점)에 대한 설명으로 가장 적절하지 않은 것은?", "choices": ["과거 데이터를 사용하므로 예기치 못한 구조변화가 발생해도 정확한 정보를 제공한다.", "수치로 표시되므로 구체적이고 회사 간 비교가 가능하다.", "제한된 투자자원을 효율적으로 배분하는 데 유용하다.", "각 거래부문별 거래한도를 설정할 수 있어 총량규제보다 효율적이다."], "answer": 0, "explanation": "VaR은 과거 데이터로 계산한 값입니다. 그래서 예기치 못한 구조변화가 생기면 잘못된 정보를 줄 수 있습니다. 이것은 장점이 아니라 단점이며, 이를 보완하는 것이 스트레스 테스트입니다. 수치로 표시되어 회사 간 비교가 가능하고, 자원을 효율적으로 배분하며, 부문별 거래한도를 정할 수 있다는 것은 VaR의 장점입니다.", "tip": "VaR 단점: 과거 데이터 의존 → 구조변화에 약함 → 스트레스 테스트로 보완", "terms": [{"term": "구조변화", "meaning": "시장의 틀이나 움직이는 방식 자체가 크게 바뀌는 것."}, {"term": "스트레스 테스트", "meaning": "극단적인 상황(시나리오)을 가정해서 그때 포트폴리오 가치가 얼마나 변하는지 재는 방법. 스트레스 검증법이라고도 한다."}, {"term": "거래한도", "meaning": "각 거래부문이 거래할 수 있도록 정해 둔 최대 범위."}]}], "tip": "신뢰수준↑ → 상수↑ → VaR↑ / 기간 n배 → VaR √n배", "terms": [{"term": "VaR", "meaning": "정해진 기간 동안 정해진 신뢰수준에서 발생할 수 있는 최대손실 예상치."}, {"term": "신뢰수준", "meaning": "VaR이 맞을 것이라고 믿는 확률(95%, 99% 등). 신뢰구간이라고도 한다."}, {"term": "신뢰상수", "meaning": "신뢰수준에 따라 곱하는 숫자. 95%는 1.65, 99%는 2.33이다."}, {"term": "분산투자효과", "meaning": "여러 자산에 나눠 투자해서 전체 위험이 개별 위험의 단순 합보다 작아지는 효과. 포트폴리오 효과라고도 한다."}]}, {"no": 39, "topic": "리스크관리", "concept": "델타-노말 방식 옵션 VaR 계산", "q": "KOSPI200 지수가 250pt, 주가지수수익률의 1일 기준 표준편차가 2%, 콜옵션의 델타가 0.5, 옵션가격이 10pt이다. 델타-노말 방식에 의한 95% 신뢰수준 1일 VaR은? (95% 신뢰상수 1.65)", "choices": ["4.125pt", "8.25pt", "0.165pt", "5.825pt"], "answer": 0, "explanation": "정답은 4.125pt입니다. 옵션 VaR은 옵션가격이 아니라 기초자산가격에 수익률 표준편차·델타·신뢰상수를 곱해 구합니다. 8.25는 델타를 빠뜨린 값입니다. 0.165는 기초자산가격 대신 옵션가격(10)을 넣은 값입니다. 5.825는 99% 상수(2.33)를 쓴 값입니다.\n공식: 옵션 VaR = 신뢰상수 × 기초자산가격 × 수익률 표준편차 × 델타\n① 1.65 × 250 = 412.5\n② 412.5 × 0.02 = 8.25\n③ 8.25 × 0.5 = 4.125pt", "similar": [{"q": "KOSPI200 지수가 200pt, 지수수익률의 1일 표준편차가 1.5%, 옵션의 델타가 0.4이다. 델타-노말 방식에 의한 99% 신뢰수준 1일 VaR은? (99% 신뢰상수 2.33)", "choices": ["1.980pt", "2.796pt", "6.990pt", "8.388pt"], "answer": 1, "explanation": "정답은 2.796pt입니다. 99% 신뢰수준이므로 신뢰상수 2.33을 씁니다. 1.980은 95% 상수(1.65)를 쓴 값입니다. 6.990은 델타를 빠뜨린 값입니다. 8.388은 필요 없는 √9(=3)를 곱한 값입니다.\n공식: VaR = 신뢰상수 × 기초자산가격 × 표준편차 × 델타\n① 2.33 × 200 = 466\n② 466 × 0.015 = 6.99\n③ 6.99 × 0.4 = 2.796pt", "tip": "옵션 VaR엔 옵션가격 말고 기초자산가격!", "terms": [{"term": "신뢰상수", "meaning": "신뢰수준에 따라 곱하는 숫자. 95%는 1.65, 99%는 2.33이다."}, {"term": "기초자산", "meaning": "옵션이나 선물의 가격을 결정하는 대상 자산(예: KOSPI200 지수)."}, {"term": "델타", "meaning": "기초자산 가격이 1만큼 변할 때 옵션가격이 얼마나 변하는지 나타내는 민감도."}]}, {"q": "주가지수가 300pt, 지수수익률의 1일 표준편차가 1%, 옵션의 델타가 0.5, 옵션가격이 15pt이다. 델타-노말 방식에 의한 95% 신뢰수준 1일 VaR은? (95% 신뢰상수 1.65)", "choices": ["0.124pt", "4.950pt", "3.495pt", "2.475pt"], "answer": 3, "explanation": "정답은 2.475pt입니다. 옵션가격(15pt)은 공식에 쓰지 않습니다. 0.124는 옵션가격(15)을 기초자산가격 자리에 넣은 오답입니다. 4.950은 델타를 빠뜨린 값입니다. 3.495는 99% 상수(2.33)를 쓴 값입니다.\n공식: VaR = 신뢰상수 × 기초자산가격 × 표준편차 × 델타\n① 1.65 × 300 = 495\n② 495 × 0.01 = 4.95\n③ 4.95 × 0.5 = 2.475pt", "tip": "옵션 VaR엔 옵션가격 말고 기초자산가격!", "terms": [{"term": "기초자산", "meaning": "옵션이나 선물의 가격을 결정하는 대상 자산(예: KOSPI200 지수)."}, {"term": "델타", "meaning": "기초자산 가격이 1만큼 변할 때 옵션가격이 얼마나 변하는지 나타내는 민감도."}, {"term": "표준편차(σ)", "meaning": "값들이 평균에서 얼마나 흩어져 있는지를 나타내는 숫자. 클수록 변동이 크다."}]}, {"q": "주가지수가 200pt, 지수수익률의 1일 표준편차가 2%, 옵션의 델타가 0.6이다. 델타-노말 방식에 의한 95% 신뢰수준 9일 VaR은? (95% 신뢰상수 1.65)", "choices": ["3.96pt", "35.64pt", "7.92pt", "11.88pt"], "answer": 3, "explanation": "정답은 11.88pt입니다. 먼저 1일 VaR을 구하고, 9일로 바꿀 때는 9가 아니라 √9 = 3을 곱합니다. 3.96은 1일 VaR 그대로입니다. 35.64는 √9가 아닌 9를 곱한 실수입니다. 7.92는 2를 곱한 값입니다.\n① 1일 VaR = 1.65 × 200 × 0.02 × 0.6 = 3.96pt\n② 9일 VaR = 3.96 × √9\n③ = 3.96 × 3 = 11.88pt", "tip": "N일 VaR = 1일 VaR × √N", "terms": [{"term": "보유기간", "meaning": "VaR을 계산할 때 기준으로 삼는 기간(1일, 10일 등). 측정기간이라고도 한다."}, {"term": "제곱근(√)", "meaning": "두 번 곱하면 그 값이 되는 수. 예: √9 = 3."}, {"term": "델타", "meaning": "기초자산 가격이 1만큼 변할 때 옵션가격이 얼마나 변하는지 나타내는 민감도."}]}], "tip": "옵션 VaR엔 옵션가격 말고 기초자산가격!", "terms": [{"term": "델타-노말 방식", "meaning": "델타(민감도)를 이용하고 수익률이 정규분포를 따른다고 보고 VaR을 구하는 방법."}, {"term": "기초자산", "meaning": "옵션이나 선물의 가격을 결정하는 대상 자산(예: KOSPI200 지수)."}, {"term": "델타", "meaning": "기초자산 가격이 1만큼 변할 때 옵션가격이 얼마나 변하는지 나타내는 민감도."}, {"term": "표준편차(σ)", "meaning": "값들이 평균에서 얼마나 흩어져 있는지를 나타내는 숫자. 클수록 변동이 크다."}]}, {"no": 40, "topic": "리스크관리", "concept": "채권(듀레이션)·주식(베타) VaR 계산", "q": "채권을 200억 원 보유하고 있다. 수정듀레이션은 4, 채권수익률 변화의 1일 기준 표준편차는 0.1%이다. 95% 신뢰수준의 1일 VaR은? (95% 신뢰상수 1.65)", "choices": ["1.864억 원", "13.2억 원", "0.8억 원", "1.32억 원"], "answer": 3, "explanation": "정답은 1.32억 원입니다. 채권 VaR은 시가·수정듀레이션·수익률 표준편차·신뢰상수를 곱해 구합니다. 1.864억은 2.33을 쓴 값입니다. 13.2억은 0.1%를 0.01로 잘못 바꾼 값입니다. 0.8억은 신뢰상수를 빠뜨린 값입니다.\n공식: 채권 VaR = 시가 × 수정듀레이션 × 수익률 표준편차 × 신뢰상수\n① 0.1% = 0.001\n② 200억 × 4 × 0.001 = 0.8억\n③ 0.8억 × 1.65 = 1.32억 원", "similar": [{"q": "주식 포트폴리오를 100억 원 보유 중이다. 주가지수의 일별수익률 표준편차가 2%, 포트폴리오의 베타가 1.2일 때 95% 신뢰수준 1일 VaR은? (95% 신뢰상수 1.65)", "choices": ["3.96억 원", "3.30억 원", "5.592억 원", "2.75억 원"], "answer": 0, "explanation": "정답은 3.96억 원입니다. 주식 VaR은 금액·시장수익률 표준편차·베타·신뢰상수를 곱해 구합니다. 3.30억은 베타를 빠뜨린 값입니다. 5.592억은 2.33을 쓴 값입니다. 2.75억은 베타로 나눈 값입니다.\n공식: 주식 VaR = 금액 × 시장수익률 표준편차 × 베타 × 신뢰상수\n① 100억 × 0.02 = 2억\n② 2억 × 1.2 = 2.4억\n③ 2.4억 × 1.65 = 3.96억 원", "tip": "주식 VaR = 금액 × 시장 σ × 베타 × 신뢰상수", "terms": [{"term": "베타", "meaning": "시장 전체가 움직일 때 그 주식(포트폴리오)이 얼마나 따라 움직이는지 나타내는 민감도."}, {"term": "포트폴리오", "meaning": "여러 자산을 묶어서 함께 보유한 것."}, {"term": "표준편차(σ)", "meaning": "값들이 평균에서 얼마나 흩어져 있는지를 나타내는 숫자. 클수록 변동이 크다."}]}, {"q": "국채를 500억 원 보유하고 있다. 수정듀레이션은 2.5, 만기수익률 변화의 1일 표준편차는 0.04%이다. 99% 신뢰수준 1일 VaR은? (99% 신뢰상수 2.33)", "choices": ["1.165억 원", "0.825억 원", "0.5억 원", "11.65억 원"], "answer": 0, "explanation": "정답은 1.165억 원(1억 1,650만 원)입니다. 99% 신뢰수준이므로 2.33을 곱합니다. 0.825억은 1.65를 쓴 값입니다. 0.5억은 신뢰상수를 빠뜨린 값입니다. 11.65억은 0.04%를 0.004로 잘못 바꾼 값입니다.\n공식: 채권 VaR = 시가 × 수정듀레이션 × 수익률 표준편차 × 신뢰상수\n① 0.04% = 0.0004\n② 500억 × 2.5 × 0.0004 = 0.5억\n③ 0.5억 × 2.33 = 1.165억 원", "tip": "채권 VaR = 금액 × 수정듀레이션 × σ × 신뢰상수 (% → 소수 변환 주의)", "terms": [{"term": "수정듀레이션", "meaning": "채권수익률(금리)이 변할 때 채권가격이 몇 % 변하는지 나타내는 민감도."}, {"term": "만기수익률", "meaning": "채권을 만기까지 가지고 있을 때 얻는 연 수익률."}, {"term": "신뢰상수", "meaning": "신뢰수준에 따라 곱하는 숫자. 95%는 1.65, 99%는 2.33이다."}]}, {"q": "주식 펀드를 200억 원 보유 중이다. 주가지수 일별수익률 표준편차가 2%, 펀드의 베타가 0.8일 때 95% 신뢰수준 25일 VaR은? (95% 신뢰상수 1.65)", "choices": ["5.28억 원", "26.4억 원", "132억 원", "37.28억 원"], "answer": 1, "explanation": "정답은 26.4억 원입니다. 1일 VaR을 먼저 구한 뒤, 25일로 바꿀 때는 √25 = 5를 곱합니다. 5.28억은 1일 VaR 그대로입니다. 132억은 √25가 아닌 25를 곱한 값입니다. 37.28억은 2.33을 쓴 값입니다.\n① 1일 VaR = 200억 × 0.02 × 0.8 × 1.65 = 5.28억\n② 25일 VaR = 5.28억 × √25\n③ = 5.28억 × 5 = 26.4억 원", "tip": "N일 VaR = 1일 VaR × √N", "terms": [{"term": "베타", "meaning": "시장 전체가 움직일 때 그 주식(포트폴리오)이 얼마나 따라 움직이는지 나타내는 민감도."}, {"term": "보유기간", "meaning": "VaR을 계산할 때 기준으로 삼는 기간(1일, 10일 등). 측정기간이라고도 한다."}, {"term": "제곱근(√)", "meaning": "두 번 곱하면 그 값이 되는 수. 예: √9 = 3."}]}], "tip": "채권 VaR = 금액 × 수정듀레이션 × σ × 신뢰상수 (% → 소수 변환 주의)", "terms": [{"term": "수정듀레이션", "meaning": "채권수익률(금리)이 변할 때 채권가격이 몇 % 변하는지 나타내는 민감도."}, {"term": "시가", "meaning": "지금 시장에서 거래되는 가격."}, {"term": "신뢰상수", "meaning": "신뢰수준에 따라 곱하는 숫자. 95%는 1.65, 99%는 2.33이다."}, {"term": "표준편차(σ)", "meaning": "값들이 평균에서 얼마나 흩어져 있는지를 나타내는 숫자. 클수록 변동이 크다."}]}, {"no": 41, "topic": "리스크관리", "concept": "VaR 보유기간·신뢰수준 전환", "q": "95% 신뢰수준, 보유기간 1일 기준 VaR이 3.3억 원이다. 99% 신뢰수준, 보유기간 9일 기준 VaR은? (95% 신뢰상수 1.65, 99% 신뢰상수 2.33)", "choices": ["13.98억 원", "9.90억 원", "41.94억 원", "4.66억 원"], "answer": 0, "explanation": "정답은 13.98억 원입니다. 신뢰수준과 보유기간을 둘 다 바꿔야 합니다. 9.90억은 신뢰수준 전환을 빠뜨린 값입니다. 41.94억은 √9가 아닌 9를 곱한 값입니다. 4.66억은 보유기간 전환을 빠뜨린 값입니다.\n공식: N일 VaR = 1일 VaR × √N × (전환 후 상수 / 전환 전 상수)\n① 신뢰수준 전환: 3.3 × (2.33 / 1.65) = 4.66억\n② 보유기간 전환: 4.66 × √9 = 4.66 × 3 = 13.98억 원", "similar": [{"q": "99% 신뢰수준, 보유기간 1일 기준 VaR이 4.66억 원이다. 95% 신뢰수준, 보유기간 16일 기준 VaR은? (95% 1.65, 99% 2.33)", "choices": ["18.64억 원", "52.8억 원", "13.2억 원", "3.3억 원"], "answer": 2, "explanation": "정답은 13.2억 원입니다. 99%에서 95%로 낮추므로 (1.65 / 2.33)을 곱하고, 16일로 늘리므로 √16 = 4를 곱합니다. 18.64억은 신뢰수준 전환을 빠뜨린 값입니다. 52.8억은 16을 그대로 곱한 값입니다. 3.3억은 보유기간 전환을 빠뜨린 값입니다.\n① 신뢰수준 전환: 4.66 × (1.65 / 2.33) = 3.3억\n② 보유기간 전환: 3.3 × √16 = 3.3 × 4 = 13.2억 원", "tip": "N일 VaR = 1일 VaR × √N × (전환 후 상수 / 전환 전 상수)", "terms": [{"term": "신뢰수준", "meaning": "VaR이 맞을 것이라고 믿는 확률(95%, 99% 등). 신뢰구간이라고도 한다."}, {"term": "보유기간", "meaning": "VaR을 계산할 때 기준으로 삼는 기간(1일, 10일 등). 측정기간이라고도 한다."}, {"term": "제곱근(√)", "meaning": "두 번 곱하면 그 값이 되는 수. 예: √9 = 3."}]}, {"q": "99% 신뢰수준, 보유기간 10일 기준 VaR이 20억 원이다. 동일 신뢰수준에서 보유기간 1일 기준 VaR은 약 얼마인가?", "choices": ["2.00억 원", "6.32억 원", "4.48억 원", "63.25억 원"], "answer": 1, "explanation": "정답은 약 6.32억 원입니다. 10일 VaR을 1일로 바꿀 때는 10이 아니라 √10으로 나눕니다. 2.00억은 10으로 나눈 실수입니다. 4.48억은 신뢰수준까지 95%로 바꾼 값입니다. 63.25억은 √10을 곱한 값입니다.\n① √10 ≈ 3.162\n② 1일 VaR = 20 / 3.162 ≈ 6.32억 원", "tip": "기간을 줄일 땐 √N으로 나누고, 늘릴 땐 √N을 곱한다", "terms": [{"term": "보유기간", "meaning": "VaR을 계산할 때 기준으로 삼는 기간(1일, 10일 등). 측정기간이라고도 한다."}, {"term": "제곱근(√)", "meaning": "두 번 곱하면 그 값이 되는 수. 예: √9 = 3."}]}, {"q": "VaR의 보유기간 및 신뢰수준에 대한 설명으로 가장 적절하지 않은 것은?", "choices": ["보유기간이 1일에서 4일로 늘어나면 VaR은 √4배, 즉 2배가 된다.", "보유기간 전환 시에는 보유일수의 제곱근을 곱한다.", "신뢰수준을 95%에서 99%로 높이면 VaR은 감소한다.", "신뢰수준 전환 시에는 전환 후 신뢰상수를 전환 전 신뢰상수로 나눈 비율을 곱한다."], "answer": 2, "explanation": "신뢰수준을 95%에서 99%로 높이면 신뢰상수가 1.65에서 2.33으로 커집니다. 그래서 VaR은 감소하는 것이 아니라 '증가'합니다. 보유기간을 바꿀 때는 √N배를 합니다(1일→4일이면 √4 = 2배). 신뢰수준을 바꿀 때는 (전환 후 상수 / 전환 전 상수)배를 합니다.", "tip": "기간 전환 → √N배, 신뢰수준 전환 → (후 상수 / 전 상수)배", "terms": [{"term": "신뢰수준", "meaning": "VaR이 맞을 것이라고 믿는 확률(95%, 99% 등). 신뢰구간이라고도 한다."}, {"term": "신뢰상수", "meaning": "신뢰수준에 따라 곱하는 숫자. 95%는 1.65, 99%는 2.33이다."}, {"term": "보유기간", "meaning": "VaR을 계산할 때 기준으로 삼는 기간(1일, 10일 등). 측정기간이라고도 한다."}]}], "tip": "N일 VaR = 1일 VaR × √N × (전환 후 상수 / 전환 전 상수)", "terms": [{"term": "신뢰수준", "meaning": "VaR이 맞을 것이라고 믿는 확률(95%, 99% 등). 신뢰구간이라고도 한다."}, {"term": "보유기간", "meaning": "VaR을 계산할 때 기준으로 삼는 기간(1일, 10일 등). 측정기간이라고도 한다."}, {"term": "신뢰상수", "meaning": "신뢰수준에 따라 곱하는 숫자. 95%는 1.65, 99%는 2.33이다."}]}, {"no": 42, "topic": "리스크관리", "concept": "포트폴리오 VaR과 분산효과", "q": "자산 A의 VaR은 60억 원, 자산 B의 VaR은 80억 원이고 두 자산 수익률의 상관 meaning": "위험에 대비해 필요한 자본. RAROC에서는 VaR을 말한다."}]}, {"q": "A의 VaR이 50억 원, B의 VaR이 70억 원이다. A와 B로 구성된 포트폴리오의 VaR이 100억 원일 때, A포지션의 Marginal VaR은?", "choices": ["50억 원", "20억 원", "80억 원", "30억 원"], "answer": 3, "explanation": "정답은 30억 원입니다. A의 Marginal VaR은 포트폴리오 VaR에서 A를 뺀 나머지(B만의) VaR을 빼서 구합니다. 50억은 A의 개별 VaR입니다. 20억은 개별 VaR 합(120)과 포트폴리오 VaR의 차이, 즉 분산효과입니다. 80억은 100에서 두 개별 VaR의 차이(70 − 50 = 20)를 뺀 값입니다.\n① A의 Marginal VaR = 포트폴리오 VaR − B의 VaR\n② = 100 − 70 = 30억 원", "tip": "A의 Marginal VaR = 전체 VaR − (A를 뺀 나머지의 VaR)", "terms": [{"term": "Marginal VaR", "meaning": "특정 투자대안을 기존 포트폴리오에 편입할 때 추가되는 VaR."}, {"term": "분산투자효과", "meaning": "여러 자산에 나눠 투자해서 전체 위험이 개별 위험의 단순 합보다 작아지는 효과. 포트폴리오 효과라고도 한다."}]}, {"q": "Marginal VaR과 RAROC에 대한 설명으로 가장 적절하지 않은 것은?", "choices": ["Marginal VaR은 특정 투자대안을 기존 포트폴리오에 편입할 때 추가되는 VaR이다.", "Marginal VaR이 클수록 우수한 투자대안이다.", "RAROC는 VaR을 이용하여 위험을 고려한 수익률 지표이다.", "기대수익률이 같다면 RAROC가 큰 투자대안이 더 우수하다."], "answer": 1, "explanation": "Marginal VaR은 '작을수록' 우수한 투자대안입니다. 그래서 '클수록 우수하다'는 설명이 틀렸습니다. Marginal VaR은 투자대안을 고를 때 유용한 정보를 줍니다. RAROC는 순수익을 VaR로 나눈 값으로, 클수록 좋습니다.", "tip": "Marginal VaR은 작을수록, RAROC는 클수록 좋다", "terms": [{"term": "Marginal VaR", "meaning": "특정 투자대안을 기존 포트폴리오에 편입할 때 추가되는 VaR."}, {"term": "RAROC", "meaning": "순수익을 VaR(위험자본)로 나눈 위험조정 수익률. 클수록 좋다."}, {"term": "편입", "meaning": "포트폴리오 안에 새로 넣는 것."}]}], "tip": "Marginal VaR은 작을수록, RAROC는 클수록 좋다", "terms": [{"term": "Marginal VaR", "meaning": "특정 투자대안을 기존 포트폴리오에 편입할 때 추가되는 VaR."}, {"term": "편입", "meaning": "포트폴리오 안에 새로 넣는 것."}, {"term": "기대수익률", "meaning": "평균적으로 얻을 것으로 예상되는 수익률."}, {"term": "포트폴리오", "meaning": "여러 자산을 묶어서 함께 보유한 것."}]}, {"no": 44, "topic": "리스크관리", "concept": "델타-노말 분석법의 특징", "q": "VaR 측정방법으로서 델타-노말 분석법에 대한 설명으로 가장 거리가 먼 것은?", "choices": ["부분가치평가법이므로 가치평가모형을 필요로 하지 않는다.", "가치평가모형을 이용하여 포지션을 완전가치로 평가한다.", "옵션이나 채권과 같은 비선형 금융상품을 평가할 경우 정확성이 떨어진다.", "자산수익률이 정규분포를 따른다고 전제한다."], "answer": 1, "explanation": "델타-노말 분석법은 완전가치가 아니라 '부분가치평가법'입니다. 1차 미분치(델타)만큼의 변동만 반영하므로 가치평가모형이 필요 없습니다. 정규분포를 전제하고 계산이 간단·빠르지만, 옵션·채권 같은 비선형상품에는 정확도가 떨어집니다. 완전가치평가법은 역사적 시뮬레이션·몬테카를로·스트레스 테스트입니다.", "similar": [{"q": "델타분석법으로 옵션 포지션의 VaR을 측정할 때의 문제점으로 가장 적절한 것은?", "choices": ["옵션 매입포지션의 위험은 과소평가되고, 옵션 매도포지션의 위험은 과대평가된다.", "옵션 매입포지션의 위험은 과대평가되고, 옵션 매도포지션의 위험은 과소평가된다.", "델타가 0인 스트래들 포지션도 감마를 반영하므로 위험이 정확히 측정된다.", "옵션포지션을 많이 포함할수록 정확도가 높아진다."], "answer": 1, "explanation": "델타분석법은 감마(곡률)를 무시합니다. 그래서 옵션 매입포지션의 위험은 과대평가되고, 매도포지션의 위험은 과소평가됩니다. 델타가 0인 스트래들은 VaR이 0으로 계산되어 전혀 위험하지 않은 것처럼 나옵니다. 옵션이 많을수록 정확도는 높아지지 않고 오히려 떨어집니다.", "tip": "델타법: 옵션 매입 위험은 과대, 매도 위험은 과소 (감마 무시)", "terms": [{"term": "감마", "meaning": "델타가 변하는 정도. 가격 곡선이 휘어진 정도(곡률)를 나타낸다."}, {"term": "과대평가·과소평가", "meaning": "실제보다 크게 평가하는 것이 과대평가, 작게 평가하는 것이 과소평가이다."}, {"term": "스트래들", "meaning": "같은 행사가격의 콜과 풋을 동시에 매입(또는 매도)하는 전략."}, {"term": "매입포지션", "meaning": "주식 등을 사서 들고 있는 상태."}]}, {"q": "델타-노말 분석법으로 옵션의 VaR을 측정할 경우, 측정에 필요한 요소로서 가장 적절한 것은?", "choices": ["기초자산가격", "옵션가격", "옵션의 행사가격", "무위험이자율"], "answer": 0, "explanation": "델타-노말 방식의 옵션 VaR 공식에는 기초자산가격이 들어갑니다. 옵션가격·행사가격·무위험이자율은 공식에 들어가지 않습니다. 델타-노말 방식은 가치평가모형이 필요 없기 때문입니다.\n공식: 옵션 VaR = 신뢰상수 × 기초자산가격 × 기초자산수익률 표준편차 × 델타", "tip": "옵션 VaR엔 옵션가격 말고 기초자산가격!", "terms": [{"term": "기초자산", "meaning": "옵션이나 선물의 가격을 결정하는 대상 자산(예: KOSPI200 지수)."}, {"term": "행사가격", "meaning": "옵션으로 사거나 팔 수 있도록 미리 정해 둔 가격."}, {"term": "무위험이자율", "meaning": "위험이 전혀 없는 자산(예: 국채)에서 얻는 이자율."}, {"term": "가치평가모형", "meaning": "상품의 가격을 계산해 내는 수학 공식(모형)."}]}, {"q": "스트래들 매도포지션의 VaR을 델타분석법으로 측정할 때 나타나는 현상으로 가장 적절한 것은?", "choices": ["델타가 매우 커서 실제 위험을 크게 과대평가하게 된다.", "델타가 0에 가까워 VaR이 0에 가깝게 계산되므로 실제 위험을 매우 과소평가하게 된다.", "감마를 반영하므로 완전가치평가법과 동일한 결과가 나온다.", "정규분포를 가정하지 않으므로 실제 위험이 정확히 측정된다."], "answer": 1, "explanation": "스트래들은 같은 행사가격의 콜과 풋을 동시에 매도하는 포지션입니다. 델타가 0에 가까워서 델타분석법으로는 VaR이 0처럼 계산됩니다. 그래서 실제 위험을 매우 과소평가합니다. 델타분석법은 감마를 반영하지 않는 부분가치평가법이고 정규분포를 전제하므로, 나머지 설명은 틀립니다.", "tip": "스트래들 매도 → 델타≈0 → VaR≈0 → 위험을 크게 과소평가", "terms": [{"term": "스트래들", "meaning": "같은 행사가격의 콜과 풋을 동시에 매입(또는 매도)하는 전략."}, {"term": "콜·풋", "meaning": "콜은 정해진 가격에 살 수 있는 권리, 풋은 정해진 가격에 팔 수 있는 권리이다."}, {"term": "행사가격", "meaning": "옵션으로 사거나 팔 수 있도록 미리 정해 둔 가격."}, {"term": "과대평가·과소평가", "meaning": "실제보다 크게 평가하는 것이 과대평가, 작게 평가하는 것이 과소평가이다."}]}], "tip": "부분가치 = 델타-노말 하나뿐 / 완전가치 = 역사적·몬테카를로·스트레스", "terms": [{"term": "부분가치평가법", "meaning": "가격 변동 전체가 아니라 민감도(델타)만큼의 변화만 반영해 대략 평가하는 방법."}, {"term": "완전가치평가법", "meaning": "가치평가모형으로 포지션 가치를 다시 계산해서 가격 변동 전체를 반영하는 방법."}, {"term": "비선형상품", "meaning": "기초자산 가격 변화와 상품 가격 변화가 직선처럼 비례하지 않는 상품(옵션·채권 등)."}, {"term": "정규분포", "meaning": "평균을 중심으로 좌우가 대칭인 종 모양의 분포."}]}, {"no": 45, "topic": "리스크관리", "concept": "역사적 시뮬레이션·몬테카를로 시뮬레이션", "q": "VaR 측정방법 중 역사적 시뮬레이션법에 대한 설명으로 가장 적절하지 않은 것은?", "choices": ["분산, 공분산 등과 같은 모수에 대한 추정을 요구하지 않는다.", "옵션이나 채권과 같은 비선형상품의 VaR을 측정할 경우 델타분석법보다 정확도가 떨어진다.", "수익률의 정규분포 가정이 필요하지 않다.", "표본기간(표본의 길이)에 지나치게 의존해서 측정치가 달라질 수 있다."], "answer": 1, "explanation": "역사적 시뮬레이션은 완전가치평가법입니다. 그래서 옵션·채권 같은 비선형상품에 대해 부분가치평가인 델타분석법보다 '더 정확'합니다. 모수 추정과 정규분포 가정이 필요 없고 개념이 쉽습니다. 하지만 과거 데이터가 없으면 쓸 수 없고, 결과가 표본기간의 질에 크게 좌우됩니다.", "similar": [{"q": "구조화된 몬테카를로 분석법(Structured Monte Carlo)에 대한 설명으로 가장 적절한 것은?", "choices": ["부분가치평가법으로서 가치평가모형이 필요하지 않다.", "계산이 간단하고 시간과 비용이 적게 든다.", "확률과정 선택과 무관하므로 모형위험이 존재하지 않는다.", "주가 움직임에 대한 확률모형으로 가장 흔히 사용되는 것은 기하학적 브라운운동모형이다."], "answer": 3, "explanation": "몬테카를로법은 확률분포를 가정해 아주 많은 시나리오를 만드는 완전가치평가법입니다. 주가 확률모형으로는 기하학적 브라운운동모형을 가장 흔히 씁니다. 비선형상품 VaR 측정에 가장 쓰기 좋지만, 시간과 비용이 많이 듭니다. 또 고른 확률과정이 비현실적이면 VaR도 비현실적이 되는 모형위험이 있습니다.", "tip": "몬테카를로: 완전가치·가장 정교 / 단점: 시간·비용 큼, 모형위험", "terms": [{"term": "몬테카를로 시뮬레이션", "meaning": "확률분포를 바탕으로 무작위 시뮬레이션을 아주 많이 반복해서 VaR을 구하는 방법."}, {"term": "기하학적 브라운운동모형", "meaning": "주가가 무작위로 오르내린다고 보고 주가 움직임을 나타낼 때 가장 흔히 쓰는 확률모형."}, {"term": "확률과정", "meaning": "시간에 따라 값이 확률적으로(무작위로) 변해 가는 모양을 나타낸 모형."}, {"term": "모형위험", "meaning": "선택한 모형이 현실과 맞지 않아서 결과가 틀어질 위험."}]}, {"q": "VaR 측정방법에 대한 설명으로 가장 적절한 것은?", "choices": ["옵션포지션의 평가에서 델타분석법은 역사적 시뮬레이션보다 정확하다.", "가격모형을 통해 옵션의 VaR을 평가하는 방법은 델타분석법뿐이다.", "역사적 시뮬레이션법은 과거 데이터가 없는 자산에도  {"term": "정규분포", "meaning": "평균을 중심으로 좌우가 대칭인 종 모양의 분포."}]}, {"no": 49, "topic": "리스크관리", "concept": "기대손실(EL) 계산", "q": "어느 은행이 200억 원의 대출을 하고 있다. 대출의 부도율은 3%이고 부도 시 회수율은 60%이다. 부도모형상 기대손실(EL)은?", "choices": ["3.6억 원", "2.4억 원", "6.0억 원", "0.24억 원"], "answer": 1, "explanation": "정답은 2.4억 원입니다. 회수율이 주어지면 먼저 1에서 빼서 손실률을 구합니다. 3.6억은 회수율(60%)을 손실률로 착각한 값입니다. 6.0억은 손실률을 빠뜨린 값입니다. 0.24억은 단위 실수입니다.\n공식: EL = 익스포저 × 부도율 × 손실률\n① 손실률 = 1 − 0.6 = 0.4\n② EL = 200 × 0.03 × 0.4 = 2.4억 원", "similar": [{"q": "어떤 은행이 100억 원의 대출을 하고 있다. 부도 시 회수율이 75%이며 기대손실(EL)이 2억 원이라고 할 때, 이 대출의 부도율은?", "choices": ["2.67%", "8%", "2%", "25%"], "answer": 1, "explanation": "정답은 8%입니다. 먼저 손실률을 구한 뒤 EL 공식을 거꾸로 풀어 부도율을 구합니다. 2.67%는 회수율(75%)을 손실률로 넣은 값입니다. 2%는 손실률을 무시한 값입니다. 25%는 손실률 자체입니다.\n① 손실률 = 1 − 0.75 = 0.25\n② EL = 100 × p × 0.25 = 2\n③ 25 × p = 2 → p = 2 / 25 = 8%", "tip": "손실률 = 1 − 회수율, EL = EAD × p × LGD", "terms": [{"term": "부도율", "meaning": "돈을 빌린 쪽이 부도날 확률(p)."}, {"term": "회수율", "meaning": "부도가 났을 때 돌려받을 수 있는 돈의 비율."}, {"term": "손실률(LGD)", "meaning": "부도가 났을 때 돌려받지 못하는 비율. 1 − 회수율이다."}]}, {"q": "어느 은행이 500억 원의 대출을 하고 있다. 대출의 부도율은 1%이고 손실률은 45%이다. 부도모형상 기대손실(EL)은?", "choices": ["5.00억 원", "2.75억 원", "2.25억 원", "22.5억 원"], "answer": 2, "explanation": "정답은 2.25억 원입니다. 손실률이 바로 주어졌으므로 그대로 곱합니다. 5.00억은 손실률을 빠뜨린 값입니다. 2.75억은 회수율(55%)을 넣은 값입니다. 22.5억은 부도율을 10%로 잘못 본 값입니다.\n공식: EL = 익스포저 × 부도율 × 손실률\n① EL = 500 × 0.01 × 0.45\n② = 5 × 0.45 = 2.25억 원", "tip": "손실률 = 1 − 회수율, EL = EAD × p × LGD", "terms": [{"term": "EL(기대손실·예상손실)", "meaning": "평균적으로 예상되는 손실. 비용(충당금)으로 처리한다."}, {"term": "익스포저(EAD)", "meaning": "부도 시 노출금액. 대출금처럼 떼일 수 있는 금액."}, {"term": "손실률(LGD)", "meaning": "부도가 났을 때 돌려받지 못하는 비율. 1 − 회수율이다."}]}, {"q": "신용위험의 예상손실(EL)과 예상외손실(UL)에 대한 설명으로 가장 적절하지 않은 것은?", "choices": ["EL은 익스포저 × 부도율 × 부도 시 손실률로 계산한다.", "EL은 평균적으로 예상되는 손실로 회계상 충당금 설정의 기준이 된다.", "UL은 확률적으로 드물게 발생하는 큰 손실로 자기자본 등으로 대비해야 한다.", "신용리스크는 신용손실분포로부터의 예상손실(EL)로 정의된다."], "answer": 3, "explanation": "신용리스크는 예상손실(EL)이 아니라 예상'외'손실(UL)로 정의됩니다. EL은 비용(충당금)으로 처리합니다. 다만 UL은 직접 재기 어려워서, 부도모형에서는 잴 수 있는 EL의 불확실성(변동성)을 신용위험으로 측정합니다. 나머지 세 설명은 맞습니다.", "tip": "EL = 비용(충당금), UL = 신용리스크(자기자본으로 대비)", "terms": [{"term": "EL(기대손실·예상손실)", "meaning": "평균적으로 예상되는 손실. 비용(충당금)으로 처리한다."}, {"term": "UL(예상외손실)", "meaning": "평균을 넘어 드물게 생기는 큰 손실. 신용리스크는 이것으로 정의된다."}, {"term": "충당금", "meaning": "앞으로 생길 손실에 대비해 미리 비용으로 쌓아 두는 돈."}, {"term": "자기자본", "meaning": "회사가 빌리지 않고 스스로 가진 돈."}]}], "tip": "손실률 = 1 − 회수율, EL = EAD × p × LGD", "terms": [{"term": "EL(기대손실·예상손실)", "meaning": "평균적으로 예상되는 손실. 비용(충당금)으로 처리한다."}, {"term": "회수율", "meaning": "부도가 났을 때 돌려받을 수 있는 돈의 비율."}, {"term": "손실률(LGD)", "meaning": "부도가 났을 때 돌려받지 못하는 비율. 1 − 회수율이다."}, {"term": "익스포저(EAD)", "meaning": "부도 시 노출금액. 대출금처럼 떼일 수 있는 금액."}]}, {"no": 50, "topic": "리스크관리", "concept": "부도모형의 EL 변동성(신용위험) 계산", "q": "어떤 은행이 100억 원의 대출을 하고 있다. 대출의 부도율은 4%, 손실률은 50%이며 부도율은 베르누이분포를 따른다. 부도모형상 신용위험(예상손실의 변동성, σEL)은 약 얼마인가?", "choices": ["9.80억 원", "2.00억 원", "10.00억 원", "19.60억 원"], "answer": 0, "explanation": "정답은 약 9.80억 원입니다. 부도율이 베르누이분포를 따르므로 변동성에는 √(p(1−p))를 씁니다. 2.00억은 EL(100×0.04×0.5)입니다. 10.00억은 √p만 쓰고 (1−p)를 빠뜨린 값입니다. 19.60억은 손실률을 빠뜨린 값입니다.\n공식: σEL = 익스포저 × √(p(1−p)) × 손실률\n① √(0.04 × 0.96) ≈ 0.196\n② 100 × 0.196 = 19.6\n③ 19.6 × 0.5 ≈ 9.80억 원", "similar": [{"q": "어느 은행이 300억 원의 대출을 하고 있다. 대출의 부도율은 10%이고 손실률은 60%이다(부도율은 베르누이분포). 부도모형상의 EL과 신용위험 측정액에 해당하는 EL의 변동성을 순서대로 옳게 연결한 것은?", "choices": ["18억 원, 90억 원", "30억 원, 54억 원", "54억 원, 18억 원", "18억 원, 54억 원"], "answer": 3, "explanation": "정답은 18억 원, 54억 원입니다. EL은 부도율 p를 곱하고, 변동성은 √(p(1−p))를 곱한다는 점만 다릅니다. 90억은 변동성에서 손실률을 빠뜨린 값입니다. 30억은 EL에서 손실률을 빠뜨린 값입니다. '54억, 18억'은 순서를 바꾼 것입니다.\n① EL = 300 × 0.1 × 0.6 = 18억 원\n② √(0.1 × 0.9) = √0.09 = 0.3\n③ σEL = 300 × 0.3 × 0.6 = 54억 원", "tip": "σEL = EAD × √(p(1−p)) × LGD (EL은 √ 없이 p를 곱함)", "terms": [{"term": "EL(기대손실·예상손실)", "meaning": "평균적으로 예상되는 손실. 비용(충당금)으로 처리한다."}, {"term": "베르누이분포", "meaning": "결과가 '일어난다/안 일어난다' 두 가지뿐인 확률분포(예: 부도/정상)."}, {"term": "변동성", "meaning": "값이 평균에서 얼마나 크게 오르내리는지의 정도(표준편차)."}]}, {"q": "어떤 은행이 50억 원의 대출을 하고 있고 손실률은 40%이다. 부도모형상 기대손실금액(EL)과 기대손실의 변동성금액(σEL)이 동일하다고 할 때, 이 대출의 부도율은? (부도율은 베르누이분포를 따름)", "choices": ["50%", "40%", "25%", "60%"], "answer": 0, "explanation": "정답은 50%입니다. EL과 σEL의 식에는 익스포저와 손실률이 똑같이 곱해집니다. 그래서 둘이 같으려면 p와 √(p(1−p))가 같아야 합니다. 대출금액·손실률과 상관없이 항상 50%입니다.\n① EL = EAD × p × LGD, σEL = EAD × √(p(1−p)) × LGD\n② p = √(p(1−p))\n③ 양변 제곱: p² = p − p²\n④ 2p² = p → p = 0.5", "tip": "EL = σEL이면 부도율 0.5", "terms": [{"term": "EL(기대손실·예상손실)", "meaning": "평균적으로 예상되는 손실. 비용(충당금)으로 처리한다."}, {"term": "베르누이분포", "meaning": "결과가 '일어난다/안 일어난다' 두 가지뿐인 확률분포(예: 부도/정상)."}, {"term": "변동성", "meaning": "값이 평균에서 얼마나 크게 오르내리는지의 정도(표준편차)."}]}, {"q": "어떤 은행이 100억 원의 대출을 하고 있다. 대출의 부도율은 20%, 손실률은 50%이며 부도율은 베르누이분포를 따른다. 예상손실의 변동성(σEL)은?", "choices": ["10억 원", "8억 원", "20억 원", "40억 원"], "answer": 2, "explanation": "정답은 20억 원입니다. 변동성을 구할 때는 p(1−p)에 반드시 제곱근을 씌워야 합니다. 10억은 EL(100×0.2×0.5)입니다. 8억은 제곱근을 씌우지 않은 분산 형태(0.2×0.8)를 쓴 값입니다. 40억은 손실률을 빠뜨린 값입니다.\n① √(0.2 × 0.8) = √0.16 = 0.4\n② σEL = 100 × 0.4 × 0.5 = 20억 원", "tip": "σEL = EAD × √(p(1−p)) × LGD (EL은 √ 없이 p를 곱함)", "terms": [{"term": "변동성", "meaning": "값이 평균에서 얼마나 크게 오르내리는지의 정도(표준편차)."}, {"term": "베르누이분포", "meaning": "결과가 '일어난다/안 일어난다' 두 가지뿐인 확률분포(예: 부도/정상)."}, {"term": "분산", "meaning": "값들이 평균에서 흩어진 정도를 나타내는 값. 표준편차를 제곱한 것이다."}]}], "tip": "σEL = EAD × √(p(1−p)) × LGD (EL은 √ 없이 p를 곱함)", "terms": [{"term": "베르누이분포", "meaning": "결과가 '일어난다/안 일어난다' 두 가지뿐인 확률분포(예: 부도/정상)."}, {"term": "변동성", "meaning": "값이 평균에서 얼마나 크게 오르내리는지의 정도(표준편차)."}, {"term": "익스포저(EAD)", "meaning": "부도 시 노출금액. 대출금처럼 떼일 수 있는 금액."}, {"term": "손실률(LGD)", "meaning": "부도가 났을 때 돌려받지 못하는 비율. 1 − 회수율이다."}]}]}, {"name": "직무윤리 및 법규 / 투자운용 및 전략 I 등", "short": "법규·운용I", "desc": "실제 시험 50문항 배분 그대로 · 직무윤리 5 / 자본시장법 11 / 협회규정 3 / 주식 6 / 채권 6 / 파생 6 / 성과분석 4 / 거시 4 / 분산투자 5", "items": [{"no": 1, "topic": "직무윤리", "concept": "이해상충 방지의무와 자기거래 금지", "q": "금융투자업자의 이해상충 방지 및 자기거래 금지에 대한 설명으로 옳지 않은 것은?", "choices": ["투자중개업자가 투자자의 rm": "겸직", "meaning": "본래 업무 외에 다른 업무를 함께 맡는 것."}, {"term": "과태료", "meaning": "법을 어긴 것에 대해 행정기관이 물리는 돈(형벌은 아니다)."}]}, {"no": 6, "topic": "자본시장법·금융위원회규정", "concept": "금융투자상품의 범위(명시적 배제)", "q": "자본시장법상 금융투자상품에 해당하는 것은?", "choices": ["원화표시 양도성예금증서(CD)", "관리형신탁의 수익권", "ELS 등 파생결합증권", "주식매수선택권(스톡옵션)"], "answer": 2, "explanation": "ELS·ELW 같은 파생결합증권은 파생상품이 아니라 '증권'으로서 금융투자상품에 해당한다. 그래서 이것이 정답이다. 나머지는 금융투자상품에서 명시적으로 빠진다. 원화표시 CD는 예금에 준하기 때문이다. 관리형신탁의 수익권은 신탁업자에게 처분권한이 없기 때문이다. 주식매수선택권은 받을 때 돈을 내지 않고 유통성도 적기 때문이다.", "similar": [{"q": "투자성(원금손실 가능성) 판단 시 투자금액 산정에 포함되는 것은?", "choices": ["판매수수료", "보험계약의 사업비", "환매수수료", "위험보험료"], "answer": 2, "explanation": "투자성을 판단할 때 환매수수료는 투자금액 산정에 포함된다. 그래서 이것이 정답이다. 중도해지수수료와 세금도 포함된다. 반면 판매수수료, 보험의 사업비, 위험보험료는 투자금액에서 빠진다.", "tip": "'들어갈 때 비용(판매수수료·사업비)'은 제외, '나올 때 비용(환매·해지수수료)·세금'은 포함.", "terms": [{"term": "투자성", "meaning": "투자한 원금보다 돌려받는 돈이 적어질 수 있는 가능성(원금손실 가능성)."}, {"term": "환매수수료", "meaning": "펀드를 중간에 되팔아(환매) 돈을 찾을 때 내는 수수료."}, {"term": "판매수수료", "meaning": "펀드를 팔 때 한 번 받는 수수료."}]}, {"q": "금융투자상품의 정의와 관련된 설명으로 옳지 않은 것은?", "choices": ["금융투자상품은 원금초과손실(추가지급의무) 가능 여부에 따라 증권과 파생상품으로 구분된다.", "투자성 유무에 따라 금융투자상품과 비금융투자상품으로 구분된다.", "ELS·ELW 등 파생결합증권은 자본시장법상 파생상품으로 분류된다.", "사적인 금전채권(차용증)은 채무증권에 해당하지 않는다."], "answer": 2, "explanation": "파생결합증권은 원금초과손실이 없으므로 파생상품이 아니라 '증권'으로 분류된다. 그래서 '파생상품으로 분류된다'는 설명이 틀렸고 정답이다. 투자성이 있는지에 따라 금융투자상품인지 아닌지를 나눈다. 추가지급의무가 있는지에 따라 증권(손실 100% 이하)과 파생상품(100% 초과)을 나눈다. 차용증 같은 사적인 금전채권은 채무증권이 아니다.", "tip": "투자성 → 금융투자상품 여부, 추가지급의무 → 증권/파생상품 구분.", "terms": [{"term": "파생결합증권", "meaning": "주가, 금리 같은 기초자산의 움직임에 따라 받을 돈이 정해지는 증권(ELS, ELW 등)."}, {"term": "원금초과손실", "meaning": "투자한 원금보다 더 크게 잃어서 돈을 추가로 내야 하는 손실."}, {"term": "투자성", "meaning": "투자한 원금보다 돌려받는 돈이 적어질 수 있는 가능성(원금손실 가능성)."}, {"term": "채무증권", "meaning": "국채, 회사채처럼 돈을 빌렸다는 사실(빚)을 나타내는 증권."}]}, {"q": "특정 투자자가 그 투자자와 타인 간의 공동사업에 금전 등을 투자하고 주로 타인이 수행한 공동사업의 결과에 따른 손익을 귀속받는 계약상의 권리가 표시된 증권은?", "choices": ["투자계약증권", "파생결합증권", "수익증권", "증권예탁증권"], "answer": 0, "explanation": "공동사업
