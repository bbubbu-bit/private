<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>투자자산운용사 CBT 모의고사</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Nanum+Myeongjo:wght@400;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: CBT 시험장 화면 — 상단 수험정보 바 + 과목 탭, 왼쪽 문제지(명조), 오른쪽 고정 OMR 답안표기란 */
:root{
  --paper:#f6f7f9; --sheet:#ffffff; --ink:#18212f; --ink-2:#4a5568; --line:#d9dee6; --line-2:#eceff4;
  --navy:#1d3a63; --navy-ink:#ffffff; --accent:#2457a6; --accent-soft:#e7eefa;
  --ok:#17804a; --ok-soft:#e5f4ec; --bad:#c8322d; --bad-soft:#fbe9e8; --warn:#a86a00; --warn-soft:#fbf1dc;
  --omr:#e4547a; --omr-soft:#fdeef2;
  --f-q:"Nanum Myeongjo","Batang","AppleMyungjo",serif;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11151c; --sheet:#181e28; --ink:#e6eaf0; --ink-2:#a3adbc; --line:#2c3544; --line-2:#222a36;
  --navy:#0d1a2e; --navy-ink:#e6eaf0; --accent:#7aa7ec; --accent-soft:#1d2b44;
  --ok:#4cc488; --ok-soft:#14301f; --bad:#f07a74; --bad-soft:#3a1c1c; --warn:#e3a94a; --warn-soft:#352812;
  --omr:#f08aa6; --omr-soft:#3a1e28; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11151c; --sheet:#181e28; --ink:#e6eaf0; --ink-2:#a3adbc; --line:#2c3544; --line-2:#222a36;
  --navy:#0d1a2e; --navy-ink:#e6eaf0; --accent:#7aa7ec; --accent-soft:#1d2b44;
  --ok:#4cc488; --ok-soft:#14301f; --bad:#f07a74; --bad-soft:#3a1c1c; --warn:#e3a94a; --warn-soft:#352812;
  --omr:#f08aa6; --omr-soft:#3a1e28; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--navy);color:var(--navy-ink)}
.top-in{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding-block:10px}
.brand{display:flex;flex-direction:column;line-height:1.25}
.brand b{font-size:16px;font-weight:700;letter-spacing:.01em}
.brand span{font-size:12px;opacity:.75}
.meta{display:flex;gap:18px;margin-left:auto;flex-wrap:wrap;font-size:12.5px}
.meta div{display:flex;flex-direction:column;line-height:1.2}
.meta small{opacity:.7;font-size:11px;letter-spacing:.04em}
.meta strong{font-family:var(--f-num);font-size:15px;font-variant-numeric:tabular-nums}
.tabs{max-width:1180px;margin:0 auto;display:flex;gap:2px;overflow-x:auto}
.tab{appearance:none;border:0;background:transparent;color:var(--navy-ink);opacity:.7;padding:9px 16px 10px;cursor:pointer;font-weight:600;font-size:14px;border-bottom:3px solid transparent;white-space:nowrap}
.tab:hover{opacity:1}
.tab[aria-selected="true"]{opacity:1;border-bottom-color:var(--omr)}
.tab em{font-style:normal;font-family:var(--f-num);font-size:12px;opacity:.8;margin-left:6px}

/* main layout */
.wrap{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:24px;padding-block:20px 60px}
@media (max-width:900px){.wrap{grid-template-columns:minmax(0,1fr)}.side{order:-1}}

.subhead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 16px;margin-bottom:14px}
.subhead h1{font-family:var(--f-q);font-size:24px;font-weight:800;margin:0;text-wrap:balance}
.subhead p{margin:0;color:var(--ink-2);font-size:13px}
.filters{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.chip{appearance:none;border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}

/* question paper */
.paper{background:var(--sheet);border:1px solid var(--line);border-radius:4px}
.q{padding:22px 24px 20px;border-top:1px solid var(--line-2);scroll-margin-top:120px}
.q:first-child{border-top:0}
@media (max-width:520px){.q{padding:18px 16px}}
.qhead{display:flex;gap:10px;align-items:baseline;margin-bottom:8px;flex-wrap:wrap}
.qno{font-family:var(--f-num);font-weight:600;font-size:15px;color:var(--accent)}
.topic{font-size:11.5px;color:var(--ink-2);border:1px solid var(--line);border-radius:3px;padding:0 6px;letter-spacing:.02em}
.status{margin-left:auto;font-size:12px;font-weight:700;letter-spacing:.04em}
.status.ok{color:var(--ok)} .status.bad{color:var(--bad)}
.qtext{font-family:var(--f-q);font-size:16.5px;font-weight:700;white-space:pre-line;margin:0 0 12px;max-width:70ch}
.choices{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.ch{appearance:none;width:100%;text-align:left;display:flex;gap:10px;align-items:flex-start;background:transparent;border:1px solid transparent;border-radius:4px;padding:7px 10px;cursor:pointer;font-family:var(--f-q);font-size:15.5px;line-height:1.55}
.ch:hover:not(:disabled){background:var(--accent-soft);border-color:var(--line)}
.ch:disabled{cursor:default}
.ch .mk{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ink-2);display:grid;place-items:center;font-family:var(--f-ui);font-size:12px;font-weight:600;margin-top:1px}
.ch .tx{min-width:0;white-space:pre-line}
.ch.pick-ok{background:var(--ok-soft);border-color:var(--ok)}
.ch.pick-ok .mk{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.ch.pick-bad{background:var(--bad-soft);border-color:var(--bad)}
.ch.pick-bad .mk{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.ch.is-ans{background:var(--ok-soft);border:2px solid var(--ok);padding:6px 9px}
.ch.is-ans .mk{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.ch .flag{flex:none;margin-left:auto;align-self:center;font-family:var(--f-ui);font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:999px;white-space:nowrap}
.ch.is-ans .flag{background:var(--ok);color:var(--sheet)}
.ch.pick-ok .flag{background:var(--ok);color:var(--sheet)}
.ch.pick-bad .flag{background:var(--bad);color:var(--sheet)}
.ch.pick-bad .tx{text-decoration:line-through;text-decoration-color:var(--bad)}
.qtext strong{color:var(--bad);text-decoration:underline;text-underline-offset:3px}
.terms{margin-top:10px;display:grid;gap:4px;font-size:13.5px}
.terms dt{font-weight:700;display:inline}
.terms div{background:var(--sheet);border:1px solid var(--line);border-radius:4px;padding:6px 10px}
.terms dd{display:inline;margin:0;color:var(--ink-2)}
.tip{margin-top:10px;font-size:13.5px;background:var(--warn-soft);color:var(--ink);border-radius:4px;padding:6px 10px}
.tip b{color:var(--warn);margin-right:6px;display:inline;font-size:12px}
.exp-body{white-space:pre-line}
.tiplist{display:grid}
.tiprow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;padding:12px 18px;border-top:1px solid var(--line-2);align-items:start}
.tiprow:first-child{border-top:0}
.tiprow .c{font-size:12px;color:var(--ink-2)}
.tiprow .t{font-family:var(--f-q);font-weight:700;font-size:15.5px;white-space:pre-line}
.tiprow a{font-family:var(--f-num);font-size:12px;color:var(--accent);text-decoration:none;white-space:nowrap}
.tgroup{font-size:13px;font-weight:700;padding:14px 18px 6px;background:var(--paper);border-top:1px solid var(--line)}
.tgroup:first-child{border-top:0}

.exp{margin-top:12px;border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 14px;font-size:14px;border-radius:0 4px 4px 0}
.exp b{display:block;font-size:12px;letter-spacing:.06em;color:var(--accent);margin-bottom:2px}
.exp .concept{font-size:12.5px;color:var(--ink-2);margin-top:6px}

.sim{margin-top:16px;border:1px dashed var(--bad);border-radius:6px;padding:4px 0 2px;background:var(--sheet)}
.sim-h{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;padding:8px 16px 4px;font-size:13px}
.sim-h b{color:var(--bad);letter-spacing:.03em}
.sim-h span{color:var(--ink-2)}
.sim .q{padding:14px 16px;border-top:1px dashed var(--line)}
.sim .qtext{font-size:15.5px}

/* side OMR */
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 112px);align-self:start;display:grid;gap:14px}
@media (max-width:900px){.side{position:static}}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:4px;padding:14px}
.card h2{font-size:12px;letter-spacing:.08em;color:var(--ink-2);margin:0 0 10px;font-weight:600}
.score{display:flex;align-items:baseline;gap:8px}
.score .big{font-family:var(--f-num);font-size:34px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.score .of{color:var(--ink-2);font-size:13px}
.bar{height:6px;background:var(--line-2);border-radius:3px;margin:10px 0 6px;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:3px}
.bar .cut{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.small{font-size:12.5px;color:var(--ink-2)}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:999px;letter-spacing:.03em}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.wait{background:var(--line-2);color:var(--ink-2)}
.omr{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.omr a{display:flex;align-items:center;justify-content:center;gap:3px;height:28px;border:1px solid var(--line);border-radius:3px;text-decoration:none;color:var(--ink-2);font-family:var(--f-num);font-size:12px;font-variant-numeric:tabular-nums;background:var(--sheet)}
.omr a:hover{border-color:var(--omr)}
.omr a.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:600}
.omr a.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);font-weight:600}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:11.5px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
.btn{appearance:none;border:1px solid var(--line);background:var(--sheet);padding:7px 12px;border-radius:4px;cursor:pointer;font-size:13px;width:100%}
.btn:hover{border-color:var(--ink-2)}
.btn.danger{color:var(--bad);border-color:var(--bad)}

/* results */
.res{display:grid;gap:18px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;border-bottom:1px solid var(--line-2);text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--ink-2);font-weight:600;letter-spacing:.04em}
td.n{font-family:var(--f-num);font-variant-numeric:tabular-nums;text-align:right}
.weak{display:grid;gap:8px}
.weak-row{display:grid;grid-template-columns:minmax(0,1fr) 120px 64px;gap:12px;align-items:center;font-size:14px}
.weak-row .bar{margin:0}
.weak-row .bar i{background:var(--bad)}
.empty{padding:28px 24px;color:var(--ink-2);text-align:center}
.notice{font-size:12.5px;color:var(--ink-2);margin:0 0 14px;max-width:80ch}
@media (prefers-reduced-motion:no-preference){.exp,.sim{animation:fade .25s ease-out}@keyframes fade{from{transform:translateY(-3px)}to{transform:none}}}
</style>

milar": [{"q": "월세 300만원을 받는 임대용 부동산의 가치를 수익환원법으로 구하면? (단, 환원이율은 8%이고 월세가 순영업소득이라고 가정한다)", "choices": ["3억 6,000만원", "3,750만원", "2억 4,000만원", "4억 5,000만원"], "answer": 3, "explanation": "정답은 4억 5,000만원입니다. 수익환원법은 1년 동안의 순영업소득을 쓰므로 월세를 먼저 1년치로 바꿔야 합니다. 월세를 그대로 쓰면 300만 ÷ 0.08 = 3,750만원이라는 오답이 나옵니다.\n연간 순영업소득 = 300만원 × 12 = 3,600만원\n가치 = 3,600만원 ÷ 0.08 = 4억 5,000만원", "tip": "월세는 반드시 ×12", "terms": [{"term": "수익환원방식", "meaning": "그 부동산이 앞으로 벌어들일 수익을 바탕으로 가치를 구하는 방법"}, {"term": "환원이율", "meaning": "부동산이 1년에 버는 순이익을 그 부동산 가치로 나눈 비율. 수익을 가치로 바꿀 때 쓴다"}, {"term": "순영업소득(NOI)", "meaning": "실제로 들어온 소득에서 운영 비용을 뺀 순수한 이익(순운용소득)"}]}, {"q": "순영업소득(NOI)이 12억원인 부동산의 시장가치가 150억원일 때 자본환원율은?", "choices": ["8%", "1.25%", "12.5%", "6%"], "answer": 0, "explanation": "정답은 8%입니다. 직접환원법은 '가치 = NOI ÷ 환원율'이므로, 환원율은 NOI를 가치로 나눠 구합니다. 150 ÷ 12 = 12.5를 %로 착각하는 것이 흔한 실수입니다.\n환원율 = NOI ÷ 가치\n= 12 ÷ 150 = 0.08 = 8%", "tip": "환원율 = NOI / 가치", "terms": [{"term": "순영업소득(NOI)", "meaning": "실제로 들어온 소득에서 운영 비용을 뺀 순수한 이익(순운용소득)"}, {"term": "환원이율", "meaning": "부동산이 1년에 버는 순이익을 그 부동산 가치로 나눈 비율. 수익을 가치로 바꿀 때 쓴다"}]}, {"q": "다음 자료로 수익환원방식(직접환원법)에 의한 부동산 가치를 구하면?\n잠재총소득 5억원, 공실 및 대손 0.5억원, 기타소득(주차장 임대료 등) 0.3억원, 운용비용 1.8억원, 환원이율 6%", "choices": ["45억원", "50억원", "53.3억원", "80억원"], "answer": 1, "explanation": "정답은 50억원입니다. 실제총소득을 구할 때 공실은 빼고 기타소득은 더합니다. 기타소득을 더하지 않으면 2.7억 → 45억원, 운용비용을 빼지 않으면 4.8억 → 80억원이 됩니다.\n실제총소득 = 5 − 0.5 + 0.3 = 4.8억원\n순운용소득 = 4.8 − 1.8 = 3.0억원\n가치 = 3.0 ÷ 0.06 = 50억원", "tip": "잠재총소득 − 공실 + 기타소득 − 운용비용 = NOI", "terms": [{"term": "잠재총소득", "meaning": "빈 방 없이 모든 공간이 임대됐다고 가정했을 때 받을 수 있는 최대 소득"}, {"term": "공실", "meaning": "임대가 되지 않고 비어 있는 공간"}, {"term": "순영업소득(NOI)", "meaning": "실제로 들어온 소득에서 운영 비용을 뺀 순수한 이익(순운용소득)"}, {"term": "환원이율", "meaning": "부동산이 1년에 버는 순이익을 그 부동산 가치로 나눈 비율. 수익을 가치로 바꿀 때 쓴다"}]}], "tip": "가치 = 순이익 ÷ (무위험 + 위험보상)", "terms": [{"term": "순영업소득(NOI)", "meaning": "실제로 들어온 소득에서 운영 비용을 뺀 순수한 이익(순운용소득)"}, {"term": "유효총소득", "meaning": "임대료 등 잠재적인 총소득에서 공실과 못 받은 돈을 빼고 기타소득을 더한 실제 소득"}, {"term": "영업경비", "meaning": "부동산을 운영하는 데 드는 비용(관리비, 세금, 보험료 등)"}, {"term": "환원이율", "meaning": "부동산이 1년에 버는 순이익을 그 부동산 가치로 나눈 비율. 수익을 가치로 바꿀 때 쓴다"}]}, {"no": 46, "topic": "부동산관련상품", "concept": "부동산 경기와 부동산의 특성", "q": "부동산 경기가 호황일 때의 상황과 가장 거리가 먼 것은?", "choices": ["과거 사례가격은 새로운 거래가격의 상한선이 된다.", "매도인 중시 현상이 커진다.", "건축허가 신청이 급증세를 보인다.", "부동산 가격이 상승하고 거래가 활발하며 경기가 후퇴할 가능성을 가진다."], "answer": 0, "explanation": "정답은 '과거 사례가격은 새로운 거래가격의 상한선이 된다'입니다. 호황(상향)국면에서는 가격이 계속 오르므로, 과거 사례가격은 새 거래가격의 상한선이 아니라 하한선이 됩니다. 가격이 오르고 거래가 활발하며 후퇴할 가능성이 있다는 것은 호황의 특징이 맞습니다. 매도인 중시 현상, 건축허가 신청 급증도 호황의 특징입니다.", "similar": [{"q": "부동산 경기의 특징에 대한 설명으로 옳지 않은 것은?", "choices": ["일반경기순환의 4국면 외에 '안정시장'이라는 특수국면이 있다.", "상업용·공업용 부동산 경기는 일반경기에 역행하는 경향이 있다.", "일반경기 변동보다 정점이 높고 저점이 깊다.", "주거용 부동산 경기는 일반경기에 후행하거나 역행한다."], "answer": 1, "explanation": "정답은 '상업용·공업용 부동산 경기는 일반경기에 역행하는 경향이 있다'입니다. 상업용·공업용 부동산 경기는 일반경기와 같이 움직이는(동행) 편입니다. 일반경기에 후행하거나 역행하는 것은 주거용 부동산 경기입니다. 부동산 경기는 일반경기보다 정점이 높고 저점이 깊습니다. 또 회복·호황·후퇴·불황 외에 안정시장이라는 특수국면이 있습니다.", "tip": "상·공은 동행, 주거는 후행·역행", "terms": [{"term": "안정시장", "meaning": "가격이 크게 흔들리지 않고 꾸준히 유지되는 부동산 시장의 특수한 국면"}]}, {"q": "부동산이 개별적이어서 일물일가의 원칙이 적용되지 않게 되는 부동산의 자연적 특성은?", "choices": ["부동성", "영속성", "개별성", "부증성"], "answer": 2, "explanation": "정답은 개별성입니다. 개별성 때문에 세상에 똑같은 부동산이 없어서 일물일가의 원칙이 적용되지 않습니다. 부동성은 부동산 현상을 지역에 묶어 두는(국지화) 성질입니다. 영속성은 감가상각이 적용되지 않는 성질입니다. 부증성은 공급을 늘릴 수 없어(비탄력적) 희소성을 낳는 성질입니다.", "tip": "부동=국지화, 부증=희소, 영속=감가X, 개별=일물일가X", "terms": [{"term": "개별성", "meaning": "세상에 똑같은 부동산은 하나도 없다는 성질"}, {"term": "일물일가의 원칙", "meaning": "같은 물건은 같은 시장에서 하나의 가격을 가진다는 원칙"}, {"term": "부동성", "meaning": "땅은 위치를 옮길 수 없다는 성질"}, {"term": "부증성", "meaning": "땅은 새로 만들어 늘릴 수 없다는 성질"}]}, {"q": "부동산의 가치발생요인이 아닌 것은?", "choices": ["부동산의 효용성", "부동산의 상대적 희소성", "부동산의 유효수요", "부동산의 위치"], "answer": 3, "explanation": "정답은 부동산의 위치입니다. 부동산의 가치발생요인은 효용성, 상대적 희소성, 유효수요 세 가지입니다. 위치는 가치발생요인이 아니라 가격형성요인 중 개별요인에 속합니다.", "tip": "가치발생 = 효용·희소·유효수요", "terms": [{"term": "가치발생요인", "meaning": "부동산에 가치가 생기게 하는 요인(효용성, 상대적 희소성, 유효수요)"}, {"term": "효용", "meaning": "어떤 상품을 통해 얻는 만족이나 쓸모"}, {"term": "유효수요", "meaning": "사고 싶은 마음과 실제로 살 돈(구매력)을 함께 갖춘 수요"}]}], "tip": "호황엔 과거 가격이 바닥(하한선)", "terms": [{"term": "호황", "meaning": "경기가 좋아서 가격이 오르고 거래가 활발한 시기"}, {"term": "하한선", "meaning": "더 이상 내려가지 않는 가장 낮은 기준"}]}, {"no": 47, "topic": "부동산관련상품", "concept": "부동산 운용·매도 현금흐름 계산", "q": "다음 자료로 계산한 부동산의 납세 전 현금흐름은?\n잠재총소득 10억원, 공실 및 대손 1억원, 기타소득 0.5억원, 운용비용 3억원, 부채상환액 2억원, 소득세 0.5억원", "choices": ["4.5억원", "5.5억원", "4.0억원", "6.5억원"], "answer": 0, "explanation": "정답은 4.5억원입니다. 잠재총소득에서 시작해 공실은 빼고 기타소득은 더한 뒤, 운용비용과 부채상환액을 차례로 뺍니다. 소득세까지 빼면 납세 후 현금흐름(4.0억원)이 됩니다. 6.5억원은 순운용소득이고, 공실을 빼지 않으면 5.5억원이 나옵니다.\n실제총소득 = 10 − 1 + 0.5 = 9.5억원\n순운용소득 = 9.5 − 3 = 6.5억원\n납세 전 현금흐름 = 6.5 − 2 = 4.5억원", "similar": [{"q": "다음 자료로 계산한 부동산 매도 시 납세 후 지분복귀액(자기수취자본)은?\n예상매도가격 50억원, 매도비용 2억원, 미상환 저당대출잔고 20억원, 양도소득세 3억원", "choices": ["30억원", "25억원", "27억원", "28억원"], "answer": 1, "explanation": "정답은 25억원입니다. 매도가격에서 매도비용, 남은 대출, 양도소득세를 차례로 뺍니다. 28억원은 세금을 빼기 전 금액이고, 27억원은 매도비용을 빠뜨린 값입니다.\n매도순수익 = 50 − 2 = 48억원\n납세 전 자기수취자본 = 48 − 20 = 28억원\n납세 후 자기수취자본 = 28 − 3 = 25억원", "tip": "매도가 − 매도비용 − 대출잔고 − 양도세", "terms": [{"term": "지분복귀액", "meaning": "부동산을 팔고 비용과 대출을 갚은 뒤 투자자 손에 남는 돈(자기수취자본)"}, {"term": "저당대출", "meaning": "부동산을 담보로 잡고 빌리는 대출"}]}, {"q": "다음 자료로 계산한 순운용소득(NOI)은?\n잠재총소득 8억원, 공실 및 대손 0.8억원, 기타소득 0.2억원, 운용비용 2.4억원", "choices": ["4.6억원", "7.4억원", "5.8억원", "5.0억원"], "answer": 3, "explanation": "정답은 5.0억원입니다. 공실 및 대손은 빼고 기타소득은 더해 실제총소득을 구한 뒤, 운용비용을 뺍니다. 공실을 빼지 않으면 5.8억원, 기타소득을 빼 버리면 4.6억원입니다. 7.4억원은 실제총소득입니다.\n실제총소득 = 8 − 0.8 + 0.2 = 7.4억원\n순운용소득 = 7.4 − 2.4 = 5.0억원", "tip": "기타소득은 더하고, 공실·운용비용은 뺀다", "terms": [{"term": "순영업소득(NOI)", "meaning": "실제로 들어온 소득에서 운영 비용을 뺀 순수한 이익(순운용소득)"}, {"term": "잠재총소득", "meaning": "빈 방 없이 모든 공간이 임대됐다고 가정했을 때 받을 수 있는 최대 소득"}, {"term": "공실", "meaning": "임대가 되지 않고 비어 있는 공간"}, {"term": "대손", "meaning": "받아야 할 돈(임대료 등)을 못 받게 되는 것"}]}, {"q": "실제총소득이 6억원, 운용비용이 2억원, 부채상환액이 1.5억원, 소득세가 0.5억원일 때 납세 후 현금흐름은?", "choices": ["3.5억원", "2.5억원", "2.0억원", "4.0억원"], "answer": 2, "explanation": "정답은 2.0억원입니다. 실제총소득에서 운용비용, 부채상환액, 소득세를 순서대로 뺍니다. 2.5억원은 납세 전 현금흐름, 4.0억원은 순운용소득입니다. 3.5억원은 부채상환액을 빠뜨린 값입니다.\n순운용소득 = 6 − 2 = 4억원\n납세 전 현금흐름 = 4 − 1.5 = 2.5억원\n납세 후 현금흐름 = 2.5 − 0.5 = 2.0억원", "tip": "NOI → 부채상환 → 소득세 순으로 뺀다", "terms": [{"term": "순영업소득(NOI)", "meaning": "실제로 들어온 소득에서 운영 비용을 뺀 순수한 이익(순운용소득)"}, {"term": "납세 전 현금흐름", "meaning": "순운용소득에서 대출 원리금(부채상환액)을 갚고 남은 돈. 세금은 아직 빼지 않은 것"}, {"term": "부채상환액", "meaning": "대출의 원금과 이자를 갚는 데 드는 돈"}]}], "tip": "잠재 → (−공실 +기타) 실제 → (−운용비용) NOI → (−부채상환) 납세전 → (−소득세) 납세후", "terms": [{"term": "잠재총소득", "meaning": "빈 방 없이 모든 공간이 임대됐다고 가정했을 때 받을 수 있는 최대 소득"}, {"term": "순영업소득(NOI)", "meaning": "실제로 들어온 소득에서 운영 비용을 뺀 순수한 이익(순운용소득)"}, {"term": "납세 전 현금흐름", "meaning": "순운용소득에서 대출 원리금(부채상환액)을 갚고 남은 돈. 세금은 아직 빼지 않은 것"}, {"term": "부채상환액", "meaning": "대출의 원금과 이자를 갚는 데 드는 돈"}]}, {"no": 48, "topic": "부동산관련상품", "concept": "부동산 투자분석 지표(PI·DCR·LTV·CoC)", "q": "최초 투자액이 10억원인 부동산 임대사업에서 1년 후 6.6억원, 2년 후 6.05억원의 현금흐름이 예상된다. 할인율이 10%일 때 수익성지수(PI, 편익비용비율)는?", "choices": ["1.00", "1.10", "1.265", "0.91"], "answer": 1, "explanation": "정답은 1.10입니다. 미래 현금흐름을 할인율로 할인해 현재가치로 바꾼 뒤, 최초투자액으로 나눕니다. 할인하지 않고 (6.6 + 6.05) ÷ 10 = 1.265로 계산하는 것이 대표적인 실수입니다. PI가 1보다 크면 투자를 채택합니다.\n현재가치 = 6.6/1.1 + 6.05/1.1² = 6.0 + 5.0 = 11억원\nPI = 현재가치 ÷ 최초투자액 = 11 ÷ 10 = 1.10", "similar": [{"q": "어떤 부동산의 순운용소득(NOI)이 3억원이고 연간 부채상환액이 2억원일 때 부채감당률(DCR)은?", "choices": ["0.67", "1.0", "2.0", "1.5"], "answer": 3, "explanation": "정답은 1.5입니다. DCR은 순운용소득을 부채상환액으로 나눈 값입니다. 분자와 분모를 바꾸면 0.67이 나옵니다. DCR은 원리금 상환능력을 재는 지표로, 1보다 클수록 상환능력이 좋습니다.\nDCR = 순운용소득 ÷ 부채상환액 = 3 ÷ 2 = 1.5", "tip": "DCR = 버는 돈(NOI) / 갚을 돈", "terms": [{"term": "부채감당률(DCR)", "meaning": "순운용소득을 부채상환액으로 나눈 값. 빚을 갚을 능력이 얼마나 되는지 보여 준다"}, {"term": "순영업소득(NOI)", "meaning": "실제로 들어온 소득에서 운영 비용을 뺀 순수한 이익(순운용소득)"}, {"term": "부채상환액", "meaning": "대출의 원금과 이자를 갚는 데 드는 돈"}]}, {"q": "가격이 20억원인 부동산을 매입하면서 12억원을 저당대출로 조달했다. 대출비율(LTV)은?", "choices": ["40%", "150%", "60%", "166.7%"], "answer": 2, "explanation": "정답은 60%입니다. LTV는 부동산 가격에서 대출금이 차지하는 비율입니다. 40%는 자기자본 비율이고, 166.7%는 분자와 분모를 바꾼 값입니다. LTV로 부동산 투자의 자본구조를 알 수 있습니다.\nLTV = 대출잔고 ÷ 부동산 가격 = 12 ÷ 20 = 60%", "tip": "LTV = Loan / Value", "terms": [{"term": "대출비율(LTV)", "meaning": "부동산 가격에 대한 대출금의 비율"}, {"term": "저당대출", "meaning": "부동산을 담보로 잡고 빌리는 대출"}, {"term": "자기자본", "meaning": "남에게 빌리지 않은 투자자 자신의 돈"}]}, {"q": "20억원짜리 부동산을 대출 12억원과 자기자본 8억원으로 매입했다. 당기 순현금흐름(납세 전 현금흐름)이 0.6억원일 때 CoC(Cash on Cash) 수익률은?", "choices": ["7.5%", "5.0%", "3.0%", "13.3%"], "answer": 0, "explanation": "정답은 7.5%입니다. CoC 수익률은 내가 넣은 자기자본으로 나눠야 합니다. 부동산 가격(20억)으로 나누면 3.0%, 대출금(12억)으로 나누면 5.0%가 되는 실수가 흔합니다. CoC 수익률은 화폐의 시간가치를 고려하지 않습니다.\nCoC 수익률 = 당기 순현금흐름 ÷ 자기자본 = 0.6 ÷ 8 = 7.5%", "tip": "CoC = 내 현금(자기자본) 대비 현금", "terms": [{"term": "CoC 수익률", "meaning": "투자자가 넣은 자기자본 대비 1년 동안 들어온 현금의 비율"}, {"term": "자기자본", "meaning": "남에게 빌리지 않은 투자자 자신의 돈"}, {"term": "납세 전 현금흐름", "meaning": "순운용소득에서 대출 원리금(부채상환액)을 갚고 남은 돈. 세금은 아직 빼지 않은 것"}]}], "tip": "PI = 미래CF 현가 / 최초투자액", "terms": [{"term": "수익성지수(PI)", "meaning": "앞으로 들어올 현금의 현재가치를 처음 투자한 돈으로 나눈 값. 1보다 크면 투자할 만하다"}, {"term": "현재가치", "meaning": "미래에 받을 돈을 지금 시점의 가치로 바꾼 금액"}, {"term": "할인율", "meaning": "미래의 돈을 현재가치로 바꿀 때 쓰는 비율"}]}, {"no": 49, "topic": "부동산관련상품", "concept": "부동산 PF의 채권보전(안전성 확보) 수단", "q": "PF 사업의 안정성을 확보하기 위한 수단 중 시공사를 통한 PF 채권보전수단과 가장 거리가 먼 것은?", "choices": ["책임분양 약정", "책임준공 약정", "채무인수", "부동산 담보신탁 설정"], "answer": 3, "explanation": "정답은 부동산 담보신탁 설정입니다. 부동산 담보신탁 설정은 저당권 설정과 함께 시공사가 아니라 시행사를 통한 수단입니다. 시공사를 통한 수단은 책임준공 약정, 책임분양 약정, 채무인수, 연대보증입니다. 제3자를 통한 수단은 주택사업금융보증과 PF보증입니다.", "similar": [{"q": "PF의 채권보전수단 중 하나인 부동산 담보신탁에 대한 설명으로 가장 적절하지 않은 것은?", "choices": ["담보물 관리는 신탁회사가 한다.", "후순위 권리설정을 배제할 수 있어 담보가치 유지에 유리하다.", "채권 실행 시 법원경매를 거쳐야 하므로 저당권보다 기간이 길다.", "저당권 설정에 비해 환가가액이 높다."], "answer": 2, "explanation": "정답은 '법원경매를 거쳐야 하므로 저당권보다 기간이 길다'입니다. 담보신탁은 신탁회사가 직접 팔기(공매) 때문에 법원경매를 거치는 저당권보다 채권 실행 기간이 짧습니다. 담보물을 신탁회사가 관리한다는 것은 맞습니다. 후순위 권리설정을 막을 수 있고, 환가가액이 높다는 것 은?", "choices": ["무한책임사원(GP)과 유한책임사원(LP)이 각각 1인 이상인 합자회사 형태이다.", "업무집행사원은 무한책임사원 중에서 선정한다.", "무한책임사원은 노무나 신용으로 출자할 수 있다.", "유한책임사원은 PEF에 투자한 금액의 범위 안에서만 책임을 진다."], "answer": 2, "explanation": "무한책임사원(GP)은 노무나 신용으로 출자할 수 없다. 반드시 금전(돈)이나 시장성 있는 유가증권으로 출자해야 한다. 그래서 '노무나 신용으로 출자할 수 있다'는 설명이 틀렸다. GP와 LP가 각 1인 이상인 합자회사라는 점, GP 중에서 업무집행사원을 뽑는 점, LP는 투자한 금액까지만 책임진다는 점은 모두 옳다.", "similar": [{"q": "PEF의 Clawback 조항에 대한 설명으로 옳은 것은?", "choices": ["유한책임사원이 약정한 투자금을 무한책임사원이 요청할 수 있는 조항이다.", "무한책임사원에게 이미 분배한 성과보수라도 PEF에 손실이 발생하면 손실보전에 충당해야 하는 의무이다.", "핵심인력으로 지정된 사원이 명시된 기간 내 회사를 그만둘 수 없도록 하는 조항이다.", "유한책임사원이 PEF와 동등한 자격으로 투자대상 기업에 추가 투자하는 조항이다."], "answer": 1, "explanation": "Clawback은 GP에게 이미 준 성과보수라도 PEF에 손실이 나면 그 손실을 메우는 데 쓰게 하는 의무다. 이 의무는 무한책임사원(GP)에게만 적용된다. 투자금을 요청하는 것은 Capital Call, 핵심인력이 그만두지 못하게 하는 것은 Key Man Clause, 함께 추가로 투자하는 것은 Coinvestment이다.", "tip": "Claw(발톱)로 GP 성과보수를 '다시 긁어온다'", "terms": [{"term": "Clawback", "meaning": "GP가 이미 받은 성과보수를 나중에 손실이 나면 다시 돌려놓게 하는 조항"}, {"term": "성과보수", "meaning": "운용 성과에 따라 운용자에게 주는 보수"}, {"term": "무한책임사원(GP)", "meaning": "회사의 빚에 대해 끝까지(한도 없이) 책임을 지는 사원으로, PEF를 운영한다"}]}, {"q": "PEF가 투자회수(Exit) 시 일반적으로 가장 선호하는 방법은?", "choices": ["증권시장에 상장(IPO)", "일반 기업(동종기업)에 매각", "유상감자를 통한 자금회수", "PEF 자체를 상장"], "answer": 1, "explanation": "PEF가 투자금을 회수(Exit)할 때 가장 선호하는 방법은 동종(일반)기업에 매각하는 것이다. 선호 순서는 동종기업 매각 > 다른 PEF에 매각 > 증권시장 상장 > 유상감자 > PEF 자체 상장이다. 상장(IPO)은 공모절차와 심사가 복잡해서 매각보다 뒤로 밀린다.", "tip": "Exit 순서: 매각 → 상장 → 감자 → PEF상장", "terms": [{"term": "Exit", "meaning": "투자한 돈을 회수하는 것(투자회수)"}, {"term": "IPO", "meaning": "기업이 주식을 처음으로 증권시장에 상장하는 것"}, {"term": "유상감자", "meaning": "회사가 주주에게 돈을 돌려주고 자본금(주식 수)을 줄이는 것"}]}, {"q": "PEF의 유한책임사원(LP)과 무한책임사원(GP)에 대한 설명으로 옳지 않은 것은?", "choices": ["LP는 투자액만큼만 책임을 부담한다.", "GP의 출자내역은 비공개이고 LP의 출자내역은 공개된다.", "PEF는 등기 및 등록사항을 통해 GP의 내역을 공개한다.", "LP로는 연기금, 은행, 보험사 등이 주종을 이룬다."], "answer": 1, "explanation": "GP(무한책임사원)는 출자내역이 공개되고, LP(유한책임사원)는 출자내역이 공개되지 않는다. 그래서 이를 반대로 말한 설명이 틀렸다. LP가 투자액 한도 안에서만 책임진다는 점, 등기·등록으로 GP 내역을 공개한다는 점, 연기금·은행·보험사가 주요 LP라는 점은 옳다.", "tip": "GP는 '무한책임·공개', LP는 '유한책임·비공개'", "terms": [{"term": "무한책임사원(GP)", "meaning": "회사의 빚에 대해 끝까지(한도 없이) 책임을 지는 사원으로, PEF를 운영한다"}, {"term": "유한책임사원(LP)", "meaning": "자기가 투자한 금액만큼만 책임을 지는 사원"}]}], "tip": "GP = 무한책임·금전/유가증권 출자·업무집행", "terms": [{"term": "합자회사", "meaning": "무한책임사원과 유한책임사원이 함께 만든 회사 형태"}, {"term": "무한책임사원(GP)", "meaning": "회사의 빚에 대해 끝까지(한도 없이) 책임을 지는 사원으로, PEF를 운영한다"}, {"term": "유한책임사원(LP)", "meaning": "자기가 투자한 금액만큼만 책임을 지는 사원"}, {"term": "노무·신용출자", "meaning": "돈 대신 일(노동)이나 신용(이름값)으로 출자하는 것"}]}, {"no": 3, "topic": "대안투자운용/투자전략", "concept": "헤지펀드 운용전략 분류", "q": "헤지펀드 운용전략 중 방향성 전략으로만 묶인 것은?", "choices": ["주식시장중립형, 전환사채 차익거래", "합병차익거래, 부실채권투자", "글로벌매크로, 이머징마켓 헤지펀드", "채권차익거래, 매도전문펀드"], "answer": 2, "explanation": "방향성 전략에는 주식의 롱숏(편중형), 글로벌매크로, 이머징마켓, 선물거래, 매도전문펀드가 있다. 그래서 글로벌매크로와 이머징마켓 헤지펀드로 묶인 것이 정답이다. 주식시장중립형, 채권차익거래, 전환사채 차익거래는 차익거래 전략이다. 합병차익거래와 부실채권투자는 상황의존형(Event Driven) 전략이다.", "similar": [{"q": "<보기>의 내용에 모두 부합하는 헤지펀드 운용전략은?\nㄱ. 위험을 적극적으로 취하고 상황에 따라 공매도와 차입을 사용한다.\nㄴ. 기업의 합병, 사업개편, 청산 및 파산 등 큰 사건에 따른 가격변동을 이용한다.\nㄷ. 합병차익거래, 부실채권투자전략 등이 있다.", "choices": ["차익거래(Relative Value) 전략", "상황의존형(Event Driven) 전략", "방향성(Directional) 전략", "펀드오브헤지펀드 전략"], "answer": 1, "explanation": "합병, 파산 같은 기업의 큰 사건(Event)을 이용하는 전략은 상황의존형(Event Driven) 전략이다. 대표적인 예가 합병차익거래와 부실채권투자다. 차익거래 전략은 이론가격과 시장가격의 차이를 수익원으로 삼는다. 방향성 전략은 시장이 움직이는 방향을 수익원으로 삼는다.", "tip": "Event = 합병·부실", "terms": [{"term": "상황의존형(Event Driven) 전략", "meaning": "합병·파산 같은 기업의 큰 사건으로 생기는 가격 변화를 이용하는 전략"}, {"term": "공매도", "meaning": "갖고 있지 않은 주식을 빌려서 먼저 판 뒤, 나중에 싸게 사서 갚아 차익을 노리는 거래"}, {"term": "차입", "meaning": "돈을 빌리는 것. 빌린 돈으로 투자 규모를 키우는 것을 레버리지라고 한다."}]}, {"q": "다음 중 헤지펀드의 차익거래 전략에 해당하지 않는 것은?", "choices": ["주식시장중립형", "채권차익거래(이자율 스프레드)", "주식의 롱숏(편중형)", "전환사채 차익거래"], "answer": 2, "explanation": "주식의 롱숏 중 편중형(Long 또는 Short Biased)은 방향성 전략이다. 그래서 차익거래 전략이 아닌 것은 주식의 롱숏(편중형)이다. 시장중립형(Equity Market Neutral), 채권차익거래, 전환사채 차익거래는 차익거래 전략이 맞다.", "tip": "롱숏이라도 '중립형'은 차익거래, '편중형'은 방향성", "terms": [{"term": "롱숏", "meaning": "오를 것 같은 자산은 사고(Long) 내릴 것 같은 자산은 파는(Short) 전략"}, {"term": "차익거래 전략", "meaning": "이론적인 가격과 실제 시장가격의 차이(괴리)를 이용해 수익을 내는 전략"}, {"term": "방향성 전략", "meaning": "시장이 오를지 내릴지 방향을 예측해 투자하는 헤지펀드 전략"}]}, {"q": "글로벌매크로(Global Macro) 전략에 대한 설명으로 가장 거리가 먼 것은?", "choices": ["투자결정 시 개별기업 분석에서 출발하는 Bottom-Up 방식을 사용한다.", "가장 광범위한 자산에 공매도·레버리지·파생상품 등 다양한 수단을 사용한다.", "경제추세나 특정 사건에 영향을 받는 시장방향 예측에 근거해 방향성에 투자한다.", "유동성이 풍부한 외환, 국채, 원자재 등에 대한 투자를 선호한다."], "answer": 0, "explanation": "글로벌매크로 전략은 거시경제의 불균형을 찾는 Top-Down 방식을 쓴다. 그래서 개별기업에서 출발하는 Bottom-Up 방식을 쓴다는 설명이 틀렸다. 이 전략은 헤지를 하지 않고 시장 방향에 베팅한다. 또 아주 넓은 자산에 다양한 수단을 쓰고, 유동성이 높은 외환·국채·원자재를 좋아한다.", "tip": "매크로 = Top-Down·노헤지", "terms": [{"term": "Top-Down", "meaning": "경제 전체(거시경제)를 먼저 보고 점점 산업·기업으로 내려가며 투자를 결정하는 방식"}, {"term": "Bottom-Up", "meaning": "개별 기업 분석에서 출발해 투자를 결정하는 방식"}, {"term": "레버리지", "meaning": "빌린 돈을 이용해 내 돈보다 더 큰 규모로 투자하는 것"}, {"term": "파생상품", "meaning": "주식·채권·통화 같은 기초자산의 가격에 따라 가치가 정해지는 상품(선물, 옵션, 스왑 등)"}]}], "tip": "차익거래 '중립·채권·CB', 상황의존 '합병·부실', 나머지는 방향성", "terms": [{"term": "방향성 전략", "meaning": "시장이 오를지 내릴지 방향을 예측해 투자하는 헤지펀드 전략"}, {"term": "차익거래 전략", "meaning": "이론적인 가격과 실제 시장가격의 차이(괴리)를 이용해 수익을 내는 전략"}, {"term": "상황의존형(Event Driven) 전략", "meaning": "합병·파산 같은 기업의 큰 사건으로 생기는 가격 변화를 이용하는 전략"}, {"term": "롱숏", "meaning": "오를 것 같은 자산은 사고(Long) 내릴 것 같은 자산은 파는(Short) 전략"}]}, {"no": 4, "topic": "대안투자운용/투자전략", "concept": "전환사채·채권 차익거래", "q": "전환사채 차익거래에 유리한 속성을 가진 전환사채로 가장 거리가 먼 것은?", "choices": ["기초자산의 변동성(볼록성)이 큰 전환사채", "전환프리미엄이 높은 전환사채", "유동성이 높고 기초주식을 빌리기 쉬운 전환사채", "배당이 없거나 배당률이 낮은 기초자산의 전환사채"], "answer": 1, "explanation": "전환사채 차익거래를 하는 사람은 전환프리미엄이 '낮은' 전환사채를 좋아한다. 그래서 '높은' 전환프리미엄이 유리하다는 설명이 틀렸다. 변동성(볼록성)이 크고, 유동성이 높아 주식을 빌리기 쉽고, 기초주식 배당이 낮으며, 낮은 내재변동성으로 발행된 전환사채가 유리하다. 이 전략의 구조는 기초주식 매도 + 전환사채 매수이다.", "similar": [{"q": "채권수익률곡선이 일시적인 시장변동으로 기울기가 완만해질(flattening) 것으로 예상될 때 적절한 채권차익거래 포지션은?", "choices": ["단기채 매수 + 장기채 매도", "단기채 매도 + 장기채 매수", "단기채 매수 + 장기채 매수", "단기채 매도 + 장기채 매도"], "answer": 1, "explanation": "수익률곡선의 기울기가 완만해질 것(플래트닝)으로 예상하면 단기채를 팔고 장기채를 사는 플래트너 포지션을 잡는다. 반대로 기울기가 가팔라질 것(스티프닝)으로 예상하면 장기채를 팔고 단기채를 사는 스티프너를 쓴다. 이런 전략(flattener, steepener, butterfly)은 차익거래 전략에 속한다.", "tip": "'단스장플' — 스티프닝이면 단기 매수, 플래트닝이면 장기 매수", "terms": [{"term": "수익률곡선", "meaning": "채권의 만기별 수익률을 이어 그린 선"}, {"term": "플래트닝", "meaning": "수익률곡선의 기울기가 완만해지는 것(장기·단기 금리 차이가 줄어듦)"}, {"term": "스티프닝", "meaning": "수익률곡선의 기울기가 가팔라지는 것(장기·단기 금리 차이가 커짐)"}]}, {"q": "합병차익거래(Merger Arbitrage)의 일반적인 포지션으로 옳은 것은?", "choices": ["인수기업 주식 매도 + 피인수기업 주식 매수", "인수기업 주식 매수 + 피인수기업 주식 매도", "인수기업·피인수기업 주식 모두 매수", "인수기업·피인수기업 주식 모두 매도"], "answer": 0, "explanation": "M&A가 발표되면 인수기업 주가는 떨어지고 피인수기업 주가는 오르는 경향이 있다. 그래서 인수기업 주식은 팔고 피인수기업 주식은 산다. 합병차익거래는 예측이 아니라 이미 발표된 정보에만 의존하는 상황의존형 전략이다.", "tip": "'사는 놈(인수) 팔고, 팔리는 놈(피인수) 산다'", "terms": [{"term": "합병차익거래", "meaning": "M&A가 발표되면 인수기업 주식은 팔고 피인수기업 주식은 사서 가격 변화로 이익을 내는 전략"}, {"term": "인수기업·피인수기업", "meaning": "인수기업은 다른 회사를 사는 회사, 피인수기업은 팔리는 회사"}, {"term": "상황의존형(Event Driven) 전략", "meaning": "합병·파산 같은 기업의 큰 사건으로 생기는 가격 변화를 이용하는 전략"}]}, {"q": "헤지펀드의 특성에 대한 설명으로 옳지 않은 것은?", "choices": ["기초자산을 보유하지 않고도 파생상품을 활용한 거래를 할 수 있다.", "설정과 환매가 자유로워 언제든지 환매할 수 있다.", "운용보수와 함께 고율의 성과보수를 부과한다.", "헤지펀드 운용자는 본인이 운용하는 헤지펀드에도 투자할 수 있다."], "answer": 1, "explanation": "헤지펀드는 보통 분기마다 환매할 수 있고, 처음 환매금지(Lock-up) 기간에는 환매가 금지된다. 그래서 언제든 환매할 수 있다는 설명이 틀렸다. 기초자산 없이 파생상품으로 거래하는 점, 운용자 본인도 투자할 수 있는 점, 높은 운용보수(약 2%)와 성과보수(약 20%)는 옳다.", "tip": "헤지펀드 = 고레버리지·고보수·저투명성·Lock-up", "terms": [{"term": "헤지펀드", "meaning": "공매도·차입·파생상품 등 다양한 방법을 써서 시장 상황과 관계없이 수익을 노리는 펀드"}, {"term": "환매금지기간(Lock-up Period)", "meaning": "투자한 뒤 일정 기간 동안 돈을 돌려받을(환매할) 수 없도록 정해 둔 기간"}, {"term": "기초자산", "meaning": "파생상품의 가치를 정하는 바탕이 되는 원래 자산"}, {"term": "성과보수", "meaning": "운용 성과에 따라 운용자에게 주는 보수"}]}], "tip": "CB차익 = 변동성↑·유동성↑·프리미엄↓·배당↓", "terms": [{"term": "전환사채", "meaning": "정해진 조건에 따라 주식으로 바꿀 수 있는 권리가 붙은 채권"}, {"term": "전환프리미엄", "meaning": "전환사채 가격이 주식으로 바꿨을 때의 가치보다 얼마나 비싼지를 나타내는 값"}, {"term": "변동성", "meaning": "가격이 위아래로 크게 출렁이는 정도"}, {"term": "내재변동성", "meaning": "옵션 등의 현재 가격에 반영되어 있는, 시장이 예상하는 앞으로의 변동성"}]}, {"no": 5, "topic": "대안투자운용/투자전략", "concept": "롱숏 전략 익스포저 계산", "q": "200억 원 규모의 포트폴리오에서 60억 원을 차입하여 Long Position 260억 원, Short Position 200억 원을 구축하였다. Net Market Exposure는?", "choices": ["230%", "130%", "30%", "60%"], "answer": 2, "explanation": "Net Market Exposure는 Long에서 Short를 뺀 뒤 포트폴리오 금액으로 나눈다. 130%는 Long/Short 비율(1.3)과 헷갈린 값이고, 230%는 Gross Exposure와 헷갈린 값이다.\n공식: Net Market Exposure = (Long - Short) / 포트폴리오 금액\n계산: (260 - 200) / 200 = 30%\n참고: Gross Exposure = (260 + 200) / 200 = 230%", "similar": [{"q": "100억 원 규모의 포트폴리오로 Long Position 150억 원, Short Position 120억 원을 구축하였다. Long-Short Ratio는?", "choices": ["1.25", "0.8", "1.5", "2.7"], "answer": 0, "explanation": "Long-Short Ratio는 Long 금액을 Short 금액으로 나눈 값이라 1.25가 정답이다. 0.8은 Short/Long, 1.5는 Long/포트폴리오, 2.7은 (Long+Short)/포트폴리오로 잘못 계산한 값이다. Long-Short Ratio는 낮을수록 손익분기점에 빨리 도달해 수익을 내기에 유리하다.\n공식: Long-Short Ratio = Long / Short\n계산: 150 / 120 = 1.25", "tip": "Long-Short Ratio = Long ÷ Short, 낮을수록 유리", "terms": [{"term": "Long-Short Ratio", "meaning": "Long 금액을 Short 금액으로 나눈 비율"}, {"term": "손익분기점", "meaning": "손해도 이익도 없는, 수익이 0이 되는 지점"}]}, {"q": "100억 원 규모의 포트폴리오에서 40억 원을 차입하여 Long Position 140억 원, Short Position 100억 원을 구축하였다. Gross Exposure는?", "choices": ["240%", "140%", "40%", "1.4배"], "answer": 0, "explanation": "Gross Exposure는 Long과 Short를 더한 뒤 포트폴리오 금액으로 나눈다. 40%는 Net Market Exposure이고, 1.4는 Long-Short Ratio이다. Gross Exposure가 높을수록 레버리지를 크게 쓰고 있다는 뜻이다.\n공식: Gross Exposure = (Long + Short) / 포트폴리오 금액\n계산: (140 + 100) / 100 = 240%", "tip": "Net = 차이, Gross = 합, Ratio = 나누기", "terms": [{"term": "Gross Exposure", "meaning": "(Long + Short)를 포트폴리오 금액으로 나눈 값으로, 전체 투자 규모(레버리지)를 보여 준다"}, {"term": "Net Market Exposure", "meaning": "(Long - Short)를 포트폴리오 금액으로 나눈 값으로, 시장 방향에 순수하게 노출된 정도"}, {"term": "레버리지", "meaning": "빌린 돈을 이용해 내 돈보다 더 큰 규모로 투자하는 것"}]}, {"q": "100억 원 포트폴리오에서 40억 원을 차입해 Long 140억 원, Short 100억 원을 구축한 경우에 대한 설명으로 옳지 않은 것은?", "choices": ["Net Market Exposure는 40%이다.", "Long-Short Ratio는 1.4이다.", "Long이 Short보다 크므로 Long Biased 전략이다.", "Long-Short Ratio가 높을수록 손익분기점에 빨리 도달한다."], "answer": 3, "explanation": "Long-Short Ratio는 낮을수록 유리하다. 낮을수록 손익분기점에 빨리 도달해서 빨리 수익을 낼 수 있다. 그래서 '높을수록 빨리 도달한다'는 설명이 틀렸다. 나머지는 모두 옳다.\nNet = (140 - 100) / 100 = 40%\nRatio = 140 / 100 = 1.4\nLong(140) > Short(100)이므로 Long Biased", "tip": "Long-Short Ratio는 낮을수록 손익분기점에 빨리 도달", "terms": [{"term": "Long-Short Ratio", "meaning": "Long 금액을 Short 금액으로 나눈 비율"}, {"term": "손익분기점", "meaning": "손해도 이익도 없는, 수익이 0이 되는 지점"}, {"term": "Long Biased", "meaning": "Long(매수)이 Short(매도)보다 커서 오르는 쪽에 더 기운 전략"}]}], "tip": "Net = 차이, Gross = 합, Ratio = 나누기", "terms": [{"term": "Net Market Exposure", "meaning": "(Long - Short)를 포트폴리오 금액으로 나눈 값으로, 시장 방향에 순수하게 노출된 정도"}, {"term": "Gross Exposure", "meaning": "(Long + Short)를 포트폴리오 금액으로 나눈 값으로, 전체 투자 규모(레버리지)를 보여 준다"}, {"term": "Long Position", "meaning": "자산을 사서 보유한 상태(매수 포지션)"}, {"term": "Short Position", "meaning": "자산을 빌려서 판 상태(매도 포지션)"}]}, {"no": 6, "topic": "대안투자운용/투자전략", "concept": "신용부도스왑(CDS)", "q": "신용부도스왑(CDS; Credit Default Swap)에 대한 설명으로 가장 거리가 먼 것은?", "choices": ["보장매수자가 보장매도자에게 프리미엄을 지급한다.", "신용위험 전가 사실을 차주가 알 수 없어 고객과의 우호적 관계를 유지할 수 있다.", "준거자산이 여러 개의 포트폴리오로 구성된 계약을 바스켓 디폴트 스왑이라 한다.", "신용위험뿐 아니라 시장위험까지 한 번에 전가할 수 있다."], "answer": 3, "explanation": "CDS는 신용위험만 넘길 수 있고, 시장위험은 넘길 수 없다. 그래서 시장위험까지 한 번에 넘긴다는 설명이 틀렸다. 신용위험과 시장위험을 함께 넘기는 상품은 TRS이다. 보장매수자가 보장매도자에게 프리미엄을 내는 점, 차주가 위험 전가 사실을 모르는 점, 바스켓 디폴트 스왑의 뜻은 모두 옳다.", "similar": [{"q": "CDS 프리미엄이 높아지는(비싸지는) 요인으로 옳지 않은 것은?", "choices": ["스왑계약의 만기가 길어질수록", "보장매도자의 신용등급이 높을수록", "준거자산의 기대회수율이 높을수록", "준거자산의 채무불이행확률이 높을수록"], "answer": 2, "explanation": "준거자산의 기대회수율이 '낮을수록' 손실이 커지므로 CDS 프리미엄이 비싸진다. 그래서 '회수율이 높을수록 비싸진다'는 설명이 틀렸다. 만기가 길수록, 보장매도자 신용등급이 높을수록(보장의 질이 좋음), 부도확률이 높을수록 프리미엄은 높아진다.", "tip": "만기↑·매도자등급↑·회수율↓·부도율↑ → 비싸다", "terms": [{"term": "프리미엄", "meaning": "CDS에서 보장을 받는 대가로 내는 돈(보험료와 비슷)"}, {"term": "준거자산", "meaning": "신용파생상품에서 신용위험을 사고파는 기준이 되는 자산(채권·대출 등)"}, {"term": "회수율", "meaning": "부도가 났을 때 빌려준 돈 중 돌려받을 수 있는 비율"}, {"term": "보장매수자·보장매도자", "meaning": "보장매수자는 프리미엄을 내고 신용위험을 넘기는 쪽, 보장매도자는 프리미엄을 받고 신용위험을 떠안는 쪽"}]}, {"q": "신용파생상품의 위험전가자와 위험인수자를 옳게 연결한 것은?", "choices": ["CDS: 보장매도자 → 보장매수자", "TRS: TRS매수자 → TRS매도자", "CLN: CLN투자자 → CLN발행자", "TRS: TRS매도자 → TRS매수자"], "answer": 3, "explanation": "위험을 넘기는 쪽(위험전가자)에서 받는 쪽(위험인수자) 순서로 보면, TRS는 TRS매도자 → TRS매수자이다. 그래서 이것이 정답이다. CDS는 보장매수자 → 보장매도자, CLN은 CLN발행자 → CLN투자자가 맞으므로 나머지 선지는 방향이 거꾸로다.", "tip": "CDS만 '매수자'가 위험을 넘기고, TRS·CLN은 '매도자/발행자'가 넘긴다", "terms": [{"term": "CDS", "meaning": "보장매수자가 프리미엄을 내고, 부도 같은 신용사건이 생기면 보장매도자가 손실을 메워 주는 신용파생상품(보험과 비슷)"}, {"term": "TRS", "meaning": "준거자산에서 나오는 모든 수익(총수익)을 넘기고 정해진 금리를 받는 신용파생상품. 신용위험과 시장위험을 함께 넘긴다."}, {"term": "CLN(신용연계채권)", "meaning": "일반채권에 CDS를 결합해, 발행자가 신용위험을 채권 투자자에게 넘기는 상품"}]}, {"q": "신용파생상품에 대한 설명으로 가장 적절하지 않은 것은?", "choices": ["CDS는 신용위험을 사고파는 가장 간단하고 보편화된 상품이다.", "CLN은 일반채권에 CDS를 결합한 상품이다.", "CDS 거래 시 보장매도자가 보장매수자에게 프리미엄을 지급한다.", "신용스프레드옵션은 신용스프레드를 일정한 행사가격에 사거나 팔 수 있는 권리이다."], "answer": 2, "explanation": "CDS에서는 보장매수자가 보장매도자에게 프리미엄을 낸다. 보장매도자는 그 대가로 신용사건이 생기면 손실을 메워 준다. 그래서 반대로 말한 설명이 틀렸다. CDS가 가장 간단하고 흔한 상품이라는 점, CLN = 채권 + CDS라는 점, 신용스프레드옵션의 뜻은 옳다.", "tip": "보험처럼 '보장 사는 쪽이 보험료(프리미엄)를 낸다'", "terms": [{"term": "보장매수자·보장매도자", "meaning": "보장매수자는 프리미엄을 내고 신용위험을 넘기는 쪽, 보장매도자는 프리미엄을 받고 신용위험을 떠안는 쪽"}, {"term": "CLN(신용연계채권)", "meaning": "일반채권에 CDS를 결합해, 발행자가 신용위험을 채권 투자자에게 넘기는 상품"}, {"term": "신용스프레드옵션", "meaning": "신용스프레드를 정해진 행사가격에 사거나 팔 수 있는 권리"}]}], "tip": "CDS = 신용위험만, TRS = 신용+시장", "terms": [{"term": "CDS", "meaning": "보장매수자가 프리미엄을 내고, 부도 같은 신용사건이 생기면 보장매도자가 손실을 메워 주는 신용파생상품(보험과 비슷)"}, {"term": "신용위험", "meaning": "돈을 빌린 쪽이 약속대로 돈을 갚지 못할 위험"}, {"term": "시장위험", "meaning": "금리·주가·환율 같은 시장가격이 변해서 손실을 볼 위험"}, {"term": "바스켓 디폴트 스왑", "meaning": "준거자산이 여러 개로 묶인 포트폴리오인 CDS 계약"}]}, {"no": 7, "topic": "대안투자운용/투자전략", "concept": "총수익스왑(TRS)과 CLN", "q": "총수익스왑(TRS; Total Return Swap)에 대한 설명으로 옳지 않은 것은?", "choices": ["신용위험뿐만 아니라 시장위험도 거래상대방에게 전가한다.", "TRS매수자는 시장기준금리에 TRS Spread를 가산한 금리를 TRS매도자에게 지급한다.", "만기일에 준거자산 가치가 최초 계약일보다 하락하면 그 차액을 TRS매도자가 TRS매수자에게 지급한다.", "준거자산의 의결권 등 경영권이 이전되지 않으므로 준거자산 매각이 곤란한 경우 적합하다."], "answer": 2, "explanation": "TRS매수자는 위험을 넘겨받는 위험인수자이다. 그래서 준거자산 가치가 떨어지면 그 차액은 TRS매수자가 TRS매도자에게 내야 한다. 따라서 TRS매도자가 낸다는 설명이 틀렸다. TRS매도자는 총수익을 넘기고 기준금리+스프레드를 받으며, 신용위험과 시장위험을 함께 넘기고 경영권은 넘기지 않는다(현금흐름 복제효과).", "similar": [{"q": "신용연계채권(CLN; Credit-Linked Notes)에 대한 설명으로 옳은 것은?", "choices": ["CDS를 채권 형태로 전환해 투자자에게 발행함으로써 신용위험을 전가한다.", "CLN 투자자가 위험전가자, CLN 발행자가 위험인수자이다.", "증권화되어 있지 않아 고도의 전문지식이 요구된다.", "신용위험과 시장위험을 동시에 전가하는 상품이다."], "answer": 0, "explanation": "CLN은 일반채권에 CDS를 결합한 것이다. 발행자가 CDS를 채권 형태로 바꿔 투자자에게 발행해서 신용위험을 넘긴다. 위험전가자는 CLN발행자, 위험인수자는 CLN투자자이므로 반대로 말한 선지는 틀렸다. 또 CLN은 증권화되어 있어 전문지식이 덜 필요하다. 신용위험과 시장위험을 함께 넘기는 것은 TRS의 특징이다.", "tip": "CLN = 채권 + CDS, 발행자 → 투자자로 위험 이전", "terms": [{"term": "CLN(신용연계채권)", "meaning": "일반채권에 CDS를 결합해, 발행자가 신용위험을 채권 투자자에게 넘기는 상품"}, {"term": "CDS", "meaning": "보장매수자가 프리미엄을 내고, 부도 같은 신용사건이 생기면 보장매도자가 손실을 메워 주는 신용파생상품(보험과 비슷)"}, {"term": "증권화", "meaning": "대출 같은 자산을 사고팔 수 있는 증권으로 만드는 것"}]}, {"q": "거래상대방에게 신용위험과 시장위험을 동시에 전가하며, 실제 자산의 양도 없이 동일한 현금흐름이 발생하는 '현금흐름 복제효과'가 있는 신용파생상품은?", "choices": ["CDS", "CLN", "TRS", "신용스프레드옵션"], "answer": 2, "explanation": "TRS(총수익스왑)는 준거자산의 총수익을 넘겨서 신용위험과 시장위험을 한 번에 헤지한다. 실제로 자산을 넘기지 않아도 같은 현금흐름이 생기는 현금흐름 복제효과가 있다. CDS와 CLN은 신용위험만 넘긴다.", "tip": "TRS의 T = Total(신용+시장 전부)", "terms": [{"term": "TRS", "meaning": "준거자산에서 나오는 모든 수익(총수익)을 넘기고 정해진 금리를 받는 신용파생상품. 신용위험과 시장위험을 함께 넘긴다."}, {"term": "현금흐름 복제효과", "meaning": "자산을 실제로 넘기지 않고도 그 자산을 가진 것과 같은 현금흐름이 생기는 효과"}, {"term": "신용위험", "meaning": "돈을 빌린 쪽이 약속대로 돈을 갚지 못할 위험"}, {"term": "시장위험", "meaning": "금리·주가·환율 같은 시장가격이 변해서 손실을 볼 위험"}]}, {"q": "특별자산펀드 중 CLN(Commodity Linked Notes)에 대한 설명으로 가장 적절하지 않은 것은?", "choices": ["투자자가 롤링위험과 잔차위험(트래킹에러)을 부담한다.", "금융공학과 실물시장이 교차되는 형태로, 만기를 가진 채권에 투자하는 것과 같다.", "투자자가 실물자산에 직접 투자하기 어려울 경우 활용한다.", "상품지수의 사례로는 RJ/CRB, S&P GSCI 등이 있다."], "answer": 0, "explanation": "Commodity Linked Notes는 발행자가 롤링위험과 잔차위험(트래킹에러)을 부담한다. 그래서 투자자는 이 위험에서 자유롭다. 따라서 투자자가 부담한다는 설명이 틀렸다. 만기 있는 채권과 비슷하다는 점, 실물에 직접 투자하기 어려울 때 쓴다는 점, RJ/CRB·S&P GSCI·DJ-AIGCI·RICI 같은 지수 사례는 옳다.", "tip": "상품 CLN은 '발행자가 위험 부담'", "terms": [{"term": "롤링위험", "meaning": "만기가 된 선물을 다음 만기 선물로 바꿔 탈 때(롤링) 생기는 손실 위험"}, {"term": "잔차위험(트래킹에러)", "meaning": "투자 성과가 따라가려는 지수와 얼마나 차이 나는지를 나타내는 위험"}, {"term": "상품지수", "meaning": "원유·금·곡물 같은 상품(Commodity) 가격을 모아 만든 지수"}]}], "tip": "TRS매수자 = 위험 인수 = 하락분 부담", "terms": [{"term": "TRS", "meaning": "준거자산에서 나오는 모든 수익(총수익)을 넘기고 정해진 금리를 받는 신용파생상품. 신용위험과 시장위험을 함께 넘긴다."}, {"term": "준거자산", "meaning": "신용파생상품에서 신용위험을 사고파는 기준이 되는 자산(채권·대출 등)"}, {"term": "TRS Spread", "meaning": "TRS매수자가 시장기준금리에 더해서 내는 추가 금리"}, {"term": "현금흐름 복제효과", "meaning": "자산을 실제로 넘기지 않고도 그 자산을 가진 것과 같은 현금흐름이 생기는 효과"}]}, {"no": 8, "topic": "대안투자운용/투자전략", "concept": "CDO의 구분과 트랜치", "q": "CDO(Collateralized Debt Obligation) 중 기초자산을 매각하지 않고도 신용위험을 이전할 수 있는 형태로만 묶인 것은?", "choices": ["CLN-CDO, 합성(Synthetic) CDO", "CLO, CBO", "전통 CDO, CLN-CDO", "현금흐름(Cash Flow) CDO, 합성 CDO"], "answer": 0, "explanation": "CLN-CDO와 합성 CDO는 기초자산을 팔지 않고도 신용위험을 넘길 수 있다. 그래서 고객관계가 그대로 유지된다. 특히 합성 CDO는 채권발행비용도 생기지 않는다. 반면 전통 CDO(CLO, CBO)와 현금흐름 CDO는 실제 자산을 SPC에 팔아(양도해) 고객관계가 나빠질 수 있다.", "similar": [{"q": "CDO 트랜치(Tranche)에 대한 설명으로 가장 거리가 먼 것은?", "choices": ["Senior 트랜치는 위험과 수익이 가장 낮으나 mark-to-market 위험이 있다.", "Mezzanine 트랜치는 잔여이익에 대한 참여권이 없다.", "Equity 트랜치는 수익을 만기에 한꺼번에 지급받는 방식이 일반적이다.", "Equity 트랜치는 위험과 수익이 가장 높은 후순위채권 성격이다."], "answer": 2, "explanation": "Equity 트랜치는 수익을 처음에 한꺼번에 받는 Up-Front 방식이다. 그래서 만기에 한꺼번에 받는다는 설명이 틀렸다. Equity 트랜치는 신용위험을 사는 포지션으로 옵션 성격을 가진다. Senior는 저위험·저수익이지만 시장평가(mark-to-market) 위험이 있고, Mezzanine은 잔여이익 참여권이 없으며, Equity는 손실을 가장 먼저 떠안는 후순위 성격이다.", "tip": "Equity = 첫 손실·Up-Front", "terms": [{"term": "트랜치(Tranche)", "meaning": "CDO를 위험과 수익의 크기에 따라 나눈 각각의 등급(Senior, Mezzanine, Equity)"}, {"term": "Up-Front", "meaning": "수익을 처음에 한꺼번에 미리 받는 방식"}, {"term": "mark-to-market", "meaning": "자산을 매일 시장가격으로 다시 평가하는 것(시가평가)"}, {"term": "후순위채권", "meaning": "부도 시 다른 채권보다 늦게 돈을 돌려받는 채권으로, 위험이 큰 대신 이자가 높다"}]}, {"q": "CDO의 신용등급을 평가하는 요소와 가장 거리가 먼 것은?", "choices": ["자산의 퀄리티", "발행사의 재무건전성", "신용보강", "자산운용매니저"], "answer": 1, "explanation": "CDO 신용등급은 자산의 퀄리티, 자산운용매니저, 신용보강, 기대신용손실, 거래구조, 법적위험, 거래감시 등으로 평가한다. 발행사(SPC)의 재무건전성은 평가요소가 아니다. 그래서 이것이 정답이다.", "tip": "CDO는 '담긴 자산과 구조'를 보지 발행사 재무를 보지 않는다", "terms": [{"term": "CDO", "meaning": "여러 채권·대출을 묶어 위험 순서별(트랜치)로 나눠 발행한 증권"}, {"term": "신용등급", "meaning": "돈을 잘 갚을 수 있는 능력을 등급으로 매긴 것"}, {"term": "신용보강", "meaning": "증권이 안전하게 상환되도록 보증 등 추가 장치를 붙이는 것"}, {"term": "SPC", "meaning": "자산을 넘겨받아 증권을 발행하는 일만 하려고 만든 특수목적회사"}]}, {"q": "CDO와 관련한 설명 중 빈칸에 들어갈 말을 순서대로 옳게 나열한 것은?\n(가) 자산보유자가 재무비율 개선, 최저요구자본 충족, 대출여력 확충 효과를 얻기 위해 보유자산을 대차대조표에서 제거하려고 발행하는 CDO\n(나) 기초자산 수익률과 유동화증권 수익률 간 차이에서 발생하는 차익을 목적으로 발행하는 CDO", "choices": ["(가) Arbitrage CDO, (나) Balance Sheet CDO", "(가) Balance Sheet CDO, (나) Arbitrage CDO", "(가) Synthetic CDO, (나) Cash Flow CDO", "(가) Static CDO, (나) Dynamic CDO"], "answer": 1, "explanation": "(가)처럼 위험을 넘기고 재무비율을 좋게 하려고 자산을 대차대조표에서 없애는 CDO는 Balance Sheet CDO이다. (나)처럼 수익률 차이(금리차)로 차익을 얻으려는 CDO는 Arbitrage CDO이다. 둘 다 '발행목적'에 따른 구분이다. Cash Flow/Synthetic은 위험전이 방법, Static/Dynamic은 운용방법에 따른 구분이다.", "tip": "대차대조표 = Balance Sheet, 차익 = Arbitrage", "terms": [{"term": "CDO", "meaning": "여러 채권·대출을 묶어 위험 순서별(트랜치)로 나눠 발행한 증권"}, {"term": "대차대조표", "meaning": "어느 시점에 회사가 가진 자산과 부채, 자본을 보여 주는 표(재무상태표)"}]}], "tip": "매각 O = 전통/현금흐름, 매각 X = CLN-CDO/합성", "terms": [{"term": "CDO", "meaning": "여러 채권·대출을 묶어 위험 순서별(트랜치)로 나눠 발행한 증권"}, {"term": "SPC", "meaning": "자산을 넘겨받아 증권을 발행하는 일만 하려고 만든 특수목적회사"}, {"term": "합성 CDO", "meaning": "자산을 실제로 넘기지 않고 CDS를 이용해 신용위험만 넘기는 CDO"}, {"term": "신용위험", "meaning": "돈을 빌린 쪽이 약속대로 돈을 갚지 못할 위험"}]}, {"no": 9, "topic": "해외증권투자운용/투자전략", "concept": "MSCI 지수", "q": "MSCI 지수에 대한 설명으로 가장 적절하지 않은 것은?", "choices": ["정부·계열사 보유지분 등 유통되기 어려운 주식을 제외한 유동시가총액 방식으로 산출한다.", "주가등락과 환율변동을 모 지하는 전략으로 적절한 것은?", "choices": ["달러 선물환 매수", "달러 통화선물 매수", "달러 콜옵션 매수", "달러 풋옵션 매수"], "answer": 3, "explanation": "앞으로 달러가 들어올 예정이면 달러 가치가 떨어질(환율 하락) 위험이 있다. 그래서 달러가 떨어질 때 이익이 나는 포지션이 필요하다. 달러 풋옵션 매수가 여기에 맞는다. 선물환 매도, 통화선물 매도, 콜옵션 매도도 적절하지만, 선지의 선물환 매수·통화선물 매수·콜옵션 매수는 달러가 오를 때 이익이 나므로 틀렸다.", "tip": "받을 돈(유입)은 '팔기' 헤지", "terms": [{"term": "풋옵션", "meaning": "정해진 가격에 팔 수 있는 권리"}, {"term": "콜옵션", "meaning": "정해진 가격에 살 수 있는 권리"}, {"term": "선물환", "meaning": "미래의 정해진 날에 정해진 환율로 통화를 사고팔기로 지금 약속하는 장외 계약"}, {"term": "통화선물", "meaning": "거래소에서 거래되는, 미래에 정해진 환율로 통화를 사고팔기로 한 계약"}]}, {"q": "달러화와 높은 양(+)의 상관관계를 가진 주식에 투자하는 미국 투자자의 경우, 환손실과 주가의 환율요인이 상쇄되어 환노출이 낮아진다. 이를 무엇이라 하는가?", "choices": ["롤링헤지", "통화구성 분산", "내재적 헤지", "교차헤지"], "answer": 2, "explanation": "주가와 통화가치 사이의 상관관계 때문에 따로 헤지하지 않아도 환노출이 낮아지는 것을 내재적 헤지라고 한다. 내재적 헤지는 헤지비용이 추가로 들지 않는다. 한국의 국제투자자들은 내재적 헤지를 이용하기 어렵다.", "tip": "'내재적' = 상품 안에 이미 헤지가 들어있다", "terms": [{"term": "내재적 헤지", "meaning": "주가와 통화가치의 상관관계 때문에 따로 헤지하지 않아도 환노출이 저절로 낮아지는 것"}, {"term": "환노출", "meaning": "환율 변화에 영향을 받는 정도"}, {"term": "상관관계", "meaning": "두 자산의 가격이 같은 방향으로 움직이는 정도. 낮을수록 서로 따로 움직여서 함께 담으면 위험이 줄어든다."}]}, {"q": "환위험과 환위험 헤지 전략에 대한 설명으로 옳지 않은 것은?", "choices": ["한국의 국제투자자들은 원화와 상관관계가 높은 해외주식이 많아 내재적 헤지를 이용하기 쉽다.", "투자자 자국통화 가치가 상승할 때는 포트폴리오 내 현금성자산을 모두 자국통화로 보유해야 환위험 회피가 가능하다.", "환노출은 위험요인이면서 동시에 수익의 원천이 된다.", "선물환, 통화스왑, 통화선물 등 통화파생상품을 이용해 헤지할 수 있다."], "answer": 0, "explanation": "한국의 국제투자자들은 내재적 헤지를 이용하기 어렵다. 그래서 '이용하기 쉽다'는 설명이 틀렸다. 통화파생상품(선물환·통화스왑·통화선물)으로 헤지하는 것, 자국통화가 강할 때 현금성자산을 자국통화로 보유하는 것, 환노출이 위험이자 수익원이라는 것은 옳다.", "tip": "내재적 헤지는 '미국(달러) 투자자'의 이야기", "terms": [{"term": "내재적 헤지", "meaning": "주가와 통화가치의 상관관계 때문에 따로 헤지하지 않아도 환노출이 저절로 낮아지는 것"}, {"term": "통화스왑", "meaning": "두 당사자가 서로 다른 통화의 원금과 이자를 일정 기간 맞바꾸는 계약"}, {"term": "현금성자산", "meaning": "현금이나 곧바로 현금으로 바꿀 수 있는 자산"}, {"term": "환노출", "meaning": "환율 변화에 영향을 받는 정도"}]}], "tip": "롤링위험 = 장내, 선물환 = 롤링위험 X", "terms": [{"term": "통화파생상품", "meaning": "통화(환율)를 기초자산으로 하는 파생상품(선물환, 통화선물, 통화옵션, 통화스왑 등)"}, {"term": "롤링위험", "meaning": "만기가 된 선물을 다음 만기 선물로 바꿔 탈 때(롤링) 생기는 손실 위험"}, {"term": "선물환", "meaning": "미래의 정해진 날에 정해진 환율로 통화를 사고팔기로 지금 약속하는 장외 계약"}, {"term": "내재적 헤지", "meaning": "주가와 통화가치의 상관관계 때문에 따로 헤지하지 않아도 환노출이 저절로 낮아지는 것"}]}, {"no": 12, "topic": "해외증권투자운용/투자전략", "concept": "주식예탁증서(DR)", "q": "DR(Depositary Receipt)에 대한 설명으로 가장 적절하지 않은 것은?", "choices": ["ADR은 SEC에 등록되고 뉴욕증권거래소나 나스닥 등 미국 거래소에서 거래된다.", "미국과 미국 이외의 거래소에 동시에 상장하는 DR은 GDR로 구분된다.", "ADR은 발행기업이 발행·상장비용을 부담하는 Sponsored DR 형태가 일반적이다.", "미국 이외의 거래소에만 상장되는 DR은 ADR로 구분된다."], "answer": 3, "explanation": "미국 이외의 거래소에만 상장되는 DR은 ADR이 아니라 EDR이다. 그래서 이 설명이 틀렸다. ADR은 SEC에 등록되어 미국 거래소에서 거래되고, GDR은 미국과 미국 외 거래소에 동시에 상장된다. ADR은 기업이 비용을 내는 Sponsored 형태가 일반적이다.", "similar": [{"q": "해외주식 발행(DR)에 대한 설명으로 가장 거리가 먼 것은?", "choices": ["우리나라 기업의 해외상장은 현지 제도와 관계없이 DR의 형태로 상장·거래된다.", "상장비용 측면에서는 EDR보다 ADR이 유리하다.", "달러화 표시 DR을 미국과 미국 이외의 거래소에 동시 상장하면 GDR이 된다.", "미국 증권회사가 비용을 부담하고 발행하는 DR을 Unsponsored DR이라 한다."], "answer": 1, "explanation": "상장비용 면에서는 ADR보다 EDR이 유리하다. 뉴욕시장은 DR 발행절차가 까다롭지만 공신력이 높다. 그래서 'ADR이 유리하다'는 설명이 틀렸다. 원화는 국제통화가 아니어서 국내기업은 모두 DR로 상장한다. 동시상장은 GDR, 증권회사가 비용을 내면 Unsponsored DR이다.", "tip": "비용은 EDR 유리, 공신력은 ADR(뉴욕) 높음", "terms": [{"term": "DR(예탁증서)", "meaning": "해외 주식 원본을 보관해 두고, 그것을 대신해 다른 나라 거래소에서 거래되도록 발행한 증서"}, {"term": "Unsponsored DR", "meaning": "증권회사가 비용을 부담해 발행하는 DR"}]}, {"q": "DR의 발행비용 부담주체에 따른 구분으로 옳은 것은?", "choices": ["Sponsored DR - 증권회사가 발행 및 상장비용 부담", "Unsponsored DR - 발행기업이 발행 및 상장비용 부담", "GDR - 투자자가 발행 및 상장비용 부담", "Sponsored DR - 발행기업이 발행 및 상장비용 부담"], "answer": 3, "explanation": "Sponsored DR은 발행기업이 직접 발행·상장비용을 낸다. 그래서 이것이 정답이다. Unsponsored DR은 증권회사가 비용을 낸다. GDR은 비용을 누가 내느냐가 아니라 상장장소(미국 + 미국 외 동시)에 따른 구분이다.", "tip": "Sponsor = 기업이 스폰서", "terms": [{"term": "Sponsored DR", "meaning": "발행기업이 직접 발행·상장비용을 부담하는 DR"}, {"term": "Unsponsored DR", "meaning": "증권회사가 비용을 부담해 발행하는 DR"}]}, {"q": "DR(예탁증서)의 일반적 특징으로 옳지 않은 것은?", "choices": ["해외주식의 표시통화를 거래소 국가의 표시통화로 전환한다.", "DR비율은 자유롭게 결정되어 1주를 여러 개로, 여러 개를 1주로 전환할 수 있다.", "원화는 국제통화가 아니므로 국내기업은 모두 DR 형태로 해외에 상장한다.", "DR 발행기업이 배당을 하면 현지통화가 아닌 원화로 DR 투자자에게 지급된다."], "answer": 3, "explanation": "ADR 발행기업이 배당을 하면 배당금은 보관은행을 거쳐 ADR 발행은행으로 간다. 그리고 미 달러화로 바뀌어 투자자에게 지급된다. 그래서 원화로 지급된다는 설명이 틀렸다. 표시통화를 바꿔 주는 점, DR비율을 자유롭게 정하는 점, 국내기업이 DR로 상장하는 점은 옳다.", "tip": "DR 배당 = 현지통화(ADR이면 달러)로 지급", "terms": [{"term": "DR(예탁증서)", "meaning": "해외 주식 원본을 보관해 두고, 그것을 대신해 다른 나라 거래소에서 거래되도록 발행한 증서"}, {"term": "보관은행", "meaning": "DR의 바탕이 되는 원래 주식을 맡아 보관하는 은행"}, {"term": "DR비율", "meaning": "원주 1주가 DR 몇 개에 해당하는지를 정한 비율"}]}], "tip": "A=America, E=Euro(미국 외), G=Global(동시)", "terms": [{"term": "DR(예탁증서)", "meaning": "해외 주식 원본을 보관해 두고, 그것을 대신해 다른 나라 거래소에서 거래되도록 발행한 증서"}, {"term": "SEC", "meaning": "미국의 증권거래위원회로, 미국 증권시장을 감독하는 기관"}, {"term": "Sponsored DR", "meaning": "발행기업이 직접 발행·상장비용을 부담하는 DR"}]}, {"no": 13, "topic": "해외증권투자운용/투자전략", "concept": "국제주식시장과 복수상장 효과", "q": "국내 상장기업이 미국 증시에 상장(복수상장)할 경우의 효과와 가장 거리가 먼 것은?", "choices": ["국내외 동시상장으로 상장비용이 절감된다.", "국제신인도가 올라가면서 자금조달 비용을 절감할 수 있다.", "기업지배구조의 투명성 제고 등으로 할인율이 감소할 수 있다.", "미국 시장에서의 홍보효과를 기대할 수 있다."], "answer": 0, "explanation": "국내와 해외에 동시상장하면 상장비용은 줄지 않고 오히려 더 든다. 그래서 '상장비용이 절감된다'는 설명이 틀렸다. 홍보효과, 국제신인도가 올라 자금조달비용이 줄어드는 것, 투명성이 높아져 할인율이 줄어드는 것은 복수상장의 효과이다.", "similar": [{"q": "국제주식시장에 대한 설명으로 가장 적절하지 않은 것은?", "choices": ["국제자본이동 자유화로 통합화가 진전되면 국제분산투자 효과가 약화된다.", "국제주식시장의 국제화는 외국거래소 상장주식 직접투자와 자국에 상장된 DR 투자의 두 방향으로 전개되었다.", "각국 주식시장 규모의 결정적 요인은 상장주식 시가총액이며, 투자자 거래행태나 주식보유 분포는 중요하지 않다.", "미국 기업들은 직접금융 조달 비중이 높아 GDP 대비 시가총액 비중이 높게 나타난다."], "answer": 2, "explanation": "각국 주식시장 규모를 정하는 결정적 요인은 상장주식 시가총액이다. 하지만 투자자의 거래행태와 주식보유 동기·분포도 중요하다. 그래서 '중요하지 않다'는 설명이 틀렸다. 통합화가 진전되면 분산효과가 약해지는 점, 직접투자와 DR투자의 두 방향, 미국의 높은 직접금융 비중은 옳다.", "tip": "시장규모 = 시가총액 + 거래행태·보유분포", "terms": [{"term": "시가총액", "meaning": "주가 × 발행주식 수. 회사 주식 전체의 시장가치"}, {"term": "통합화", "meaning": "자본시장 개방 같은 제도 변화로 여러 나라 시장이 하나처럼 합쳐지는 것"}, {"term": "직접금융", "meaning": "기업이 은행을 거치지 않고 주식·채권을 발행해 투자자에게서 직접 돈을 모으는 것"}]}, {"q": "복수상장(Multiple Listing)의 효과 또는 문제점에 대한 설명으로 옳지 않은 것은?", "choices": ["자금조달 원천의 다양화와 자본비용 절감이 가능하다.", "해외 투자자 지분이 늘어도 적대적 M&A의 대상이 될 가능성은 없다.", "해외시장으로 거래가 집중되면 가격결정 리더십을 상실할 우려가 있다.", "기업 인지도 상승과 투명성 제고로 기업가치가 상승할 수 있다."], "answer": 1, "explanation": "복수상장을 하면 적대적 M&A의 대상이 될 수 있다는 점이 단점으로 꼽힌다. 그래서 '가능성이 없다'는 설명이 틀렸다. 자금조달 원천이 다양해지고 자본비용이 줄어드는 점, 인지도·투명성이 높아지는 점, 해외로 거래가 몰리면 가격결정 리더십을 잃을 수 있다는 점은 옳다.", "tip": "복수상장 단점 = 적대적 M&A·가격결정 리더십 상실", "terms": [{"term": "복수상장", "meaning": "한 기업의 주식을 국내와 해외 등 여러 거래소에 함께 상장하는 것"}, {"term": "적대적 M&A", "meaning": "경영진이 원하지 않는데 강제로 회사를 인수하는 것"}, {"term": "가격결정 리더십", "meaning": "주가가 어느 시장의 거래로 주로 결정되는지에 대한 주도권"}]}, {"q": "본국에서 거래되는 주식을 DR이 아닌 원주 그대로 해외 거래소에 상장하는 방식은?", "choices": ["GDR", "Unsponsored DR", "원주상장(Direct Listing)", "EDR"], "answer": 2, "explanation": "원주상장(직상장)은 본국에서 거래되는 주식을 DR로 바꾸지 않고 그대로 해외에 상장하는 방식이다. 거래소 통화와 본국통화가 달라서 따로 시장부가 존재한다. 우리나라 기업은 현지 제도와 관계없이 DR 형태로 상장·거래되므로 원주상장을 하지 못한다.", "tip": "원주상장 = 주식 그대로, 한국 기업은 DR만", "terms": [{"term": "원주상장", "meaning": "DR이 아닌 본국 주식 원본 그대로 해외 거래소에 상장하는 방식"}, {"term": "DR(예탁증서)", "meaning": "해외 주식 원본을 보관해 두고, 그것을 대신해 다른 나라 거래소에서 거래되도록 발행한 증서"}]}], "tip": "복수상장 = 홍보·신인도·투명성 ↑, 비용은 ↑", "terms": [{"term": "복수상장", "meaning": "한 기업의 주식을 국내와 해외 등 여러 거래소에 함께 상장하는 것"}, {"term": "국제신인도", "meaning": "국제 금융시장에서 그 기업(나라)을 믿을 수 있는 정도"}, {"term": "할인율", "meaning": "미래 가치를 현재 가치로 바꿀 때 깎는 비율. 위험이 줄면 할인율도 작아진다."}, {"term": "기업지배구조", "meaning": "회사가 누구에 의해 어떻게 운영·감시되는지에 대한 구조"}]}, {"no": 14, "topic": "해외증권투자운용/투자전략", "concept": "유로채와 외국채 구분", "q": "다음 중 채권표시통화의 본국에서 발행되는 채권(외국채)이 아닌 것은?", "choices": ["양키본드", "사무라이본드", "딤섬본드", "아리랑본드"], "answer": 2, "explanation": "딤섬본드는 홍콩에서 위안화로 발행되는 채권이다. 표시통화의 본국(중국) 밖에서 발행되므로 외국채가 아니라 유로채이다. 양키본드(미국·달러), 사무라이본드(일본·엔), 아리랑본드(한국·원), 판다본드(중국·위안), 불독본드(영국·파운드)는 외국채이다.", "similar": [{"q": "유로채와 외국채에 대한 설명으로 옳지 않은 것은?", "choices": ["외국채는 기명식으로, 유로채는 무기명식으로 발행된다.", "유로채는 채권표시통화국 이외의 국가에서 발행되는 역외채권이다.", "외국채는 발행국의 규제를 따라야 한다.", "유로채 발행 시 공시나 신용평가등급에 대한 규제가 의무화되어 있다."], "answer": 3, "explanation": "유
